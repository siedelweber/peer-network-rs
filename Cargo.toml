[workspace]
resolver = "3"
exclude = ["packages/interchange/fuzz"]
members = ["packages/interchange", "vendor/regexml", "packages/documents", "packages/cli-common", "packages/execwrap", "packages/testkit", "packages/records", "packages/verification", "packages/host"]

[workspace.package]
authors = ["Peer Network contributors"]
edition = "2024"
publish = false
version = "0.1.0"
# Code is AGPL-3.0-only; documents carry CC0-1.0 (see LICENSE-DOCS).
license = "AGPL-3.0-only"

[workspace.dependencies]
# Reviewed exact carriers and explicit numeric bounds; manifest and lock pin one reviewed public revision.
nrz-scalar = { git = "https://github.com/naturrhythmuszentrum/naturrhythmuszentrum", rev = "b90b8025a2c0fdc70e1a5a8e8fa83403c8634526" }
nrz-accuracy = { git = "https://github.com/naturrhythmuszentrum/naturrhythmuszentrum", rev = "b90b8025a2c0fdc70e1a5a8e8fa83403c8634526" }
nrz-cas = { git = "https://github.com/naturrhythmuszentrum/naturrhythmuszentrum", rev = "b90b8025a2c0fdc70e1a5a8e8fa83403c8634526" }
# Public anchored-plus-budget fork (Paligo/regexml#15), scalar aliases and local XSD count-preserving endpoint search; see README.
# Retire when upstream releases the anchored matcher, budget and count-preserving endpoint search.
regexml = { path = "vendor/regexml" }
# Property obligations require shrinking and prop_recursive over the recursive Value model.
proptest = "1"
pn-testkit = { path = "packages/testkit" }
# Measurement only; plotting and parallel analysis are unnecessary for owned smoke runs.
criterion = { version = "0.7", default-features = false }
cli-common = { path = "packages/cli-common" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Interchange tests load the vector corpus; the library data model does not depend on serde.
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
thiserror = "2"
# Pre-1.0 minor lines preserve the API used by the public pack.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
secrecy = { version = "0.10", default-features = false }
metrics = { version = "0.24", default-features = false }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# Parser-only development tooling and a compatible local exporter stack.
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "experimental_metrics_custom_reader"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace", "metrics"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
opentelemetry-http = { version = "0.33.1", default-features = false }
http = "1"
bytes = "1"
futures-executor = "0.3"
textwrap = "0.16"
# Keep the renderer on its reviewed major line with default features and dataset serialization.
minijinja = { version = "3", features = ["serde"] }
# TOML is pre-1.0; its 0.9 minor line preserves this input parser's API.
toml = "0.9"

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -2 }
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
exit = { level = "deny", priority = 0 }
nursery = { level = "allow", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
print_stderr = { level = "deny", priority = 0 }
print_stdout = { level = "deny", priority = 0 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Thin LTO provides most full-LTO cross-crate inlining at a fraction of link time.
# One codegen unit lets the optimiser see each crate whole. Dev and test retain
# Cargo defaults for interactive debugging; measured gate builds use gate below.
[profile.release]
lto = "thin"
codegen-units = 1

# Measured separately from ordinary debugging; assertions and checks remain on.
[profile.gate]
inherits = "dev"
opt-level = 1
debug = 0
debug-assertions = true
overflow-checks = true
