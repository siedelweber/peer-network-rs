# Every secret exit is a reviewed, labelled smallest-item exception.
disallowed-methods = [
  { path = "pn_host::config::Configuration::expose_field", reason = "Requires a labelled configuration consumer." },
  { path = "pn_host::config::Configuration::expose_text", reason = "Requires a labelled configuration text consumer." },
  { path = "pn_host::config::Configuration::expose_port", reason = "Requires a labelled connection scalar consumer." },
  { path = "pn_host::scram::expose_auth", reason = "Requires a labelled authentication payload consumer." },
  { path = "pn_host::secret::Buffer::expose_bytes", reason = "Requires a labelled consumer-specific secret borrow." },
  { path = "pn_host::secret::Buffer::expose_storage", reason = "Requires a labelled consumer-specific secret borrow." },
  { path = "secrecy::ExposeSecret::expose_secret", reason = "Requires a labelled secret-exposure exception." },
  { path = "secrecy::ExposeSecretMut::expose_secret_mut", reason = "Requires a labelled secret-exposure exception." },
  { path = "secrecy::SecretBox::init_with_mut", reason = "The initializer receives an exposed mutable secret." },
  { path = "secrecy::SecretBox::init_with", reason = "The initializer constructs an ordinary secret temporary." },
  { path = "secrecy::SecretBox::try_init_with", reason = "The initializer constructs an ordinary secret temporary." },
]
