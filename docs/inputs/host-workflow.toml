[[rows]]
name = "Unsigned"
category = "scalar"
encoding = "native CBOR unsigned integer"
rule = "full unsigned range; no signed or floating intermediate; literal coercion reviewed with the SDL"
status = "planned; not served"

[[rows]]
name = "Bytes"
category = "scalar"
encoding = "native CBOR byte string"
rule = "variables only; no text, base64 or integer-array substitute"
status = "planned; not served"

[[rows]]
name = "Document"
category = "scalar"
encoding = "native CBOR byte string"
rule = "strict validation of unchanged inner bytes against the assigned theory"
status = "planned; not served"

[[rows]]
name = "Int"
category = "scalar"
encoding = "native integer in GraphQL Int range"
rule = "the GraphQL signed range remains structural; no widened counter alias"
status = "planned; not served"

[[rows]]
name = "Float"
category = "scalar"
encoding = "finite CBOR float at a Float position only"
rule = "never a ledger value, charge, exact constant or binding comparison"
status = "planned; not served"

[[rows]]
name = "funded"
category = "recovery"
action = "Reconcile the node grant and receiving-wallet transaction under the original funding intent."
recovery = "This completes funding only, never burn settlement or act admission."

[[rows]]
name = "verified-act"
category = "recovery"
action = "Recover the exact host-sealed header and its private openings; check all proposal fields, editions and both legs."
recovery = "A host seal grants no inclusion; a mismatch refuses approval."

[[rows]]
name = "approved"
category = "recovery"
action = "The Actor authorizes only the exact checked verified header and host seal."
recovery = "Retain the exact approval before delivery; never approve substituted host fields."

[[rows]]
name = "admitted"
category = "recovery"
action = "Read the host result produced by all final gates and atomic persistence."
recovery = "Eligibility, receipt or approval alone cannot reach this state."
