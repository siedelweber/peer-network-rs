namespace = "org.peer-network.host.workflow"
version = [1, 0, 0]

[[rows]]
name = "submitAct"
category = "operation"
surface = "node"
kind = "mutation"
inputs = "stage, act identifier and exact public proposal header or approval document; private handshake material stays in the reviewed custody context"
outcome = "receipt and durable stage; never implicit admission"
contract = "sig:design:host"
status = "planned; not served"

[[rows]]
name = "actStatus"
category = "operation"
surface = "node"
kind = "query"
inputs = "act identifier"
outcome = "received, verified, eligible, admitted or published status with evidence"
contract = "rule:api:submission"
status = "planned; not served"

[[rows]]
name = "readPublished"
category = "operation"
surface = "node"
kind = "query"
inputs = "explicit boundary or latest resolved once, typed keys and bounded page"
outcome = "standing, title and retained effective declarations at that boundary"
contract = "sig:design:storage"
status = "planned; not served"

[[rows]]
name = "fetchPublication"
category = "operation"
surface = "node"
kind = "query"
inputs = "explicit boundary"
outcome = "complete exact canonical package bytes or explicit unavailable"
contract = "proto:design:encoding"
status = "planned; not served"

[[rows]]
name = "fetchReplayInputs"
category = "operation"
surface = "node"
kind = "query"
inputs = "explicit boundary"
outcome = "complete public causes or unsupported until the replay cut"
contract = "sig:design:replay"
status = "planned; not served"

[[rows]]
name = "rawService"
category = "operation"
surface = "node"
kind = "query"
inputs = "declared request and boundary"
outcome = "unsupported until the optional readout cut"
contract = "sig:design:readouts"
status = "planned; not served"

[[rows]]
name = "grant"
category = "operation"
surface = "node"
kind = "mutation"
inputs = "run, request, destination and exact amount"
outcome = "durable reservation and funding status, development profile only"
contract = "sig:devnet:faucet"
status = "planned; not served"

[[rows]]
name = "grantStatus"
category = "operation"
surface = "node"
kind = "query"
inputs = "run and request"
outcome = "reserved, uncertain or reconciled funding receipt"
contract = "rule:devnet:grant-outcomes"
status = "planned; not served"

[[rows]]
name = "clientFund"
category = "operation"
surface = "client"
kind = "mutation"
inputs = "run, request and wallet selection"
outcome = "funding workflow stage"
contract = "rule:harness:wallet-recovery"
status = "planned; not served"

[[rows]]
name = "clientBurnNew"
category = "operation"
surface = "client"
kind = "mutation"
inputs = "run, request, prepared authenticated binding, asset, amount and fee policy"
outcome = "new-account destruction stage; no inferred admission"
contract = "rule:harness:burn-targets"
status = "planned; not served"

[[rows]]
name = "clientBurnExisting"
category = "operation"
surface = "client"
kind = "mutation"
inputs = "run, request, existing binding, asset, amount and fee policy"
outcome = "fresh destruction stage, including gift funding; no transferred old burn"
contract = "rule:harness:burn-targets"
status = "planned; not served"

[[rows]]
name = "clientRecover"
category = "operation"
surface = "client"
kind = "mutation"
inputs = "original run and request"
outcome = "authoritative recovered stage or unknown effect"
contract = "rule:harness:wallet-recovery"
status = "planned; not served"

[[rows]]
name = "clientPrepareAct"
category = "operation"
surface = "client"
kind = "mutation"
inputs = "public intent and secret custody capability supplied outside public variables"
outcome = "prepared proposal status or unsupported custody"
contract = "open:identity:act-production-concealment"
status = "planned; not served"

[[rows]]
name = "clientApproveAct"
category = "operation"
surface = "client"
kind = "mutation"
inputs = "exact verified act and original custody request"
outcome = "approval and submission stage after all equality and opening checks"
contract = "open:crypto:dependency-admission"
status = "planned; not served"

[[rows]]
name = "clientRecoverAct"
category = "operation"
surface = "client"
kind = "query"
inputs = "original Actor and request"
outcome = "retained proposal, approval or publication stage; no replacement identity"
contract = "open:identity:act-production-concealment"
status = "planned; not served"

[[rows]]
name = "start"
category = "operation"
surface = "control"
kind = "mutation"
inputs = "private typed bootstrap context outside public variables"
outcome = "listener start outcome through local executor"
contract = "amend:api:node-package"
status = "planned; not served"

[[rows]]
name = "inspect"
category = "operation"
surface = "control"
kind = "query"
inputs = "authenticated local selection"
outcome = "bounded operational state"
contract = "amend:api:node-package"
status = "planned; not served"

[[rows]]
name = "administer"
category = "operation"
surface = "control"
kind = "mutation"
inputs = "explicit allow-listed local operation"
outcome = "durable administration outcome or unsupported"
contract = "amend:api:node-package"
status = "planned; not served"

[[rows]]
name = "preflight"
category = "recovery"
action = "Validate profile, run, request, this attempt's target and amount, authority and resource limits before effects."
recovery = "Unsupported or refused performs no effect; a capability study must precede spending."

[[rows]]
name = "prepared"
category = "recovery"
action = "Recover or retain the authenticated account binding and request; verify descriptor signer authority."
recovery = "Retain the request; any replacement must preserve the common spent-input intersection."

[[rows]]
name = "funding"
category = "recovery"
action = "Reserve node quota and grant intent, then recover node and selected-wallet status for that request."
recovery = "Retain the reservation during uncertainty; no second grant request."

[[rows]]
name = "associated"
category = "recovery"
action = "Durably retain this attempt's owned spent outputs before signing, after serialized all-attempt intersection admission."
recovery = "No outcome is stored; absent pending-pool data never permits forgetting a signed attempt."

[[rows]]
name = "broadcast"
category = "recovery"
action = "Broadcast an admitted signed attempt, or scan descriptor spends and request commitments."
recovery = "Lost response is unknown effect; replacements retain the intersection of every recorded attempt."

[[rows]]
name = "settlement"
category = "recovery"
action = "Verify actual signed destruction, permanent target, amount and shared settled marker."
recovery = "Read the current chain at the required depth; a reorg may change the selected attempt, and incomplete scans remain unavailable."

[[rows]]
name = "submitted"
category = "recovery"
action = "Submit the same structural act or request and recover its recorded receipt."
recovery = "Receipt and approval do not promise final inclusion."

[[rows]]
name = "published"
category = "recovery"
action = "Read admitted result and its complete package at the named boundary."
recovery = "Publication completes the act-publication workflow only; funding and burn workflows retain their own narrower terminal receipts."

[[rows]]
name = "uncertain"
category = "recovery"
action = "Reconcile the request through chain and pool; admit no signing that loses its common input set."
recovery = "Cancellation never proves rollback; unavailable or incomplete lookup cannot become no-creation."

