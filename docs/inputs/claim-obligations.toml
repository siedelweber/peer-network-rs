claims = ["EPOCH::claim:compiler:completed-packages-require-explicit-coherent-bindings", "EPOCH::claim:compiler:fixed-inputs-determine-the-compiled-state", "EPOCH::claim:compiler:recorded-permutations-preserve-joined-results", "EPOCH::claim:compiler:generated-packages-match-the-literal-compiler-table", "EPOCH::claim:compiler:split-witnesses-stop-at-the-compiled-base", "ROOT::claim:discipline:epoch-inputs-retain-observed-results", "EPOCH::claim:standing:compiled-conservation-retains-emission-and-pair-totals", "EPOCH::claim:standing:sibling-response-refuses-selected-path-independence", "EPOCH::claim:standing:certified-splits-retain-hop-premises-and-displacement", "EPOCH::claim:standing:saturated-burn-can-lower-own-standing", "EPOCH::claim:standing:saturated-burn-can-lower-reached-standing", "EPOCH::claim:standing:depleted-burn-can-lower-anchor-recipient", "EPOCH::claim:standing:burn-rung-switch-retains-finite-loss-bound", "EPOCH::claim:standing:sole-contributor-burn-increases-throughout-path", "EPOCH::claim:standing:accepted-acts-have-opposite-certified-responses", "EPOCH::claim:standing:accepted-act-emission-change-retains-finite-response", "EPOCH::claim:standing:accepted-act-rung-switch-retains-finite-response", "EPOCH::claim:standing:small-receiving-annotations-preserve-public-evidence", "EPOCH::claim:standing:showcase-receiving-retains-scoped-concentration", "EPOCH::claim:standing:distinct-target-split-retains-pair-displacement", "EPOCH::claim:standing:positive-rung-splits-retain-displacement-premises", "EPOCH::claim:standing:nonconstant-matched-split-retains-hop-refinement", "EPOCH::claim:compiler:shared-boundary-ledgers-retain-vintages", "EPOCH::claim:compiler:shared-boundary-compiles-retain-fixed-inputs", "EPOCH::claim:standing:published-isolated-act-samples-retain-exact-loss", "EPOCH::claim:standing:published-retained-act-has-certified-own-increase"]
