namespace = "org.peer-network.testing.claim-areas"
version = [1, 0, 0]

[[rows]]
owner = "CLICOMMON"
area = "cli"
stake = "If shared CLI claims fail, callers can misclassify exits, expose secrets in control records, or publish incorrect report bytes, permissions and success stamps."
register = "CLICOMMON::sec:clicommon:area-cli"
contract = "CLICOMMON::sec:clicommon:area-cli"

[[rows]]
owner = "DOCUMENTS"
area = "cli"
stake = "If command contract claims fail, machine callers cannot distinguish results from diagnostics or rely on process status before using an output."
register = "DOCUMENTS::sec:documents:area-cli"
contract = "DOCUMENTS::sec:documents:area-cli"

[[rows]]
owner = "DOCUMENTS"
area = "envelope"
stake = "If envelope claims fail, a malformed or incompatible structured file can be treated as valid data before its identity is established."
register = "DOCUMENTS::sec:documents:area-envelope"
contract = "DOCUMENTS::sec:documents:area-envelope"

[[rows]]
owner = "DOCUMENTS"
area = "render"
stake = "If rendering claims fail, committed documents can silently drift from their inputs or conceal unsupported premises."
register = "DOCUMENTS::sec:documents:area-render"
contract = "DOCUMENTS::sec:documents:area-render"

[[rows]]
owner = "EXECWRAP"
area = "cli"
stake = "If process-wrapper claims fail, child output can be lost or mixed, routing can truncate prior logs, raw arguments can leak, and wrapper statuses can conceal child or delivery failure."
register = "EXECWRAP::sec:execwrap:area-cli"
contract = "EXECWRAP::sec:execwrap:area-cli"

[[rows]]
owner = "INTERCHANGE"
area = "acceptance"
stake = "If acceptance claims fail, document stamps can select the wrong reader or turn a refusal into acceptance."
