[[rows]]
name = "foundation-decisions"
category = "decision"
profile = "Adopt a named gate profile inheriting dev with optimization level 1, debug information 0, debug assertions true and overflow checks true. Ordinary dev and test retain their debugging defaults, and release is unchanged. In the one-setting-at-a-time campaign, median warm test times were 6.987 seconds at optimization 0/debug 2, 7.573 seconds at optimization 0/debug 0 with variable contention, and 4.571 seconds at optimization 1/debug 0; median document checks were 0.678, 0.603 and 0.357 seconds. Cold test builds were 15.198, 15.366 and 23.529 seconds. Removing debug information alone is not claimed to speed test execution. The chosen gate profile trades a bounded cold cost and gate-only symbols for recurring execution and link savings; debugging remains available through the unchanged dev/test profiles. The independent profile campaign measured comment-only documents rebuild medians of 0.627 seconds before and 0.475 seconds after; this measures front-end and relink cost, not a changed implementation workload."
runner = "Use the provisioned cargo-nextest 0.9.149 on the measured x86_64 Linux node, with the versioned libtest-json-plus 0.1 stream, retries zero, no fail-fast and no slow-timeout termination. It builds the inventory once and reuses its binaries. Default-profile paired medians including separate doctests were 6.926 seconds with Cargo and 5.655 seconds with nextest; under the chosen gate profile they were 4.642 and 4.870 seconds. Process isolation and structured case accounting cost 0.228 seconds against the optimized Cargo runner in that series, while the combined profile/runner remains faster than the starting path. A controlled two-case capture probe retained one pass, one failure, both measured durations and the failure text, returning the original failure status. JUnit was rejected because it emits offset timestamps; the selected JSON stream has durations and no instants. Only the observer adds UTC instants ending Z. Captured stdout is retained in untracked raw evidence and never copied into timing findings. The current inventory has 1689 non-doctest cases and zero ignored cases; the adapter still accounts explicitly for ignored declarations. Platform measurements establish this node only, not unmeasured targets."
license = "crates.io records cargo-nextest 0.9.149 as Apache-2.0 OR MIT, with repository github.com/nextest-rs/nextest. crates.io is the licence source of record. It runs on the compute node as a tool and is neither linked into nor distributed with any package."
linker = "Keep the toolchain default bundled LLVM linker without repository rustflags. The target specification names gnu-lld-cc with its linker self-contained, and observed link arguments select the toolchain gcc-ld path and -fuse-ld=lld. Corrected cold documents builds measured 11.200 seconds with the default and 15.291 seconds with the system linker selected by disabling the lld feature. Five comment-only relink samples had medians 0.691 and 3.251 seconds. The initial obsolete print-link-args instrumentation failed and is excluded; corrected --print link-args measurements all passed. No system lld installation or linker override is needed."
cache = "Hold sccache until provisioned and measured. It is absent and was not adopted. Current default cold test, clippy and documents builds measured 13.172, 10.548 and 11.773 seconds, with unchanged warm medians below 0.3 seconds; the candidate cold test build was 23.664 seconds in that campaign. These costs do not justify requesting compiler-cache provisioning for this workspace now. Reconsider when clean build fan-out or repeated cross-checkout compilation makes a measurable cache benefit plausible."
context = "All campaigns used the same locked dependency corpus offline on the x86_64 Linux node, nightly Rust 1.101.0 with LLVM 23.1.4, default features, 256 reported CPUs and a cgroup CPU quota equivalent to 62.25 CPUs. Each measured configuration used its own target directory; cold means empty target with the dependency cache and filesystem page cache already populated, not a machine cache flush. Each target was removed after recording its samples. Normal priority was retained because lowering scheduling priority on the shared contended node would distort comparisons. Load, CPU/I/O/memory pressure, quota and throttling counters are retained before and after every sample; concurrent jobs were recorded at campaign start, while per-process attribution and service versions are unavailable or inapplicable to this pure workspace. No quiet baseline is replaced: shared-node comparison evidence remains distinct from the five-quiet-sample regression policy. Historical contended and quiet ranges remain above."
