[[rows]]
document = "Entering state and selected evidence"
members = "Cumulative facts for touched subjects and irreducible inputs"
references = "Derive outgoing values; no stored epoch ordinal by default"

[[rows]]
document = "Epoch result/root — common"
members = "Epoch, entering state, selected inputs/evidence"
references = "Three references; complete static set, no computed-copy branch"

[[rows]]
document = "Static and history closure"
members = "Internal validity / declared-run accounting consistency"
references = "History receives validated epochs and their computed states; no parent link"

[[rows]]
document = "Oracle and optional displays"
