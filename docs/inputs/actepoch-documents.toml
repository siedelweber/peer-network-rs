[[rows]]
document = "Witnessed act — common"
members = "Act hash, signing key, signature half one, half two"
references = "Four 32-byte members; complete-act approval under the recorded key"

[[rows]]
document = "Typed and public parts"
members = "Type coordinates, incidence, optional license, settlement and public parents"
references = "Nineteen act types; required public documents inside the set"

[[rows]]
document = "Removable parts"
members = "Act identity, client randomness, content or dependencies"
references = "Commitments stay; private openings are not required public inputs"

[[rows]]
document = "Acts"
members = "Ordered pairs of act hash and witnessed-act hash"
references = "Pair equality; containment supplies completion, position is place"

[[rows]]
document = "Epoch — common"
