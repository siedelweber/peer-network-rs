namespace = "org.peer-network.design.implementation-graph"
version = [1, 0, 0]

[[rows]]
name = "petgraph"
release_line = "0.8"
reviewed_release = "0.8.3"
license = "MIT OR Apache-2.0"
default_features = ["std", "graphmap", "stable_graph", "matrix_graph"]
extra_features = ["serde-1"]
entry_bite = 3
projection_type = "petgraph::stable_graph::StableDiGraph"
intersection_type = "petgraph::graph::UnGraph"
projection_reason = "StableGraph preserves unrelated node and edge indices on removal and supports parallel edges; a removed slot is not a permanent identity and may be reused."
intersection_reason = "Graph has compact indices suited to a temporary intersection graph built once and read without removals; removal can move the last node or edge into the vacated slot."
graphmap_boundary = "GraphMap uses Copy + Ord + Hash node weights as keys and does not allow parallel edges, so it does not carry the complete projection multigraph."
