  { name = "pn-host", responsibility = "Encode the complete seven-part public package", dependencies = ["pn-records", "pn-graph", "pn-epoch"], surfaces = ["post:network:host-contract"] },
  { name = "pn-replay", responsibility = "Reconstruct and compare the binding package from public inputs", dependencies = ["pn-records", "pn-graph", "pn-epoch", "pn-host"], surfaces = ["subsec:deployment:conserved-standing-reproducibility", "post:deployment:public-object-replay"] },
  { name = "pn-verification", responsibility = "Maintain labelled integrated fixtures and independent public-surface checks", dependencies = ["pn-records", "pn-graph", "pn-epoch", "pn-readouts", "pn-host", "pn-replay"], surfaces = ["rem:verification:certificate-reproducibility"] },
]
