namespace = "org.peer-network.design.crates"
version = [1, 0, 0]

rows = [
  { name = "pn-records", responsibility = "Immutable public inputs: identities, acts, ledger/burn data and declared constants", dependencies = [], surfaces = ["def:graph:act-identifier", "def:graph:act-edge-projection", "def:comparator:burn-interface"] },
  { name = "pn-graph", responsibility = "Structural formation, shared graph algebra and title folds", dependencies = ["pn-records"], surfaces = ["post:nodes:canonical-tensor-pipeline", "def:graph:verified-act", "thm:graph:epoch-title-fold"] },
