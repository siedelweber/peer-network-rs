  { chapter = "10 Scalability", label = "thm:scalability:conserved-equilibrium-cost", environment = "theorem", statement = "Account separately for compilation, rung screening and residual-certified map passes.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "tbl:scalability:conserved-standing-work", environment = "table", statement = "Record the declared cost model without treating it as a measured build or runtime result.", kind = "fixture", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "prop:scalability:conserved-standing-verifiability", environment = "proposition", statement = "Recompute standing from the public package at the declared production-order cost.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:fixed-point-cost", environment = "subsection", statement = "Track fixed point cost as a separately addressable subsection.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "lem:scalability:contraction-stopping-rule", environment = "lemma", statement = "Use the certified residual enclosure to decide required comparisons; these within-epoch passes establish no inter-epoch controller settling bound.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:solver-decomposition", environment = "subsection", statement = "Track solver decomposition as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "prop:scalability:transport-scc-decomposition", environment = "proposition", statement = "Solve supported dependency components in dependency order and retain possible singleton self-dependence.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "prop:scalability:exact-component-reuse", environment = "proposition", statement = "Reuse a component only when all current mathematical inputs and upstream values match.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "rem:scalability:warm-start-neutrality", environment = "remark", statement = "Permit initialization from old solutions without making history a standing input.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:checking-a-claim", environment = "subsection", statement = "Track checking a claim as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "prop:scalability:fixed-point-check-cost", environment = "proposition", statement = "Check a claimed equilibrium using a fresh map residual and certificate bound.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "rem:scalability:certification-is-one-sweep", environment = "remark", statement = "Evaluate the operative width fence in one sweep. A global replacement enclosure must establish soundness, cost and improvement for an adopted stronger charter; it is no obligation of the current gate.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:boundary-search", environment = "subsection", statement = "Track boundary search as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "rem:scalability:boundary-search-cost", environment = "remark", statement = "Separate discretionary trial-set search from validity of the accepted final set.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:dense-projection", environment = "subsection", statement = "Track dense projection as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "rem:scalability:dense-projection-cost", environment = "remark", statement = "Keep the declared work proportional to sparse support, including dense quadratic inputs.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:approximation-guarantee", environment = "subsection", statement = "Track approximation guarantee as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "def:scalability:approximation", environment = "definition", statement = "Inventory the terminal probabilistic estimator contract.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "thm:scalability:efficient-approximation", environment = "theorem", statement = "Inventory the terminal centrality sampling claim without applying it to standing.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:nash-preservation", environment = "subsection", statement = "Track nash preservation as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "def:scalability:incentive-slack", environment = "definition", statement = "Inventory the terminal strict incentive-slack assumption.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "thm:scalability:nash-preservation", environment = "theorem", statement = "Inventory reward approximation under the stated incentive margin.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:sybil-and-spam-resistance", environment = "subsection", statement = "Track sybil and spam resistance as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "cor:scalability:sybil-resistance", environment = "corollary", statement = "Retain no unsupported standing and rival allocation, not funded-address invariance; common control alone supplies no zero terminal affinity or attribution factor.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "cor:scalability:spam-resistance", environment = "corollary", statement = "Check priced complete-act standing constraints without importing retired path-selection machinery.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-closed-person-vouch-census", environment = "item", statement = "Limit standing contributions to the closed person-vouch family census.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-complete-act-author-continuity", environment = "item", statement = "Require complete acts and continuous Actor authorship for standing contributions.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-passive-unmatched-leg-exclusion", environment = "item", statement = "Exclude passive interference and unmatched hyper-edge legs from standing contributions.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-conserved-apportionment", environment = "item", statement = "Allocate one rival unit per source across self and recipients, preserving it through hop products and the depth mixture. Additional acts and routes divide that unit rather than add copies, and final standing remains in its contributing-rate hull.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-safety-wall-clamp", environment = "item", statement = "Apply the safety-wall clamp to limit below-wall dynamic gain without erasing the Actor’s source pair.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-conserved-standing-certificate", environment = "item", statement = "Require the conserved-standing certificate to bound row feedback.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-final-gates-record-budget", environment = "item", statement = "Apply final individual-safety checks to every proposed-set author, epoch admission to the closed set, and the finite epoch record budget.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-per-action-debit", environment = "item", statement = "Debit the in-force action price and retain each accepted act’s count increment: residual balance falls while its denominator rises, and merely stopping does not undo the dilution. A below-wall final stamp fails individual safety; this ledger-rate effect supplies no universal final-standing direction.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "subsec:scalability:verifiability", environment = "subsection", statement = "Track verifiability as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "10 Scalability", label = "prop:scalability:raw-path-verifiability", environment = "proposition", statement = "Reconstruct raw weights and parity from retrieved structural records.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "app:gates", environment = "appendix", statement = "Track gates as a separately addressable appendix.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "rem:gates:split-scope", environment = "remark", statement = "For an unsupported Actor sustaining reduced rate c, each accepted act requires c times numeraire plus the action price in new burn; wall-neutral sustaining burn is twice that price. Relational support may help stamps but never reduces the own-balance debit. Additional Registration debit and incremental aggregate burn are distinct, and cost alone bounds no small standing gain.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "subsec:gates:door-and-wall", environment = "subsection", statement = "Track door and wall as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "thm:gates:sustaining", environment = "theorem", statement = "Check the exact new burn needed to preserve an unsupported actor's own rate.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "cor:gates:band-floor", environment = "corollary", statement = "Check that unsupported wall-neutral activity needs twice the action threshold.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "rem:gates:propped", environment = "remark", statement = "Never let relational standing pay another actor's solvency debit.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "subsec:gates:frontier", environment = "subsection", statement = "Track frontier as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "thm:gates:frontier", environment = "theorem", statement = "Check the unsupported long-run sustaining lower bounds under their fixed-floor premises.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "prop:gates:two-phase-transit", environment = "proposition", statement = "Reproduce unsupported no-burn door and wall crossing formulas with integer-action interpretation unresolved.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "rem:gates:frontload", environment = "remark", statement = "Distinguish burn timing from long-run own-source sustaining cost.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "subsec:gates:lever", environment = "subsection", statement = "Track lever as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "cor:gates:standing-transport-no-solvency-discount", environment = "corollary", statement = "Keep every accepted actor's own threshold debit unchanged by transport.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "rem:gates:tilt-is-not-price-discount", environment = "remark", statement = "Lowering responsiveness does not alter the debit, numeraire or policy floor.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "thm:gates:equal-rate-no-internal-lift", environment = "theorem", statement = "When every contributing pair, including the own pair, has one common reduced rate, final reduced standing equals that rate under every certified allocation. This exact invariance does not extend to heterogeneous funded partitions.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "rem:gates:external", environment = "remark", statement = "Bound relational assistance by contributing source rates rather than a fixed discount.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "subsec:gates:funding", environment = "subsection", statement = "Track funding as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "rem:gates:guild-funding", environment = "remark", statement = "A guild may fund new burn at an Actor’s permanently bound address, but payment or lineage alone does not imply marker-policy acceptance or sufficient accepted amount. Funding changes neither recorded provenance nor the own-act debit. Discovery or recovery benefits require the response tests and terminal fixed-context premises, not merely payment.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "rem:gates:standing-safety-scope", environment = "remark", statement = "Separate own-balance solvency, individual and epoch gates, contraction and movement; conserve transported pairs without transferring ledger assets.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "A Gates", label = "rem:gates:sustaining-denomination", environment = "remark", statement = "Keep burn price, reduced floor and tilt changes dimensionally distinct.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "app:can", environment = "appendix", statement = "Track can as a separately addressable appendix.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "def:can:mandatory-guild-invariants", environment = "definition", statement = "Inventory mandatory terminal depth decay, strict attenuation and context independence.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "rem:can:standing-allocation-separation", environment = "remark", statement = "Expose raw hyperedge legs separately from the complete-act standing projection.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "rem:can:final-standing-scope", environment = "remark", statement = "Limit the attribution input seam to raw records and explicitly included Declaration leaves.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "subsec:can:structure", environment = "subsection", statement = "Track structure as a separately addressable subsection.", kind = "policy", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "def:can:compositional-attribution-network", environment = "definition", statement = "Inventory the guild's finite composition DAG and registry.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "def:can:compositional-depth", environment = "definition", statement = "Inventory maximum-child-depth plus one with zero-depth leaves.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
