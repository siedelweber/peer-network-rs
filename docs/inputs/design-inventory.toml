namespace = "org.peer-network.design.inventory"
version = [1, 0, 0]

rows = [
  { chapter = "00 Front matter", label = "abs:abstract", environment = "abs", statement = "Compare clusters through exogenous bound burn, complete authored acts and a conserved same-epoch balance/count equilibrium, with public replay and terminal feed and reward readouts. Genuine contributing source and rival allocation do not imply funded-partition invariance; sharp strategic guarantees remain open.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "00 Front matter", label = "motto:motto", environment = "motto", statement = "Track motto as a separately addressable motto.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "sec:introduction", environment = "section", statement = "Track introduction as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:captured-comparator", environment = "subsection", statement = "Track captured comparator as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:every-platform-compares", environment = "ins", statement = "Track every platform compares as a separately addressable ins.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:the-detector", environment = "ins", statement = "Track the detector as a separately addressable ins.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:the-only-question", environment = "subsection", statement = "Track the only question as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:who-owns-the-frame", environment = "ins", statement = "Track who owns the frame as a separately addressable ins.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:two-precedents", environment = "subsection", statement = "Track two precedents as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:tcp-is-unpriced-neutrality", environment = "ins", statement = "Track tcp is unpriced neutrality as a separately addressable ins.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:wikipedia-is-public-auditability", environment = "ins", statement = "Track wikipedia is public auditability as a separately addressable ins.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:dignity", environment = "subsection", statement = "Track dignity as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:neutrality-is-dignity", environment = "insight", statement = "Participants must be able to inspect and reproduce the measure of standing.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:price-not-detector", environment = "insight", statement = "Admission uses burn solvency and safety and participation floors rather than a humanity detector. Required Registration debit is distinct from incremental total burn between matched histories, which can be zero; pricing establishes no authenticity or partition guarantee.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:equal-among-peers", environment = "insight", statement = "Standing pools transported balances and action counts rather than averaging actor rates. Incoming action mass, not headcount, controls the limit; funded partitions can change retained denominators and individual standings.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:no-escape-velocity", environment = "insight", statement = "Certified fixed-rung relational support cannot be replaced by artifact routing. Separate responsive activation from final burn response: source rates and emission can rise without each standing increasing. The hull and response bounds do not give a universal participant-maximum guarantee.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:peer-claim-scope", environment = "insight", statement = "Incoming action mass controls peer convergence and an isolated actor retains its own source rate. Preserve the closed transported-count-weighted mean without claiming invariance of individual coordinates or participant maxima under funded partitions.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:only-faithful-coordinate", environment = "insight", statement = "Compare a two-sided closed community by its transported-count-weighted ledger ratio, not an arithmetic mean of rates or a total-reserve ranking. At fixed counts, accepted burn raises this mean; it does not determine each coordinate, reward or funded-partition maximum.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:the-floor-we-name", environment = "insight", statement = "Public accountability does not prove the truth of every graph claim.", kind = "none", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:the-cut-no-mechanism-can-make", environment = "insight", statement = "Internal graph evidence cannot distinguish funded genuine participants from funded fabrications. Exclude unsupported standing through genuine contributing source and rival allocation; funded address partitions remain a distinct strategic question.", kind = "none", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:vouch-not-check", environment = "insight", statement = "Record accountable authored vouches without recording or certifying private identity checks.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:right-to-leave", environment = "insight", statement = "Payload erasure preserves relied-upon structure; outside knowledge and structural distinctiveness can identify a departed Actor, and no degree of anonymity is promised.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:two-layers-derived", environment = "subsection", statement = "Layer 1 reads the external burn interface and publishes reproducible conserved standing while guilds own terminal readouts. Terminal independence and binding replay do not establish strategic partition invariance.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "tbl:introduction:layer-roles", environment = "table", statement = "Separate external frame supply, network binding, and terminal consumer roles.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:the-graph", environment = "subsection", statement = "Track the graph as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:infrastructure", environment = "subsection", statement = "Track infrastructure as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "post:introduction:public-accessibility", environment = "postulate", statement = "Graph and ledger remain publicly readable without authentication.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "post:introduction:record-integrity", environment = "postulate", statement = "Published records and ledger entries cannot be silently changed.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "post:introduction:irrevocability", environment = "postulate", statement = "Retain irreversible ledger history and monotone pinned imported burn amounts.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "post:introduction:authoritative-act-order", environment = "postulate", statement = "Publish a dependency-respecting total act order whose positions define logical times.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "post:introduction:epoch-edge-set", environment = "postulate", statement = "Each boundary supplies a finite monotone causally closed edge set.", kind = "invariant check", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "rem:introduction:mechanism-agnostic", environment = "remark", statement = "Any provider mechanism must establish agreement on the ordered acts as well as the edge set.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:comparator-previewed", environment = "subsection", statement = "Derive residual balance/count sources from the ledger, weigh complete acts, and solve the conserved transport mediant with a known source-rate hull and public replay. Universal burn monotonicity is false; anchor sign claims need fixed emission, while sharp funded-partition guarantees remain open.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:comparator-made-human", environment = "ins", statement = "Track comparator made human as a separately addressable ins.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:verification-model", environment = "subsection", statement = "Audit and gated phases share public formulas; verify complete ledger and acts, folds, allocation, emission and each attempted rung, then certify residuals. Within-epoch convergence establishes neither inter-epoch tracking nor consent.", kind = "policy", crate = "pn-verification", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:reading-guide", environment = "subsection", statement = "Track reading guide as a separately addressable subsection.", kind = "policy", crate = "pn-verification", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "sec:comparator", environment = "section", statement = "Track comparator as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:the-axis", environment = "subsection", statement = "Track the axis as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "ax:comparator:inter-cluster", environment = "axiom", statement = "A meaningful comparison requires exogenous source rather than topology alone.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:topology-is-gauge", environment = "remark", statement = "Graph geometry alone cannot certify costly source.", kind = "none", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:actor-field-cluster-comparison", environment = "remark", statement = "Publish actor standing without prescribing social cluster partitions or aggregation.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:burn-primitive", environment = "subsection", statement = "Track burn primitive as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:burn-primitive", environment = "definition", statement = "The imported primitive must record costly irreversible publicly verifiable destruction.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:burn-interface", environment = "definition", statement = "Expose the burn-amount map, opaque addresses, bootstrap capacity and positive unit-cost projection with its external denomination and terms; audit evidence and marker policy add no monetary input.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "post:comparator:burn-primitive", environment = "postulate", statement = "Require each labelled burn-realization obligation, including settlement, provenance, nontransferability, capacity, cost and conditional operator evidence.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-exogenous-origin", environment = "condition", statement = "Import burn amounts from outside the graph; no graph-derived rule or network operation may compute or write them.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-neutrality", environment = "condition", statement = "Treat the primitive as a uniform measurement of destroyed magnitude, not a priced asset, redemption right, entitlement or selection of a winner.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-non-transferability", environment = "condition", statement = "Keep each recorded destruction amount at its original address, with recoverable attribution and no duplicate contribution; this does not prohibit standing relocation, pooling or concentration through alternative funded histories.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-settlement-amount", environment = "condition", statement = "Pin nonnegative burn amounts at settlement with nondecreasing pins and conservative intermediate publication, subject to the specified history-replacement floor.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-settlement-pin", environment = "condition", statement = "Pin the burn amount at a settlement event.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-pinned-monotonicity", environment = "condition", statement = "Require successive pinned amounts at an address to be nondecreasing, with append-only records and nonnegative contributions.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-conservative-publication", environment = "condition", statement = "Between settlements, publish no amount greater than the amount pinned by the next settlement.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-revision-floor", environment = "condition", statement = "Permit downward revision no lower than the last settled pin when an alternative history omits a not-yet-final boundary; never revise below that pin.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-settlement-depth", environment = "condition", statement = "Publish settlement depth and its finality assumptions: beyond that depth no history containing a settlement boundary is replaced, and an amount sampled at or below it equals its pinned amount.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-bindability", environment = "condition", statement = "Supply opaque permanent addresses carrying no identity claim, so a consumer can bind its identities for the lifetime of its record.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-non-negativity", environment = "condition", statement = "Require every address’s burn amount to lie on the same nonnegative real line.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-provenance-auditability", environment = "condition", statement = "Anchor each contributing unit to genuine irrecoverable destruction and cap each recording event by its backing destruction; an unbacked record contributes zero. Publish enough quantities to recompute and verify provenance rather than merely total records.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-costly-append-only-record", environment = "condition", statement = "Price destruction at its occurrence, preserve its record and provide no reverse map to the destroyed resource.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-bootstrap-capacity", environment = "condition", statement = "Publish the nonnegative pre-opening capacity bound; an empty interval when external acquisition is possible from the start requires zero with its explanation, not a bound on later burns.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-unit-cost-projection", environment = "condition", statement = "Publish a positive amount-proportional unit cost with external denomination and terms; publish recording-event costs separately as audit evidence. Destruction provenance supplies neither normalization nor a lower bound of one.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-operator-audit-bound", environment = "condition", statement = "Publish the proved bound and proof for an operator accruing burn amount from operating the realization, or publish the absence of such a role with its explanation.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "post:comparator:marker-bound-settlement", environment = "postulate", statement = "Fix a public pre-genesis marker policy for its sequence, with open placement and cadence, and recognize settlement only under the lineage, acceptance, causal-dependence and single-count conditions.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-lineage-succession", environment = "condition", statement = "Recognize an initial marker with index zero, no predecessor and empty accepted set and snapshot, followed by unique immediate successors with growing lineage, fixed policy and interpretation, and published depth and finality assumptions.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-network-acceptance", environment = "condition", statement = "Recover each finite accepted set publicly under the fixed policy, containing predecessor acceptance and contained in marker lineage; verify every destruction, amount and address without omissions or repairs.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-causal-dependence", environment = "condition", statement = "A marker depends on its predecessor and entire lineage; a history losing a lineage record cannot retain the same marker even by copying its written contents.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-single-count", environment = "condition", statement = "Count each underlying destruction at first acceptance only, despite aliases, repeated references, later markers or attempts to change attribution.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:marker-burn-snapshot", environment = "definition", statement = "Derive each address amount by summing distinct destructions first represented in accepted sets through the recognized marker; an older lineage record may first contribute later.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "eq:comparator:marker-burn-snapshot", environment = "equation", statement = "Sum first-accepted destruction amounts by attributed address from the empty initial snapshot, deriving the gross increment from newly counted destructions.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "prop:comparator:marker-settlement-consistency", environment = "proposition", statement = "The same recognized final marker and fixed policy determine the same accepted sets, gross snapshot and increment; monotonicity is within one history and does not assert residual-balance monotonicity or liveness.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:imported-frame", environment = "subsection", statement = "Track imported frame as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:imported-frame", environment = "definition", statement = "Read a shared nonnegative burn-amount codomain at each permanently bound actor address.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "eq:comparator:seam", environment = "equation", statement = "Resolve an actor burn amount through its bound primitive address.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:neutrality-from-silence", environment = "remark", statement = "The imported destruction record confers no primitive-level priced claim.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:frame-binding", environment = "definition", statement = "Keep each actor permanently bound to its opaque burn address. Bind recorded burn permanently to its address; standing is a separate computed quantity, and address portfolios can concentrate received support.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:destination-funding-non-transferability", environment = "remark", statement = "Allow destination-funded new accrual without transferring recorded source or identifying its funder; this promises no standing invariance across alternative address portfolios.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:identity-is-layer-2", environment = "remark", statement = "Do not represent the person associated with an actor in Layer 1.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "lem:comparator:frame-stability", environment = "lemma", statement = "Settled gross burn amounts do not decrease along the recognized marker sequence in one history under its fixed policy.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:auditability", environment = "remark", statement = "Verify destruction provenance rather than treating a sum of records as sufficient burn evidence.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:the-source", environment = "subsection", statement = "Track the source as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:rate", environment = "definition", statement = "Divide residual balance by the greater of cumulative accepted-act count and one.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "eq:comparator:rate", environment = "equation", statement = "Compute the neutral source from residual balance and guarded count.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:residual-balance", environment = "definition", statement = "Subtract historical consummated debits at their original epoch prices from imported burn.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "eq:comparator:residual-balance", environment = "equation", statement = "Calculate residual burn as imported burn amount less the debit schedule.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:vintage-trichotomy", environment = "remark", statement = "Preserve recorded parameters and debit vintages while reading carried balances under current constants.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:vintage-recorded-parameters", environment = "remark", statement = "Track vintage recorded parameters as a separately addressable remark.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:vintage-read-time-state", environment = "remark", statement = "Track vintage read time state as a separately addressable remark.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:vintage-consummated-debits", environment = "remark", statement = "Track vintage consummated debits as a separately addressable remark.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:type-asymmetry", environment = "remark", statement = "Distinguish burn magnitudes from integer counts and reduce through the numeraire.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:numeraire", environment = "definition", statement = "Use a positive burn-per-action numeraire as the sole dimensional conversion.", kind = "constant", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:two-costs", environment = "subsection", statement = "Track two costs as a separately addressable subsection.", kind = "constant", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "ins:comparator:inherited-costliness", environment = "insight", statement = "Treat costliness and provenance as obligations supplied by the realization.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:source-faithful", environment = "definition", statement = "Separate inherited actor-source authenticity from the bounded truth of edge claims.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:source-actor-mass", environment = "condition", statement = "Require contributing Actor mass to be genuinely destroyed and non-transferable across addresses, with instantaneous-costliness grounding at genesis and net-cost grounding after a market exists. Treat this as an inherited primitive obligation.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:source-edge-event", environment = "condition", statement = "Internal title recognition and positive folded coordinates qualify counterparty allocation but do not authenticate an external event or referent; endogenous accountability leaves that semantic limit structurally bounded.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "post:comparator:accountability-cost", environment = "postulate", statement = "Keep attributed immutable claims and their endogenous accountability cost; internal corroboration cannot establish external truth or supply an authenticity test.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "tbl:comparator:two-costs", environment = "table", statement = "Distinguish exogenous source cost from endogenous accountability cost.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:faithfulness", environment = "subsection", statement = "Track faithfulness as a separately addressable subsection.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "post:comparator:faithfulness", environment = "postulate", statement = "Enforce source, dimensional, immutable-ledger, conservation, epoch-set, title, memoryless, universal, domain, tilt, cluster-rate and final-state clauses.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-source", environment = "condition", statement = "Require real, irrecoverable contributing mass bound to its Actor; source provenance does not make standing coordinates invariant under funded address partition.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-numeraire", environment = "condition", statement = "Divide every burn-denominated input by the numeraire before combining it with a count.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-measurement", environment = "condition", statement = "Compute standing as a measurement of the record, not a possessed ledger asset; the ledger after measurement must equal the ledger before it.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-conservation", environment = "condition", statement = "Conserve full balance and count totals through row-stochastic allocation; this is rival allocation, not invariance of individual standings, participant maxima or unweighted sums.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-epoch-set", environment = "condition", statement = "Keep host-assigned order, relation frontiers and intra-epoch latest positions out of every standing quantity.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-title", environment = "condition", statement = "Resolve a settlement act’s counterparty allocation only through the epoch title fold.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-memorylessness", environment = "condition", statement = "Use no previous epoch’s standing as a semantic input.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-universal-act-weighing", environment = "condition", statement = "Weigh every accepted Actor-authored act exactly once, resolving to a person or self; consume matched hyper-acts atomically so unmatched legs and passive artifacts carry no standing. Admissible partitions can change author-indexed folds and normalized allocation, so invariance needs additional premises.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-domain-weights", environment = "condition", statement = "Apply declared domain weights to complete folded acts; preserving aggregate ledger pairs does not by itself preserve the resulting author-indexed allocation.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-responsive-tilt", environment = "condition", statement = "Use recipient standing only to modulate relative authored allocation, with hop fading at the greatest certified rung.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-cluster-rate", environment = "condition", statement = "Preserve the closed transported-count-weighted mean under internal pair allocation; neither an open fibre mean nor individual coordinates or maxima are thereby fixed.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-final-set-admission", environment = "condition", statement = "Require final-set admission to read only the completed post-debit standing result; this is a boundary-operator obligation, not a consequence of the standing construction.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "ins:comparator:universal-amplifier", environment = "insight", statement = "Terminal value channels use dimensionless standing amplification without manufacturing source. Use published standing in terminal formulas only under their fixed-context premises; terminal scalar monotonicity does not imply monotonicity under a burn, act or funded partition.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:amplifier-rendering", environment = "remark", statement = "Terminal amplification must not silently become an admission-policy control. Zero standing retains unit amplification; an optional guild exponent is published with canonical default one. Terminal input monotonicity implies no monotone burn, act or partition response.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:conserved-allocation-scope", environment = "remark", statement = "Conservation excludes passive or unowned redirection and makes source allocation rival, including against self, but supplies no target veto. General funded-partition standing invariance is false even with proportional pairs and unchanged incoming acts. Pair totals, closed weighted means and equal-rate regimes survive; displacement bounds are not small strategic-gain guarantees.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "cor:comparator:sybil-resistance-is-faithfulness", environment = "corollary", statement = "Sybil resistance means no standing without genuine contributing source and rival allocation of existing source; it promises no invariance when one participant funds several addresses.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:capacity-and-admission-benchmarks", environment = "subsection", statement = "Track capacity and admission benchmarks as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "def:comparator:bootstrap-capacity", environment = "definition", statement = "Carry the published aggregate pre-opening burn-amount bound without deriving it; publish zero and an explanation when external acquisition is possible from the start. The aggregate ceiling restricts amount, not the allocation of that amount among funded addresses.", kind = "constant", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "eq:comparator:admission-benchmark-deposits", environment = "equation", statement = "Multiply unsupported-act burn benchmarks by the realization unit-cost projection.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "tbl:comparator:admission-benchmarks", environment = "table", statement = "Check debit-only, safety and door-neutral unsupported-act costs separately.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:the-surface", environment = "subsection", statement = "Track the surface as a separately addressable subsection.", kind = "constant", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:network-prices-the-frame", environment = "remark", statement = "Derive standing from imported source without importing a realization monetary mechanism.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:surface-readings", environment = "remark", statement = "Exclude monetary-surface prices, announcement timing and operator attribution from computation; retain only the burn-interface inputs and separately required public audit evidence.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "subsec:comparator:limitations", environment = "subsection", statement = "Track limitations as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:inherited-limitations", environment = "remark", statement = "Holding all external supply does not establish zero net burn cost; neither destruction provenance nor the unit-cost projection determines holdings-adjusted cost, and nontransferability alone supplies no actor-splitting guarantee. Recorded-amount non-transferability is not standing immobility; required Registration debit differs from incremental total burn between matched histories.", kind = "none", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "02 Comparator", label = "rem:comparator:structural-ceiling", environment = "remark", statement = "Separate consistent marker snapshots from external truth: title-coupled counterparty allocation requires recognition, while even valid title transfers cannot authenticate the asserted event or referent.", kind = "none", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "sec:network", environment = "section", statement = "Track network as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "subsec:network:the-write", environment = "subsection", statement = "Track the write as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "def:network:write", environment = "definition", statement = "Publish the accepted ordered act sequence and its whole dependent-set projections only after final-state validity.", kind = "function", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "rem:network:not-a-write", environment = "remark", statement = "Do not publish rejected candidates, solver iterates, derived edges or payload reductions as writes.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "subsec:network:admission-closure", environment = "subsection", statement = "Track admission closure as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "def:network:admission-closure", environment = "definition", statement = "Classify every value by whether its arithmetic or validity read-sites feed admission.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "case:network:admission-closure-binding", environment = "case", statement = "Track admission closure binding as a separately addressable case.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "case:network:admission-closure-free", environment = "case", statement = "Track admission closure free as a separately addressable case.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "case:network:admission-closure-title-feedback", environment = "case", statement = "Track admission closure title feedback as a separately addressable case.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "case:network:admission-closure-title-terminal", environment = "case", statement = "Track admission closure title terminal as a separately addressable case.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "rem:network:boundary-one-sentence", environment = "remark", statement = "Keep ledger, formation, title-coupled standing resolution and admission binding; raw routing and terminal interpretations cannot replace that binding meaning.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "subsec:network:object-taxonomy", environment = "subsection", statement = "Track object taxonomy as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "def:network:object-taxonomy", environment = "definition", statement = "Distinguish imported, binding, verification, optional byproduct and terminal objects.", kind = "type", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "def:network:conserved-standing-package", environment = "definition", statement = "Publish completed inputs, fold/base data, activation, rung history, transport, emissions, standing and reproduction evidence.", kind = "type", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-final-state", environment = "item", statement = "Publish the proposed final epoch state: final edge set, residual balances, action counts, settled burn snapshot and constants in force.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-folds", environment = "item", statement = "Publish fold cells and coefficients, each cell’s recipient resolution, the domain weights and the base allocation matrix they determine.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-activation", environment = "item", statement = "Publish responsive and wall-clamped activation formulas, the in-force wall and structural floor, and controller edition and reduced constants. Include the completed width and accepted rung as controller inputs beside its wall, proposal, delivered next wall and burn-image schedule.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-tilt", environment = "item", statement = "Publish the tilt profile, backoff grid, accepted rung and certificate verdict of every higher rung attempted.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-transport", environment = "item", statement = "Publish the depth masses, hop allocation matrices and conserved transport they compose at the equilibrium.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-emission", environment = "item", statement = "Publish each source’s emission fraction even though it is derivable from the final state, so its transport reach can be audited directly.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-certificate", environment = "item", statement = "Publish the rate-hull box, standing certificate and verdict, fixed-point enclosure, final standing and stamps, door headroom, and own-balance, individual-safety and epoch-admission verdicts.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-evidence", environment = "item", statement = "Publish interval boxes, residual bounds and other evidence sufficient to check the mathematical claims independently; these prove the binding package and are not separate standing inputs.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "tbl:network:object-taxonomy", environment = "table", statement = "Apply the five permission classes to published values according to their read-sites.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "rem:network:taxonomy-subtleties", environment = "remark", statement = "Separate binding certificate verdicts from evidence and never let optional caches feed binding outputs.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "rem:network:within-epoch-solve-freeze", environment = "remark", statement = "Freeze the completed-set base matrix and ledger-derived emissions throughout a solve.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "subsec:network:host-contract", environment = "subsection", statement = "Track host contract as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "post:network:host-contract", environment = "postulate", statement = "Publish the complete package with the fixed marker policy, verified accepted burn snapshot and evidence, and decisive standing enclosures without hidden state or normative digests.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:host-contract-accepted-records", environment = "item", statement = "At each accepted boundary publish the final write and edge sets, the dependent-set partition obtained by merging overlapping principal closures against prior finalized history, realized size, closure cause and attested boundary timestamp.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:host-contract-final-ledger", environment = "item", statement = "Publish settled boundary burn state, final residual balances and action counts, accepted-act count increments and debit vintages.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:host-contract-semantic-projection", environment = "item", statement = "Publish every accepted Actor-authored act, its fold cell and coefficient, recipient resolution and inviter revocation, together with the base allocation determined under the published domain weights.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:host-contract-transport", environment = "item", statement = "Publish the tilt profile, accepted rung and PASS, FAIL or INDECISIVE verdict for every higher attempted rung, depth masses, emission fractions and conserved transport.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:host-contract-final-standing", environment = "item", statement = "Publish the rate-hull box, standing certificate, fixed-point enclosure, final standing, action and epoch stamps, door headroom and all three write-gate verdicts.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:host-contract-shared-policy", environment = "item", statement = "Publish title and settlement recognition, target size and duration bounds, the led policy-floor schedule with its wall comparison, threshold schedule and margin. Publish the in-force wall and fixed structural-floor declaration beside the numeraire before the first epoch, including its exact defining object and comparison procedure; include controller edition, reduced constants, completed width and rung, proposal and delivered led wall. No protocol formula changes silently.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "itm:network:host-contract-evidence", environment = "item", statement = "Publish formula editions, constants, interval boxes, residual bounds and reports sufficient for any participant to rerun the host calculation.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "def:network:door-headroom", environment = "definition", statement = "Sum final stamp surplus once per accepted act as a non-actuating diagnostic.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "rem:network:durations-no-glyph", environment = "remark", statement = "Publish duration policy, closure cause and attested timestamp without inventing a formula-derived clock.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "03 Network", label = "ins:network:back-pressure", environment = "insight", statement = "Separate epoch budget and timing selection from the greatest-certifiable-rung search.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "sec:graph", environment = "section", statement = "Track graph as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "subsec:graph:edge-ontology", environment = "subsection", statement = "Track edge ontology as a separately addressable subsection.", kind = "none", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "ax:graph:authored-act-ontology", environment = "axiom", statement = "Accepted acts own all authoritative fields and project to edges; nodes and their properties are derived readings.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:act-ownership-invariant", environment = "remark", statement = "An edge projection cannot independently change any parent-owned approval, payload, debit or clock.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "cor:graph:hyper-act-indivisibility", environment = "corollary", statement = "Both hyper-act projections share exactly one lifecycle and accounting unit.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
