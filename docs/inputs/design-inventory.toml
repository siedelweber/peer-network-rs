  { chapter = "05 Nodes and edges", label = "case:nodes:participant-found", environment = "case", statement = "Branch of ``edge:nodes:participant``: A founding Participant uses mint of its own act identifier for both the A-leg origin and T-leg destination, creating the Chat through its terminal target.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
