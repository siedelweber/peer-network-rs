  { chapter = "Appendix I — Deployment", label = "subsec:deployment:transparency-of-protocol-formulas", environment = "subsection", statement = "Publish formula and constant editions and announce changes before they affect reproduction.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:transparency-of-protocol-formulas-edition-fixed", environment = "case", statement = "Track transparency of protocol formulas edition fixed as a separately addressable case.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:transparency-of-protocol-formulas-scheduled-vote", environment = "case", statement = "Track transparency of protocol formulas scheduled vote as a separately addressable case.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:transparency-of-protocol-formulas-time-locked", environment = "case", statement = "Track transparency of protocol formulas time locked as a separately addressable case.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:transparency-of-protocol-formulas-silent-tuning", environment = "case", statement = "Silent parameter changes invalidate cached values and accountability; publish changed formulas, reduced controller inputs and led outputs without repricing past debits. An aggregate source ceiling limits amount, not funded-partition allocation or strategic standing advantage.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:calibration-declarations", environment = "subsection", statement = "Group the public standing, wall, boundary, encoding and replay declarations required before an edition takes effect.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "post:deployment:calibration-declarations", environment = "postulate", statement = "Publish the edition declarations before effect and retain all material needed to replay them; a reference may be used without claiming empirical optimality.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:standing-parameters", environment = "condition", statement = "Declare tilt profile/grid, normalized nonnegative depth masses and deepest support, positive self-retention, nonnegative domain weights and normalized family profiles with admissibility evidence; deepest positive depth incurs its full cumulative tilt. Deployment declares before effect; bite 2 carries declarations, bite 5 compiles them and bite 6 certifies them. Complete-act partitions can still change author-indexed folds and normalized rows; standing invariance needs additional premises.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:wall-calibration", environment = "condition", statement = "Publish numeraire, policy floor, fixed structural floor with exact object, margin, controller edition/init/constants and total comparison procedure. Compare both chartered floors, neither a default; distinguish proposal from delivered wall and preserve debit vintage. Deployment supplies evidence; epoch bites 6 and 7 certify the charge and controller.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:boundary-policy", environment = "condition", statement = "Declare size and duration bounds, floor/announcement lead, candidate search/trial budget, timeout, availability target and fallback, plus a constant-change window freezing cadence retargeting. No unwritten candidate gains an admission right. Deployment owns policy; host bite 8 applies it with bite 7 validation.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:canonical-encoding", environment = "condition", statement = "Publish and version one canonical encoding with Actor/support order, rational representations, nonexact disclosures and all profile, depth, emission, controller and certificate fields; supply round-trip evidence. Host bite 8 encodes through pn-interchange; stored history retains exact package bytes and the effective encoding edition for replay bite 9. The paper selects no byte codec.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:canonical-replay", environment = "condition", statement = "Publish deterministic certification, precision, refinement, equality and stopping limits. The same inputs and procedure must reproduce every attempted PASS, FAIL or INDECISIVE verdict and greatest proved passing rung, with the exact anchor available. Threshold straddling refines or rejects; no tolerance chooses a verdict. Bites 6 and 8 publish the procedure and history, and replay bite 9 reconstructs its original edition and inputs. Declared fibres and matched comparison histories permit replay of pair displacement and projected residuals; common ownership and counterfactual histories remain explicit inputs rather than inferred record facts.", kind = "policy", crate = "pn-replay", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:centralized-monitoring", environment = "subsection", statement = "Group required centralized certificate, emission, controller, work and cadence observations, without new binding feedback.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "post:deployment:centralized-monitoring", environment = "postulate", statement = "The centralized operator publishes reproducible observations, sampling, aggregation, thresholds, persistence, reviews and crossing dispositions; targets never waive exact standing, the floor, certification or input quarantine.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:certificate-monitoring", environment = "condition", statement = "The centralized operator publishes per-epoch fence, width, rung, enclosure radius, movement, hop mass and below-wall fraction; aggregate FAIL versus INDECISIVE, fallback frequencies, thresholds, persistence and crossing reviews. Screen failure is not certificate failure. Epoch bite 6 supplies evidence, host bite 8 publishes it, and deployment owns monitoring. For partition comparisons identify fibre, matched histories, rungs, pair shock, mixture variation and residual bound; distinguish identities from measured displacement without adding a gate or ownership inference.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:emission-experience", environment = "condition", statement = "The operator publishes wall, emission and exported-pair distributions, sag and rehabilitation with source rates, rung, interval and changed supports; declare thresholds, persistence, review and response. Report the export cap without a small-movement guarantee; no observation adds controller inputs or silently changes emission. Epoch bites 5 and 6 supply fields, host bite 8 publishes, and deployment owns comparisons. For declared funded partitions report actual export beside both fibre ceilings, Registration debit beside incremental burn, and maximum-standing concentration; observations do not settle strategic bounds.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:controller-performance", environment = "condition", statement = "Publish plant/activity/burn hypotheses, tested range and tracking, error, settling and chatter including failures; include price, capacity, emission and below-wall fractions. Declare review criteria for step and deadband calibration; failures authorize neither escalation nor new inputs nor unconditional tracking claims. Epoch bite 7 supplies controller results, host bite 8 publishes, and deployment owns trials.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:standing-work", environment = "condition", statement = "Measure per epoch/trial edges, support, width, clearance, SCCs, passes, residuals, invalidations and elapsed time against declared workload, hardware, arithmetic and memory envelopes; report missed targets and use declared fallback without dropping relations or approximating standing. Bites 6, 7 and 11 supply scoped work evidence; deployment owns operational percentile publication.", kind = "policy", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:cadence-maturity", environment = "condition", statement = "The deployment measures raw maturity drift and terminal observations when boundary timing changes, publishes adaptation-window freeze evidence and threshold responses. Raw maturity never becomes a projected-standing input. Host bite 8 publishes boundary facts and readouts bite 10 supplies the optional raw service; terminal-consumer computation remains a deployment duty under (`open:inventory:deployment-terminal-evidence`).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:calibration-evidence", environment = "subsection", statement = "Group deployment comparison and conformance evidence, not new universal constants.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "post:deployment:calibration-evidence", environment = "postulate", statement = "Publish exact inputs or acquisition procedure, editions, workload, method, predeclared criteria, results and limitations; report failed criteria without changing the comparison after seeing it.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:parameter-comparisons", environment = "condition", statement = "Publish baseline/candidate inputs, affected derived values, criteria and regenerated evidence for structural parameter changes. Keep temperature fixed absent charter adoption; recompute tier, discovery and margin comparisons, and distinguish recoinage from structural migration without holding standing fixed. Bites 6, 7, 10 and 11 furnish relevant fixtures; deployment owns criteria, terminal comparisons and review, with no hidden controller feedback.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:payload-cache-envelope", environment = "condition", statement = "Publish payload cap, indexing/encoding overhead, cache budget, traversal/depth-four envelope, parallel complete-act workload and retention horizon. Count one allowance per authored act and none for derived edges; reject oversized candidate workload/cap combinations. Deployment owns capacity sizing; records validation and host bite 8 support declared bounds, while terminal cache computation stays held under (`open:inventory:deployment-terminal-evidence`).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:boundary-search-evidence", environment = "condition", statement = "Publish trials and elapsed envelopes with dependencies, insolvency, safety, headroom, registration/vouch and title-conflict cases; declare hardware, arithmetic, residual, timeout and fallback. Reuse must reproduce certified outputs and revalidate changed inputs. Bites 7, 8 and 11 supply validator/host comparisons; deployment publishes findings without claiming optimal selection or complete unwritten demand.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:terminal-regression", environment = "condition", statement = "For each standing-edition change, publish consumer-specific inputs, deltas, fit/tolerance and failure response using actual dependencies; insulated CAN does not thereby read standing. Readouts bite 10 and corpus bite 11 cover the supported raw surface; other terminal comparisons belong to deployments under (`open:inventory:deployment-terminal-evidence`).", kind = "fixture", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:complete-act-conformance", environment = "condition", statement = "Publish compiler/replay evidence for parallel authored acts, identities, folds, revocations, recipient resolution, domain profiles and allocation under original ledger/threshold vintages. Reproduce the accepted-act census; source inspection or a certificate on incomplete projections is insufficient. Bites 3 through 6 build the semantics, replay bite 9 reconstructs them and bite 11 composes the evidence.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:sufficiency", environment = "subsection", statement = "Require sufficient public edge and parent-act data to reconstruct every binding graph quantity.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:sufficiency-minimal-record", environment = "case", statement = "Track sufficiency minimal record as a separately addressable case.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
