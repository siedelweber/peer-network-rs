  { chapter = "05 Nodes and edges", label = "edge:nodes:hyper-deinvite", environment = "edge specification", statement = "Represent unconditional De-invite control toward the same Chat and Profile without requiring an earlier Invitation or membership. It changes no standing quantity; withdrawal uses a cancelling Invitation, while De-invite is read by the Layer-2 membership fold.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "environment", material_class = "closure" },
