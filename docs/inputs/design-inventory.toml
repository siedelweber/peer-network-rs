  { chapter = "04 Graph", label = "case:graph:path-view-determinant-bound-full-mask", environment = "case", statement = "Branch of ``prop:graph:path-view-determinant-bound`` proof: For the full path-view mask, all four entries are unsoftened and the determinant is ad-bc; the reference parameters give the stated determinant and square-root magnitude.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:path-view-determinant-bound-epistemic-mask", environment = "case", statement = "Branch of ``prop:graph:path-view-determinant-bound`` proof: For the Epistemic path-view mask, softening the first column gives determinant bleed times (ad-bc); the reference parameters give the stated determinant and square-root score.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:path-view-determinant-bound-economic-mask", environment = "case", statement = "Branch of ``prop:graph:path-view-determinant-bound`` proof: For the Economic path-view mask, softening the first row gives determinant bleed times (ad-bc), with square-root score of order sqrt(bleed).", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:path-view-determinant-bound-identity-mask", environment = "case", statement = "Branch of ``prop:graph:path-view-determinant-bound`` proof: For the Identity path-view mask, softening both off-diagonal entries gives determinant ad minus bleed squared times bc. The reference Self score is above the non-Self full-mask band and consistent with the full-tier assignment.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:path-view-determinant-bound-minimal-mask", environment = "case", statement = "Branch of ``prop:graph:path-view-determinant-bound`` proof: For the Minimal path-view mask, soften all but the polarization corner, giving determinant bleed times (ad-bleed times bc). The stated lower-bound estimate is strictly positive when the signed core magnitude exceeds twice bleed; small-parameter scores approach zero.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:path-view-determinant-bound-half-tier", environment = "case", statement = "Branch of ``prop:graph:path-view-determinant-bound`` proof: For a half-tier full block, attenuating the three off-corner entries gives determinant half-floor times (ad-half-floor times bc), of order half-floor; the reference Accept and Bid parameters give the stated scores.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "lem:graph:tier-floor-sign-invariance", environment = "lemma", statement = "Half-tier attenuation preserves the full-block determinant sign.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
