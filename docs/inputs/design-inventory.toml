  { chapter = "F Verification", label = "ver:raw:bid-maturity-pair", environment = "verification", statement = "Compare paired raw Bid maturity probes through tensor, activation and damping, with declared terminal reward factors; no raw product is a standing transport entry.", kind = "fixture", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:settlement:same-epoch-cancel", environment = "labelled fixture paragraph", statement = "Retain a completed child and its same-epoch challenge under both dependency-compliant residual orders.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:settlement:suppressed-cancel", environment = "labelled fixture paragraph", statement = "No suppressed cancellation is invented; a later written cancellation attaches evidence without reversing earlier published branches.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:settlement:coerced-unfair", environment = "labelled fixture paragraph", statement = "Distinguish coherent negative experience from positive standing eligibility.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "subsec:verification:authored-act-fixtures", environment = "subsection", statement = "Exercise unsigned author preparation, complete-act approval, atomicity, authoritative order and opening-qualified ordering-fraud proofs.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:handshake:approved-act-integrity", environment = "labelled fixture paragraph", statement = "Detect replacement of bytes covered by the complete-act approval; unsigned preparation is not a separate signature boundary.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:handshake:commitment-binding", environment = "labelled fixture paragraph", statement = "Check complete-act commitment binding and supplied openings under their declared construction, independently of missing private openings and without requiring a host contribution.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:handshake:approval", environment = "labelled fixture paragraph", statement = "Reject missing, altered or transplanted actor approvals.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:handshake:author-authority", environment = "labelled fixture paragraph", statement = "Check signature validity under the recorded key independently of the separate authority oracle; a valid signature can coexist with an adverse or unavailable authority result.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:handshake:atomicity", environment = "labelled fixture paragraph", statement = "Reject missing or inconsistent hyperedge projections and leg-addressed dependencies.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:handshake:ordering", environment = "labelled fixture paragraph", statement = "Check prior and same-epoch dependency order, cycles and unconstrained permutations.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:handshake:tombstoning", environment = "labelled fixture paragraph", statement = "Within the optional courtesy standard: Retain commitments and binding results when a holder removes its dependency opening. Check an independently supplied valid opening against the unchanged commitment; treating the missing opening as a new graph state or refusing it solely because the first holder deleted its copy is the required failure.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "F Verification", label = "ver:handshake:fraud", environment = "labelled fixture paragraph", statement = "Verify dependency openings and ordering fault without reversing completed state.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:handshake:title", environment = "labelled fixture paragraph", statement = "Check binding, explicit state anchors, sibling completion and continuing cancellation with no winner by residual order.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "G Frontiers", label = "app:frontiers", environment = "appendix", statement = "Inventory four architectural extensions with their scope, requirements and stake. No entry meets the Layer-1 open-problem criterion; an extension does not license a change to the operative charter.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "G Frontiers", label = "def:frontiers:open-problem", environment = "definition", statement = "An open problem must be capable of changing a needed admission, faithfulness or convergence claim or requirement; an already proved bound or a deployment choice with fixed validation is not one merely because it could be sharpened. The appendix contains four architectural extensions and no Layer-1 open problem.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "G Frontiers", label = "rem:frontiers:priority", environment = "remark", statement = "Prioritize exact conserved evaluation and the boundary mechanism. Adopted exact reuse retains its comparison evidence; the mechanism also needs its agreement, selection and liveness arguments. Accepted evidence follows replay verification, and a replacement certificate requires the specified stronger charter.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", conformance = ["realizes{``cond:deployment:boundary-search-evidence``; This inventory summary records the exact-reuse comparison evidence required at this closure label, without adopting monitoring conduct.}", "realizes{``cond:deployment:certificate-monitoring``; This inventory summary records accepted certificate evidence required for replay, without adopting the separate courtesy monitoring standard.}"], material_class = "closure" },
  { chapter = "G Frontiers", label = "subsec:frontiers:core", environment = "subsection", statement = "No appendix entry meets the Layer-1 open-problem criterion.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "G Frontiers", label = "subsec:frontiers:architectural", environment = "subsection", statement = "Distinguish the boundary mechanism and exact conserved evaluation from the two conditional charter extensions. The mechanism owes agreement, selection and availability; optional exact reuse owes equality and measured benefit. Richer terminal sign transport is governed by the guild grant and formula completeness, not an architectural frontier. Four architectural extensions leave no Layer-1 open problem.", kind = "policy", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "G Frontiers", label = "frontier:boundary-mechanism", environment = "frontier (arch)", statement = "Specify the submission model, candidate class, assumptions and testable selection guarantee. Establish agreement on the published act sequence, placement, causally closed edge set and complete calculation package; recompute logical time rather than agree it. Search policy, budgets and fallback concern conduct, and no timeout permits an invalid accepted set. External wall-clock measurement audits published durations; the asserted timestamp verifies no elapsed time. Written-side accountability proves neither treatment of unwritten candidates nor decentralized selection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "environment", material_class = "closure" },
  { chapter = "G Frontiers", label = "frontier:high-dimensional-sentiment", environment = "frontier (arch)", statement = "Changing the operative tensor or temperature requires charter adoption with rank, determinant, composition, replay and multivariate-maturity evidence; extra coordinates alone establish none of these.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "environment", material_class = "closure" },
  { chapter = "G Frontiers", label = "frontier:exact-conserved-evaluation", environment = "frontier (arch)", statement = "Implement exact conserved evaluation against declared scale, hardware, memory and boundary-duration envelopes; publish limiting load and failure mode. Adopted reuse must revalidate current inputs and reproduce complete recomputation’s certified package and verdicts under the specified calculation. Retain every required act and relation; equality of fixed-point certification requires neither a published compiler-version field nor identical iteration history, and numerical allowances cannot select verdicts.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "environment", material_class = "closure" },
  { chapter = "G Frontiers", label = "frontier:certificate-enclosure", environment = "frontier (arch)", statement = "Only a specified stronger charter can propose a global replacement certificate: state the required rung and graph class the width fence cannot certify, prove soundness including wall kinks, and report cost, interval overestimation or equality. The operative fence remains authoritative; no implementation chooses whichever gate passes.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "environment", material_class = "closure" },
  { chapter = "H Necessity", label = "app:necessity", environment = "appendix", statement = "Track necessity as a separately addressable appendix.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:directed-edges", environment = "subsection", statement = "Preserve directed incidence while flagging the claim that every projection source is active.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:directed-edges-undirected", environment = "case", statement = "Refused simplification under ``subsec:necessity:directed-edges``: Keep directed edges; refuse undirected, symmetric influence, which manufactures paths to clique members through shared content without the directed outward actions those paths would require.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:passivity", environment = "subsection", statement = "Require active authorship or boundary derivation for passive-sourced projections.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:passivity-autonomous-emission", environment = "case", statement = "Refused simplification under ``subsec:necessity:passivity``: Keep passive-sourced legs author-attributed, target-fixed and immutable; refuse autonomous passive-node emission, which injects routing connections no actor consented to or authored.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:tensor-format", environment = "subsection", statement = "Preserve the distinct full slice and extracted path-view matrix interfaces.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:tensor-format-scalar-routing", environment = "case", statement = "Refused simplification under ``subsec:necessity:tensor-format``: Keep the stored 3 by 3 slice and extracted 2 by 2 path view for their distinct consumers; refuse routing on a single derived scalar, which loses orientation, matrix composition and the separation of routing discrimination from attribution equity, even if the parameters remain auditable.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:tensor-format-lossy-storage", environment = "case", statement = "Refused simplification under ``subsec:necessity:tensor-format``: Keep the non-lossy parameter declaration so scoring objects can be recomputed; refuse storing only a derived scalar and discarding the parameters, which breaks auditability. This storage failure requires parameter sufficiency, not by itself the tensor format.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "rem:necessity:tensor-overdetermination-convenience", environment = "remark", statement = "Treat cached-slice consistency as a diagnostic rather than provenance.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:average-based-aggregation", environment = "subsection", statement = "Retain the declared terminal mean fold rather than unbounded parameter summation.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:average-based-aggregation-summation", environment = "case", statement = "Refused simplification under ``subsec:necessity:average-based-aggregation``: Keep arithmetic-mean aggregation; refuse summing sentiment parameters, which drives repeated identical contributions into clamp saturation and erases per-actor sentiment magnitude rather than preserving parameter fidelity.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:per-author-netting", environment = "subsection", statement = "Net complete authored coordinates within the declared bundle and exclude derived/control/settlement readings.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:per-author-netting-weight-netting", environment = "case", statement = "Refused simplification under ``subsec:necessity:per-author-netting``: Keep full-incidence, per-author parameter netting by sum-then-clip to [-1,1] for endorsement projection only; refuse summing already transformed edge weights, which can exceed the published path-weight ceilings.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:per-author-netting-cross-author-netting", environment = "case", statement = "Refused simplification under ``subsec:necessity:per-author-netting``: Keep full-incidence bundles separate by author and net their parameters only; refuse cross-author netting, which lets one author’s revision cancel another author’s live consent through a shared passive node.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:per-author-netting-derived-bond-netting", environment = "case", statement = "Refused simplification under ``subsec:necessity:per-author-netting``: Keep derived Self-edge components outside record netting and recompute their activation from computed standing; refuse netting them as records, a category error because they have no authored bundle and their responsive channel is not an accumulated record quantity.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:per-author-netting-settlement-netting", environment = "case", statement = "Refused simplification under ``subsec:necessity:per-author-netting``: Keep settlement records outside endorsement-only parameter netting; refuse netting them, which hides the individual records settlement recognition reads.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:per-author-netting-control-netting", environment = "case", statement = "Refused simplification under ``subsec:necessity:per-author-netting``: Keep control records outside endorsement-only parameter netting; refuse netting them, which hides the individual control records settlement recognition reads.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:max-product-path-scoring", environment = "subsection", statement = "Keep raw maximum-path traversal distinct from a sum-of-paths estimator.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:max-product-path-scoring-sum-of-paths", environment = "case", statement = "Refused simplification under ``subsec:necessity:max-product-path-scoring``: Keep max-product path scoring; refuse summing over all paths, which lets k parallel paths multiply the score by k and turns internal redundancy into manufactured visibility.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:conserved-rival-allocation", environment = "subsection", statement = "Normalize allocation across self and all recipients to one conserved unit.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:conserved-rival-allocation-independent-weights", environment = "case", statement = "Independent per-pair weights without a row budget permit cost-free replication of regard; row conservation instead makes intact source pairs rival and preserves the closed weighted mean. Endorsing everyone is not equivalent to endorsing no one for coordinates or maxima. Under ``thm:epoch:split-observational-equivalence``, a record-based remedy imposes the same change on a legitimate completion with identical public fields, or the same distribution of changes if randomized.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:self-retention-base", environment = "subsection", statement = "Keep a positive unmodulated self base and retain unallocated pair mass.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:self-retention-base-drop-mass", environment = "case", statement = "Refused simplification under ``subsec:necessity:self-retention-base``: Keep unallocated source mass as positive self-retention; refuse dropping it, which lowers row sums below one and breaks the equality between a closed cluster’s weighted mean and its ledger ratio.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:self-retention-base-tilt-self", environment = "case", statement = "Refused simplification under ``subsec:necessity:self-retention-base``: Keep self-retention unmodulated by standing; refuse tilting the self share, which lets standing defend its own retention without a new source or act and introduces a direct feedback channel.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:domain-weighted-allocation", environment = "subsection", statement = "Sum weighted act coefficients with one normalized domain profile per act.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:domain-weighted-allocation-domain-double-counting", environment = "case", statement = "Refused simplification under ``subsec:necessity:domain-weighted-allocation``: Keep published domain weights and a normalized domain profile summing to one for each folded act contribution; refuse counting an act once per projected domain, which lets its shape multiply the same authored intent for the same debit.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:finite-depth-conserved-transport", environment = "subsection", statement = "Use the published finite supported-depth mixture.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:finite-depth-conserved-transport-unbounded-closure", environment = "case", statement = "Refused simplification under ``subsec:necessity:finite-depth-conserved-transport``: Keep one conserved transport operator mixed from a published finite depth mass; refuse unbounded transitive closure, which has no finite deepest-supported-depth screen and expands contributing width to the whole graph’s rate range.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:finite-depth-conserved-transport-single-hop", environment = "case", statement = "Refused simplification under ``subsec:necessity:finite-depth-conserved-transport``: Keep the published finite-depth transport mixture; refuse replacing it with a single hop, which reports only immediate allocation and loses whether allocating sources are themselves backed, making the comparator purely local.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:hop-faded-responsive-tilt", environment = "subsection", statement = "Attach hop exponents to transported mass rather than authored rows.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:hop-faded-responsive-tilt-flat-profile", environment = "case", statement = "Refused simplification under ``subsec:necessity:hop-faded-responsive-tilt``: Keep a hop-decaying tilt profile owned by transported mass; refuse a flat profile, whose two-sided volume grows with the hop count instead of the front-loaded sum and fails the prior screen at twice the cap.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:hop-faded-responsive-tilt-row-owned-exponent", environment = "case", statement = "Refused simplification under ``subsec:necessity:hop-faded-responsive-tilt``: Keep the tilt exponent attached to transported mass at its own hop index; refuse a row-owned exponent, since one row relaying both its own and a distant source’s mass would need two exponents in one product, invalidating the propagation argument.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:epoch-set-standing", environment = "subsection", statement = "Exclude previous standing and incidental intraepoch order from the mathematical result.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:epoch-set-standing-order-input", environment = "case", statement = "Refused simplification under ``subsec:necessity:epoch-set-standing``: Keep standing a function of the completed epoch set and evaluated-state inputs; refuse intra-epoch order as a standing input, which lets a host reorder concurrent acts to move a verdict without a recorded semantic choice. Formation and order-sensitive raw quantities still read authoritative order.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:epoch-set-standing-memory-input", environment = "case", statement = "Refused simplification under ``subsec:necessity:epoch-set-standing``: Keep standing memoryless on the completed epoch inputs; refuse the preceding epoch’s standing as a semantic input, which makes the answer path-dependent and prevents holders of the same records from independently agreeing by replay.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:title-coupled-settlement-standing", environment = "subsection", statement = "Resolve incomplete or invalid settlements home; structurally completed event cells can allocate outward without requiring an unchallenged winning branch.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:title-coupled-settlement-standing-face-value", environment = "case", statement = "Reject standalone claimed settlement as a standing premise; require actual structurally completed event evidence, not an external winner or unchallenged status.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:clamped-entry-bounds", environment = "subsection", statement = "Use the declared master-formula clamps and preserve zero-parameter routing degeneracy.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:clamped-entry-bounds-raw-products", environment = "case", statement = "Refused simplification under ``subsec:necessity:clamped-entry-bounds``: Keep the master formula’s clamped entry bounds and polarization floor; refuse unclamped raw parameter products, which lose the floor and allow rank-one degeneracy and zero path-view determinant at weak or vanishing parameters.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:always-active-baseline", environment = "subsection", statement = "Retain the mask-independent full-slice baseline.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:always-active-baseline-drop-baseline", environment = "case", statement = "Refused simplification under ``subsec:necessity:always-active-baseline``: Keep the always-active baseline entry as the mask-independent norm anchor; refuse dropping it, which makes the guaranteed floor depend on the mask. Full-mask entries still contribute at zero parameters, so baseline deletion alone does not make that full-mask norm zero.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:eta-softening", environment = "subsection", statement = "Use the declared bleed and derived Half-tier floor in path views.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:eta-softening-hard-zeroing", environment = "case", statement = "Refused simplification under ``subsec:necessity:eta-softening``: Keep bleed-softening of masked path-view entries; refuse hard-zeroing, which makes the marginal restricted masks singular and their edges impassable even when the stored slice has nonzero norm.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:eta-softening-epistemic-zero", environment = "case", statement = "Refused simplification under ``subsec:necessity:eta-softening``: Keep bleed-softening for the Epistemic path-view mask; refuse zeroing its masked column, which gives an identically zero determinant and infinite routing cost regardless of parameters.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:eta-softening-economic-zero", environment = "case", statement = "Refused simplification under ``subsec:necessity:eta-softening``: Keep bleed-softening for the Economic path-view mask; refuse hard-zeroing its masked entries, which forces zero determinant.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:eta-softening-minimal-zero", environment = "case", statement = "Refused simplification under ``subsec:necessity:eta-softening``: Keep bleed-softening for the Minimal path-view mask; refuse zeroing three of its four entries, which forces zero determinant and destroys routing through that mask.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:dual-view-architecture", environment = "subsection", statement = "Separate determinant routing from Frobenius attribution inputs.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:dual-view-architecture-frobenius-only", environment = "case", statement = "Refused simplification under ``subsec:necessity:dual-view-architecture``: Keep path-view determinant and sign for routing and attribution-view Frobenius norm for CAN; refuse Frobenius-only scoring, which makes Tag and Opinion routing nearly equal and cannot distinguish orientation-preserving from orientation-reversing interactions.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:dual-view-architecture-determinant-only", environment = "case", statement = "Refused simplification under ``subsec:necessity:dual-view-architecture``: Keep the distinct routing and attribution views; refuse determinant-only CAN attribution, which gives Tag-based compositions less credit than Opinion-based compositions of comparable information content and discriminates by tier instead of contribution quality.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:positive-parity-routing", environment = "subsection", statement = "Preserve signed raw traversal while flagging its obsolete standing role.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:positive-parity-routing-magnitude-only", environment = "case", statement = "Refused simplification under ``subsec:necessity:positive-parity-routing``: Keep determinant signs and positive-path-parity filtering in the raw endorsement service; refuse magnitude-only routing, which treats a strong negative-parity path as coherent endorsement. Positive parity is necessary for that routing test, not sufficient for a standing vouch: coherent hostility still fails the separate local stance test.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:strict-transmission-decay", environment = "subsection", statement = "Inventory strict terminal composition attenuation.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:strict-transmission-decay-lossless", environment = "case", statement = "Refused simplification under ``subsec:necessity:strict-transmission-decay``: Keep saturated transmission mean/(1+mean), strictly below one; refuse lossless transmission, which lets a one-child wrapper retain the child’s full credit even as its connection strength tends to zero, defeating depth decay.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:inverse-temperature", environment = "subsection", statement = "Keep the locked temperature declaration distinct from speculative adaptive calibration.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:inverse-temperature-free-temperature", environment = "case", statement = "Refused simplification under ``subsec:necessity:inverse-temperature``: Keep the declared inverse-temperature anchor 2 ln 2; refuse treating it as a freely tuned post-deployment parameter, which moves the maturity crossover so moderate-maturity noise passes at low values or cross-cluster discovery is suppressed at high values.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:inverse-temperature-low-temperature", environment = "case", statement = "Refused simplification under ``subsec:necessity:inverse-temperature``: Keep the declared inverse-temperature anchor 2 ln 2; the beta=1 comparison is a refused replacement because its shifted crossover amplifies moderate-maturity noise, including the stated prior-degree example.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:inverse-temperature-high-temperature", environment = "case", statement = "Refused simplification under ``subsec:necessity:inverse-temperature``: Keep the declared inverse-temperature anchor 2 ln 2; the beta=2 comparison is a refused replacement because amplification requires very high prior degree and cross-cluster discovery becomes effectively impossible in the stated comparison.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:redundancy-correction", environment = "subsection", statement = "Treat overlap discount as a replaceable terminal preference; preserve nonduplication, depth decay, attenuation and context independence.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:redundancy-correction-ignore-overlap", environment = "case", statement = "Terminal preference under ``subsec:necessity:redundancy-correction``: The canonical terminal overlap ratio discounts shared upstream work. Setting it to one is an alternative preference, not a forbidden simplification or an admission violation: normalized dependency weights already average identical contributions rather than multiply them. A guild may replace the discount under its published rule while preserving depth decay, strict transmission attenuation and context independence.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:participation-floor", environment = "subsection", statement = "Keep numeraire, safety threshold, policy floor and derived effective floor distinct.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:participation-floor-coupled-price-policy", environment = "case", statement = "Refused simplification under ``subsec:necessity:participation-floor``: Keep the reduced wall, structural floor and policy dial distinct, joined to frame amounts by the numeraire; refuse one coupled price-policy constant, which forces congestion policy to reprice survivors although the door and curve are separable.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:participation-floor-capacity-gate", environment = "case", statement = "Refused simplification under ``subsec:necessity:participation-floor``: Keep the participation gate distinct from capacity; refuse forcing them to coincide, which collapses the two-gate architecture and turns the dimensionless policy barrier into a hard monetary scale.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:participation-floor-uncontrolled-host-dial", environment = "case", statement = "Refused simplification under ``subsec:necessity:participation-floor``: Keep a published wall controller and structural floor separate from the discretionary policy dial; refuse one uncontrolled host dial, which permits a wall below its floor and turns every controller adjustment into a governance decision.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:floor-as-numeraire", environment = "subsection", statement = "Use the explicit numeraire to join frame amounts to action counts and co-scale it under redenomination; external price projection is not an operand of this reduction.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:floor-as-numeraire-unreduced-debit", environment = "case", statement = "Refused simplification under ``subsec:necessity:floor-as-numeraire``: Subtracting the frame-denominated threshold directly from a reduced pair mixes frame and action units. Convert through the numeraire before applying a reduced-pair debit.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:floor-as-numeraire-unreduced-bond", environment = "case", statement = "Refused simplification under ``subsec:necessity:floor-as-numeraire``: Combining unreduced frame amount or standing directly with counts or the bond's literal one conceals a unit and makes the result depend on denomination. The numeraire is the sole conversion between frame units and the action economy.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:nu-reduced-kernel", environment = "subsection", statement = "Reduce activation by numeraire rather than the policy door.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:nu-reduced-kernel-gate-reduction", environment = "case", statement = "Refused simplification under ``subsec:necessity:nu-reduced-kernel``: Keep the bond kernel reduced by the numeraire, with the participation floor confined to gate, freeze and entry cost; refuse reducing by the gate’s frame image, which makes every policy-floor move reshape bond weights and coupled dynamics for actors who remain admitted.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:time-locked-non-burnable", environment = "subsection", statement = "Discuss source realization unit classes outside the Actor-entry calculation; source price projection is oracle material.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "H Necessity", label = "subsec:necessity:time-locked-non-redeemable", environment = "subsection", statement = "Discuss source redemption mechanisms outside the Actor-entry calculation.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "H Necessity", label = "subsec:necessity:three-step-settlement", environment = "subsection", statement = "Require the first correct buyer Ratify to complete its Accept handshake; cancellation remains challenge evidence after completion.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:three-step-settlement-accept-commit", environment = "case", statement = "Do not complete at Accept; buyer Ratify supplies the completing confirmation, without closing future challenge rights.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:explicit-cancels", environment = "subsection", statement = "Use authored cancellation rather than invented per-Bid timeouts.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:explicit-cancels-expiry", environment = "case", statement = "Refused simplification under ``subsec:necessity:explicit-cancels``: Keep explicit authored, immutable Withdraw and Rescind records without per-object timeout; refuse per-Bid expiry, which causes an unrecorded state transition from unrelated throughput and violates causal locality.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:no-privileged-cancel-class", environment = "subsection", statement = "Apply ordinary gates and debit to cancellation acts.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:no-privileged-cancel-class-exempt-cancels", environment = "case", statement = "Cancellation remains an ordinary priced act under universal gates; continuing challenge semantics confer no privileged inclusion.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:endogenous-clearing", environment = "subsection", statement = "Publish constraints and accepted-set validity without inventing normative optimal selection.", kind = "invariant check", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:endogenous-clearing-normative-selection", environment = "case", statement = "Refused simplification under ``subsec:necessity:endogenous-clearing``: Keep published constraints, replayable dependent-set partition validity and discretionary selection; refuse a normative price-order or packing rule audited against all unwritten demand, since that demand is not a Layer-1 object and the supposed audit cannot verify the counterfactual selection.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:conflict-not-causal", environment = "subsection", statement = "Do not force concurrent conflicts into one causal dependent set.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:conflict-not-causal-conflict-grouping", environment = "case", statement = "Refused simplification under ``subsec:necessity:conflict-not-causal``: Keep conflict protection as the written-side tie-favoring recognition rule plus the named boundary-censorship exposure; the dependent set is already its causal closure. Refuse co-transport grouping of concurrent cancels and commits, which would require cross-references or serialization that destroys the regret window.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:conflict-not-causal-mandatory-cross-reference", environment = "case", statement = "Refused simplification under ``subsec:necessity:conflict-not-causal``: Keep conflict protection as the written-side tie-favoring recognition rule plus the named boundary-censorship exposure; the dependent set is already its causal closure. Refuse mandatory cancel-to-commit cross-references, which force a Rescind to cite Ratify or a Withdraw to cite a later Accept and let the counterparty outrun early regret.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:conflict-not-causal-serialization", environment = "case", statement = "Keep causal closure distinct from competing branches and challenges; do not add a serialization choice that chooses one winner.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:stance-marginal-reputation", environment = "subsection", statement = "Interpretation or optional practice, not a closure admission condition: Keep terminal experience stance distinct from determinant coherence.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "H Necessity", label = "case:necessity:stance-marginal-reputation-parity-reputation", environment = "case", statement = "Interpretation or optional practice, not a closure admission condition: Refused simplification under ``subsec:necessity:stance-marginal-reputation``: Keep commercial reputation on each settlement edge’s stance marginal and routing on bilinear parity; refuse parity for both, which makes a coerced-unfair Accept with two negative coordinates yield the same positive reputation sign as the best experience.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "H Necessity", label = "subsec:necessity:universal-act-weighing", environment = "subsection", statement = "Allocate outward only for eligible positive coordinates while weighing other acts at self.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:universal-act-weighing-parity-only", environment = "case", statement = "Parity-only endorsement wrongly treats coherent hostility as an outward vouch like praise. A higher-rate source lifts under the frozen-flow comparison, but a completed act changes debit, count and allocation, so this counterfactual proves no universal act-induced lift. Changed-history displacement has the scoped pair and concentration bounds of ``prop:epoch:split-pair-displacement`` and ``prop:epoch:split-concentration``.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:universal-act-weighing-negative-weight", environment = "case", statement = "Refused simplification under ``subsec:necessity:universal-act-weighing``: Keep nonnegative conserved allocation and resolve non-vouch acts home; refuse negative standing weights as a remedy for hostility, which destroys the convex-combination standing hull.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:universal-act-weighing-composed-stance", environment = "case", statement = "Refused simplification under ``subsec:necessity:universal-act-weighing``: Keep stance as the local authored verdict deciding destination, with parity composing coherence; refuse composing stance along paths, which confuses local verdicts with orientation transport. A coherent hostile person-directed act remains weighed and resolves home.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:universal-act-weighing-exclude-hostility", environment = "case", statement = "Refused simplification under ``subsec:necessity:universal-act-weighing``: Keep every act weighed, with hostile person-directed acts charged at full magnitude against their author’s conserved unit and resolved home; refuse excluding hostility from the weighing census, which discounts the author’s attack instead of pricing it.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:declarative-item-identity", environment = "subsection", statement = "Derive Item identity from genesis structure rather than erasable descriptions.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:declarative-item-identity-content-addressing", environment = "case", statement = "Refused simplification under ``subsec:necessity:declarative-item-identity``: Keep Item identity as the genesis record’s structural key; refuse hashing its removable description as identity, which welds title to erasable bytes and makes removal orphan or re-key the title thread.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:declarative-item-identity-external-registry", environment = "case", statement = "An external referent registry imports an identity authority; declared Item identity remains distinct from the real-world referent question.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:handshake-actor-incidence", environment = "subsection", statement = "Retain direct Actor-to-Actor settlement incidence.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:handshake-actor-incidence-profile-handshake", environment = "case", statement = "Direct Actor incidence keeps title independent of Profile sentiment; recognition-blind raw routing remains separate from title-coupled counterparty standing.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:settlement-half-routing", environment = "subsection", statement = "Apply Half-tier path extraction to settlement families without changing stored blocks.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:settlement-half-routing-full-routing", environment = "case", statement = "Full-tier settlement is an alternative raw-view assignment, not an alternate standing or admission rule.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:settlement-half-routing-auction-gravity", environment = "case", statement = "Raw Bid discovery depends on surrounding graph and competition; a tier choice alone supplies no universal concentration bound.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:settlement-half-routing-endorsement-injection", environment = "case", statement = "Authored settlement incidence may be traversed without recognition only by the raw service. Half-tier demotion preserves determinant sign, not a universal scaling factor or negligible terminal exposure.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:settlement-half-routing-minimal-routing", environment = "case", statement = "The charter chooses Half-tier settlement routing; sign preservation proves neither a unique intermediate floor nor a quantitative deterrence guarantee.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:binary-join-request", environment = "subsection", statement = "Keep Join Request binary without fabricating recipient-authored incidence.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:binary-join-request-ternary-request", environment = "case", statement = "Refused simplification under ``subsec:necessity:binary-join-request``: Keep Join Request binary from requester Actor to Chat; refuse a ternary request routed through the recipient Actor, which creates a recipient-sourced leg before that recipient authors anything and misrepresents their stance.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:invitation-profile-terminus", environment = "subsection", statement = "Require Invitation terminal incidence at the invitee Profile.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:invitation-profile-terminus-actor-terminus", environment = "case", statement = "Refused simplification under ``subsec:necessity:invitation-profile-terminus``: Keep Invitation/T directed to the invitee’s Profile; refuse an Actor terminus, which creates another passive-sourced in-edge family and bypasses the standing-dependent Reputation funnel with an undamped conduit to fresh accounts.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:proposal-half-tier", environment = "subsection", statement = "Apply Half-tier routing to Join Request and Invitation A legs.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:proposal-half-tier-full-routing", environment = "case", statement = "Refused simplification under ``subsec:necessity:proposal-half-tier``: Keep Join Request and Invitation/A at Half-tier routing; refuse Full-tier proposal routing, which gives unanswered proposals enacted-relation force and lets mass invitations manufacture Chat-adjacent visibility at proposal cost.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:unrestricted-departure", environment = "subsection", statement = "Do not add membership or authority predicates to Leave and De-invite formation.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:unrestricted-departure-leave-membership-check", environment = "case", statement = "Refused simplification under ``subsec:necessity:unrestricted-departure``: Keep Leave admission under the universal write rule without a membership precondition; refuse rejecting a nonmember’s Leave, which makes terminal membership a binding admission predicate and suppresses a priced public dissociation.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:unrestricted-departure-deinvite-authority-check", environment = "case", statement = "Refused simplification under ``subsec:necessity:unrestricted-departure``: Keep De-invite admission under the universal write rule without authority or target-membership preconditions; refuse those checks, which make membership binding and turn who may expel into a Layer-1 authority verdict instead of terminal guild policy.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:control-self-retention", environment = "subsection", statement = "Weigh every control act at its author and never as an outward vouch.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:control-self-retention-outward-control", environment = "case", statement = "Refused simplification under ``subsec:necessity:control-self-retention``: Keep type-fixed control acts weighed and resolved to their author in every quadrant; refuse outward allocation merely because their fixed coordinates are positive and their raw tier is small, which turns De-invite into a vouch for the expellee rather than authored stance.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:deinvite-profile-terminus", environment = "subsection", statement = "Require De-invite terminal incidence at the target Profile.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:deinvite-profile-terminus-actor-terminus", environment = "case", statement = "Refused simplification under ``subsec:necessity:deinvite-profile-terminus``: Keep De-invite/T directed to the target Profile; refuse an Actor terminus, which breaks the sole passive-sourced Reputation funnel and opens an undamped attention conduit. The conduit is feed-only: the control act still resolves home for standing.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:bridge-per-edge-positivity", environment = "subsection", statement = "Inventory positive-edge affinity as terminal bridge policy.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:bridge-per-edge-positivity-endpoint-parity", environment = "case", statement = "Refused simplification under ``subsec:necessity:bridge-per-edge-positivity``: Keep affinity on the per-edge positive subgraph; refuse endpoint-parity-only filtering for that channel, which admits paired interior inversions and prices delivery to an interior consumer receiving an inverted signal.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:bridge-consent-difference", environment = "subsection", statement = "Inventory Profile-register consent while flagging the omitted direct-stance veto.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:bridge-consent-difference-positive-only", environment = "case", statement = "Refused simplification under ``subsec:necessity:bridge-consent-difference``: Keep consent as the clipped positive-minus-negative register difference at the bridge Profile; refuse the positive register alone, which makes advertiser-authored dislike invisible to that consent comparison.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:bridge-consent-difference-actor-register", environment = "case", statement = "Refused simplification under ``subsec:necessity:bridge-consent-difference``: Keep the consent register read at the bridge Profile; refuse reading it at the Actor, which traverses the Reputation component again after affinity already includes it, double-counting reputation and biasing bridge selection.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:bridge-consent-difference-ratio", environment = "case", statement = "Refused simplification under ``subsec:necessity:bridge-consent-difference``: Keep the always-defined clipped register difference at the bridge Profile; refuse the positive/negative register ratio, which is undefined in the common zero-negative-register case.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:bridge-self-exclusion", environment = "subsection", statement = "Inventory advertiser exclusion from terminal target and bridge domains.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:bridge-self-exclusion-self-target", environment = "case", statement = "Refused simplification under ``subsec:necessity:bridge-self-exclusion``: Keep the advertiser outside the target domain; refuse self-targeting, which prices a circuit back to the advertiser without external audience value. Under the excluded self-target case the target set is empty and reward is zero.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:bridge-self-exclusion-self-bridge", environment = "case", statement = "Refused simplification under ``subsec:necessity:bridge-self-exclusion``: Keep the advertiser outside the bridge domain; refuse self-bridging, which lets an advertiser author its own endorsement factor and manufacture a self-endorsement circuit without a counterparty.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:edge-ontology", environment = "subsection", statement = "Avoid first-class node writes and authored boundary bonds; reconcile edge wording with act ownership.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:edge-ontology-node-records", environment = "case", statement = "Refused simplification under ``subsec:necessity:edge-ontology``: Keep edge records and implicit node folds; refuse a second plane of first-class node records and attributes, which introduces new mutability, custody and erasure semantics and reopens genesis authorization and admission.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:edge-ontology-appended-bonds", environment = "case", statement = "Refused simplification under ``subsec:necessity:edge-ontology``: Keep Layer-1 bond readings derived rather than appended; refuse Layer-1-authored bond records, which re-enter the admission set and reopen the append exception and epoch cascade.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:universal-parallelism", environment = "subsection", statement = "Preserve parallel authored acts without implicit merges or supersession.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:universal-parallelism-uniqueness-constraint", environment = "case", statement = "Refused simplification under ``subsec:necessity:universal-parallelism``: Keep all record families parallelizable with no Layer-1 merge or supersession; refuse one-record-per-author/target or per-actor uniqueness constraints, which pull per-family state machines into admission and destroy the parallel accumulation needed for priced walk-back.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:universal-parallelism-latest-wins", environment = "case", statement = "Refused simplification under ``subsec:necessity:universal-parallelism``: Keep binding standing and title bundle readings distinct from terminal consumers’ fold choices; refuse Layer-1 latest-wins everywhere, which repeals sum-then-clip, makes stance free to flip and imposes one fold on consumers with different needs.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:payload-isolation", environment = "subsection", statement = "Separate removable payload from retained structural commitment.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:payload-isolation-joint-commitment", environment = "case", statement = "Refuse committing structure and payload jointly: structural authentication must remain possible when the separable payload opening is unavailable; binding and concealment rest on the declared cryptographic premise.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:complete-act-approval", environment = "subsection", statement = "Complete-act approval is required to bind the exact eligible act; neither an unsigned preparation nor an unrelated signature replaces it.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:complete-act-approval-no-approval", environment = "case", statement = "Without approval over the complete act, the accepted object can differ from the Actor’s authorized bytes; unsigned preparation is not that approval.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:act-level-dependencies", environment = "subsection", statement = "Address dependencies to complete acts with one projection per act.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:act-level-dependencies-leg-dependencies", environment = "case", statement = "Refused simplification under ``subsec:necessity:act-level-dependencies``: Keep dependencies at act level with one dependency projection and shared parent act for both hyper-edge legs; refuse separate per-leg lists and ordering, which can split an atomic act across another act or bind a provable dependency list to only one leg.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:authoritative-order", environment = "subsection", statement = "Publish one agreed total act order rather than independent local linearizations.", kind = "invariant check", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:authoritative-order-local-linearization", environment = "case", statement = "Refused simplification under ``subsec:necessity:authoritative-order``: Keep one published authoritative total act order; refuse publishing only the accepted set and letting readers linearize locally, which makes raw maturities, projected times and path eligibility diverge. Standing remains set-based on its evaluated-state inputs rather than using that residual order.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:retained-commitment", environment = "subsection", statement = "The retained commitment binds without its opening; no particular tombstoning event is needed.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:retained-commitment-remove-residue", environment = "case", statement = "Refused simplification under ``subsec:necessity:retained-commitment``: Keep the binding dependency commitment residue after removing the list and opening; refuse deleting the residue too, which leaves a later fraud proof nothing to open against and permits fabricated lists or denial of the committed list.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "subsec:necessity:title-order-separation", environment = "subsection", statement = "Use causal order to establish valid completed-state references and retain every sibling; residual order selects no honored title.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:title-order-separation-host-title-tiebreak", environment = "case", statement = "Require the counted Bid–Accept–Ratify ancestry and retain all completed children; residual host order may not select a winning branch. Branch evidence does not prescribe a terminal consumer’s choice.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "app:deployment", environment = "appendix", statement = "Track deployment as a separately addressable appendix.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:public-availability", environment = "subsection", statement = "Describe optional ways to make accepted records and replay support available; delivery is distinct from the complete inputs required once replay is attempted.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:public-availability-streaming", environment = "case", statement = "Optional operating example: Streaming the append-log minimizes cache staleness among the listed data-access choices; supplying records for inspection does not promise continuous future service.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:public-availability-api-polling", environment = "case", statement = "Optional operating example: API polling with pagination supplies records for inspection with bounded staleness; it does not change a calculation over the same consumed data or promise continuous future access.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:public-availability-snapshot-delta", environment = "case", statement = "Optional operating example: Periodic snapshots with deltas supply inspection data with bounded staleness without changing a calculation over the same consumed data.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:public-availability-gossip", environment = "case", statement = "Optional operating example: P2P gossip is one way to supply records for inspection, not an additional calculation input or a guarantee of continuous future service.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:public-availability-gated-access", environment = "case", statement = "Optional operating example: A gated subset can omit paths needed to check a creator’s centrality. Independent inspection needs the complete consumed graph inputs; the access service adds no calculation premise or promise of continuous future service.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:public-availability-through-creator", environment = "case", statement = "Optional operating example: In the public-availability proof sketch, an absent path that would pass through the creator is indistinguishable in a gated view from one routed around the creator. The invisible path therefore prevents independent verification of that creator’s centrality.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:public-availability-around-creator", environment = "case", statement = "Optional operating example: In a gated view, an absent path around the creator is indistinguishable from an absent path through the creator. Supplying the full consumed edge set permits the specified path calculation; access choices alone do not supply its inputs.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "6 Epoch", label = "subsec:deployment:epoch-calculation-input-agreement", environment = "subsection", statement = "Agreement concerns the epoch’s supplied calculation input object, not redundant computed output copies or an independent canonical serialization standard.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:epoch-calculation-input-agreement-linearization", environment = "case", statement = "An agreement service may select an input order; deterministic closure checks the supplied order rather than selecting it.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:epoch-calculation-input-agreement-cluster-closure", environment = "case", statement = "A cluster can agree one supplied epoch calculation input object; the example imposes no particular local coordination procedure.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:epoch-calculation-input-agreement-bft-agreement", environment = "case", statement = "An agreement mechanism may coordinate the supplied epoch calculation inputs; it is an optional deployment choice, not another closure operand.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:epoch-calculation-input-agreement-gossip-stability", environment = "case", statement = "Gossip stability can support optional agreement on the supplied inputs; it does not turn an unavailable or changing view into a static operand.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:epoch-calculation-input-agreement-disagreement", environment = "case", statement = "Different supplied input objects can produce different results without a deterministic-calculation disagreement.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:epoch-calculation-input-agreement-inconsistent-projection", environment = "case", statement = "Different projections of the supplied epoch inputs need not support one agreement claim; agreeing a redundant result alone does not identify those inputs.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:deployment:immutability", environment = "subsection", statement = "Keep consumed edge parameters fixed for replay; later accepted acts add edges rather than rewriting those parameters.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:deployment:immutability-mutable-records", environment = "case", statement = "Parameter updates, retroactive corrections and soft deletions violate the fixed parameters of a consumed edge record: replay of that record uses the same values, while later accepted acts may add edges.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "post:deployment:public-object-replay", environment = "postulate", statement = "Determine normative identity and replay from public objects rather than hashes or digests.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "subsec:deployment:feed-reproducibility", environment = "subsection", statement = "Clients with identical consumed ego-network records, scoring constants and depth bound reproduce the same feed; source capacity, external unit cost and source-history depth are not ranking inputs.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "case:deployment:feed-reproducibility-closed-form", environment = "case", statement = "The selected closed-form feed formula lets clients reproduce the ranking from the same consumed graph data without server state or model-weight distribution.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "case:deployment:feed-reproducibility-public-model", environment = "case", statement = "A publicly distributed, locally executable model can reproduce the feed when its full model and evaluation rule are supplied and the client can perform the whole computation without server state.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "case:deployment:feed-reproducibility-consensus-ranking", environment = "case", statement = "Consensus-computed ranking refreshed per epoch satisfies feed reproducibility only if a client can execute the full computation without server state.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "case:deployment:feed-reproducibility-opaque-model", environment = "case", statement = "Opaque server-held model weights inaccessible to clients fail feed reproducibility: clients cannot independently compute or falsify the claimed ranking.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:device-local", environment = "subsection", statement = "A deployment may provide locally cached feed computation; the depth and device-cost example describe that optional service, not a universal device guarantee.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:device-local-depth-four", environment = "case", statement = "Depth four is the chosen example for an optional device-local service; its cacheability depends on the declared device and degree assumptions and is not a closure-admission condition.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:device-local-depth-three", environment = "case", statement = "Depth three is an alternative for an optional device-local service, assessed against the same declared cacheability assumptions.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:device-local-depth-six", environment = "case", statement = "Depth six illustrates the larger memory and infrastructure cost under the stated mean degree; it is not a universal device guarantee.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:device-local-server-assisted", environment = "case", statement = "Optional operating example: Server-assisted feed computation beyond the local cache fails device-local scope when the client needs per-request graph data from the server whose ranking it is verifying.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:transparency-of-protocol-formulas", environment = "subsection", statement = "Describe communication of specified formulas and supplied constants; a changed formula changes the calculation, independently of optional announcement conduct.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:transparency-of-protocol-formulas-edition-fixed", environment = "case", statement = "An optional communication practice fixes formulas and constants within its announced edition; closure evaluates the supplied specified calculation regardless of that announcement practice.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:transparency-of-protocol-formulas-scheduled-vote", environment = "case", statement = "Optional operating example: Governance-vote updates are compatible with formula transparency only on a published schedule with enough lead time for clients to recompute affected cached values before the change applies.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:transparency-of-protocol-formulas-time-locked", environment = "case", statement = "Optional operating example: Time-locked update windows with independent oracle attestation are compatible with formula transparency only if clients cannot be surprised by silent changes; the declaration remains fixed within its structural edition.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:transparency-of-protocol-formulas-silent-tuning", environment = "case", statement = "Silent changes frustrate the optional transparency practice and cached readouts; calculation uses supplied inputs. The record carries the asserted timestamp, which verifies no elapsed time; an external wall-clock oracle audits duration bounds against observed conduct.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:calibration-declarations", environment = "subsection", statement = "Group optional communication of selected calculation inputs; the inputs themselves remain those of the separately labelled calculation.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "6 Epoch", label = "post:deployment:calibration-declarations", environment = "postulate", statement = "Closure-class supplied values and rules fix calculation operands; boundary conduct and how a deployment communicates or sets supplied values remain outside calculation.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:deployment:standing-parameters", environment = "condition", statement = "Consume the tilt profile and finite grid, normalized nonnegative depth masses, deepest support, positive self-retention, nonnegative domain weights and normalized family profiles. Deepest positive support pays its full cumulative tilt. Profile normalization removes duplicate domain counting but leaves domain-weight scale independent; row normalization conserves the allocated unit. Partition invariance needs additional premises beyond these inputs.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:deployment:wall-calibration", environment = "condition", statement = "Consume the numeraire, policy-floor schedule, exact structural floor and defining object, margin, controller formula, initialization, reduced constants and arithmetic/comparison rules. Refine or reject an unresolved binding-floor proposal before acceptance. Keep proposal and delivered wall distinct through floor, deadband and step cap, and charge the writing-epoch vintage. A changed structural floor changes an input, not an epoch output.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:deployment:supplied-boundary-values", environment = "condition", statement = "Resolve the committed target, policy-floor and led threshold schedules; no target fallback or separately supplied lead exists. Static closure reads the in-force schedule and computes the outgoing schedule; history checks the adjacent schedule seam. No unwritten candidate gains an admission right.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:deployment:boundary-conduct", environment = "condition", statement = "Publish duration bounds, timeout, search policy and trial budget and fallback; earliest target/minimum-duration or maximum-duration closing is deployment conduct outside closure and gives no unwritten candidate an admission right.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "6 Epoch", label = "cond:deployment:canonical-encoding", environment = "condition", statement = "Supply a public binding construction that resolves the epoch’s required documents and exact interpretations; the paper fixes neither a byte codec nor a serialized copy of every computed value.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "post:deployment:replay-verification", environment = "postulate", statement = "Replay the static calculation from complete inputs and sound comparison support; history seams and optional displays are checked in their separate domains.", kind = "policy", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:deployment:canonical-replay", environment = "condition", statement = "Record positive rung attempts in descending order through the first PASS or the least positive rung, each with supplied or recoverable sound support; the anchor has no row. Missing, repeated, misplaced or unsupported attempts cannot justify descent or acceptance. A reader unable to check confirms and disputes nothing; an unresolved binding comparison rejects the proposed set. Partition comparisons require their explicit fibre and history inputs, which the record does not supply as person associations or counterfactual histories. A proposed set without the required sound enclosure fails static verification; another set or published fallback is outside replay.", kind = "policy", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "subsec:deployment:verdict-certificates", environment = "subsection", statement = "Supply sound instance-bound evidence and compute its verdict under the declared standard; separate optional issuance from the required check.", kind = "policy", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:deployment:verdict-certificate", environment = "definition", statement = "Bind a comparison standard to sufficient sound evidence for its instance and compute the verdict; an independently published verdict copy is not required support.", kind = "type", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "lem:deployment:stated-verdict-replay", environment = "lemma", statement = "The same bound standard and sound evidence determine the same computed verdict; agreement about evidence syntax alone does not prove its soundness.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "lem:deployment:sound-verdict-agreement", environment = "lemma", statement = "Sound enclosures of one comparison under one standard never decide opposite ways; their intersection is sound and decides whatever either decides, a contained sound enclosure keeps any decision, a containing one never reverses one, and where the value equals an exact threshold an enclosure decides an order test exactly when the endpoint on which the test turns is the value and equality only as the point enclosure, while an enclosure or refinement keeping the value in its interior stays INDECISIVE.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "post:deployment:verdict-issuance", environment = "postulate", statement = "For a realization adopting the courtesy issuance standard, present the existing computed-and-included comparison data whole to its rightful holder, binding the issuer by a trusted association. The duty promises neither a computation nor a delivery hop; a holder checks resolved support and outcome, and soundness needs the bound inputs.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "post:deployment:rejected-verdicts", environment = "postulate", statement = "An operator may show a rejected proposed set’s certificate outside the accepted package; notification supplies no accepted act or admission requirement. Accepted certificate membership is fixed by the host contract and replay rules.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "03 Network", label = "rem:deployment:stated-exactness", environment = "remark", statement = "Decide what is stated exactly however it was computed; when every stated enclosure is sound and every declared reduction is an exact equivalence, inexactness of any kind can only leave a verdict INDECISIVE, and realizations that state the same data reach the same verdicts.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:centralized-monitoring", environment = "subsection", statement = "Group optional observation and reporting practices, not additional feedback or admission conditions.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "post:deployment:centralized-monitoring", environment = "postulate", statement = "An optional monitoring standard may report accepted calculations; missing a target changes neither the floor, exact standing, certificate verdict nor input quarantine.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:certificate-monitoring", environment = "condition", statement = "An optional monitor can display and check computed certificate information against the static inputs and sound support; this does not require a separate published result copy.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:emission-experience", environment = "condition", statement = "Within the optional courtesy standard: The operator publishes wall, emission and exported-pair distributions, sag and rehabilitation with source rates, rung, interval and changed supports; declare thresholds, persistence, review and response. Report the export cap without a small-movement guarantee; no observation adds controller inputs or silently changes emission. Epoch bites 5 and 6 supply fields, host bite 8 publishes, and deployment owns comparisons. For declared funded partitions report actual export beside both fibre ceilings, Registration debit beside incremental burn, and maximum-standing concentration; the same concentration exposure can measure a legitimately separate role under ``ex:epoch:split-showcase``.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:controller-performance", environment = "condition", statement = "Within the optional courtesy standard: Publish plant/activity/burn hypotheses, tested range and tracking, error, settling and chatter including failures; include price, capacity, emission and below-wall fractions. Declare review criteria for step and deadband calibration; failures authorize neither escalation nor new inputs nor unconditional tracking claims. Epoch bite 7 supplies controller results, host bite 8 publishes, and deployment owns trials.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:standing-work", environment = "condition", statement = "Within the optional courtesy standard: Measure per epoch/trial edges, support, width, clearance, SCCs, passes, residuals, invalidations and elapsed time against declared workload, hardware, arithmetic and memory envelopes; report missed targets and use declared fallback without dropping relations or approximating standing. Bites 6, 7 and 11 supply scoped work evidence; deployment owns operational percentile publication. These are the work-envelope measurements for exact conserved evaluation, including measured benefit of adopted reuse.", kind = "policy", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:cadence-maturity", environment = "condition", statement = "Within the optional courtesy standard: The deployment measures raw maturity drift and terminal observations when boundary timing changes, publishes adaptation-window freeze evidence and threshold responses. Raw maturity never becomes a projected-standing input. Host bite 8 publishes boundary facts and readouts bite 10 supplies the optional raw service; terminal-consumer computation remains a deployment duty under (`open:inventory:deployment-terminal-evidence`).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:calibration-evidence", environment = "subsection", statement = "Group optional comparisons of chosen operating parameters and implementations.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "post:deployment:calibration-evidence", environment = "postulate", statement = "A deployment may publish comparative evidence under a chosen service standard; it creates neither a calculation constant nor an independent-audit duty.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:parameter-comparisons", environment = "condition", statement = "Within the optional courtesy standard: Publish baseline/candidate inputs, affected derived values, criteria and regenerated evidence for structural parameter changes. Keep temperature fixed absent charter adoption; recompute tier, discovery and margin comparisons, and distinguish recoinage from structural migration without holding standing fixed. Bites 6, 7, 10 and 11 furnish relevant fixtures; deployment owns criteria, terminal comparisons and review, with no hidden controller feedback.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:payload-cache-envelope", environment = "condition", statement = "Within the optional courtesy standard: Publish payload cap, indexing/encoding overhead, cache budget, traversal/depth-four envelope, parallel complete-act workload and retention horizon. Count one allowance per authored act and none for derived edges; reject oversized candidate workload/cap combinations. Deployment owns capacity sizing; records validation and host bite 8 support declared bounds, while terminal cache computation stays held under (`open:inventory:deployment-terminal-evidence`).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:boundary-search-evidence", environment = "condition", statement = "A selected comparison service may publish current inputs and output/reuse comparisons; exact reuse itself remains justified by the calculation’s equality conditions, not by adoption of this service.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:terminal-regression", environment = "condition", statement = "Within the optional courtesy standard: For each standing-edition change, publish consumer-specific inputs, deltas, fit/tolerance and failure response using actual dependencies; insulated CAN does not thereby read standing. Readouts bite 10 and corpus bite 11 cover the supported raw surface; other terminal comparisons belong to deployments under (`open:inventory:deployment-terminal-evidence`).", kind = "fixture", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:complete-act-conformance", environment = "condition", statement = "Within the optional courtesy standard: Publish compiler/replay evidence for parallel authored acts, identities, folds, recipient resolution, domain profiles and allocation under original ledger/threshold vintages. Reproduce the accepted-act census; source inspection or a certificate on incomplete projections is insufficient. Bites 3 through 6 build the semantics, replay bite 9 reconstructs them and bite 11 composes the evidence.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "03 Network", label = "subsec:deployment:sufficiency", environment = "subsection", statement = "Require sufficient public edge and parent-act data to reconstruct every binding graph quantity.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:sufficiency-minimal-record", environment = "case", statement = "The chosen minimal sufficient record permits independent recomputation from published parameters, temporal attributes, author and endpoints. Hyper-edge legs also carry role and reciprocal co-leg identity, and derived edges add no record fields.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:sufficiency-precomputed-record", environment = "case", statement = "An extended record may publish precomputed derived quantities for client convenience, such as cached temporal entropy, provided clients can recompute and verify them from the public sufficient record.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:sufficiency-redundant-record", environment = "case", statement = "Additional verified but redundant fields preserve record sufficiency because clients can recompute them; the server must not depend on unpublished enrichment.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:sufficiency-proprietary-fields", environment = "case", statement = "Proprietary fields on which the server’s scoring depends are not a valid sufficient-record implementation: every load-bearing input must be published for independent recomputation.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:concealment-entropy", environment = "subsection", statement = "The optional concealment practice assigns independent author-generated values and their custody/removal boundaries; host entropy is not a required act-construction premise.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:concealment-entropy-operator-generated", environment = "case", statement = "An operator may generate author-side opening material; that generator owns its custody, without a host contribution or entropy-audit requirement imposed by the paper.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:concealment-entropy-client-generated", environment = "case", statement = "A client may generate and retain the author opening material independently of the host; append and acceptance do not establish private randomness quality.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:concealment-entropy-secret-derived", environment = "case", statement = "A client may derive opening material from a secret with separation across acts and projections; no particular derivation is mandated.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:concealment-entropy-unassigned-custody", environment = "case", statement = "If no generator retains a private opening, append or acceptance cannot supply it; weak or reused randomness can expose enumerable material.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "6 Epoch", label = "subsec:deployment:conserved-standing-reproducibility", environment = "subsection", statement = "Derive the computed ledger from supplied Actor entries, prior state, accepted acts and writing-epoch debit vintage, then reconstruct the complete standing package and check every attempted rung and verdict with independent sound evaluation. Source history and private solver state are not calculation inputs.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:conserved-standing-reproducibility-reference-compiler", environment = "case", statement = "A deterministic reference compiler and independently executable certificate tools aid verification of the public record; neither tool is required for acceptance.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:conserved-standing-reproducibility-formal-compiler", environment = "case", statement = "A formal implementation is an alternative way to compute the same specified result from the same inputs; implementation variation does not itself require a compiler-version field.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:conserved-standing-reproducibility-equivalent-compiler", environment = "case", statement = "Another implementation must compute the same specified result from the same inputs; no separate compiler-version field follows.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:deployment:conserved-standing-reproducibility-mismatched-package", environment = "case", statement = "A safe-looking projection, base matrix, emission diagonal or verdict fails reproduction if it omits accepted records, differs from deterministic allocation, concerns another standing point or does not match computed standing; isolated validity is insufficient.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:deployment:allocation-input-completeness", environment = "proposition", statement = "Ensure the standing compiler is deterministic over the disclosed accepted-act and ledger inputs.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:deployment:completeness-safety-orthogonal", environment = "remark", statement = "Check compiler completeness separately from numerical safety certification.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:deployment:canonical-standing-encoding", environment = "subsection", statement = "Supply a public binding interpretation of the static input set; the paper fixes no canonical serialization of computed standing or its optional copies.", kind = "serialization", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:deployment:canonical-standing-publication", environment = "postulate", statement = "Make the inputs needed to compute standing available under the identified interpretation; no canonical byte encoding or redundant standing copy is imposed.", kind = "serialization", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "subsec:deployment:terminal-centrality-certificates", environment = "subsection", statement = "Recompute terminal centrality from supplied graph inputs and sampled paths within the stated approximation bounds; scalar-only publication supplies no independently checkable computation.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:deployment:terminal-centrality-certificates-tree-samples", environment = "case", statement = "Published Dijkstra-tree samples are the chosen terminal-centrality certificate: any participant can independently reproduce a creator’s centrality within the published approximation bounds without a trusted intermediary.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:deployment:terminal-centrality-certificates-selective-reveal", environment = "case", statement = "A commitment with per-creator selective reveal lets a creator verify their own centrality but not others’, weakening collective auditing compared with published Dijkstra-tree samples.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:deployment:terminal-centrality-certificates-auditor", environment = "case", statement = "Third-party auditor attestation of terminal centrality reintroduces a trusted intermediary; the chosen published-tree method instead permits every participant to run the computation independently.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:deployment:terminal-centrality-certificates-scalar-only", environment = "case", statement = "Publishing only centrality scalars while suppressing sampled Dijkstra-path trees fails participant verification: the approximation error remains a server claim rather than an independently measured quantity.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "subsec:deployment:can-enrichment-insulation", environment = "subsection", statement = "CAN enrichment stays outside binding Layer 1 standing and gates.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "case:deployment:can-enrichment-insulation-frobenius", environment = "case", statement = "Pure attribution-view Frobenius norms are the chosen CAN enrichment inputs. No path-view or standing-derived quantity enters the recursion, and normalized enrichment is independent of an actor’s standing when that actor’s Declaration is outside its own dependency closure.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "case:deployment:can-enrichment-insulation-standing-scaled", environment = "case", statement = "A standing-scaled CAN enrichment component is rejected: it introduces standing dependence and counts the influence signal again alongside the reward formula’s existing amplifier.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "case:deployment:can-enrichment-insulation-path-corrected", environment = "case", statement = "A path-view determinant correction in CAN enrichment is rejected: it introduces path-view tier discrimination into attribution rather than preserving the attribution-view recursion.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "subsec:deployment:completeness", environment = "subsection", statement = "Disclose every binding formula and policy input needed to reproduce the deployed boundary.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-written-specification", environment = "case", statement = "A complete normative written specification is the chosen publication form: it must determine every binding computation and each terminal computation a guild elects to publish, with no proprietary load-bearing component.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-source-implementation", environment = "case", statement = "An open-source reference implementation is an alternative publication form only when complete enough to reproduce every binding computation and each terminal computation a guild elects to publish.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-formal-specification", environment = "case", statement = "A machine-checked formal specification with test vectors is an alternative complete publication form; vectors disambiguate mask promotion, bleed-softening boundaries and raw parity relaxation, without replacing the requirement for completeness.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-missing-constants", environment = "case", statement = "Publishing formula structure without constants fails completeness: participants cannot reproduce all binding outputs and the terminal outputs a guild elects to publish.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-missing-promotion", environment = "case", statement = "Publishing constants without mask-promotion criteria fails completeness: the published information must determine the promoted masks used in computation.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-missing-epoch", environment = "case", statement = "Publishing promotion criteria without epoch architecture fails completeness: the published information must also determine the boundary computation.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-unpublished-masks", environment = "case", statement = "In the formula-completeness proof sketch, unpublished mask-promotion criteria leave promoted-edge determinant scores underspecified, and the per-edge error multiplies along paths containing promoted edges.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-unpublished-can", environment = "case", statement = "In the formula-completeness proof sketch, an unpublished CAN recursion leaves the normalized enrichment factor uncomputable and the reward formula opaque at its attribution-view bridge.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-unpublished-epoch", environment = "case", statement = "In the formula-completeness proof sketch, missing supplied boundary values and recorded observations leave the write budget and frame snapshot undefined. Different supplied assumptions give different rates and standing from the same edge records; an omitted derived-size copy is not missing input.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-unpublished-parity", environment = "case", statement = "In the formula-completeness proof sketch, an unpublished parity relaxation rule prevents verification of raw positive-parity paths. This requirement applies only to raw signed services publishing such results; standing instead requires its initiator-owned package.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:deployment:completeness-unpublished-standing", environment = "case", statement = "Missing reconstruction, allocation, emission, activation, transport or sound comparison inputs prevents independent computation; a scalar assertion cannot replace the complete static inputs.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:realization-observations", environment = "subsection", statement = "Group optional source observations and continuity choices; no source-proof publication or audit duty belongs to the calculation.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "case:comparator:unmatched-source-claim", environment = "case", statement = "A claim present in only the lineage or only the accepted selection contributes nothing to their common projection; this is not an omitted-field defect in the closure.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "04 Graph", label = "cond:graph:act-incidence-causality-completed-predecessors", environment = "condition", statement = "Only completed public causal parents at lower accepted-order keys contribute to the optional time recurrence; missing or misplaced parents remain separately reportable placement faults.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "cond:graph:act-incidence-causality-fold-accumulator", environment = "condition", statement = "The optional reader folds endpoint frontiers across its supplied history from zero; its accumulator is not an epoch input or a published requirement.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "cond:graph:authoritative-order-dependency-placement", environment = "condition", statement = "For dependency compliance, each declared dependency of an accepted act must occur in completed history at a strictly lower epoch-position key.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "cond:graph:authoritative-order-parent-placement", environment = "condition", statement = "For parent compliance, each public causal parent of an accepted act must occur in completed history at a strictly lower epoch-position key.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "cond:graph:ordering-accountability-parent-placement", environment = "condition", statement = "A parent-placement proof shows that the host completed an act violating its public parents. Formation refuses such placement, but replay keeps the published order and every completed consequence; the proof authorizes no reordering, deletion or reversal.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "cond:graph:ordering-accountability-stamp", environment = "condition", statement = "Optional stamp discrepancy evidence leaves accepted order and its required results unchanged; it creates no replacement time or historical reversal.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:parent-placement-fault", environment = "definition", statement = "A completed act has a parent-placement fault when a public parent is absent from completed history or occurs at an equal or greater key. Structural parent references and published sequences prove it without an optional opening.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:stamp-fault", environment = "definition", statement = "Compare an attributed optional time assertion with the public-only fold of its identified available history; absence of a stamp is no fault and the comparison changes no order.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "prop:graph:act-time-finite", environment = "proposition", statement = "Check finite logical time for every completed act, including absent or misplaced predecessors: finite incidence and predecessor sets read only finite earlier recomputed values, with zero for empty maxima.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:act-time-is-summary", environment = "remark", statement = "Logical time is an optional public-history summary, not an identity, admission or static-state operand.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:cross-epoch-precedence", environment = "remark", statement = "Epoch-position order places every earlier-epoch act before later-epoch acts; optional history-fold time summarizes incidence and never establishes that precedence.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:order-of-record-is-position", environment = "remark", statement = "Authoritative precedence uses epoch and position, not logical time; optional time is computed from the supplied ordered public history.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:boundary:act-time-recomputation", environment = "verification", statement = "For the optional history reading, recompute time from public incidence and causal parents without private dependency openings; the declared seven-act sample gives eta time two.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "def:comparator:burn-accumulator", environment = "definition", statement = "An oracle-history record carries source events and extends a dependency lineage. Its lineage in a public history comprises the source-event claims it depends on; it is neither a closure accumulator nor a calculation input.", kind = "data type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:comparator:epoch-marker", environment = "definition", statement = "A recognized source marker identifies its predecessor and lineage and accepts an epoch root together with the successor standard; its input lineage and accepted-claim selection remain independently recognized.", kind = "data type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-epoch-registration", environment = "condition", statement = "Register recognized boundaries and accepted epoch roots with the applicable standard and static verdict; unrecognized accumulation is silent and an unclosed boundary pending, while the epoch contains no marker reference.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "rem:comparator:finality-breach-continuity", environment = "remark", statement = "A changed source history requires a new oracle projection; completed calculations over their consumed inputs stand, and re-anchor or follow are optional future continuity choices.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "04 Graph", label = "def:graph:settlement-parties", environment = "definition", statement = "The buyer is the Bid author and the seller is the terminal Actor of Accept’s uniquely cited completed state, with Item binding through Bid and Offer. Eligibility follows the counted-parent relation; a later referent never repairs a forward anchor.", kind = "data type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:title-certificate-fault", environment = "definition", statement = "An optional displayed title or branch certificate can disagree with recomputation from available inputs; without a display there is no display fault, and missing inputs establish no discrepancy.", kind = "data type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "cond:graph:boundary-accountability-title-certificate", environment = "condition", statement = "Optional display disagreement triggers the claimed courtesy comparison; no display implies no display fault, not immunity from other record faults.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:settlement-party-mismatch", environment = "remark", statement = "Invalid author/target or cited-state party bindings complete no child and establish no outward settlement event; written records remain charged.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:title-certificate-is-summary", environment = "remark", statement = "The common branch certificate is computed from sufficient supplied state and acts; named timeline selection is terminal and a displayed copy is optional.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "lem:epoch:tentative-fold-agreement", environment = "lemma", statement = "Accepted candidates yield the same tentative and final shared branch certificate from the same sufficient state, membership and causal epoch partition.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:consumed-epoch-sequence", environment = "remark", statement = "Static closure consumes its supplied epoch coordinates; history closure compares the declared sequence and boundary arithmetic without rerunning epoch evaluation.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "cond:deployment:title-certificate-monitoring", environment = "condition", statement = "Optional monitoring compares an identified branch/timeline reading with its computed result and does not define title or create an external review guarantee.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:realization-observations-finality-breach-reanchor", environment = "case", statement = "A deployment may retain completed results and begin a newly identified source lineage for future supplied entries; this optional response does not change a completed calculation.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "case:deployment:realization-observations-finality-breach-follow", environment = "case", statement = "A deployment may instead replay the changed public source history and supply revised entries for future calculations under ``rem:comparator:finality-breach-continuity``. Neither response changes a completed calculation over its consumed inputs.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "F Verification", label = "ver:boundary:marker-registration", environment = "verification", statement = "Exercise independent lineage and accepted selection, inert unmatched claims, single counting and conflicting claim exclusion; preserve completed calculations when a changed source history requires a new oracle projection.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "F Verification", label = "ver:boundary:title-certificate-recomputation", environment = "verification", statement = "Compare an optional named-path/epoch assertion with recomputed shared branch and challenge evidence; absence is not an asserted title.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "F Verification", label = "ver:settlement:wrong-party", environment = "verification", statement = "An author/target mismatch against the cited state completes no branch and yields no outward event, while retaining the records and their self accounting.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:material-classification", environment = "definition", statement = "Separate closure checks over their own supplied domains from asserted oracle inputs and deterministic public projections, and from courtesy conduct; no closure check verifies an external referent or an assertion warrant.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:projection", environment = "definition", statement = "A projection is determined by its stated source and rule; materializing it is a cache with no independent authority.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:deployment:published-epoch-replay-floor", environment = "definition", statement = "Make the complete static commitment set and its identified public interpretation available; earlier epochs, external boundary witnesses and independently recomputable copies are not required floor members.", kind = "policy", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "post:deployment:replay-floor-scope", environment = "postulate", statement = "The floor supports static closure; history closure, oracle assessment and optional courtesy checks have distinct inputs and claims.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "def:comparator:burn-provenance-oracle", environment = "definition", statement = "The source oracle judges destruction backing from public source history separately from the calculation over supplied entries.", kind = "type", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:deployment:provenance-validity-projection", environment = "definition", statement = "Assess a supplied Actor entry against the applicable public source history and source rules. Historical assessment uses the event's history; current assessment can change with public source state or rules. Neither is an epoch property, and a materialized result has no independent authority.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "post:comparator:public-provenance-replay", environment = "postulate", statement = "Replay provenance from the relevant public rules and history; unavailable history establishes no positive oracle result and no calculation discrepancy.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:comparator:burn-history-inputs", environment = "definition", statement = "Identify the public rules and history that the provenance oracle reads; no pinned declaration or source-proof membership in the epoch follows.", kind = "type", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "04 Graph", label = "def:graph:author-authority-oracle", environment = "definition", statement = "The authority oracle judges whether the signing key recorded for an accepted act speaks for its stated Actor at the signing moment, separately from static signature validity.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "04 Graph", label = "def:graph:authority-history-inputs", environment = "definition", statement = "Supply the authority history and rules needed to assess the recorded keys and Actor; the epoch itself has no authority declaration, warrantor, edition or proof object.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "04 Graph", label = "post:graph:public-author-authority-replay", environment = "postulate", statement = "A changed or unavailable authority history changes the oracle result without reassigning the recorded author, debit, standing, title or settlement consequences.", kind = "policy", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "04 Graph", label = "def:deployment:author-authority-validity-projection", environment = "definition", statement = "Assess the signing key recorded for an accepted act against applicable public history; formation-time and current assessments may differ, without storing authority in the act or changing its calculation. A materialized result is a cache.", kind = "policy", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "rem:comparator:burn-realization-audit-evidence", environment = "remark", statement = "Public source history can be inspected for provenance and external price. Source projection and no-privileged-accrual discharge are oracle claims; independent auditing is optional courtesy, adding no calculation operand, publication duty or operator bound.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:courtesy-handshake", environment = "definition", statement = "The reference courtesy exchange prepares the author’s independent concealed commitments and obtains one complete-act approval; generator quality and custody remain private premises, with no host entropy or seal duty.", kind = "policy", crate = "pn-act-authentication", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:requested-publication-intent", environment = "definition", statement = "A requested intent is a courtesy in a named standard; an initial request may address a recipient of an opening and does not itself establish an undertaking. An authenticated request remains historically fixed; subsequent messages do not edit it.", kind = "policy", crate = "pn-act-profile", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:dependency-list-order", environment = "definition", statement = "The reference encoding orders identifiers by author bytes, numeric act nonce and family bytes, strictly increasing; a vocabulary change changes no admitted comparison bytes.", kind = "serialization", crate = "pn-act-profile", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "gloss:graph:commitment", environment = "remark", statement = "Commitment means binding and concealing under the declared cryptographic premise.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "gloss:graph:opening", environment = "remark", statement = "An opening supplies the complete content and blinding values needed to check its commitment; it supplies no selective disclosure.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "gloss:graph:blinding-value", environment = "remark", statement = "A blinding value is private author-generated concealment material, separated by projection and retained with its opening; its format does not prove entropy quality.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "gloss:graph:peek", environment = "remark", statement = "Peek means examine without taking.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:holder", environment = "definition", statement = "Holding is possession of opening material, not a service undertaking or graph state; transient sight is not holding.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:storage", environment = "definition", statement = "Storage quietly retains opening material without an endpoint or serving duty until the custodian removes it.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:custodian", environment = "definition", statement = "A holder becomes custodian by undertaking storage or carriage, not by receipt alone; its promise binds itself and ends when its controlled material is removed.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:carriage", environment = "definition", statement = "Carriage adds serving at an authenticated endpoint to storage; acceptance and transitions are acknowledged separately from append and never determine act validity.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:wall-calibration-oversight", environment = "remark", statement = "An adopter evaluates both chartered floors against declared economic and work criteria; a third floor needs its own derivation.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:boundary-conduct-oversight", environment = "remark", statement = "Publish availability and adaptation declarations and freeze retargeting in the stated window; a not-full epoch has a computed slack relation. Oracle reading and external duration audit are not replay operands.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:canonical-encoding-oversight", environment = "remark", statement = "An adopter supplies canonical round-trip evidence for the published encoding; it is implementation evidence, not an extra epoch input.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:centralized-monitoring-conduct", environment = "remark", statement = "An adopter publishes reproducible observations, acquisition procedures, thresholds, persistence windows, review schedule and crossing dispositions.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:title-certificate-monitoring-courtesies", environment = "remark", statement = "An attributed discrepancy in an optional title display can trigger the claimed courtesy response; it changes no computed title and absence of a display creates no fault.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:certificate-monitoring-courtesies", environment = "remark", statement = "An adopter publishes movement, hop mass, below-wall fractions and Registration/vouch cases, fallback and verdict frequencies, thresholds, reviews and scoped partition comparisons; none is a new replay dependency.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:calibration-publication-conduct", environment = "remark", statement = "An adopter publishes calibration inputs or acquisition, editions, method, predeclared criteria, results and limitations and records failure without replacing the comparison.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:boundary-search-courtesies", environment = "remark", statement = "An adopter publishes trials, elapsed envelopes, failures and headroom, hardware and measured reuse benefit without claiming optimal selection or unseen-demand completeness; performance reports do not replace accepted-output evidence.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-exogeneity", environment = "condition", statement = "Graph topology and graph operations do not supply the exogenous frame gross amount. ``cond:comparator:burn-exogenous-origin``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-instantaneous-cost", environment = "condition", statement = "Obtaining the attributed amount consumes a resource priced at the instant of its source event. ``cond:comparator:burn-costly-append-only-record``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-irrecoverability", environment = "condition", statement = "The source event cannot be reversed to recover what it consumed. ``cond:comparator:burn-costly-append-only-record``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-monotone-history", environment = "condition", statement = "Successive frame gross amounts are nondecreasing under the stated connection premises; this condition does not concern balances after debits. ``cond:comparator:burn-pinned-monotonicity`` and ``cond:comparator:burn-costly-append-only-record``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-neutrality", environment = "condition", statement = "Frame gross amounts use one common magnitude unit across actors. ``cond:comparator:burn-neutrality``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-non-negativity", environment = "condition", statement = "Frame gross amounts inhabit a nonnegative ordered magnitude domain. ``cond:comparator:burn-non-negativity``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-non-repayment", environment = "condition", statement = "The supplied input confers no redemption or repayment entitlement. ``cond:comparator:burn-neutrality``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-opaque-identity-link", environment = "condition", statement = "The attributed frame amount links the opaque actor identity to what it denotes in the source realization, without defining an address ontology or signing authority. ``cond:comparator:burn-bindability``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-source-backing", environment = "condition", statement = "An attributed amount is backed by a genuine irrecoverable source event and does not exceed that event's attributable magnitude. ``cond:comparator:burn-provenance-auditability``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-source-persistence", environment = "condition", statement = "An attributed contribution does not move to another identity or duplicate through its representation; alternative funded partitions may still change standing. ``cond:comparator:burn-non-transferability``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-finalization-pin", environment = "condition", statement = "Pin the source amount at an identified finalization boundary.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-no-privileged-accrual", environment = "condition", statement = "Operating a realization supplies no privilege to accrue source amount outside its costly source rule; this is an oracle premise, not a numerical operator cap.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:finalized-burn-amount", environment = "condition", statement = "The source primitive supplies finalization boundaries and their fixed attributed amounts.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:comparator:actor-entry", environment = "definition", statement = "An Actor entry supplies an opaque Actor identifier and its frame gross amount at a boundary; the type does not certify source backing or external cost.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "def:comparator:burn-projection", environment = "definition", statement = "Separate source amounts, price and source interpretation from the Actor-entry operands consumed by closure.", kind = "type", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "post:comparator:actor-entry-assumptions", environment = "postulate", statement = "State the thirteen Actor-entry hypotheses separately from the oracle claims that can discharge their source interpretation; the closure calculates over supplied values.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:closing-survey", environment = "remark", statement = "Finalization of a public source history can support a stable supplied snapshot; its timing and external economic effects are realization matters (``post:comparator:marker-bound-finalization``). Internally recognized title does not establish the truth of an asserted external event (``rem:graph:settlement-reputation``, ``rem:graph:item-identity-limit``). This is the interpretive limit of ``cond:comparator:source-edge-event``; reputation can price a false claim through ``post:comparator:accountability-cost``. The no-privileged-accrual assumption is explicit at ``cond:comparator:actor-entry-no-privileged-accrual``; the calculation neither infers it from an operating role nor evaluates a realization's source distribution.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "rem:comparator:external-outlay-projection", environment = "remark", statement = "Multiply each stated frame-amount benchmark by the source realization’s published unit cost to obtain the corresponding proportional outlay in its external denomination; this is an oracle projection, not another calculation operand.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "rem:comparator:external-value-necessity", environment = "remark", statement = "Costliness of the source action requires value supplied outside closure; the oracle attaches to that action, while the calculation assumes exogeneity and does not evaluate source history.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "rem:comparator:numeraire-fiat-choice", environment = "remark", statement = "When the positive numeraire value is supplied by fiat, its choice and standing are matters of reputation. The network consumes the value without a record field naming a warrantor, and the oracle does not choose or set it.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "rem:comparator:pre-opening-capacity-warning", environment = "remark", statement = "An interval before external acquisition opens deserves attention to the amount attainable under the realization’s rules; without such an interval there is nothing to bound, and no realization owes a published or committed capacity bound.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "rem:comparator:sincere-audit-benefit", environment = "remark", statement = "Passing sincere audits can earn good reputation. Sincerity and the significance of reputation are persuasive judgments. The specification imposes no duty to conduct an audit, obtain a verdict, publish audit evidence, or meet a reputation assessment.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "rem:comparator:source-backing-discharge", environment = "remark", statement = "The oracle can compare the supplied amount with publicly available realization history through a deterministic provenance projection. This check concerns the source of the amount and is not an operand of the frame arithmetic.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "rem:comparator:source-faithfulness-interpretation", environment = "remark", statement = "Source provenance is distinct from the truth of a claim carried by an accepted act. Costliness and no privileged source accrual are assumed for the supplied amount; the oracle can examine public source history through ``rem:comparator:source-backing-discharge``. Neither the amount nor a valid internal title fold establishes external event truth. Equal public records cannot distinguish legitimate separation from strategic concentration (``thm:epoch:split-observational-equivalence``).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "rem:comparator:source-limit-survey", environment = "remark", statement = "The frame amount does not state what obtaining it cost its actor net of external holdings. The conditional external outlay of ``eq:comparator:admission-benchmark-deposits`` does not determine that net cost. A realization's own rules can limit an initial interval (``rem:comparator:pre-opening-capacity-warning``); this grants no later costless-source guarantee. Remedies for strategic concentration apply equally to a legitimate completion with the same public fields (``thm:epoch:split-observational-equivalence``).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "subsec:comparator:actor-entry-assumptions", environment = "subsection", statement = "Track actor entry assumptions as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "post:deployment:specified-calculation-inputs", environment = "postulate", statement = "Supply the specified Actor entries, acts, carried state, free constants and specification version; the calculation adds no procedure for identifying a source warrantor.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:supplied-object", environment = "definition", statement = "A supplied object controls or constrains closure behavior; its defining statement fixes its semantics.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "post:network:supplied-value-custody", environment = "postulate", statement = "Assert supplied values at the oracle layer, commit them in the epoch and read them as given without outside reference; closure does not evaluate their warrant.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:defaulted-constant", environment = "definition", statement = "An issued defaulted constant is an illustration that binds no epoch and supplies no fallback; every epoch commits its target. Locked constants belong to the governing public rules and are not separately supplied.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "rem:network:non-adoption-declaration-courtesy", environment = "remark", statement = "Declaring non-adoption of an optional practice is itself courtesy, not an added calculation or admission duty.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "03 Network", label = "rem:network:optional-host-conduct", environment = "remark", statement = "A host may offer cached by-products or a reproducible build account without changing the standing package or calculation-evidence replay; reputational assessment of enclosure looseness is external to the calculation.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:settlement-coordinate-conjunction", environment = "remark", statement = "Positive commercial stance conjunction reads the three marginals; title is sentiment-independent and eligible counterparty standing follows structural completion, not absence of challenge.", kind = "policy", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:optional-bid-reputation", environment = "remark", statement = "An operator may assess a Bid's signed generosity in a terminal commercial-reputation readout. That assessment is outside the standing calculation.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:optional-conduct-readouts", environment = "remark", statement = "An operator may report Withdraw frequency as a reliability signal and Leave frequency as a participation signal, including departures without prior membership. These assessments do not enter the act cost, standing, title, or gate calculations.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "A Gates", label = "rem:gates:optional-guild-funding", environment = "remark", statement = "A guild may choose to fund an actor's source action under ``post:transport:guild-grant``. The external payment and its price are not closure inputs, and a source realization alone does not set the supplied actor-entry amount. Identical public records do not reveal whether a funded partition serves legitimate separation or strategic concentration (``thm:epoch:split-observational-equivalence``).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "E Symbols and binding ledger", label = "subsec:symbols:oracle-history", environment = "subsection", statement = "Track oracle history as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "F Verification", label = "rem:verification:author-authority-oracle-witness", environment = "remark", statement = "Check recorded signature validity separately from the authority-history cases: wrong Actor, revocation, missing delegation and unavailable history; none changes the completed calculation.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:calibration-publication-practice", environment = "remark", statement = "Communicating selected inputs and procedures before use is optional practice; formula setting and fiat selection are distinct from the supplied value consumed by calculation.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:canonical-byte-encoding-practice", environment = "remark", statement = "Optional publication and versioning of encoding and replay support adds no compiler-version field to the conserved standing package.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:standing-publication-practice", environment = "remark", statement = "Providing copies and executable tools is optional service, not a calculation premise.", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "def:comparator:marker-lineage-epoch-history", environment = "definition", statement = "The recognized marker lineage selects the ordered accepted epoch roots presented to history closure; recognition and seam consistency remain separate predicates.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:comparator:successor-standard", environment = "definition", statement = "A recognized marker supplies the interpretation and correspondence standard for recognizing its successor and accepted epoch root; it adds no free calculation inputs and receives no reference from the candidate epoch.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "6 Epoch", label = "def:epoch:document-set-commitment", environment = "definition", statement = "The root binds the epoch’s static document set, excluding the root itself, any preceding epoch and any external boundary witness; binding is not acceptance.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-incidence", environment = "definition", statement = "A binary act touches its source and target; a hyper-act touches author, middle and target as one event, without splitting its accounting identity.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:history-closure", environment = "definition", statement = "Compare cumulative structural identities and semantic coordinates across a declared ordered run of already statically validated epochs; a successor triple colliding with a predecessor fails history consistency. Do not choose the run or repeat epoch evaluation.", kind = "function", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:static-closure", environment = "definition", statement = "Check one epoch from its committed set and fixed public rules, without earlier history; supplied assertions establish neither occurrence in history nor elapsed time, and external referents are not verified.", kind = "function", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:static-commitment-set", environment = "definition", statement = "The static set supplies all irreducible calculation operands, complete recorded acts with their approvals and the recorded signature-to-key relation; no authority-history truth or external marker is made a static operand.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:declared-history-consistency", environment = "postulate", statement = "Compare consecutive computed and supplied state boundaries, cumulative structural identities, schedules, immutable debit vintages and epoch coordinates; a repeated predecessor identity triple fails history consistency. Complete-history consistency also requires a nonempty run beginning at the empty boundary.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:computed-copy-accountability", environment = "remark", statement = "An optional published result can be compared with recomputation from identified available inputs; an absent copy asserts nothing and unavailable inputs prove no discrepancy.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "E Symbols and binding ledger", label = "subsec:symbols:courtesy-readings", environment = "subsection", statement = "Logical-time and optional assertion notation belongs to courtesy readings rather than the required static input set.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "alg:graph:branch-certificate-computation", environment = "algorithm", statement = "Initialize the genesis-rooted branch graph, pending cancellation maps and per-act accounting; process causally eligible completed handshakes, attach current and earlier challenges, retain every sibling and propagate later challenges without deleting descendants.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:continuing-consent-arrival-order", environment = "case", statement = "Do not let operator arrival order decide whether a written cancellation attaches to the shared branch record.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:continuing-consent-asserted-time", environment = "case", statement = "Do not let asserted wall times determine the force of cancellation evidence.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:continuing-consent-ratify-deadline", environment = "case", statement = "Do not end cancellation at Ratify or at the completing epoch; later written challenges attach without undoing completion.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:continuing-consent-sibling-order-tiebreak", environment = "case", statement = "Do not choose a winning sibling by residual order; retain completed sibling branches.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "H Necessity", label = "case:necessity:continuing-consent-sibling-permanent-void", environment = "case", statement = "Do not erase or permanently void the Item on sibling completion; retain the shared branch graph and its challenge evidence.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:item-timeline-selection", environment = "case", statement = "A guild may select or combine named timelines at a named epoch under published policy; it cannot replace common branch construction or standing recipient resolution.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:tentative-branch-fold", environment = "definition", statement = "Compute the candidate branch certificate from the complete candidate set before recipient resolution; a rejected set publishes none of it.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-projections", environment = "definition", statement = "The complete semantic act has identifier, author, family, structural body, public references, content commitment, dependency commitment and approval; each projection is required. Completion/order come from grouping, openings separately, and mapped-key checking establishes no Actor authority.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:branch-challenge", environment = "definition", statement = "Pending buyer and seller cancellations match by Bid and applicable author; attachments are keyed by Accept identifier and cancellation act identifier. Writing epochs are run-derived evidence for computed summaries, never stored epoch-state numbers or prior static operands. Each cancellation has epoch-local static validation in its writing epoch; cross-epoch identity uniqueness is checked by history closure.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:counted-parent-relation", environment = "definition", statement = "An asserted parent counts only if it completes before its child, in an earlier epoch or an earlier same-epoch causal layer. Placement faults and cross-batch forward citations contribute no counted edge, even after later completion; accepted acts remain charged.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:item-timeline-branch", environment = "definition", statement = "Identify a branch by Item genesis and the ordered Accept-identifier path; shared prefixes form a graph, while a path digest is a representation whose collisions are malformed.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:ownership-timelines", environment = "definition", statement = "Retain all completed transfers from their cited states, including already-spent states, and read the terminal Actor of a named timeline at a named epoch.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:settlement-structure", environment = "definition", statement = "Recognize complete, well-bound and authorized handshake structure with its cited state and causal order; cancellation annotates rather than prevents completion, and only the first correct Ratify completes each Accept handshake.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-identity-uniqueness", environment = "item", statement = "Static validation refuses duplicate author/act-nonce/family triples within the selected epoch; history closure refuses an epoch whose triple collides with a predecessor. A colliding epoch does not replay in a validated history, and no tie-break selects among colliding acts. Nonce reuse across families remains permitted by the paper, independently of a stricter local slot rule.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:settlement-structure-authorization", environment = "item", statement = "Derive buyer from Bid and seller from the terminal Actor of Accept’s cited state; check the parties and reversed targets against those facts.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:settlement-structure-buyer-challenge", environment = "item", statement = "Read buyer Withdraw as pending or attached challenge evidence for matching Bid handshakes, including cancellations after completion.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:settlement-structure-completeness", environment = "item", statement = "Require the Bid, Accept and Ratify and their projections in the accepted prefix; incomplete handshakes create no completed child.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:settlement-structure-reference-binding", environment = "item", statement = "Bind the exact Bid and Accept references and the cited spent state, not an unrelated handshake or Item.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:settlement-structure-seller-challenge", environment = "item", statement = "Read seller Rescind for the matching Bid and Accept author as challenge evidence, without vetoing a completed child.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:settlement-structure-well-formedness", environment = "item", statement = "Require a unique completed-genesis or completing-Ratify anchor on the Item and causal well-formedness; strictly earlier or dependency-ordered co-epoch completion can supply it, but future completion cannot repair an invalid anchor and a later Ratify repetition supplies no anchor.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "lem:graph:act-projection-necessity", environment = "lemma", statement = "Each of the eight projections supplies an operand without which its named public static validation or fold is partial; this is semantic membership, not a serialized member count.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:timeline-certificate-anchor", environment = "remark", statement = "Anchor an external timeline use by Item, named path, reading epoch, selection rule and branch evidence; shared record/replay duties do not establish funding, release, dispute handling or physical atomicity.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:continuing-cancellation", environment = "remark", statement = "Written cancellation remains possible before, with or after completion; it neither deletes branches nor changes previously published epochs.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:dependency-blinding-value-concealment", environment = "remark", statement = "Interpretation or optional practice: dependency-opening concealment uses the author blinding value; it is distinct from the act nonce and does not turn entropy or custody into a public-record fact.", kind = "none", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "H Necessity", label = "subsec:necessity:continuing-consent", environment = "subsection", statement = "Retain written continuing cancellation as challenge evidence without an objection deadline or branch-erasing conflict rule.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "thm:graph:epoch-branch-fold", environment = "theorem", statement = "The accepted set and causal epoch partition determine the shared branch graph and computed certificate, preserving all completed children. Pending matches attach by Accept/cancellation identities; writing dates are derived evidence, not state keys.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:settlement:branch-conflicts", environment = "labelled fixture paragraph", statement = "Check that competing completed transfers create distinct retained sibling branches, not conflict consumption or a sole winner.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:settlement:late-cancellation-descendants", environment = "labelled fixture paragraph", statement = "Check late cancellation on an ancestor and descendants without deleting, renaming or reversing completed branches.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
]
