  { chapter = "F Verification", label = "ver:epoch:computed-backpressure", environment = "labelled fixture paragraph", statement = "Certify own solvency, each author safety stamp and the action-weighted door.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
