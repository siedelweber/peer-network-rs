  { chapter = "D Dynamics", label = "thm:dynamics:conserved-standing-existence", environment = "theorem", statement = "Check invariant rate-hull and continuous-map premises independently of contraction.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "subsec:dynamics:conserved-standing-certificates", environment = "subsection", statement = "Track conserved standing certificates as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "thm:dynamics:certified-conserved-standing-uniqueness", environment = "theorem", statement = "Accept uniqueness only when the margined certificate bounds contraction below one.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "eq:dynamics:certified-contraction-norm", environment = "equation", statement = "Bound the map infinity-norm derivative by the reciprocal published margin. The bound is strictly below one and gives a unique fixed point and geometric convergence; for changed inputs it controls residual amplification, not allocation shock size or sign.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "cor:dynamics:standing-initialization-independence", environment = "corollary", statement = "Check identical certified fixed points under different starts.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "def:dynamics:local-width", environment = "definition", statement = "Compute each target's contributing source-rate range and the published live maximum.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "lem:dynamics:allocation-entrywise-derivative", environment = "lemma", statement = "Bound the sum of absolute entry derivatives proportionally to the entry.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "eq:dynamics:allocation-entrywise-derivative", environment = "equation", statement = "Bound the sum of absolute entry derivatives proportionally to the entry.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "lem:dynamics:transport-derivative-propagation", environment = "lemma", statement = "Propagate the derivative bound through ordered hop products and depth mixtures.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "eq:dynamics:transport-derivative-propagation", environment = "equation", statement = "Propagate the derivative bound through ordered hop products and depth mixtures.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "thm:dynamics:hop-profile-width-fence", environment = "theorem", statement = "Evaluate twice wall gain times supported cumulative tilt times contributing width.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "eq:dynamics:hop-profile-width-fence", environment = "equation", statement = "Evaluate twice wall gain times supported cumulative tilt times contributing width.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "rem:dynamics:rival-factor-two", environment = "remark", statement = "Retain both recipient gain and sibling/self loss in the derivative budget.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "cor:dynamics:tilt-profile-prior-screen", environment = "corollary", statement = "Use the cumulative-profile cap only as a sufficient prior screen with width dominance.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "eq:dynamics:tilt-profile-prior-screen", environment = "equation", statement = "Use cumulative tilt and width dominance only as a sufficient screen; a proposed weighted refinement needs its own sound bound and charter adoption.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "rem:dynamics:screen-cap-is-derived", environment = "remark", statement = "Derive the cap from rivalry factor and activation exponent rather than an independent tunable value.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "rem:dynamics:chartered-decay-determined", environment = "remark", statement = "Preserve the chartered halving shape and supported-depth slack; alternatives require published admissible standing parameters and regenerated comparison evidence.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "def:dynamics:conserved-standing-certificate", environment = "definition", statement = "Publish the evaluated fence scalar and its margined pass verdict.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "rem:dynamics:certificate-is-the-fence", environment = "remark", statement = "Use the evaluated width fence; a graph-sensitive global enclosure is conditional on a stronger charter and demonstrated benefit, not an interchangeable second gate. Contraction controls amplification of a measured residual, not the size of changed allocation under a partition.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "prop:dynamics:emission-certificate-transfer", environment = "proposition", statement = "Keep the ledger-derived emission diagonal fixed throughout the solve.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "lem:dynamics:standing-mean-deviation", environment = "lemma", statement = "Bound the Jacobian by half the un-margined certificate using source-rate mean deviation on the nonnegative domain; keep the original evaluated fence and rung-selection test unchanged.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "prop:dynamics:standing-response-resolvent", environment = "proposition", statement = "Bound local sensitivity by the inverse Jacobian resolvent, certified nonnegative majorants or signed-series remainder; use direct own forcing rather than possibly zero net response as the relative denominator.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "prop:dynamics:standing-finite-response", environment = "proposition", statement = "Compare separately certified states on the same Actor set using full forcing, both hulls and optional certified corridor matrix bounds; changed Actor sets require an explicit comparison map.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "prop:dynamics:standing-intervention-forcing", environment = "proposition", statement = "Include the signed emission derivative below the wall and one-sided kink cases; for finite burn, rung or act changes recompute the complete fold, debit, count and transport before applying the response bound.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "cor:dynamics:minimal-safe-rung", environment = "corollary", statement = "Track minimal safe rung as a separately addressable corollary.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "case:dynamics:minimal-safe-wall-positive-width", environment = "case", statement = "Track minimal safe wall positive width as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "case:dynamics:minimal-safe-wall-zero-width", environment = "case", statement = "Track minimal safe wall zero width as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "case:dynamics:minimal-safe-wall-anchor", environment = "case", statement = "Track minimal safe wall anchor as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "rem:dynamics:wall-tilt-tradeoff", environment = "remark", statement = "Distinguish the within-epoch wall/tilt certificate tradeoff from conditional inter-epoch controller models and measured response.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "thm:dynamics:finite-max-envelope-lipschitz", environment = "theorem", statement = "Retain finite-max Lipschitz bounds for raw diagnostics, outside standing selection.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "prop:dynamics:sibling-response-without-path", environment = "proposition", statement = "A positive allocation to a sibling gives a negative cross-coordinate response absent from a direct selected path, obstructing entrywise domination.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "rem:dynamics:certified-bound-scope", environment = "remark", statement = "The evaluated hop-profile width fence bounds the conserved Jacobian; the selected-path circulant extremum supplies no conserved-map upper bound, and the zero-tilt equality case is not a bifurcation onset.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "D Dynamics", label = "subsec:dynamics:quarantined-apparatus-scope", environment = "subsection", statement = "Restrict smooth arguments to fixed responsive cells; selected-path oscillators and approximate-solver drift establish no conserved-map onset. Failed certification proves neither contraction nor divergence; controller response is a deployment evidence duty.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "E Symbols and binding ledger", label = "app:symbols", environment = "appendix", statement = "Keep the symbol map and binding ledger aligned with the conserved equilibrium and published wall controller.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "E Symbols and binding ledger", label = "tbl:symbols:index", environment = "longtable", statement = "Keep dimensions, identifier meanings and permission tags distinct; departure anonymity is limited by the right-to-leave statement rather than a quantitative exposure promise. The aggregate source ceiling limits available amount, not funded-partition allocation.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "E Symbols and binding ledger", label = "subsec:symbols:boundary", environment = "subsection", statement = "Classify values by actual feedback read-sites against admission closure.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "E Symbols and binding ledger", label = "tbl:symbols:boundary", environment = "longtable", statement = "Separate binding values, required audit evidence and replaceable terminal byproducts.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
