  { chapter = "05 Nodes and edges", label = "lem:nodes:self-loop-neutral", environment = "lemma", statement = "A positive-parity subunit-weight self-loop cannot improve a raw max-product result.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "case:nodes:self-loop-neutral-routing-inert", environment = "case", statement = "Branch of ``lem:nodes:self-loop-neutral`` proof: A zero-determinant self-loop is routing-inert and excluded from canonical raw traversal, so it cannot improve either parity register.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "case:nodes:self-loop-neutral-routing-active", environment = "case", statement = "Branch of ``lem:nodes:self-loop-neutral`` proof: A routing-active positive-parity self-loop has weight strictly below one; removing it preserves parity and improves and shortens the walk, so it cannot improve a max-product register or additive log-cost optimum.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:self-loop-parity", environment = "remark", statement = "Keep Participant terminal-leg parity positive to prevent a shared parity-flipping device.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
