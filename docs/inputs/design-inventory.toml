  { chapter = "01 Introduction", label = "ins:introduction:right-to-leave", environment = "insight", statement = "Payload erasure preserves the structural residue on which other actors rely.", kind = "policy", crate = "pn-records", citable = false, added_at = "network-v0.26.3", label_source = "explicit" },
  { chapter = "01 Introduction", label = "subsec:introduction:two-layers-derived", environment = "subsection", statement = "Layer 1 reads the external burn interface and publishes reproducible conserved standing while guilds own terminal readouts.", kind = "policy", crate = "pn-host", citable = false, added_at = "network-v0.26.3", label_source = "explicit" },
