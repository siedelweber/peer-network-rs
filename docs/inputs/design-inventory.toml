  { chapter = "05 Nodes and edges", label = "rem:nodes:reference-author-allocation", environment = "remark", statement = "Only allocation through the Reference author reaches its complete positive Profile-targeted act.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:departure-composes-with-opinion", environment = "remark", statement = "Keep control-family parameters fixed and express additional sentiment in a separate Opinion.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:chat-proposals-do-not-participate", environment = "remark", statement = "Keep Invitation and Join Request as proposals that create neither participation nor chat-derived standing. A complete positive Invitation may allocate the inviter’s own contribution to the invitee, without a membership gate.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "def:nodes:canonical-membership-fold", environment = "definition", statement = "Terminal membership reads act leg roles and latest participation/departure under published guild policy.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:membership-is-terminal", environment = "remark", statement = "Do not place membership predicates in Layer 1 admission.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:membership-not-chain-ordered", environment = "remark", statement = "The canonical terminal membership fold intentionally retains host-order sensitivity.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "edge:nodes:hyper-send", environment = "edge specification", statement = "Represent one signed-importance Message act with Full A and Minimal T projections.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "environment", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "eq:nodes:path-view:send-a", environment = "equation", statement = "Compute the declared role-specific path-view matrix for send-a.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "eq:nodes:path-view:send-t", environment = "equation", statement = "Compute the declared role-specific path-view matrix for send-t.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:self-loop-neutral", environment = "proposition", statement = "The derived Declaration/Reputation loop cannot improve either raw register.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "step:nodes:self-loop-neutral-max-product", environment = "step", statement = "For raw snapshot traversal, the Declaration/Reputation loop multiplies a register by a product strictly below one, so max-product relaxation cannot improve the source or any mid-path register. Standing does not traverse this loop.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "step:nodes:self-loop-neutral-parity", environment = "step", statement = "The raw Declaration/Reputation loop has positive parity on both edges and maps the initialized positive/negative pair (1,0) to a smaller positive value with zero negative value. Neutrality follows from weight and parity, not a claim that causal order blocks the loop.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:raw-self-edge-properties", environment = "proposition", statement = "Check raw Self zero-source, parity, synchronization and weight properties separately from standing activation.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-zero", environment = "item", statement = "At zero standing, require zero raw self-edge activation and damped Reputation weight, so the bond is inert.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-monotonicity", environment = "item", statement = "At fixed raw maturity, require the damped Reputation weight to increase strictly with positive standing. This is an input derivative of the raw edge, not a frame-gross-amount response guarantee.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-bound", environment = "item", statement = "Keep the raw damped Reputation weight strictly below one for every nonnegative standing and permitted maturity.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-concavity", environment = "item", statement = "At fixed raw maturity, require the damped Reputation weight to be strictly concave in positive standing.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-parity", environment = "item", statement = "Require positive Declaration and Reputation determinant parity at every positive standing.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-synchronization", environment = "item", statement = "At every epoch boundary, derive Declaration and Reputation with identical stored tensors, determinant scores and damped-weight formulas.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-can-independence", environment = "item", statement = "Treat normalized CAN as independent of an Actor’s standing only when its Declaration is outside its own composition dependency closure; Reputation contributes nothing to CAN.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-feed-hierarchy", environment = "item", statement = "Bound a raw profile-bridged feed path by the squared Opinion ceiling times the Reputation ceiling; this ceiling is at most half the direct Opinion ceiling.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-temporal-ceiling", environment = "item", statement = "At frozen raw sentiment, use the maturity-channel supremum equal to the determinant score times the square root of two, strictly below one. This is a raw feed bound only.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:archetype-fingerprints", environment = "subsection", statement = "Track archetype fingerprints as a separately addressable subsection.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "tbl:nodes:archetype-fingerprints", environment = "table", statement = "Use the census for family masks, tier, promotion, CAN inclusion and raw parity forcing.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:edge-census-normative", environment = "remark", statement = "Prefer the relevant normative census table over conflicting family prose.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "tbl:nodes:act-payload-schema", environment = "table", statement = "Keep role-addressed payload fields inside one author-controlled act payload and treat rendering semantics as terminal.", kind = "serialization", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties", environment = "proposition", statement = "Check the stated slice norm, rank, monotonicity, floor and moderate-parameter tier claims.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:floor", environment = "proposition clause", statement = "Maintain the baseline norm floor.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:upper", environment = "proposition clause", statement = "Maintain the slice norm ceiling of three.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:rank2", environment = "proposition clause", statement = "Check mask-specific near-rank-two bounds.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:monotone", environment = "proposition clause", statement = "Check active entry magnitudes are nondecreasing in absolute semantic coordinates.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:pol-floor", environment = "proposition clause", statement = "Keep the polarization entry at least one half.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:tier-gap", environment = "proposition clause", statement = "Treat the tier-ratio claim as limited to its stated moderate-parameter domain.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "sec:epoch", environment = "section", statement = "Track epoch as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:thermodynamic-boundary", environment = "subsection", statement = "Track thermodynamic boundary as a separately addressable subsection.", kind = "none", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "ax:epoch:thermodynamic-boundary", environment = "axiom", statement = "Apply entropy damping once per raw edge or creator, not to projected standing.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:damped-edge-weight", environment = "subsection", statement = "Track damped edge weight as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:damped-edge-weight", environment = "definition", statement = "Compute the maturity, determinant and entropy weighted raw edge magnitude.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:damped-edge-weight", environment = "equation", statement = "Compute the maturity, determinant and entropy weighted raw edge magnitude.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:shared-raw-edge-primitive", environment = "remark", statement = "Share raw weighting between feed and signed traversal.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds", environment = "proposition", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds:positive", environment = "proposition clause", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds:upper", environment = "proposition clause", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds:floor", environment = "proposition clause", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds:non-monotone", environment = "proposition clause", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:maturity-crossover", environment = "definition", statement = "Locate the derivative sign crossover of the raw maturity weight.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:crossover-location", environment = "proposition", statement = "Bound the crossover at the declared entropy and maturity values.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:commitment-rate", environment = "subsection", statement = "Track commitment rate as a separately addressable subsection.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:evaluated-state", environment = "subsection", statement = "Track evaluated state as a separately addressable subsection.", kind = "none", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:evaluated-epoch-state", environment = "definition", statement = "Complete proposed counts and residual balances from the supplied boundary gross amounts, prior state and writing-epoch debit, counting each binary act, complete hyper-edge or Registration once. A gross increment can occur without an act and an act without an increment. Use this same tentative state for standing, emission and gates; retain prior debit vintages and the controller's one-boundary lead. Source-history evaluation is outside the calculation.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:computed-residual-balance", environment = "equation", statement = "Compute proposed computed residual balance from prior balance plus the supplied gross increment, less proposed authored-act count times the price in force.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:computed-action-count", environment = "equation", statement = "Add the number of accepted authored acts once, not projection legs.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:standing-quantization", environment = "subsection", statement = "Track standing quantization as a separately addressable subsection.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:standing-quantization", environment = "postulate", statement = "Compute one current standing equilibrium per supplied epoch boundary, without requiring a redundant published copy.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:causality-without-intra-epoch-standing", environment = "remark", statement = "Use causal order for formation without assigning prefix standing.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:standing-principles", environment = "subsection", statement = "Track standing principles as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:standing-is-measurement", environment = "postulate", statement = "Compute standing as a comparison of transported pairs without changing any ledger balance or count; snapshot and compare the ledger across the solve. Standing can nevertheless move or concentrate across alternative complete histories. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:standing-pair-mass-conservation", environment = "postulate", statement = "Conserve full balance and count totals through row-stochastic allocation; this is rival allocation, not invariance of individual standings, participant maxima or unweighted sums. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "thm:epoch:standing-pair-mass-conservation", environment = "theorem", statement = "Conserve full balance and count totals through row-stochastic allocation; this is rival allocation, not invariance of individual standings, participant maxima or unweighted sums. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:standing-epoch-set-determinism", environment = "postulate", statement = "Compile standing from the fixed accepted set and structural branch event result; ordinary stance withdrawal nets, while settlement challenges do not reverse persistent outward events.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:settlement-standing-title-coupling", environment = "postulate", statement = "Positive eligible Accept and first correct Ratify cells resolve to their structurally completed counterparty event, including challenged and sibling events; later duplicate Ratify stays self and every accepted act remains counted once.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:standing-memorylessness", environment = "postulate", statement = "Recompute from current sources without previous-standing inertia.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:universal-act-weighing", environment = "postulate", statement = "Weigh every accepted act once, including control and artifact acts.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:domain-weighted-act-sum", environment = "postulate", statement = "Sum per-domain contributions without averaging away act multiplicity.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:hop-faded-responsive-tilt", environment = "postulate", statement = "Use the published nonincreasing hop profile for recipient responsiveness.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:cluster-rate-invariance", environment = "postulate", statement = "Preserve the closed transported-count-weighted mean under internal pair allocation; neither an open fibre mean nor individual coordinates or maxima are thereby fixed. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:standing-allocation-inputs", environment = "subsection", statement = "Track standing allocation inputs as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:standing-fold-cell", environment = "definition", statement = "Assign accepted acts to the declared complete-act fold cells.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:effective-act-contribution", environment = "definition", statement = "Take the geometric mean of mandatory coordinate magnitudes after folding.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:hostility-is-priced", environment = "remark", statement = "Debit zero or hostile contributions even when they allocate no outward mass.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:standing-recipient-resolution", environment = "definition", statement = "Resolve positive eligible person-directed cells by the family table; settlement destinations depend on structural completion, not a selected winner or absence of challenges.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:allocation-index-set", environment = "remark", statement = "Retain anchored actors as the standing matrix indices.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:allocation-index-set-unanchored-recipient", environment = "case", statement = "Branch of ``rem:epoch:allocation-index-set``: Keep recipient resolution and allocation on the same finite set of anchored Actors; an unanchored recipient would have a column without a row and could incorrectly receive published standing. Canonical dangling-fold handling alone does not establish this allocation closure.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "tbl:epoch:standing-recipient-resolution", environment = "table", statement = "Positive eligible Accept and first completing Ratify resolve to counterparties of a structurally complete handshake; incomplete, invalid and later duplicate Ratify cells resolve home; other families retain their rules.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:standing-domain-profile", environment = "definition", statement = "Assign the declared domain profile to each complete act.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "tbl:epoch:standing-domain-weights", environment = "table", statement = "Use published domain weights and self-retention base.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:self-retention-base", environment = "definition", statement = "Give every source a strictly positive diagonal base.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:domain-weighted-base-allocation", environment = "definition", statement = "Sum weighted cell coefficients by resolved recipient plus self base.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:domain-weighted-base-allocation", environment = "equation", statement = "Sum weighted cell coefficients by resolved recipient plus self base.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:artifact-activity-crowds-out-export", environment = "remark", statement = "Account for self-retention from artifact and control acts; an added act changes debit, count and allocation, so use the complete forcing and both source-rate hulls rather than infer a standing direction.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:conserved-standing-transport", environment = "subsection", statement = "Track conserved standing transport as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:standing-tilt-profile", environment = "definition", statement = "Multiply the published hop shape by the selected nonnegative rung.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:hop-allocation-score", environment = "definition", statement = "Tilt base scores by clamped recipient activation.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:hop-allocation-score", environment = "equation", statement = "Tilt base scores by clamped recipient activation.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:hop-allocation-matrix", environment = "equation", statement = "Normalize each hop score row to unit mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:hop-allocation-matrix", environment = "definition", statement = "Normalize each hop score row to unit mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:mass-owner-relative-hop-order", environment = "remark", statement = "Count hops from the transported source, not backwards from the reader.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:relative-allocation-odds", environment = "proposition", statement = "Check tilted relative odds against the base ratio.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:relative-allocation-odds", environment = "equation", statement = "Check tilted relative odds against the base ratio.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:rival-allocation-response", environment = "proposition", statement = "Check recipient gain and sibling loss derivatives including the safety-wall kink.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:rival-allocation-response", environment = "equation", statement = "Check recipient gain and sibling loss derivatives including the safety-wall kink.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "itm:epoch:rival-allocation-response-rivalry", environment = "item", statement = "Check that allocation derivatives sum to zero in each row: a recipient’s gain is exactly balanced by sibling and self-share losses, with self loss arising from the common denominator.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "itm:epoch:rival-allocation-response-wall-flatness", environment = "item", statement = "Below the safety wall, require zero allocation derivative with respect to that recipient’s standing at every hop; the recipient remains level-discounted rather than dynamically responsive.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "itm:epoch:rival-allocation-response-row-independence", environment = "item", statement = "Keep an allocation row independent of its own Actor’s standing because its self score is unmodulated. Retain indirect diagonal Jacobian terms through other Actors’ rows in the certificate.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:standing-support-preservation", environment = "proposition", statement = "Keep transport support fixed when ledger and compiled base are fixed.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:standing-depth-mass", environment = "definition", statement = "Use nonnegative depth masses summing to one with a positive deepest mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:source-emission", environment = "definition", statement = "Cap source emission at its own balance divided by threshold times history count.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:source-emission", environment = "equation", statement = "Set source emission to the minimum of one and residual balance divided by the writing-epoch price times history count. Read the completed ledger and retain the unexported share at self, outside the hop mixture. A fixed-pair partition cannot enlarge its aggregate capacity ceiling, although actual export can move either way. The capacity ceiling coexists with the concentration allowed under the receiving premises of ``prop:epoch:split-concentration``.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:source-emission-rationale", environment = "remark", statement = "Apply the fixed source-emission diagonal outside transport, preserving pair mass. A time-decay sink or relocated mass requires a charter amendment and a new cluster-identity argument. Partition capacity is bounded without fixing actual export or standing. Changed-history displacement has the scoped pair and concentration bounds of ``prop:epoch:split-pair-displacement`` and ``prop:epoch:split-concentration``.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:finite-depth-conserved-transport", environment = "definition", statement = "Mix ordered hop-matrix products and add nonemitted mass to the diagonal.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:finite-depth-conserved-transport", environment = "equation", statement = "Mix ordered hop-matrix products and add nonemitted mass to the diagonal.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:transport-is-not-ledger-transfer", environment = "remark", statement = "Transport full pairs for comparison without moving balances, reassigning counts or mutating the ledger. Recorded-source provenance does not imply standing invariance across alternative funded histories. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:emission-self-inertia", environment = "remark", statement = "Retain the unexported share at the source once outside the depth mixture. The self share is at least its full-pair value. Frame gross amount raises own source rate and emission until saturation, not necessarily computed standing; rehabilitation requires the stated response tests or a certified finite comparison.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cor:epoch:conserving-emission", environment = "corollary", statement = "Preserve row stochasticity after source emission.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "thm:epoch:emission-export-bound", environment = "theorem", statement = "Bound exported balance and count by the source emission budget.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:emission-export-bound", environment = "equation", statement = "Bound each source’s exported count by the minimum of its count and residual balance over the writing-epoch price; summing gives the cohort balance-over-price ceiling, and zero balance exports none. A fixed-pair partition cannot enlarge the aggregate ceiling, while actual export and standing can change; no universal small displacement follows. The capacity ceiling coexists with the concentration allowed under the receiving premises of ``prop:epoch:split-concentration``.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:emission-wall-symmetry", environment = "remark", statement = "Distinguish own-source emission from relational safety. Ledger and emission feedback across epochs does not follow from an in-epoch certificate, and the wall step bound and hysteresis establish no unconditional epoch-to-epoch stability.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:artifact-non-allocation", environment = "proposition", statement = "Check passive-projection invariance only with compiled act inputs held fixed; scope is questioned.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:conserved-standing-map", environment = "definition", statement = "Compute the pair-weighted reduced standing map for positive-count sources.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:conserved-standing-map", environment = "equation", statement = "Compute the pair-weighted reduced standing map for positive-count sources.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:conserved-standing-equilibrium", environment = "definition", statement = "Solve the current standing map fixed point on its hull.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:conserved-standing-equilibrium", environment = "equation", statement = "Solve the current standing map fixed point on its hull.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:tilt-backoff-grid", environment = "definition", statement = "Use the published finite grid ending at the exact no-tilt anchor, which is no attempt. Attempt each positive rung once in descending order through the first PASS or the least positive rung, publishing every endpoint verdict and its supplied or recoverable enclosure support; reject missing, repeated, out-of-order or below-acceptance attempts.", kind = "certificate", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:tilt-backoff-is-not-export-backoff", environment = "remark", statement = "Change responsiveness without deleting compiled support or source emission.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:certificate-failure-versus-indecisive-enclosure", environment = "remark", statement = "Record mathematical failure separately from an enclosure that cannot decide.", kind = "certificate", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:act-folding", environment = "subsection", statement = "Track act folding as a separately addressable subsection.", kind = "certificate", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:net-stance", environment = "definition", statement = "Sum complete-act signed coordinates before clipping by author, family, source, target and full incidence, never across authors or independently paired legs. Opinion, Reference and Invitation aggregate regardless of destination, including home-resolving cells. Exclude settlement records, controls and the never-outward families Publish, Owner, Affinity, Tag, Review, Send, Bid, Join Request and Participant by family: excluded authored acts remain singleton cells, while derived Self-edge components form no authored cell. Retain every member and removable payload; raw-record consumers keep their declared inputs.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:compiled-acts-fold-into-cells", environment = "remark", statement = "Group netted complete acts by author, family, source, target and full incidence, retaining member witnesses; aggregation-excluded acts remain singleton cells. Invitation reads folded A-leg u and f, never T-leg relevance; a netted-to-zero Invitation resolves home at coefficient zero, and controls never resolve outward.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:act-folding-properties", environment = "proposition", statement = "Check that cells are author-owned, passive-independent and standing-atomic; preserve incomplete, hostile and self-resolving records for declared non-standing consumers. Coefficients lie in [0,1] with both endpoints reachable; home cells remain priced and counted on the diagonal. Equal accepted sets, folds, census and constants compile equal cells, coefficients and recipients.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:folding-precedes-allocation", environment = "remark", statement = "Reconstruct complete acts, apply bundle folds, resolve cells outward or home and emit the base matrix before allocation. Passive artifacts are excluded once in the compiler, not checked again at each hop. Raw feed and signed services traverse the Action Graph independently and read nothing from this matrix.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:control-acts-resolve-to-self", environment = "remark", statement = "Weigh Withdraw, Rescind, Leave and De-invite at self with coefficient one: they have no mandatory stance coordinates and enter no person-vouch projection. De-invite has no standing-visible effect; only the Layer-2 membership fold reads it.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:net-stance-properties", environment = "proposition", statement = "Commutative sum-then-clip makes compilation invariant under dependency-compliant permutations of the accepted epoch set and preserves parameter ranges and existing ceilings. Mixed-sign and coherent-hostile stances fail the positive-coordinate person-vouch gate regardless of raw parity; near-zero net stance is routing-inert. Every revision increments the author’s count and dilutes the commitment rate; immutable records remain while their ongoing effect changes.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:conviction-inertia", environment = "remark", statement = "Keep priced prior contributions in the declared stance fold.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:conviction-inertia-latest-edge", environment = "case", statement = "Branch of ``rem:epoch:conviction-inertia``: Use per-author sum-then-clip rather than latest-edge-wins: reversing accumulated conviction requires proportionate priced counter-acts. A bundle negative in both coordinates is routing-coherent but fails person-vouch eligibility; full withdrawal targets net zero.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:severance-blindness", environment = "remark", statement = "Do not infer unseen revocations or consent from missing records.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "lem:epoch:authored-vouch-withdrawable", environment = "lemma", statement = "Authored-vouch withdrawability covers the stance-folded Opinion, Reference and Invitation families. Settlement singleton cells have no withdrawal route: once outward their allocation persists in current and future cumulative standing, and later Withdraw or Rescind is challenge evidence that re-weighs nothing home.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:vouch-activation", environment = "subsection", statement = "Track vouch activation as a separately addressable subsection.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:responsive-vouch-activation", environment = "definition", statement = "Evaluate the normalized sigmoid and hyperbolic-tangent activation from reduced standing.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:responsive-vouch-activation", environment = "equation", statement = "Evaluate the normalized sigmoid and hyperbolic-tangent activation from reduced standing.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:safety-wall-clamped-activation", environment = "definition", statement = "Clamp activation input at the safety floor without manufacturing source mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:safety-wall-clamped-activation", environment = "equation", statement = "Clamp activation input at the safety floor without manufacturing source mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:raw-signed-service", environment = "subsection", statement = "Track raw signed service as a separately addressable subsection.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:path-sign", environment = "equation", statement = "Multiply raw edge parity along the traversed path.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:parity-not-balance", environment = "remark", statement = "Keep raw sign semantics separate from standing balance allocation.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:double-cover-bfs-state", environment = "definition", statement = "Maintain separate positive and negative magnitude registers.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "alg:epoch:exact-signed-raw-traversal", environment = "algorithm", statement = "Run the exact bounded-depth two-parity raw traversal.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "lem:epoch:double-cover-bfs-correctness", environment = "lemma", statement = "Check signed traversal against its path claim; simple-path versus walk semantics remain open.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:bfs-reduction-to-feed-ranking", environment = "proposition", statement = "Recover the unsigned feed result when all traversed parities are positive.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "tbl:epoch:overhead-comparison", environment = "table", statement = "Record the stated two-register versus one-register raw traversal costs.", kind = "function", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:computed-standing", environment = "subsection", statement = "Track computed standing as a separately addressable subsection.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:computed-standing", environment = "definition", statement = "Compute computed reduced standing and multiply by the numeraire for full standing.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:computed-standing", environment = "equation", statement = "Compute computed reduced standing and multiply by the numeraire for full standing.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:computed-standing-mediant", environment = "equation", statement = "Compute standing from transported full balance/count pairs rather than averaging source rates.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:full-pair-source-transport", environment = "remark", statement = "Transport full source pairs after graduated row emission. Zero-balance sources retain identity rows; partial export obeys the balance-over-price count ceiling. Dilution remains priced and hull-bounded; a hard cutoff is a charter change, and the cap promises no small response or fading prevalence. A fixed-pair partition cannot enlarge the aggregate capacity ceiling, although actual export and target standing may change. The capacity ceiling coexists with the concentration allowed under the receiving premises of ``prop:epoch:split-concentration``.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:computed-standing-hull", environment = "proposition", statement = "Enclose each coordinate in its contributing source-rate hull; funded support concentration can approach a whole hull width, so the hull is not a small strategic-gain guarantee. The same concentration record can describe a legitimately separate role under ``ex:epoch:split-showcase``; its magnitude does not reveal purpose.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:equal-rate-standing-invariance", environment = "proposition", statement = "Equal contributing rates give that exact standing; heterogeneous partitions do not inherit this invariant. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:no-tilt-anchor", environment = "proposition", statement = "Evaluate the zero-tilt state without a nonlinear fixed-point iteration.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "thm:epoch:closed-cluster-rate-identity", environment = "theorem", statement = "Check the conserved pooled-rate identity for a closed cluster.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:closed-cluster-rate-identity", environment = "equation", statement = "Check the conserved pooled-rate identity for a closed cluster.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:closed-cluster-mean", environment = "equation", statement = "For a closed cluster, the transported-count-weighted mean standing equals aggregate residual frame balance divided by aggregate action count.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cor:epoch:conserving-source-root-criterion", environment = "corollary", statement = "Check cluster support closure for the pooled-rate identity.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cor:epoch:cluster-rate-leakage", environment = "corollary", statement = "With boundary base-allocation weight at most epsilon in either direction, departure from the closed-cluster mean is bounded by that leakage times the rate width. This weighted-mean bound gives no individual frame gross response sign. Intact pair totals and the closed weighted mean can remain conserved while partition changes individual coordinates or maxima.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:actor-partition-comparison", environment = "definition", statement = "Declare matched complete histories, participant fibre, pair partition, fixed wall/numeraire/policy and recipient/title premises; each history selects its greatest passing rung. This is an explicit counterfactual, not reassignment or inferred common ownership. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "type", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-pair-displacement", environment = "proposition", statement = "Check centred pair displacement over the new positive denominator and its common-source rate-width times total-variation bound; changed counts alone do not determine movement. The receiving regime admits the refinement of ``prop:epoch:split-concentration``.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-exact-invariants", environment = "proposition", statement = "Preserve transported pair totals, the closed transported-count-weighted mean and equal-rate coordinates under the stated partitions; individual coordinates, unweighted sums and maxima need not agree. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-fibre-capacity", environment = "proposition", statement = "Bound actual external export by the summed member capacities, no larger than the old capacity. Proportional partition preserves the ceiling, not actual export. The self-path ceiling in ``prop:epoch:split-self-path-export`` refines this capacity bound without turning it into a global advantage optimum.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-self-path-export", environment = "proposition", statement = "Refine fibre export using certified positive diagonal stay-path probabilities over published depth masses; attainment in the absorbing anchor fixture is not global optimality. Sharpness is confined to its stated family; ``prop:epoch:split-fibre-capacity`` controls the general capacity.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-concentration", environment = "proposition", statement = "Bound participant maximum gain by member displacement and a common hull width; with unchanged incoming support and absorbing equal-rate members, check the exact concentration formula and its conditional continuous envelope. The identical receiving-family record also permits legitimate separation under the hypotheses of ``prop:epoch:split-legitimate-completion`` and ``ex:epoch:split-showcase``.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "thm:epoch:split-observational-equivalence", environment = "theorem", statement = "For two semantic completions with identical public acts, payloads, ledgers, constants and all rule inputs, deterministic outputs coincide and randomized outputs have the same law when conditional randomness does. A record-based remedy imposes the same standing or fixed-context terminal change on legitimate separation and strategic concentration. This compares completions of one record, not pooled and partitioned records.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-legitimate-completion", environment = "proposition", statement = "In the admitted receiving family, partition N Registrations into n and N-n at equal source rate with 0<n<N; keep independent donors, complete positive Opinions, incoming acts, absorbing participant rows, empty titles and greatest passing rungs. A legitimate completion exists when private roles are assignable independently, payloads make no contradictory aggregate-scope claim, donors can intend the retained role and no extra public identity or purpose attestation intervenes. This is an existence result for that family, not an inference of actual intent or a claim about every strategic history.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "ex:epoch:split-small", environment = "example", statement = "Reproduce the small certified receiving fixture under ``ver:standing:split-receiving`` and its legitimate-completion hypotheses. Its one partitioned public record admits both an endorsed-role separation and strategic concentration. A record-based reduction or consumer exclusion affects both equally, or with the same distribution if randomized; pooled and partitioned standings need not agree.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "ex:epoch:split-showcase", environment = "example", statement = "Reproduce the certified near-hull concentration fixture under ``ver:standing:split-concentration`` and its legitimate-completion hypotheses. The same sparse retained Profile may separate an endorsed role from unrelated maintenance or serve strategic concentration. A record-based remedy imposes the same loss on both completions, or the same loss distribution; near-hull displacement is no evidence of private purpose.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-registration-cost", environment = "proposition", statement = "Count the additional Registration debit at its writing price; this is not incremental aggregate frame gross amount between matched histories, which may be zero. Under ``thm:epoch:split-observational-equivalence``, a record-based remedy imposes the same change on a legitimate completion with identical public fields, or the same distribution of changes if randomized.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-centered-invariance", environment = "proposition", statement = "Check all centred residuals at the lifted coarse solution within the refined hull; simultaneous vanishing characterizes invariance at that state, not a structural classification before solving. The all-state criterion of ``thm:dynamics:split-hop-refinement`` has stronger premises than this equilibrium test.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:split-admission-clearance", environment = "proposition", statement = "Use matched-author standing bounds and their act-weighted mean to preserve predicates only when clearance exceeds them; separately check formation, solvency and capacity. Existing fixtures demonstrate no verdict flip. The comparisons in ``ver:standing:split-admissibility`` certify both complete histories; they do not infer private purpose.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:computed-standing-response", environment = "proposition", statement = "With source rates and other transported coefficients fixed, increasing a source’s contribution lifts or dilutes the target according as its rate exceeds or falls below the target’s standing. A complete act or frame gross amount changes further inputs and needs the full finite-response comparison.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:computed-standing-embedding", environment = "proposition", statement = "Embed disconnected subsystems without changing their standing.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:author-directed-allocation", environment = "remark", statement = "Allocate only through the author whose act expresses regard. A relay apportions the original source’s unit, never its own; no passive artifact supplies authority or target veto. Frozen-flow source-rate comparisons give no universal sign for the completed act.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:dilution-cost", environment = "proposition", statement = "Charge each dilution act the in-force price: n such acts cost n times that price, and total grip is bounded by spent balance divided by price. Row conservation prevents cross-target copying. Funded partition and coupled frame gross amount or act responses remain subject to capacity, shock and hull bounds, not immunity or a universal sign. Changed-history displacement has the scoped pair and concentration bounds of ``prop:epoch:split-pair-displacement`` and ``prop:epoch:split-concentration``.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:griefing-resistance", environment = "remark", statement = "Bound griefing by author-only rows, priced and count-diluting acts, one rival unit per source, and the depleted-source export ceiling. Low-rate support may still dilute without a target veto; even an unreached sibling can decrease through rival feedback, within the stated response bounds.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:rate-parking", environment = "remark", statement = "Do not infer a universal rate-parking prohibition beyond the declared premises.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:no-tilt-commitment-monotonicity", environment = "proposition", statement = "At zero tilt with counts, base, threshold and emission fixed, reached coordinates increase under an increased supplied frame gross amount and unreached coordinates stay fixed. Changing emission invalidates this premise; positive-tilt reversals are certified.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "thm:epoch:frame-gross-response", environment = "theorem", statement = "Under the chartered tilt profile, depth masses, positive self-retention and a published wall at or above its structural floor, passing certificates do not imply monotonic standing under a supplied frame gross increment or an accepted act. There are admissible saturated frame gross comparisons at one fixed positive accepted rung in which the source actor decreases, a reached sibling decreases, and a structurally unreached sibling decreases. These are separate fixtures, not a claim that every ledger has every effect. There is also a depleted-source frame gross comparison with a decreasing reached recipient at the anchor. For selected rungs there is no finite universal upper bound on standing loss divided by a positive frame gross increment. One additional accepted act without additional frame gross amount has no universal direction; in the ordinary regime without an additional finite source ceiling its absolute own-standing loss is unbounded across admissible ledgers even when both contributing widths are zero. The fixed-rung losses in the certified fixtures are small in absolute size; the own feedback can nevertheless exceed the source actor's own direct forcing. One act can remove a substantial fraction of an isolated Actor's standing. The bounds are ``prop:epoch:frame-gross-response-bound``, ``prop:epoch:finite-standing-response``; the surviving positive regimes are ``cor:epoch:frame-gross-monotone-regimes``. This result changes neither the certificate nor the selection rule.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:frame-gross-response-bound", environment = "proposition", statement = "At a smooth saturated fixed passing rung, feedback offsets at most two thirds of the largest direct frame gross forcing, not necessarily of the source Actor’s own forcing; preserve the fixed Actor set, counts, base, wall, numeraire and other ledger entries.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cor:epoch:frame-gross-monotone-regimes", environment = "corollary", statement = "Establish positive response only by the stated direct-forcing versus feedback tests, fixed-emission anchor or sole-source premises. Small-rung thresholds depend on the ledger; finite paths require the premises throughout.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:finite-standing-response", environment = "proposition", statement = "Bound two certified completed states on the same Actor set by their full forcing and both hulls; recompute emission, folds and rung for changed acts or frame gross amounts instead of assuming a direction.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:within-epoch-standing-solver", environment = "subsection", statement = "Track within epoch standing solver as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:epoch-boundary", environment = "subsection", statement = "Track epoch boundary as a separately addressable subsection.", kind = "none", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:log-position", environment = "definition", statement = "Order audit positions by epoch ordinal, act position and projection role; neither a logical-time tie-break nor an audit rank is a scoring input.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:epoch-act-budget", environment = "definition", statement = "Count each complete authored act once toward the epoch target.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:act-sequence-evaluation", environment = "postulate", statement = "Read the selected boundary, evaluate the complete authoritative authored-act sequence once, enforce the committed target bound and derive binding or slack regime; elapsed-time closing is separate conduct and no asserted cause is supplied.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "itm:epoch:act-sequence-evaluation-formation", environment = "item", statement = "Require the complete act union to be formation-valid and each member’s author to pass own-balance solvency and individual safety on that completed state.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "itm:epoch:act-sequence-evaluation-safety", environment = "item", statement = "Require every complete-set member’s action stamp to be at least the safety wall.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "itm:epoch:act-sequence-evaluation-policy", environment = "item", statement = "Compute the epoch stamp once over the complete complete act union and require it to meet the effective policy floor.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:computed-edge-set", environment = "postulate", statement = "Derive the complete edge projection from the accepted whole-act sequence and its supplied state; it is not an independent accepted-set choice.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:shared-frame-gross-snapshot-rationale", environment = "remark", statement = "Use one fixed supplied boundary snapshot for the accepted calculation; source recognition and external history are separate premises.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:raw-self-edge-reading", environment = "definition", statement = "Derive current Self bonds and tenure from computed standing without appending records.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:raw-self-edge-reading", environment = "equation", statement = "Derive current Self bonds and tenure from computed standing without appending records.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "alg:epoch:conserved-standing-computation", environment = "algorithm", statement = "Validate, debit, compile, certify, solve, stamp and gate the complete proposed set.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "alg:epoch:tilt-backoff", environment = "algorithm", statement = "Resolve required selected support for positive rungs in descending order and compute their verdicts through the first PASS or least positive rung; the exact anchor is not an attempt.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:epoch-replay-determinism", environment = "proposition", statement = "The consumed Actor entries, accepted records, carried state, debit vintage, specified constants and calculation determine replay; a separate compiler-version record field is not required.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:act-debit", environment = "subsection", statement = "Track act debit as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:act-debit", environment = "postulate", statement = "Debit only the writing-epoch threshold once per accepted authored act.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:translation-law", environment = "proposition", statement = "Check exact translation at fixed weights and uniform debit history, not arbitrary fixed points.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:dense-cluster-fairness", environment = "remark", statement = "As incoming transported action mass dominates own retained mass, standing approaches the contributing support’s weighted rate; density or headcount alone does not establish that limit. The closed weighted mean does not fix individual coordinates or participant maxima under funded partition. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:two-action-counts", environment = "remark", statement = "Separate live solvency inputs from boundary pairs used by standing.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:participation-gates", environment = "subsection", statement = "Track participation gates as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:act-sequence-write-rule", environment = "postulate", statement = "Write only the accepted finite whole-act sequence that passes evaluation on its supplied cumulative state and inputs; no computed-output copy creates eligibility.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:write-own-balance-solvency", environment = "condition", statement = "Continuously require the recorded author's residual balance to cover the price in force; only that author's own balance pays the debit on a write.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:write-individual-safety", environment = "condition", statement = "Check every author against the wall on the proposed-set computed equilibrium.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:write-epoch-admission", environment = "condition", statement = "Check the act-weighted epoch stamp against the effective floor and enforce capacity, with the empty-epoch case explicit. Partition-stability guarantees require the clearance premises of ``prop:epoch:split-admission-clearance``.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:relational-gate-vs-own-export", environment = "remark", statement = "Keep solvency, own-history emission and relational safety as separate predicates.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:admission-statistics-quarantine", environment = "remark", statement = "Exclude demand-sensitive regime and headroom from unit-side formulas.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:consent-exposure", environment = "remark", statement = "Continuing cancellation records written challenges; suppression leaves no written evidence and submission alone promises no delivery or deadline protection. The safety clamp and version-fixed one-boundary announcement lead carry the policy-floor discipline.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "tbl:epoch:actor-states", environment = "table", statement = "Distinguish active, band, insolvent and frozen participation states.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:band-dwell", environment = "remark", statement = "For an unendorsed Actor with no new frame gross amount, the exact own-source formulas give door and wall crossing and the stated band-dwell benchmarks, subject to headroom. Re-entry requires additional amount rather than waiting.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:non-written-dynamic-live", environment = "remark", statement = "Retain nonwritten actors in current dynamics unless the safety clamp applies.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:registration-complete-set-admission", environment = "remark", statement = "Apply ordinary one-act debit, count, standing and gate rules to Registration.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cor:epoch:same-epoch-source-hull", environment = "corollary", statement = "A same-epoch cohort whose contributing source rates all lie below the wall cannot vouch itself above it; a closed zero-rate cohort stays at zero without external positive-rate source. The source hull creates no source and supplies no general heterogeneous funded-partition invariance. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cor:epoch:universal-frame-amount-benchmarks", environment = "corollary", statement = "Compute the own-balance, individual-safety and aggregate-door frame amount benchmarks for an unsupported Actor proposing one or more acts; none guarantees selection into the finite write set.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "subsec:epoch:floor-governance", environment = "subsection", statement = "Track floor governance as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:safety-threshold", environment = "definition", statement = "The reduced wall is primary and the charged price is its numeraire image; certify that charge on its own epoch width.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-derivability", environment = "condition", statement = "Derive the next wall from the completed certificate and published constants, then publish its price image.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-in-epoch-certification", environment = "condition", statement = "Certify the greatest attempted rung whose supplied or recoverable sound enclosure support proves PASS on the epoch own width; retain higher attempts and distinguish proved failure from indecision.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-wall-step-bound", environment = "condition", statement = "Bound a wall change by the lesser of the positive absolute cap and the relative cap times the previous wall.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-wall-hysteresis", environment = "condition", statement = "Apply a symmetric relative deadband to the floored proposal before the step cap, with no hidden latch.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-publication-lead", environment = "condition", statement = "Compute the next schedule at the present boundary and compare it with the successor’s in-force schedule in history closure, without repricing any prior debit.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-controller-publication", environment = "condition", statement = "Supply the controller’s in-force settings, formula, constants and independent observations; its proposal and next schedule are computed rather than independently required copies.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-numeraire-covariance", environment = "condition", statement = "Keep the controller blind to the numeraire and preserve reduced inputs under recoinage; distinguish other structural changes.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-declared-floor", environment = "condition", statement = "Certify the actual wall at or above the deployment fixed exact floor, including zero width and an empty domain.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-input-quarantine", environment = "condition", statement = "Read only previous wall, completed width, accepted rung and constants; exclude admission demand and private history.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:policy-floor", environment = "definition", statement = "Announce the host floor one boundary ahead and reject values below the led safety floor; the issued defaulted figure is illustrative and not a fallback.", kind = "function", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:floor-validity", environment = "equation", statement = "Check the policy floor against the dimensionless safety floor.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:participation-floor", environment = "definition", statement = "Take the maximum of policy and safety floors as fault totalization.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:effective-floor", environment = "equation", statement = "Compute the derived maximum floor without treating it as a new dial.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:safety-wall", environment = "definition", statement = "Publish the reduced wall with one-boundary lead and derive its price by multiplication by the numeraire.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:safety-wall-floor", environment = "definition", statement = "Declare once beside the numeraire either the exact clean-elasticity ridge image or the rational three thirty-sevenths; compare the actual reduced wall against that fixed structural floor.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:safety-wall-floor-ridge-floor", environment = "case", statement = "Branch of ``def:epoch:safety-wall-floor``: The ridge-floor choice is the exact real p-star/(1-p-star) defined by the unique elasticity ridge, not a grid endpoint or rounded root. Declare it publicly before the first epoch and keep the structural declaration fixed unless a public structural change regenerates its evidence.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:safety-wall-floor-rational-floor", environment = "case", statement = "Branch of ``def:epoch:safety-wall-floor``: The alternative floor is the declared exact rational value from the chartered two-element floor set. Publish the choice before the first epoch beside the numeraire; changing it or choosing a third value requires a public structural change with its own evidence, never epoch tuning.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "cor:epoch:floor-economics", environment = "corollary", statement = "A wall at or above the positive structural floor gives a price at least numeraire times that floor and bounds real remaining-action capacity per frame gross unit by its reciprocal. Apply integer flooring to a residual balance. Full emission requires a source rate at least the delivered wall; floor attainment is a mathematical bound, not a cap on every wall.", kind = "none", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:floor-is-a-landmark", environment = "remark", statement = "Treat the floor as a structural leverage choice, not a consequence of in-epoch certification; the exact defining object determines the comparison.", kind = "none", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:wall-controller", environment = "definition", statement = "Compute a numeraire-blind memory-one controller from its supplied in-force wall, completed width and accepted rung; no demand, hidden state or forecast is an operand.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:canonical-interim-wall-controller", environment = "definition", statement = "Compute a floored full-strength target, apply the relative deadband, then cap the signed step by absolute and relative bounds; zero width uses the floor target.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:canonical-interim-wall-controller-zero-width", environment = "case", statement = "Branch of ``def:epoch:canonical-interim-wall-controller``: At zero completed-epoch width, propose the declared structural floor without inversion or division by width; the delivered wall still passes through deadband and step-cap handling.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:canonical-interim-wall-controller-positive-width", environment = "case", statement = "Branch of ``def:epoch:canonical-interim-wall-controller``: At positive completed width W, propose the maximum of the structural floor and inverse deployed gain at 1/(2 times margin times chartered cumulative tilt times W). This targets the least mathematically passing wall; finite boundary comparisons may be indecisive and the next epoch certifies its own width.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:canonical-interim-wall-controller-deadband-hold", environment = "case", statement = "Branch of ``def:epoch:canonical-interim-wall-controller``: When the target error magnitude is at most deadband times the previous wall, set the effective error to zero and hold the wall, including equality.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:canonical-interim-wall-controller-deadband-move", environment = "case", statement = "Outside the deadband, apply the signed target error, structural floor and step cap in the stated order; compute the delivered wall for the successor schedule.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:safety-independent-of-controller", environment = "proposition", statement = "Under the conserved-map ledger, support and invariant-box hypotheses, every finite wall at or above its structural floor has a greatest proved passing rung on the completed epoch’s own width, with a unique fixed point and geometric convergence from its box. This does not require a correct controller forecast or attainment of the chartered rung, and does not discharge the separate write and policy tests.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:safety-independent-of-controller-nonempty-domain", environment = "case", statement = "Branch of ``prop:epoch:safety-independent-of-controller`` proof: On a nonempty finite live domain under the standing hypotheses, a positive finite wall gives finite gain, and the finite grid includes the zero-certificate anchor. The nonempty finite set of proved passes has a greatest rung; its contraction gives unique standing and geometric convergence without a next-epoch width-dominance premise.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:safety-independent-of-controller-empty-domain", environment = "case", statement = "Branch of ``prop:epoch:safety-independent-of-controller`` proof: On an empty live domain, the standing box contains only the empty vector, which is the unique fixed point. This does not discharge own-balance, individual-safety, epoch-admission or policy-validity tests.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:wall-controller-total", environment = "proposition", statement = "Define empty-domain width as zero and otherwise use the maximum contributing source-rate range. On every finite declared input triple, the canonical interim controller must return a finite proposal and delivered wall at or above the floor, obeying the step bound. Zero width proposes the floor, and a wall already there stays there.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:wall-controller-covariance", environment = "proposition", statement = "Under recoinage, co-scale frame gross amounts and numeraire while retaining reduced constants and counts: reduced rates, standing, width and wall stay unchanged, the next price co-scales, and old debits change representation only. A fixed-ledger numeraire migration instead evaluates the controller on its published transformed inputs; same-pair width scales inversely, compensation preserves the door product, an uncompensated move keeps its declared policy schedule, and floor and policy tests still apply. No controller homogeneity or solvency and individual-safety invariance is promised for that migration.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:wall-controller-covariance-recoinage", environment = "case", statement = "Branch of ``prop:epoch:wall-controller-covariance``: Co-scale every frame-denominated value and the numeraire by positive c while retaining reduced constants and counts. Reduced rates, standing, width and wall stay unchanged and the next price scales by c. Historical debits change representation, not economic charge.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:wall-controller-covariance-fixed-ledger-migration", environment = "case", statement = "Branch of ``prop:epoch:wall-controller-covariance``: Under a numeraire migration by positive c at a fixed frame amount ledger, evaluate the controller on the supplied transformed wall, width and rung, then multiply by the new numeraire for price. The same fixed source pairs have width W/c; this is not a forecast for a differently debited epoch.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:wall-controller-covariance-compensated", environment = "case", statement = "Branch of ``prop:epoch:wall-controller-covariance``: Compensated fixed-ledger migration also divides the policy floor by c so the numeraire-door product remains invariant. Validate the published wall floor and policy values; the product identity does not assert controller homogeneity or invariant write gates.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "case:epoch:wall-controller-covariance-uncompensated", environment = "case", statement = "Branch of ``prop:epoch:wall-controller-covariance``: Uncompensated fixed-ledger migration retains its declared policy schedule. Apply wall-floor and policy-validity tests to the published values; do not assume controller homogeneity or invariance of own-balance and individual-safety tests.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "def:epoch:computed-standing-stamps", environment = "definition", statement = "Give every same-author act the computed standing stamp and aggregate once per act.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:computed-action-stamp", environment = "equation", statement = "Assign the author's reduced equilibrium to each complete act.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:computed-epoch-stamp", environment = "equation", statement = "Average computed stamps by accepted authored-act count.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "eq:epoch:computed-epoch-headroom", environment = "equation", statement = "Sum action-weighted excess over the effective floor. Headroom is a measurement, not a floor or debit. Matched partitions preserve gates only with sufficient clearance and separately valid admission premises; the fixtures show no admission flip. Partition-stability guarantees require the clearance premises of ``prop:epoch:split-admission-clearance``.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "post:epoch:reduction-convention", environment = "postulate", statement = "Reduce dynamics by the numeraire and keep door and wall read-sites distinct.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "prop:epoch:compensation", environment = "proposition", statement = "Co-scale numeraire and reduced price inversely to preserve their door-price product; inverse width scaling and fence-certificate degradation both require the declared law of the comparison family. Neither scaling nor degradation follows from the door-product identity.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:capacity-crush", environment = "remark", statement = "Never reprice consummated historical debits.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:two-axes", environment = "remark", statement = "Keep the dimensionless participation membrane separate from the safety wall's frame-denominated price. Recoinage preserves reduced coordinates; a fixed-ledger numeraire migration transforms them through the controller. Compensating the policy floor preserves its door product without preserving every validity margin.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:dial-scope", environment = "remark", statement = "Separate structural numeraire, policy floor and certificate margin from measured headroom.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "6 Epoch", label = "rem:epoch:operator-authority-floor", environment = "remark", statement = "Limit host floor authority to the announced valid policy schedule.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "sec:sorting", environment = "section", statement = "Track sorting as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "subsec:sorting:relevance-score", environment = "subsection", statement = "Track relevance score as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "def:sorting:relevance-score", environment = "definition", statement = "Combine raw max-product relevance, fixed creator standing and terminal content norm.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "eq:sorting:relevance-score", environment = "equation", statement = "Combine raw max-product relevance, fixed creator standing and terminal content norm. Fixed-context scalar monotonicity supplies no general frame-gross-amount response, partition, ranking or end-to-end reward guarantee. Partition readout bounds require the matched creators and fixed non-standing context of ``prop:transport:split-terminal-readout-bounds``.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "rem:sorting:computed-standing-input", environment = "remark", statement = "Expose computed reduced creator standing without exposing solver intermediates to sorting. With other feed factors fixed, certified scalar changes bound score movement; frame gross amount, act and partition interventions require separate field and context comparisons. Partition readout bounds require the matched creators and fixed non-standing context of ``prop:transport:split-terminal-readout-bounds``.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "rem:sorting:terminal-routing-asymmetry", environment = "remark", statement = "Use directional coherence for routing and scalar energy at a content terminus.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "prop:sorting:score-positivity", environment = "proposition", statement = "Require a viable positive-weight path for a positive content score.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "prop:sorting:weak-link-suppression", environment = "proposition", statement = "Bound the score by the weakest determinant factor on the chosen path.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "subsec:sorting:log-transform-equivalence", environment = "subsection", statement = "Track log transform equivalence as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "def:sorting:log-relevance-distance", environment = "definition", statement = "Minimize summed negative log raw weights.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "eq:sorting:log-relevance-distance", environment = "equation", statement = "Minimize summed negative log raw weights.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "eq:sorting:log-cost-decomposition", environment = "equation", statement = "Separate coherence cost, maturity discount and entropy penalty.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "thm:sorting:log-transform-equivalence", environment = "theorem", statement = "Relate positive max-product paths to minimum log-cost paths.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "eq:sorting:log-equivalence", environment = "equation", statement = "Equate the maximizing product and minimizing log sum.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "case:sorting:log-transform-equivalence-routing-active", environment = "case", statement = "Branch of ``thm:sorting:log-transform-equivalence`` proof: On routing-active raw edges, positive weights admit the negative-log transform: maximizing a path product is equivalent to minimizing its additive log cost over the same admissible paths. This is a raw-path reduction, not standing transport.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "case:sorting:log-transform-equivalence-routing-inert", environment = "case", statement = "Branch of ``thm:sorting:log-transform-equivalence`` proof: A routing-inert edge contributes zero path product and has infinite negative-log cost, so it is excluded from the shortest-path reduction.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "subsec:sorting:anisotropy", environment = "subsection", statement = "Track anisotropy as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "prop:sorting:anisotropy-penalty", environment = "proposition", statement = "Compute the condition-number penalty against Frobenius scoring.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "eq:sorting:anisotropy-penalty", environment = "equation", statement = "Compute the condition-number penalty against Frobenius scoring.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "subsec:sorting:algorithms", environment = "subsection", statement = "Track algorithms as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "alg:sorting:exact-feed-traversal", environment = "algorithm", statement = "Expose bounded-depth raw traversal without designing terminal ranking policy.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "lem:sorting:bfs-correctness", environment = "lemma", statement = "Check the bounded-depth raw result against exhaustive small-graph enumeration.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "rem:sorting:matrix-bfs", environment = "remark", statement = "Nondefault terminal diversity requires matrix propagation.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "rem:sorting:raw-pruning-is-implementation", environment = "remark", statement = "Allow optimizations only when they preserve exact declared raw outputs.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "rem:sorting:mc-estimator-semantics", environment = "remark", statement = "Estimate a declared finite-horizon sum of eligible path weights using importance-corrected independently sampled walks, not the max-product relevance score.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "alg:sorting:monte-carlo-sum-of-paths", environment = "algorithm", statement = "Fix the graph, weights, eligible paths and finite horizon before sampling independent walks. Sum each eligible sampled prefix weight divided by its selection probability, including zero for unvisited targets, and average over samples.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "thm:sorting:monte-carlo-concentration", environment = "theorem", statement = "Establish a deterministic positive finite support bound independently of observed samples, positive selection probability for every positive-weight eligible path, and independent walks under one fixed stopped law before applying Hoeffding concentration. An observed maximum is not a support bound.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "cor:sorting:boundary-tightening", environment = "corollary", statement = "For a fixed sampling law, reducing a proved support bound tightens concentration. Changed transition probabilities require a new bound; neither the Boltzmann factor nor average path entropy alone establishes a smaller sample count.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "rem:sorting:diagnostic-cost", environment = "remark", statement = "Compute terminal path diagnostics after ranking without feeding them into standing.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "subsec:sorting:cross-cluster-amplification", environment = "subsection", statement = "Track cross cluster amplification as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "thm:sorting:cross-cluster-amplification", environment = "theorem", statement = "Inventory the raw maturity amplification ratio and its threshold claim.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "eq:sorting:cross-cluster-amplification", environment = "equation", statement = "Inventory the raw maturity amplification ratio and its threshold claim.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "cor:sorting:serendipity-conditions", environment = "corollary", statement = "Inventory the claimed maturity and coherence requirements for cross-cluster discovery.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "cor:sorting:polarized-cluster-amplification", environment = "corollary", statement = "Inventory the terminal amplification claim from polarization.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "subsec:sorting:score-monotonicity", environment = "subsection", statement = "Track score monotonicity as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "thm:sorting:score-monotonicity", environment = "theorem", statement = "Inventory the stated terminal score monotonicity conditions.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-standing", environment = "item", statement = "With every other feed factor fixed, score is nondecreasing in published creator standing. That scalar-input derivative supplies no universal frame gross amount or act response, partition invariance or ranking guarantee.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-quality", environment = "item", statement = "With other score inputs fixed, require feed score to be nondecreasing in the content tensor’s Frobenius norm.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-coherence", environment = "item", statement = "With other score inputs fixed, require feed score to be nondecreasing in the absolute path-view determinant of any path edge.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-maturity", environment = "item", statement = "Treat feed maturity response as non-monotone, with the stated minimum near one half and net amplification only beyond the maturity crossing.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-entropy", environment = "item", statement = "With other score inputs fixed, require feed score to be nonincreasing in tensor entropy.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-diversity", environment = "item", statement = "For positive diversity preference and fixed other score inputs, require feed score to be nondecreasing in the second singular value.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-focus", environment = "item", statement = "For positive diversity preference, require the score’s condition-number derivative to be nonpositive when the first singular value exceeds the second; the isotropic case is excluded from that premise.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-profile-bridge", environment = "item", statement = "On a fixed raw profile-bridged feed path, score is nondecreasing in the creator’s published standing through both the raw bridge factor and terminal amplifier. This is a feed property, not a standing-transport derivative; changes to supplied frame gross amount or accepted acts require a separate completed-field comparison.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "sec:transport", environment = "section", statement = "Track transport as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "subsec:transport:frame-commitment", environment = "subsection", statement = "Track frame commitment as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "def:transport:frame-commitment", environment = "definition", statement = "The supplied frame gross amount is a nonnegative amount attributed to an Actor. Costliness and irrecoverability are explicit input assumptions; transport consumes that amount under its boundary and history hypotheses.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "rem:transport:frame-amount-granularity", environment = "remark", statement = "Frame-amount precision is a deployment representation choice sufficient for the stated calculation and certification; source-action granularity and external price are not calculation operands.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "subsec:transport:guild-model", environment = "subsection", statement = "Track guild model as a separately addressable subsection.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "post:transport:guild-grant", environment = "postulate", statement = "Guilds may publish terminal timeline selection or combination without replacing the common branch certificate, standing inputs or admission.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "rem:transport:guild-grant-preconditions", environment = "remark", statement = "Terminal commercial choices do not change structural completion, challenge propagation or common recipient resolution; no terminal remedy is promised.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "rem:transport:guild-grant-cases", environment = "remark", statement = "Guild choices are terminal reimplementations with public rules and canonical defaults; every CAN replacement retains depth decay, transmission below one and context independence without changing binding values or closure.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:membership-policy", environment = "case", statement = "Branch of ``rem:transport:guild-grant-cases``: Choose a published terminal membership and sorting policy; the canonical fold admits participation and departure; De-invites are advisory unless recognized by a published policy, without conditioning admission, departure or De-invite authoring.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:deep-composition", environment = "case", statement = "Branch of ``rem:transport:guild-grant-cases``: Choose composition depth and scalar or matrix representation; the default scalar CAN follows the dependency DAG, and every choice preserves depth decay, transmission below one and context independence.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:svd-corrected-transmission", environment = "case", statement = "Branch of ``rem:transport:guild-grant-cases``: Optionally replace saturated mean edge norms by the saturated top singular value of the mean matrix; the full recursion must retain the CAN invariants.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:can-aggregation-function", environment = "case", statement = "Branch of ``rem:transport:guild-grant-cases``: Choose the aggregation function; arithmetic mean is canonical, while alternatives must preserve depth decay, strict transmission and context independence.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:bridge-multi-bridge", environment = "case", statement = "Branch of ``rem:transport:guild-grant-cases``: Choose public bridge composition and attribution; the canonical single-bridge rule takes the outer maximum per recipient, and replacements must re-establish any claimed canonical guarantees.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:bridge-eligibility-cliff", environment = "case", statement = "Branch of ``rem:transport:guild-grant-cases``: A guild chooses smoothing, with the unsmoothed single-bridge maximum as canonical default; a replacement accounts for redundancy amplification and inherits or re-derives each canonical guarantee it claims. Separately, the centralized-phase operator publishes an argmax-flip-rate threshold and a share-volatility companion, the ℓ1 distance between consecutive normalized share vectors, both computable from epoch-certificate data. Exceeding the threshold obliges the operator to publish a reference top-k ensemble composition rule; its use remains terminal and optional under the guild grant. This publication is a required policy; the implementation home is held in (`open:inventory:bridge-reaction-placement`).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:bridge-delivery-semantics", environment = "case", statement = "Branch of ``rem:transport:guild-grant-cases``: Use the canonical campaign scalar as circuit quality; privately observed traversal supplies no self-sufficient record, and adding a navigation edge type lies outside the terminal grant.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "case:transport:notoriety-field", environment = "case", statement = "Branch of ``rem:transport:guild-grant-cases``: Optionally declare a terminal negative aggregation; the canonical choice has no separate field, retains public negative records outside standing endorsement and gives them no feedback into admission or standing.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "rem:transport:guild-economic-autonomy", environment = "remark", statement = "Leave payout units, margins and pool funding to published guild policy.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "subsec:transport:advertiser-objective", environment = "subsection", statement = "Track advertiser objective as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "eq:transport:campaign-scalar", environment = "equation", statement = "Inventory the terminal weighted best-circuit campaign score.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "rem:transport:actor-targets", environment = "remark", statement = "Restrict the canonical advertiser target population to actors.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "subsec:transport:reward-formula", environment = "subsection", statement = "Track reward formula as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "eq:transport:reward-formula", environment = "equation", statement = "Inventory the normalized terminal reward formula and its positive-improvement gate. With fixed creators, positive normalization and fixed non-standing factors, conditional input bounds apply; they establish no general frame gross amount or funded-partition reward effect. Partition readout bounds require the matched creators and fixed non-standing context of ``prop:transport:split-terminal-readout-bounds``.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "tbl:transport:layer-origins", environment = "table", statement = "Expose records, scalar standing and geometry as inputs without implementing rewards.", kind = "fixture", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "eq:transport:epoch-entropy", environment = "equation", statement = "Average creator edge entropy for the terminal reward factor.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "rem:transport:cross-channel-commitment-amplification", environment = "remark", statement = "Expose certified standing as a fixed scalar rather than a replaceable raw-graph recomputation. Feed attention and pool funds reuse that scalar as distinct resources, not a double count; fixed-context sensitivity implies no monotone frame gross amount or act response. Partition readout bounds require the matched creators and fixed non-standing context of ``prop:transport:split-terminal-readout-bounds``.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "subsec:transport:properties", environment = "subsection", statement = "Track properties as a separately addressable subsection.", kind = "policy", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "pty:transport:computed-standing-input-monotonicity", environment = "property", statement = "With other creator-varying factors fixed, canonical reward share is nondecreasing in the computed reduced-standing input; frame or act interventions need their separate fixed-context comparisons.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "prop:transport:standing-readout-bounds", environment = "proposition", statement = "Bound feed and normalized reward sensitivity only with the specified creators, factors, pool and gate fixed and positive normalization; this is not an end-to-end frame gross amount, partition or ranking guarantee. Partition readout bounds require the matched creators and fixed non-standing context of ``prop:transport:split-terminal-readout-bounds``.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "cor:transport:zero-reward", environment = "corollary", statement = "Assign zero canonical reward when campaign improvement is nonpositive.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "thm:transport:epoch-entropy-damping", environment = "theorem", statement = "For a positive gate and pool with other factors and competing entropies fixed and a positive denominator, increasing own entropy never increases reward. Decrease is strict only with positive own and competing contributions; zero and sole contributions give equality, and an all-zero denominator gives no allocation claim.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "thm:transport:reward-proportionality", environment = "theorem", statement = "Inventory proportional terminal allocation among contributing creators. Use composite utility under the open improvement gate and positive normalization; a partition comparison must hold its terminal context fixed and supplies no end-to-end reward guarantee. Partition readout bounds require the matched creators and fixed non-standing context of ``prop:transport:split-terminal-readout-bounds``.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "8 Transport", label = "prop:transport:split-terminal-readout-bounds", environment = "proposition", statement = "Translate partition standing bounds into terminal bounds only with creators and all non-standing factors matched; changed authorship, paths, attribution and guild factors need separate hypotheses. Use the declared matched-history contract of ``def:epoch:actor-partition-comparison``; do not infer its fibre or counterfactual from the record.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "9 Content", label = "sec:content", environment = "section", statement = "Track content as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "9 Content", label = "def:content:provenance", environment = "definition", statement = "Inventory the continuous public-use-audit requirement without a Layer 1 enforcement mechanism.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "9 Content", label = "def:content:attribution", environment = "definition", statement = "Inventory the continuous maker-credit requirement as terminal interpretation.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "9 Content", label = "def:content:license-qualifiers", environment = "definition", statement = "Carry the genesis qualifier pair in the unit square as immutable structural metadata.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "9 Content", label = "eq:content:license-matrix", environment = "equation", statement = "Inventory the four extreme license interpretations and additive severity.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "9 Content", label = "rem:content:public-domain", environment = "remark", statement = "Inventory the zero-severity terminal license interpretation.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "9 Content", label = "prop:content:closure-exclusion", environment = "proposition", statement = "Preserve the genesis license field across payload removal and exclude its interpretation from admission.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "9 Content", label = "rem:content:license-guild-interaction", environment = "remark", statement = "Leave licensing policy and enforcement to the guild.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "sec:scalability", environment = "section", statement = "Track scalability as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:bottleneck", environment = "subsection", statement = "Track bottleneck as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:bottleneck", environment = "proposition", statement = "Separate raw traversal, attribution, standing evaluation, certification and terminal centrality costs.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "rem:scalability:advertising-centrality-exact", environment = "remark", statement = "Inventory canonical campaign centrality as an exact terminal workload.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:conserved-standing-work-model", environment = "subsection", statement = "Track conserved standing work model as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "def:scalability:conserved-standing-work-measures", environment = "definition", statement = "Measure standing work by anchored actors and sparse base support.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:allocation-input-maintenance-cost", environment = "proposition", statement = "The linear allocation-input pass assumes the accepted census and recipients are supplied; it excludes branch construction, challenge propagation, parent validation and recipient resolution.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:conserved-map-pass-cost", environment = "proposition", statement = "Apply finite-depth transport to balance and count vectors without materializing the dense matrix.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:standing-certificate-cost", environment = "proposition", statement = "Inventory the claimed support-sweep certificate bound and its contributing-width premise.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "thm:scalability:conserved-equilibrium-cost", environment = "theorem", statement = "Account separately for compilation, rung screening and residual-certified map passes.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "tbl:scalability:conserved-standing-work", environment = "table", statement = "Record the declared cost model without treating it as a measured build or runtime result.", kind = "fixture", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:conserved-standing-verifiability", environment = "proposition", statement = "Verify standing from the public package at the declared production-order asymptotic cost, without requiring the previous epoch’s standing solution.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:fixed-point-cost", environment = "subsection", statement = "Track fixed point cost as a separately addressable subsection.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "lem:scalability:contraction-stopping-rule", environment = "lemma", statement = "Use the certified residual enclosure to decide required comparisons; these within-epoch passes establish no inter-epoch controller settling bound.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:solver-decomposition", environment = "subsection", statement = "Track solver decomposition as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:transport-scc-decomposition", environment = "proposition", statement = "Solve supported dependency components in dependency order and retain possible singleton self-dependence.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:exact-component-reuse", environment = "proposition", statement = "Reuse a component only when all current mathematical inputs and upstream values match.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "rem:scalability:warm-start-neutrality", environment = "remark", statement = "Permit initialization from old solutions without making history a standing input.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:checking-a-claim", environment = "subsection", statement = "Track checking a claim as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:fixed-point-check-cost", environment = "proposition", statement = "Check a claimed equilibrium using a fresh map residual and certificate bound. A fresh map pass, residual reduction and threshold enclosure checks do not reproduce iteration history or include controller inversion and delivered-wall arithmetic.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "rem:scalability:certification-is-one-sweep", environment = "remark", statement = "Evaluate the operative width fence in one sweep. A global replacement enclosure must establish soundness, cost and improvement for an adopted stronger charter; it is no obligation of the current gate. Parallel evaluation must reproduce the certificate value and verdict; any elapsed-time benefit is an implementation question. Controller inversion and delivered-wall checks remain separate work.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:boundary-search", environment = "subsection", statement = "Track boundary search as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "rem:scalability:boundary-search-cost", environment = "remark", statement = "Separate discretionary trial-set search from validity of the accepted complete set; trial sets remain local search state, and verdicts of rejected trials form no part of the accepted publication.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:dense-projection", environment = "subsection", statement = "Track dense projection as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "rem:scalability:dense-projection-cost", environment = "remark", statement = "Keep the declared work proportional to sparse support, including dense quadratic inputs.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:approximation-guarantee", environment = "subsection", statement = "Track approximation guarantee as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "def:scalability:approximation", environment = "definition", statement = "Inventory the terminal probabilistic estimator contract.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "thm:scalability:efficient-approximation", environment = "theorem", statement = "Inventory the terminal centrality sampling claim without applying it to standing.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:nash-preservation", environment = "subsection", statement = "Track nash preservation as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "def:scalability:incentive-slack", environment = "definition", statement = "Inventory the terminal strict incentive-slack assumption.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "thm:scalability:nash-preservation", environment = "theorem", statement = "Inventory reward approximation under the stated incentive margin.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:sybil-and-spam-resistance", environment = "subsection", statement = "Track sybil and spam resistance as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "cor:scalability:sybil-resistance", environment = "corollary", statement = "Retain no unsupported standing and rival allocation, not funded-address invariance; common control alone supplies no zero terminal affinity or attribution factor. Under ``thm:epoch:split-observational-equivalence``, a record-based remedy imposes the same change on a legitimate completion with identical public fields, or the same distribution of changes if randomized.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "cor:scalability:spam-resistance", environment = "corollary", statement = "Check priced complete-act standing constraints without importing retired path-selection machinery.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-closed-person-vouch-census", environment = "item", statement = "Limit standing contributions to the closed person-vouch family census.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-complete-act-author-continuity", environment = "item", statement = "Require complete acts and continuous Actor authorship for standing contributions.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-passive-unmatched-leg-exclusion", environment = "item", statement = "Exclude passive interference and unmatched hyper-edge legs from standing contributions.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-conserved-apportionment", environment = "item", statement = "Allocate one rival unit per source across self and recipients, preserving it through hop products and the depth mixture. Additional acts and routes divide that unit rather than add copies, and computed standing remains in its contributing-rate hull.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-safety-wall-clamp", environment = "item", statement = "Apply the safety-wall clamp to limit below-wall dynamic gain without erasing the Actor’s source pair.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-conserved-standing-certificate", environment = "item", statement = "Require the conserved-standing certificate to bound row feedback.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-epoch-write-gates-record-budget", environment = "item", statement = "Apply individual-safety checks to every proposed-set author, epoch admission to the closed set, and the finite epoch record budget.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "itm:scalability:spam-resistance-per-action-debit", environment = "item", statement = "Debit the in-force action price and retain each accepted act’s count increment: residual balance falls while its denominator rises, and merely stopping does not undo the dilution. A below-wall stamp fails individual safety.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "subsec:scalability:verifiability", environment = "subsection", statement = "Track verifiability as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "10 Scalability", label = "prop:scalability:raw-path-verifiability", environment = "proposition", statement = "Reconstruct raw weights and parity from retrieved structural records.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "app:gates", environment = "appendix", statement = "Track gates as a separately addressable appendix.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "rem:gates:split-scope", environment = "remark", statement = "For an unsupported Actor sustaining reduced rate c, each accepted act requires c times numeraire plus the action price in new frame gross amount; wall-neutral sustaining frame gross amount is twice that price. Relational support may help stamps but never reduces the own-balance debit. Additional Registration debit and incremental aggregate frame gross amount are distinct, and cost alone bounds no small standing gain. Use the separate Registration-debit and incremental aggregate frame gross amount denominators of ``prop:epoch:split-registration-cost``.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "subsec:gates:door-and-wall", environment = "subsection", statement = "Track door and wall as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "thm:gates:sustaining", environment = "theorem", statement = "An unendorsed Actor preserving reduced own rate c across an accepted act needs exactly c times the numeraire plus the action price in new frame gross amount. At the safety wall this is twice the price; at the door it is the door rate's frame image plus the debit.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "cor:gates:band-floor", environment = "corollary", statement = "Check that unsupported wall-neutral activity needs twice the action threshold.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "rem:gates:propped", environment = "remark", statement = "Never let relational standing pay another actor's solvency debit.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "subsec:gates:frontier", environment = "subsection", statement = "Track frontier as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "thm:gates:frontier", environment = "theorem", statement = "Check the unsupported long-run sustaining lower bounds under their fixed-floor premises.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "prop:gates:two-phase-transit", environment = "proposition", statement = "For an unendorsed Actor acting without new frame amount, the stated exact action-count formulas give door and safety-wall crossing and band dwell, subject to headroom. Re-entry needs additional amount, not elapsed time. These own-source formulas do not predict a relational stamp without replaying its standing package.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "rem:gates:frontload", environment = "remark", statement = "Front-loading supplied frame amount can delay an unendorsed Actor's door or wall crossing without lowering its long-run own-source sustaining average. Acquisition timing and price lie below Layer 1; relational standing can alter stamps but not the own-balance debit.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "subsec:gates:lever", environment = "subsection", statement = "Track lever as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "cor:gates:standing-transport-no-solvency-discount", environment = "corollary", statement = "Keep every accepted actor's own threshold debit unchanged by transport.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "rem:gates:tilt-is-not-price-discount", environment = "remark", statement = "Lowering responsiveness does not alter the debit, numeraire or policy floor.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "thm:gates:equal-rate-no-internal-lift", environment = "theorem", statement = "When every contributing pair, including the own pair, has one common reduced rate, computed reduced standing equals that rate under every certified allocation. This exact invariance does not extend to heterogeneous funded partitions. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "rem:gates:external", environment = "remark", statement = "Bound relational assistance by contributing source rates rather than a fixed discount.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "subsec:gates:funding", environment = "subsection", statement = "Track funding as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "rem:gates:guild-funding", environment = "remark", statement = "Supplied funding retains its opaque Actor attribution. Additional amount can change residual balance, but standing and terminal effects require their separate response and fixed-context comparisons; funding neither freezes allocation nor chooses an uncertified rung. Funded partitions still pay each Registration debit even when matched histories have zero aggregate frame increment.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "rem:gates:standing-safety-scope", environment = "remark", statement = "Separate own-balance solvency, individual and epoch gates, contraction and movement; conserve transported pairs without transferring ledger assets.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "A Gates", label = "rem:gates:sustaining-denomination", environment = "remark", statement = "Keep the numeraire conversion, literal action debit, policy membrane, safety wall and tilt rung distinct. The sustaining amount is reduced own rate times numeraire plus debit; changing any one dial is not a generic cheaper action.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "app:can", environment = "appendix", statement = "Track can as a separately addressable appendix.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "def:can:mandatory-guild-invariants", environment = "definition", statement = "Inventory mandatory terminal depth decay, strict attenuation and context independence.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "rem:can:standing-allocation-separation", environment = "remark", statement = "Expose raw hyperedge legs separately from the complete-act standing projection.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "rem:can:computed-standing-scope", environment = "remark", statement = "The raw attribution interface uses its declared public inputs and computed standing where specified; it imports neither solver internals nor optional standing copies.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "subsec:can:structure", environment = "subsection", statement = "Track structure as a separately addressable subsection.", kind = "policy", crate = "pn-readouts", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "def:can:compositional-attribution-network", environment = "definition", statement = "Inventory the guild's finite composition DAG and registry.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "def:can:compositional-depth", environment = "definition", statement = "Inventory maximum-child-depth plus one with zero-depth leaves.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "case:can:compositional-depth-leaf", environment = "case", statement = "Branch of ``def:can:compositional-depth``: Assign compositional depth zero to a CAN leaf.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "case:can:compositional-depth-internal", environment = "case", statement = "Branch of ``def:can:compositional-depth``: Assign an internal CAN node one plus the maximum depth of its outgoing dependency children.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "eq:can:compositional-depth", environment = "equation", statement = "Inventory maximum-child-depth plus one with zero-depth leaves.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "def:can:dependency-induction", environment = "definition", statement = "Inventory raw contribution leaves, hyperedge compositions and control/Reputation exclusions.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "itm:can:dependency-induction-actor-edges", environment = "item", statement = "For the canonical CAN mapping, make each non-control Actor-sourced contribution record a leaf valued by its raw slice Frobenius norm. Source class, not authorship, controls this rule: a referenced derived Declaration may be a leaf, subject to CAN insulation, without exposing standing hop matrices or emission fractions.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "itm:can:dependency-induction-hyper-legs", environment = "item", statement = "Map each contributing hyper-edge to a depth-one CAN composition of its two leg leaves with redundancy one, irrespective of leg source class. A coincident Participant terminal self-loop remains a guild leaf although raw traversal prunes it; this two-leaf reading does not replace complete-act standing.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "itm:can:dependency-induction-passive-exclusion", environment = "item", statement = "Exclude standalone passive-sourced edges that are not designated hyper-edge legs from CAN, including Reputation; check source class and the composition-graph designation.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "itm:can:dependency-induction-control-exclusion", environment = "item", statement = "Exclude Withdraw, Rescind, Leave and De-invite control edges from CAN regardless of source class or hyper-edge membership; this exclusion overrides the leg-composition rule. Do not assign contribution value to cancellation or expulsion.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "subsec:can:base-values-and-transmission", environment = "subsection", statement = "Track base values and transmission as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "def:can:base-value", environment = "definition", statement = "Inventory the terminal default Frobenius leaf value without time or entropy.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
