  { chapter = "Appendix I — Deployment", label = "case:deployment:concealment-entropy-unassigned-custody", environment = "case", statement = "Track concealment entropy unassigned custody as a separately addressable case.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "subsec:deployment:conserved-standing-reproducibility", environment = "subsection", statement = "Verify marker policy, lineage, accepted-set bounds and distinct destructions before rebuilding the ledger, compiler inputs, rung attempts, certificates, standing and gates.", kind = "invariant check", crate = "pn-replay", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
