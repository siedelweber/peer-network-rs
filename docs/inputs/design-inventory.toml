  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-bound", environment = "item", statement = "Keep the raw damped Reputation weight strictly below one for every nonnegative standing and permitted maturity.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-concavity", environment = "item", statement = "At fixed raw maturity, require the damped Reputation weight to be strictly concave in positive standing.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-parity", environment = "item", statement = "Require positive Declaration and Reputation determinant parity at every positive standing.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-synchronization", environment = "item", statement = "At every epoch boundary, derive Declaration and Reputation with identical stored tensors, determinant scores and damped-weight formulas.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-can-independence", environment = "item", statement = "Treat normalized CAN as independent of an Actor’s standing only when its Declaration is outside its own composition dependency closure; Reputation contributes nothing to CAN.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-feed-hierarchy", environment = "item", statement = "Bound a raw profile-bridged feed path by the squared Opinion ceiling times the Reputation ceiling; this ceiling is at most half the direct Opinion ceiling.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "itm:nodes:raw-self-edge-properties-temporal-ceiling", environment = "item", statement = "At frozen raw sentiment, use the maturity-channel supremum equal to the determinant score times the square root of two, strictly below one. This is a raw feed bound only.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:archetype-fingerprints", environment = "subsection", statement = "Track archetype fingerprints as a separately addressable subsection.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "tbl:nodes:archetype-fingerprints", environment = "table", statement = "Use the census for family masks, tier, promotion, CAN inclusion and raw parity forcing.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:edge-census-normative", environment = "remark", statement = "Prefer the relevant normative census table over conflicting family prose.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "tbl:nodes:act-payload-schema", environment = "table", statement = "Keep role-addressed payload fields inside one author-controlled act payload and treat rendering semantics as terminal.", kind = "serialization", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties", environment = "proposition", statement = "Check the stated slice norm, rank, monotonicity, floor and moderate-parameter tier claims.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:floor", environment = "proposition clause", statement = "Maintain the baseline norm floor.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:upper", environment = "proposition clause", statement = "Maintain the slice norm ceiling of three.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:rank2", environment = "proposition clause", statement = "Check mask-specific near-rank-two bounds.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:monotone", environment = "proposition clause", statement = "Check active entry magnitudes are nondecreasing in absolute semantic coordinates.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:pol-floor", environment = "proposition clause", statement = "Keep the polarization entry at least one half.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "prop:nodes:structural-edge-properties:tier-gap", environment = "proposition clause", statement = "Treat the tier-ratio claim as limited to its stated moderate-parameter domain.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "sec:epoch", environment = "section", statement = "Track epoch as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:thermodynamic-boundary", environment = "subsection", statement = "Track thermodynamic boundary as a separately addressable subsection.", kind = "none", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "ax:epoch:thermodynamic-boundary", environment = "axiom", statement = "Apply entropy damping once per raw edge or creator, not to projected standing.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:damped-edge-weight", environment = "subsection", statement = "Track damped edge weight as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:damped-edge-weight", environment = "definition", statement = "Compute the maturity, determinant and entropy weighted raw edge magnitude.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:damped-edge-weight", environment = "equation", statement = "Compute the maturity, determinant and entropy weighted raw edge magnitude.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:shared-raw-edge-primitive", environment = "remark", statement = "Share raw weighting between feed and signed traversal.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds", environment = "proposition", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds:positive", environment = "proposition clause", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds:upper", environment = "proposition clause", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds:floor", environment = "proposition clause", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:damped-weight-bounds:non-monotone", environment = "proposition clause", statement = "Check positivity, ceiling, floor and nonmonotonic maturity claims under their premises.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:maturity-crossover", environment = "definition", statement = "Locate the derivative sign crossover of the raw maturity weight.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:crossover-location", environment = "proposition", statement = "Bound the crossover at the declared entropy and maturity values.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:commitment-rate", environment = "subsection", statement = "Track commitment rate as a separately addressable subsection.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:final-state", environment = "subsection", statement = "Track final state as a separately addressable subsection.", kind = "none", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:proposed-final-act-state", environment = "definition", statement = "Complete proposed counts and vintage debits using the common recognized marker snapshot and increment, including newly accepted older burns even when no act is authored.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:final-residual-balance", environment = "equation", statement = "Subtract accepted-act debits from prior balance plus settled new burn.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:final-action-count", environment = "equation", statement = "Add the number of accepted authored acts once, not projection legs.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:standing-quantization", environment = "subsection", statement = "Track standing quantization as a separately addressable subsection.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:standing-quantization", environment = "postulate", statement = "Publish one current equilibrium at each epoch boundary.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:causality-without-intra-epoch-standing", environment = "remark", statement = "Use causal order for formation without assigning prefix standing.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:standing-principles", environment = "subsection", statement = "Track standing principles as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:standing-is-measurement", environment = "postulate", statement = "Compute standing as a comparison of transported pairs without changing any ledger balance or count; snapshot and compare the ledger across the solve. Standing can nevertheless move or concentrate across alternative complete histories.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:standing-pair-mass-conservation", environment = "postulate", statement = "Conserve full balance and count totals through row-stochastic allocation; this is rival allocation, not invariance of individual standings, participant maxima or unweighted sums.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "thm:epoch:standing-pair-mass-conservation", environment = "theorem", statement = "Conserve full balance and count totals through row-stochastic allocation; this is rival allocation, not invariance of individual standings, participant maxima or unweighted sums.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:standing-epoch-set-determinism", environment = "postulate", statement = "Make standing depend on final membership and title results rather than incidental ordering.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:tentative-title-fold", environment = "definition", statement = "Resolve the proposed final title state before compiling settlement recipients.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:settlement-standing-title-coupling", environment = "postulate", statement = "Require recognized, unchallenged title transfer and positive folded coordinates for counterparty allocation; canceled, consumed, unauthorized or losing acts resolve to self. A later resale does not revoke a correctly settled earlier transfer. Every accepted act still pays and counts within one source unit; neither inter-family fairness nor a universal standing-response sign follows.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:standing-memorylessness", environment = "postulate", statement = "Recompute from current sources without previous-standing inertia.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:universal-act-weighing", environment = "postulate", statement = "Weigh every accepted act once, including control and artifact acts.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:domain-weighted-act-sum", environment = "postulate", statement = "Sum per-domain contributions without averaging away act multiplicity.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:hop-faded-responsive-tilt", environment = "postulate", statement = "Use the published nonincreasing hop profile for recipient responsiveness.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:cluster-rate-invariance", environment = "postulate", statement = "Preserve the closed transported-count-weighted mean under internal pair allocation; neither an open fibre mean nor individual coordinates or maxima are thereby fixed.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:standing-allocation-inputs", environment = "subsection", statement = "Track standing allocation inputs as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:standing-fold-cell", environment = "definition", statement = "Assign accepted acts to the declared complete-act fold cells.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:effective-act-contribution", environment = "definition", statement = "Take the geometric mean of mandatory coordinate magnitudes after folding.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:hostility-is-priced", environment = "remark", statement = "Debit zero or hostile contributions even when they allocate no outward mass.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:standing-recipient-resolution", environment = "definition", statement = "Resolve eligible positive person-directed acts to their recipient and all others to self.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:allocation-index-set", environment = "remark", statement = "Retain anchored actors as the standing matrix indices.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:allocation-index-set-unanchored-recipient", environment = "case", statement = "Track allocation index set unanchored recipient as a separately addressable case.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "tbl:epoch:standing-recipient-resolution", environment = "table", statement = "Resolve eligible positive person-directed acts to their recipient and all others to self.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:standing-domain-profile", environment = "definition", statement = "Assign the declared domain profile to each complete act.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "tbl:epoch:standing-domain-weights", environment = "table", statement = "Use published domain weights and self-retention base.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:self-retention-base", environment = "definition", statement = "Give every source a strictly positive diagonal base.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:domain-weighted-base-allocation", environment = "definition", statement = "Sum weighted cell coefficients by resolved recipient plus self base.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:domain-weighted-base-allocation", environment = "equation", statement = "Sum weighted cell coefficients by resolved recipient plus self base.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:artifact-activity-crowds-out-export", environment = "remark", statement = "Account for self-retention from artifact and control acts; an added act changes debit, count and allocation, so use the complete forcing and both source-rate hulls rather than infer a standing direction.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:conserved-standing-transport", environment = "subsection", statement = "Track conserved standing transport as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:standing-tilt-profile", environment = "definition", statement = "Multiply the published hop shape by the selected nonnegative rung.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:hop-allocation-score", environment = "definition", statement = "Tilt base scores by clamped recipient activation.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:hop-allocation-score", environment = "equation", statement = "Tilt base scores by clamped recipient activation.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:hop-allocation-matrix", environment = "equation", statement = "Normalize each hop score row to unit mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:hop-allocation-matrix", environment = "definition", statement = "Normalize each hop score row to unit mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:mass-owner-relative-hop-order", environment = "remark", statement = "Count hops from the transported source, not backwards from the reader.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:relative-allocation-odds", environment = "proposition", statement = "Check tilted relative odds against the base ratio.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:relative-allocation-odds", environment = "equation", statement = "Check tilted relative odds against the base ratio.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:rival-allocation-response", environment = "proposition", statement = "Check recipient gain and sibling loss derivatives including the safety-wall kink.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:rival-allocation-response", environment = "equation", statement = "Check recipient gain and sibling loss derivatives including the safety-wall kink.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "itm:epoch:rival-allocation-response-rivalry", environment = "item", statement = "Check that allocation derivatives sum to zero in each row: a recipient’s gain is exactly balanced by sibling and self-share losses, with self loss arising from the common denominator.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "itm:epoch:rival-allocation-response-wall-flatness", environment = "item", statement = "Below the safety wall, require zero allocation derivative with respect to that recipient’s standing at every hop; the recipient remains level-discounted rather than dynamically responsive.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "itm:epoch:rival-allocation-response-row-independence", environment = "item", statement = "Keep an allocation row independent of its own Actor’s standing because its self score is unmodulated. Retain indirect diagonal Jacobian terms through other Actors’ rows in the certificate.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:standing-support-preservation", environment = "proposition", statement = "Keep transport support fixed when ledger and compiled base are fixed.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:standing-depth-mass", environment = "definition", statement = "Use nonnegative depth masses summing to one with a positive deepest mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:source-emission", environment = "definition", statement = "Cap source emission at its own balance divided by threshold times history count.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:source-emission", environment = "equation", statement = "Set source emission to the minimum of one and residual balance divided by the writing-epoch price times history count. Read the completed ledger and retain the unexported share at self, outside the hop mixture. A fixed-pair partition cannot enlarge its aggregate capacity ceiling, although actual export can move either way.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:source-emission-rationale", environment = "remark", statement = "Apply the fixed source-emission diagonal outside transport, preserving pair mass. Publish fading and sag experience; a time-decay sink or relocated mass requires a charter amendment and a new cluster-identity argument. Partition capacity is bounded without fixing actual export or standing.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:finite-depth-conserved-transport", environment = "definition", statement = "Mix ordered hop-matrix products and add nonemitted mass to the diagonal.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:finite-depth-conserved-transport", environment = "equation", statement = "Mix ordered hop-matrix products and add nonemitted mass to the diagonal.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:transport-is-not-ledger-transfer", environment = "remark", statement = "Transport full pairs for comparison without moving balances, reassigning counts or mutating the ledger. Recorded-source provenance does not imply standing invariance across alternative funded histories.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:emission-self-inertia", environment = "remark", statement = "Retain the unexported share at the source once outside the depth mixture. The self share is at least its full-pair value. Burn raises own source rate and emission until saturation, not necessarily final standing; rehabilitation requires the stated response tests or a certified finite comparison.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cor:epoch:conserving-emission", environment = "corollary", statement = "Preserve row stochasticity after source emission.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "thm:epoch:emission-export-bound", environment = "theorem", statement = "Bound exported balance and count by the source emission budget.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:emission-export-bound", environment = "equation", statement = "Bound each source’s exported count by the minimum of its count and residual balance over the writing-epoch price; summing gives the cohort balance-over-price ceiling, and zero balance exports none. A fixed-pair partition cannot enlarge the aggregate ceiling, while actual export and standing can change; no universal small displacement follows.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:emission-wall-symmetry", environment = "remark", statement = "Distinguish own-source emission from relational safety; publish conditional controller-response evidence without deriving an inter-epoch tracking theorem from an in-epoch certificate.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:artifact-non-allocation", environment = "proposition", statement = "Check passive-projection invariance only with compiled act inputs held fixed; scope is questioned.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:conserved-standing-map", environment = "definition", statement = "Compute the pair-weighted reduced standing map for positive-count sources.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:conserved-standing-map", environment = "equation", statement = "Compute the pair-weighted reduced standing map for positive-count sources.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:conserved-standing-equilibrium", environment = "definition", statement = "Solve the current standing map fixed point on its hull.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:conserved-standing-equilibrium", environment = "equation", statement = "Solve the current standing map fixed point on its hull.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:tilt-backoff-grid", environment = "definition", statement = "Try the published finite decreasing rung grid ending at zero.", kind = "certificate", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:tilt-backoff-is-not-export-backoff", environment = "remark", statement = "Change responsiveness without deleting compiled support or source emission.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:certificate-failure-versus-indecisive-enclosure", environment = "remark", statement = "Record mathematical failure separately from an enclosure that cannot decide.", kind = "certificate", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:act-folding", environment = "subsection", statement = "Track act folding as a separately addressable subsection.", kind = "certificate", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:net-stance", environment = "definition", statement = "Sum then clip complete-act signed coordinates by author and full incidence.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:compiled-acts-fold-into-cells", environment = "remark", statement = "Use the mandatory-coordinate family table and exclude self-resolvers from outward folding.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:act-folding-properties", environment = "proposition", statement = "Check complete-act, author, coordinate and multiplicity folding laws.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:folding-precedes-allocation", environment = "remark", statement = "Resolve folds before applying the allocation matrix.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:control-acts-resolve-to-self", environment = "remark", statement = "Keep controls priced and self-retained without outward person allocations.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:net-stance-properties", environment = "proposition", statement = "Check canonical cancellation and bounded folded coordinates.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:conviction-inertia", environment = "remark", statement = "Keep priced prior contributions in the declared stance fold.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:conviction-inertia-latest-edge", environment = "case", statement = "Track conviction inertia latest edge as a separately addressable case.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:severance-blindness", environment = "remark", statement = "Do not infer unseen revocations or consent from missing records.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:inviter-revocation", environment = "definition", statement = "Use the latest epoch for inviter-specific revocation with revoke winning ties.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:vouch-activation", environment = "subsection", statement = "Track vouch activation as a separately addressable subsection.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:responsive-vouch-activation", environment = "definition", statement = "Evaluate the normalized sigmoid and hyperbolic-tangent activation from reduced standing.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:responsive-vouch-activation", environment = "equation", statement = "Evaluate the normalized sigmoid and hyperbolic-tangent activation from reduced standing.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:safety-wall-clamped-activation", environment = "definition", statement = "Clamp activation input at the safety floor without manufacturing source mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:safety-wall-clamped-activation", environment = "equation", statement = "Clamp activation input at the safety floor without manufacturing source mass.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:raw-signed-service", environment = "subsection", statement = "Track raw signed service as a separately addressable subsection.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:path-sign", environment = "equation", statement = "Multiply raw edge parity along the traversed path.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:parity-not-balance", environment = "remark", statement = "Keep raw sign semantics separate from standing balance allocation.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:double-cover-bfs-state", environment = "definition", statement = "Maintain separate positive and negative magnitude registers.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "alg:epoch:exact-signed-raw-traversal", environment = "algorithm", statement = "Run the exact bounded-depth two-parity raw traversal.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "lem:epoch:double-cover-bfs-correctness", environment = "lemma", statement = "Check signed traversal against its path claim; simple-path versus walk semantics remain open.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:bfs-reduction-to-feed-ranking", environment = "proposition", statement = "Recover the unsigned feed result when all traversed parities are positive.", kind = "invariant check", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "tbl:epoch:overhead-comparison", environment = "table", statement = "Record the stated two-register versus one-register raw traversal costs.", kind = "function", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:final-standing", environment = "subsection", statement = "Track final standing as a separately addressable subsection.", kind = "invariant check", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:final-standing", environment = "definition", statement = "Compute final reduced standing and multiply by the numeraire for full standing.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:final-standing", environment = "equation", statement = "Compute final reduced standing and multiply by the numeraire for full standing.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:final-standing-mediant", environment = "equation", statement = "Compute standing from transported full balance/count pairs rather than averaging source rates.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:full-pair-source-transport", environment = "remark", statement = "Transport full source pairs after graduated row emission. Zero-balance sources retain identity rows; partial export obeys the balance-over-price count ceiling. Dilution remains priced and hull-bounded; a hard cutoff is a charter change, and the cap promises no small response or fading prevalence. A fixed-pair partition cannot enlarge the aggregate capacity ceiling, although actual export and target standing may change.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:final-standing-hull", environment = "proposition", statement = "Enclose each coordinate in its contributing source-rate hull; funded support concentration can approach a whole hull width, so the hull is not a small strategic-gain guarantee.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:equal-rate-standing-invariance", environment = "proposition", statement = "Equal contributing rates give that exact standing; heterogeneous partitions do not inherit this invariant.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:no-tilt-anchor", environment = "proposition", statement = "Evaluate the zero-tilt state without a nonlinear fixed-point iteration.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "thm:epoch:closed-cluster-rate-identity", environment = "theorem", statement = "Check the conserved pooled-rate identity for a closed cluster.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:closed-cluster-rate-identity", environment = "equation", statement = "Check the conserved pooled-rate identity for a closed cluster.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:closed-cluster-mean", environment = "equation", statement = "For a two-sided closed cluster, the transported-count-weighted mean standing equals total residual balance divided by total action count. Fixed-count burn raises its reduced mean by the burn increment divided by numeraire times total count; an additional act changes both debit and count. This gives no individual, unweighted-mean or reward direction.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cor:epoch:conserving-source-root-criterion", environment = "corollary", statement = "Check cluster support closure for the pooled-rate identity.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cor:epoch:cluster-rate-leakage", environment = "corollary", statement = "Bound departure from the closed-cluster identity under the stated leakage premise. The error scales with boundary-flow weight times rate width; this weighted-mean estimate determines no individual burn-response sign.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:actor-partition-comparison", environment = "definition", statement = "Declare matched complete histories, participant fibre, pair partition, fixed wall/numeraire/policy and recipient/title premises; each history selects its greatest passing rung. This is an explicit counterfactual, not reassignment or inferred common ownership.", kind = "type", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:split-pair-displacement", environment = "proposition", statement = "Check centred pair displacement over the new positive denominator and its common-source rate-width times total-variation bound; changed counts alone do not determine movement or settle sharp strategic limits.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:split-exact-invariants", environment = "proposition", statement = "Preserve transported pair totals, the closed transported-count-weighted mean and equal-rate coordinates under the stated partitions; individual coordinates, unweighted sums and maxima need not agree.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:split-fibre-capacity", environment = "proposition", statement = "Bound actual external export by the summed member capacities, no larger than the old capacity. Proportional partition preserves the ceiling, not actual export.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:split-self-path-export", environment = "proposition", statement = "Refine fibre export using certified positive diagonal stay-path probabilities over published depth masses; attainment in the absorbing anchor fixture is not global optimality.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:split-concentration", environment = "proposition", statement = "Bound participant maximum gain by member displacement and a common hull width; with unchanged incoming support and absorbing equal-rate members, check the exact concentration formula and its conditional continuous envelope.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:split-registration-cost", environment = "proposition", statement = "Count the additional Registration debit at its writing price; this is not incremental aggregate burn between matched histories, which may be zero.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:split-centered-invariance", environment = "proposition", statement = "Check all centred residuals at the lifted coarse solution within the refined hull; simultaneous vanishing characterizes invariance at that state, not a structural classification before solving.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:split-admission-clearance", environment = "proposition", statement = "Use matched-author standing bounds and their act-weighted mean to preserve predicates only when clearance exceeds them; separately check formation, solvency and capacity. Existing fixtures demonstrate no verdict flip.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:final-standing-response", environment = "proposition", statement = "With source rates and other transported coefficients fixed, increasing a source’s contribution lifts or dilutes the target according as its rate exceeds or falls below the target’s standing. A complete act or burn changes further inputs and needs the full finite-response comparison.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:final-standing-embedding", environment = "proposition", statement = "Embed disconnected subsystems without changing their standing.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:author-directed-allocation", environment = "remark", statement = "Allocate only through the author whose act expresses regard. A relay apportions the original source’s unit, never its own; no passive artifact supplies authority or target veto. Frozen-flow source-rate comparisons give no universal sign for the completed act.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:dilution-cost", environment = "proposition", statement = "Charge each dilution act the in-force price: n such acts cost n times that price, and total grip is bounded by spent balance divided by price. Row conservation prevents cross-target copying. Funded partition and coupled burn or act responses remain subject to capacity, shock and hull bounds, not immunity or a universal sign.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:griefing-resistance", environment = "remark", statement = "Bound griefing by author-only rows, priced and count-diluting acts, one rival unit per source, and the depleted-source export ceiling. Low-rate support may still dilute without a target veto; even an unreached sibling can decrease through rival feedback, within the stated response bounds.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:rate-parking", environment = "remark", statement = "Do not infer a universal rate-parking prohibition beyond the declared premises.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:no-tilt-commitment-monotonicity", environment = "proposition", statement = "At zero tilt with counts, base, threshold and emission fixed, reached coordinates increase under burn and unreached coordinates stay fixed. Changing emission invalidates this premise; positive-tilt reversals are certified.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "thm:epoch:burn-response", environment = "theorem", statement = "Universal burn monotonicity is false: certified saturated positive-rung burns can lower own, reached or unreached sibling standing; depleted-source emission can lower a recipient at the anchor. Rung switches can decrease standing and accepted acts have no universal direction.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:burn-response-bound", environment = "proposition", statement = "At a smooth saturated fixed passing rung, feedback offsets at most two thirds of the largest direct burn forcing, not necessarily of the burner own forcing; preserve the fixed counts, base, wall and numeraire premises.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cor:epoch:burn-monotone-regimes", environment = "corollary", statement = "Establish positive response only by the stated direct-forcing versus feedback tests, fixed-emission anchor or sole-source premises. Small-rung thresholds depend on the ledger; finite paths require the premises throughout.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:finite-standing-response", environment = "proposition", statement = "Bound two certified completed states on the same Actor set by their full forcing and both hulls; recompute emission, folds and rung for changed acts or burns instead of assuming a direction.", kind = "invariant check", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:within-epoch-standing-solver", environment = "subsection", statement = "Track within epoch standing solver as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:epoch-boundary", environment = "subsection", statement = "Track epoch boundary as a separately addressable subsection.", kind = "none", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:log-position", environment = "definition", statement = "Use identity-order rank only as an audit coordinate, never for boundary scoring.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:epoch-act-budget", environment = "definition", statement = "Count each complete authored act once toward the epoch target.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:final-act-sequence-closure", environment = "postulate", statement = "Close at the declared duration and capacity conditions and certify the complete dependent-set union.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "itm:epoch:final-act-sequence-closure-formation", environment = "item", statement = "Require the final act union to be formation-valid and each member’s author to pass own-balance solvency and individual safety on that completed state.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "itm:epoch:final-act-sequence-closure-safety", environment = "item", statement = "Require every final-set member’s action stamp to be at least the safety wall.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "itm:epoch:final-act-sequence-closure-policy", environment = "item", statement = "Compute the epoch stamp once over the complete final act union and require it to meet the effective policy floor.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:final-edge-set", environment = "postulate", statement = "Publish the monotone epoch edge set, causally closed under the dependent-set closure. Bind the common recognized final marker, fixed policy identity and edition, lineage, interpretation, complete accepted sets and evidence to the accepted acts, prior state and writing-epoch debit vintage. The marker policy selects lists or uniquely verifiable public openings, with complete accepted-set recovery and verification against the policy and both acceptance bounds.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:shared-burn-snapshot-rationale", environment = "remark", statement = "A common accepted snapshot prevents closure components from using inconsistent burn observations; older lineage may first contribute at the accepting marker, without a promise of compulsory or timed acceptance or eventual progress. Consistency does not exclude economic timing effects from boundary timing or acceptance selection.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:raw-self-edge-reading", environment = "definition", statement = "Derive current Self bonds and tenure from final standing without appending records.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:raw-self-edge-reading", environment = "equation", statement = "Derive current Self bonds and tenure from final standing without appending records.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "alg:epoch:conserved-standing-computation", environment = "algorithm", statement = "Validate, debit, compile, certify, solve, stamp and gate the complete proposed set.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "alg:epoch:tilt-backoff", environment = "algorithm", statement = "Attempt each rung independently and publish all higher-rung verdicts.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:epoch-replay-determinism", environment = "proposition", statement = "Reproduce the derivation from the shared verified marker package, accepted acts, prior state, writing-epoch debit, constants, compiler edition and certificate procedure.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:act-debit", environment = "subsection", statement = "Track act debit as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:act-debit", environment = "postulate", statement = "Debit only the writing-epoch threshold once per accepted authored act.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:translation-law", environment = "proposition", statement = "Check exact translation at fixed weights and uniform debit history, not arbitrary fixed points.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:dense-cluster-fairness", environment = "remark", statement = "As incoming transported action mass dominates own retained mass, standing approaches the contributing support’s weighted rate; density or headcount alone does not establish that limit. The closed weighted mean does not fix individual coordinates or participant maxima under funded partition.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:two-action-counts", environment = "remark", statement = "Separate live solvency inputs from boundary pairs used by standing.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:participation-gates", environment = "subsection", statement = "Track participation gates as a separately addressable subsection.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:final-act-sequence-write-rule", environment = "postulate", statement = "Require own solvency, each final safety stamp and the action-weighted door.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:write-own-balance-solvency", environment = "condition", statement = "Require each authored act to pay its debit from its own settled balance.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:write-individual-safety", environment = "condition", statement = "Check every author against the wall on the proposed final-set equilibrium.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:write-epoch-admission", environment = "condition", statement = "Check the act-weighted epoch stamp against the effective floor and enforce capacity, with the empty-epoch case explicit.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:relational-gate-vs-own-export", environment = "remark", statement = "Keep solvency, own-history emission and relational safety as separate predicates.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:admission-statistics-quarantine", environment = "remark", statement = "Exclude demand-sensitive regime and headroom from unit-side formulas.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:consent-exposure", environment = "remark", statement = "Written-side boundary accountability cannot reveal suppressed candidates; selection and timely inclusion remain boundary-mechanism obligations.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "tbl:epoch:actor-states", environment = "table", statement = "Distinguish active, band, insolvent and frozen participation states.", kind = "function", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:band-dwell", environment = "remark", statement = "Reproduce the stated unsupported no-burn wall and door benchmarks.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:non-written-dynamic-live", environment = "remark", statement = "Retain nonwritten actors in current dynamics unless the safety clamp applies.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:registration-final-set-admission", environment = "remark", statement = "Apply ordinary one-act debit, count, standing and gate rules to Registration.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cor:epoch:same-epoch-source-hull", environment = "corollary", statement = "A same-epoch cohort whose contributing source rates all lie below the wall cannot vouch itself above it; a closed zero-rate cohort stays at zero without external positive-rate source. The source hull creates no source and supplies no general heterogeneous funded-partition invariance.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cor:epoch:universal-burn-benchmarks", environment = "corollary", statement = "Compute the ``cond:epoch:write-own-balance-solvency``, safety and door burn benchmarks without promising admission.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "subsec:epoch:floor-governance", environment = "subsection", statement = "Track floor governance as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:safety-threshold", environment = "definition", statement = "The reduced wall is primary and the charged price is its numeraire image; certify that charge on its own epoch width, while deployment wall-calibration and controller-performance evidence remain separate duties.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-derivability", environment = "condition", statement = "Derive the next wall from the completed certificate and published constants, then publish its price image.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-in-epoch-certification", environment = "condition", statement = "Certify the greatest procedure-proved rung on the epoch own width; keep failed and indecisive higher attempts distinct.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-wall-step-bound", environment = "condition", statement = "Bound a wall change by the lesser of the positive absolute cap and the relative cap times the previous wall.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-wall-hysteresis", environment = "condition", statement = "Apply a symmetric relative deadband to the floored proposal before the step cap, with no hidden latch.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-publication-lead", environment = "condition", statement = "Publish the next wall and price one boundary ahead without repricing a consummated debit.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-controller-publication", environment = "condition", statement = "Disclose the wall, controller edition and constants, proposal, delivered wall and price beside the rung and width.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-numeraire-covariance", environment = "condition", statement = "Keep the controller blind to the numeraire and preserve reduced inputs under recoinage; distinguish other structural changes.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-declared-floor", environment = "condition", statement = "Certify the actual wall at or above the deployment fixed exact floor, including zero width and an empty domain.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cond:epoch:safety-input-quarantine", environment = "condition", statement = "Read only previous wall, completed width, accepted rung and constants; exclude admission demand and private history.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:policy-floor", environment = "definition", statement = "Announce the host floor one boundary ahead and reject values below the led safety floor.", kind = "function", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:floor-validity", environment = "equation", statement = "Check the policy floor against the dimensionless safety floor.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:participation-floor", environment = "definition", statement = "Take the maximum of policy and safety floors as fault totalization.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:effective-floor", environment = "equation", statement = "Compute the derived maximum floor without treating it as a new dial.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:safety-wall", environment = "definition", statement = "Publish the reduced wall with one-boundary lead and derive its price by multiplication by the numeraire.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:safety-wall-floor", environment = "definition", statement = "Declare once beside the numeraire either the exact clean-elasticity ridge image or the rational three thirty-sevenths; compare the actual reduced wall against that fixed structural floor.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:safety-wall-floor-ridge-floor", environment = "case", statement = "Track safety wall floor ridge floor as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:safety-wall-floor-rational-floor", environment = "case", statement = "Track safety wall floor rational floor as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "cor:epoch:floor-economics", environment = "corollary", statement = "Track floor economics as a separately addressable corollary.", kind = "none", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:floor-is-a-landmark", environment = "remark", statement = "Treat the floor as a structural leverage landmark, not economic suitability; publish both-floor comparisons and declared economic and work criteria.", kind = "none", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:wall-controller", environment = "definition", statement = "Publish a numeraire-blind memory-one controller of previous wall, completed width and accepted rung; exclude demand, hidden state and width forecasts.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:canonical-interim-wall-controller", environment = "definition", statement = "Compute a floored full-strength target, apply the relative deadband, then cap the signed step by absolute and relative bounds; zero width uses the floor target.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:canonical-interim-wall-controller-zero-width", environment = "case", statement = "Track canonical interim wall controller zero width as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:canonical-interim-wall-controller-positive-width", environment = "case", statement = "Track canonical interim wall controller positive width as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:canonical-interim-wall-controller-deadband-hold", environment = "case", statement = "Track canonical interim wall controller deadband hold as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:canonical-interim-wall-controller-deadband-move", environment = "case", statement = "Track canonical interim wall controller deadband move as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:safety-independent-of-controller", environment = "proposition", statement = "Under the conserved-map ledger, support and invariant-box hypotheses, every finite wall at or above its structural floor has a greatest proved passing rung on the completed epoch’s own width, with a unique fixed point and geometric convergence from its box. This does not require a correct controller forecast or attainment of the chartered rung, and does not discharge the separate write and policy tests.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:safety-independent-of-controller-nonempty-domain", environment = "case", statement = "Track safety independent of controller nonempty domain as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:safety-independent-of-controller-empty-domain", environment = "case", statement = "Track safety independent of controller empty domain as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:wall-controller-total", environment = "proposition", statement = "Define empty-domain width as zero and otherwise use the maximum contributing source-rate range. On every finite declared input triple, the canonical interim controller must return a finite proposal and delivered wall at or above the floor, obeying the step bound. Zero width proposes the floor, and a wall already there stays there.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:wall-controller-covariance", environment = "proposition", statement = "Under recoinage, co-scale burn values and numeraire while retaining reduced constants and counts: reduced rates, standing, width and wall stay unchanged, the next price co-scales, and old debits change representation only. A fixed-ledger numeraire migration instead evaluates the controller on its published transformed inputs; same-pair width scales inversely, compensation preserves the door product, and floor and policy tests still apply. No controller homogeneity or solvency and individual-safety invariance is promised for that migration.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:wall-controller-covariance-recoinage", environment = "case", statement = "Track wall controller covariance recoinage as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:wall-controller-covariance-fixed-ledger-migration", environment = "case", statement = "Track wall controller covariance fixed ledger migration as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:wall-controller-covariance-compensated", environment = "case", statement = "Track wall controller covariance compensated as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "case:epoch:wall-controller-covariance-uncompensated", environment = "case", statement = "Track wall controller covariance uncompensated as a separately addressable case.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "def:epoch:final-act-stamps", environment = "definition", statement = "Give every same-author act the final standing stamp and aggregate once per act.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:final-action-stamp", environment = "equation", statement = "Assign the author's reduced equilibrium to each complete act.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:final-epoch-stamp", environment = "equation", statement = "Average final stamps by accepted authored-act count.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "eq:epoch:final-epoch-headroom", environment = "equation", statement = "Sum action-weighted excess over the effective floor. Headroom is a measurement, not a floor or debit. Matched partitions preserve gates only with sufficient clearance and separately valid admission premises; the fixtures show no admission flip.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "post:epoch:reduction-convention", environment = "postulate", statement = "Reduce dynamics by the numeraire and keep door and wall read-sites distinct.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "prop:epoch:compensation", environment = "proposition", statement = "Co-scale numeraire and reduced price inversely to preserve their door-price product; inverse width scaling and fence-certificate degradation both require the declared law of the comparison family. Neither scaling nor degradation follows from the door-product identity.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:capacity-crush", environment = "remark", statement = "Never reprice consummated historical debits.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:two-axes", environment = "remark", statement = "Keep dimensionless policy and burn-denominated safety quantities distinct.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:dial-scope", environment = "remark", statement = "Separate structural numeraire, policy floor and certificate margin from measured headroom.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "6 Epoch", label = "rem:epoch:operator-authority-floor", environment = "remark", statement = "Limit host floor authority to the announced valid policy schedule.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "sec:sorting", environment = "section", statement = "Track sorting as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "subsec:sorting:relevance-score", environment = "subsection", statement = "Track relevance score as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "def:sorting:relevance-score", environment = "definition", statement = "Combine raw max-product relevance, fixed creator standing and terminal content norm.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "eq:sorting:relevance-score", environment = "equation", statement = "Combine raw max-product relevance, fixed creator standing and terminal content norm. Fixed-context scalar monotonicity supplies no general burn-response, partition, ranking or end-to-end reward guarantee.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "rem:sorting:final-standing-input", environment = "remark", statement = "Expose final reduced creator standing without exposing solver intermediates to sorting. With other feed factors fixed, certified scalar changes bound score movement; burn, act and partition interventions require separate field and context comparisons.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "rem:sorting:terminal-routing-asymmetry", environment = "remark", statement = "Use directional coherence for routing and scalar energy at a content terminus.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "prop:sorting:score-positivity", environment = "proposition", statement = "Require a viable positive-weight path for a positive content score.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
