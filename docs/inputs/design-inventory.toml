  { chapter = "F Verification", label = "ver:pathology:clamped-zero-source-branch", environment = "labelled fixture paragraph", statement = "Check the clamped external-source case with a generalized derivative enclosure.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:pathology:zero-rate-cohort", environment = "labelled fixture paragraph", statement = "Check that a closed zero-rate cohort remains at zero absent external positive-rate source. This equal-rate case establishes no invariance for heterogeneous funded partitions. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
