namespace = "org.peer-network.design.inventory"
version = [1, 0, 0]

rows = [
  { chapter = "00 Front matter", label = "abs:abstract", environment = "abs", statement = "Compare clusters by a specified calculation over supplied Actor entries, accepted acts and carried state, with conserved standing and terminal readouts; separate that calculation from source and authority oracles and optional conduct. Funded partitions can change standing without making private purpose a public-record fact.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "00 Front matter", label = "motto:motto", environment = "motto", statement = "Track motto as a separately addressable motto.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "sec:introduction", environment = "section", statement = "Track introduction as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:captured-comparator", environment = "subsection", statement = "Track captured comparator as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:every-platform-compares", environment = "ins", statement = "Interpretation or optional practice, not a closure admission condition: Make the comparator inspectable, reproducible and contestable by those it measures; the objection is private ownership and hidden application of the measure, not comparison itself.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:the-detector", environment = "ins", statement = "Interpretation or optional practice, not a closure admission condition: Bound costless Sybil activity through resource cost rather than treating forgeable humanity proxies as a finished defense; a privileged identity detector both controls admission and extracts identity data.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:the-only-question", environment = "subsection", statement = "Track the only question as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:who-owns-the-frame", environment = "ins", statement = "Interpretation or optional practice, not a closure admission condition: Use an exogenous, neutral and public frame that no participant, including the operator, can own or price to favor its own interest.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:two-precedents", environment = "subsection", statement = "Track two precedents as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:tcp-is-unpriced-neutrality", environment = "ins", statement = "Interpretation or optional practice, not a closure admission condition: The frame source supplies a neutral substrate under common rules, without judging the worth of what it carries; worth is determined above that substrate.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:wikipedia-is-public-auditability", environment = "ins", statement = "Interpretation or optional practice, not a closure admission condition: Make the measurement reproducible and contestable from a public record by the agents it measures, in addition to using a neutral frame.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:dignity", environment = "subsection", statement = "Track dignity as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:neutrality-is-dignity", environment = "insight", statement = "Interpretation or optional practice, not a closure admission condition: Participants must be able to inspect and reproduce the measure of standing.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:price-not-detector", environment = "insight", statement = "Frame solvency and fixed admission floors are not a humanity detector; required Registration debit and incremental funding of a matched history are different quantities and neither establishes authenticity.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:equal-among-peers", environment = "insight", statement = "Interpretation or optional practice, not a closure admission condition: Standing pools transported balances and action counts rather than averaging actor rates. Incoming action mass, not headcount, controls the limit; funded partitions can change retained denominators and individual standings. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:no-escape-velocity", environment = "insight", statement = "Fixed-rung relational support, source emission and frame-response bounds constrain the stated calculation without guaranteeing every participant’s standing or revealing the purpose of an identical public record.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:peer-claim-scope", environment = "insight", statement = "Interpretation or optional practice, not a closure admission condition: Incoming action mass controls peer convergence and an isolated actor retains its own source rate. Preserve the closed transported-count-weighted mean without claiming invariance of individual coordinates or participant maxima under funded partitions. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:only-faithful-coordinate", environment = "insight", statement = "Read the transported-count-weighted ledger ratio rather than a mean of rates or reserve ranking; increasing supplied gross amounts at fixed counts does not determine each standing or funded-partition maximum.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:the-floor-we-name", environment = "insight", statement = "Interpretation or optional practice, not a closure admission condition: Public accountability does not prove the truth of every graph claim.", kind = "none", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:the-cut-no-mechanism-can-make", environment = "insight", statement = "Interpretation or optional practice, not a closure admission condition: Internal graph evidence cannot distinguish funded genuine participants from funded fabrications. Exclude unsupported standing through genuine contributing source and rival allocation. Legitimate separation and strategic concentration can share one public record, so a record-based remedy imposes the same cost on both under ``thm:epoch:split-observational-equivalence``.", kind = "none", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:vouch-not-check", environment = "insight", statement = "Interpretation or optional practice, not a closure admission condition: Record accountable authored vouches without recording or certifying private identity checks.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:right-to-leave", environment = "insight", statement = "Interpretation or optional practice, not a closure admission condition: Payload erasure preserves relied-upon structure; outside knowledge and structural distinctiveness can identify a departed Actor, and no degree of anonymity is promised.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:two-layers-derived", environment = "subsection", statement = "The specified calculation supplies conserved standing for terminal readouts; source and authority oracles are separate from that calculation and neither terminal independence nor replay identifies private purpose.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "tbl:introduction:layer-roles", environment = "table", statement = "Interpretation or optional practice, not a closure admission condition: Separate external frame supply, network binding, and terminal consumer roles.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:the-graph", environment = "subsection", statement = "Track the graph as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:infrastructure", environment = "subsection", statement = "Track infrastructure as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "post:introduction:public-accessibility", environment = "postulate", statement = "Public accessibility is an oracle claim about obtaining records, not an uptime certificate, an access-service duty or a calculation over an unavailable record.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "01 Introduction", label = "post:introduction:record-integrity", environment = "postulate", statement = "Consumed edge records and supplied ledger inputs remain fixed during calculation; residual ledger coordinates are computed from those inputs and writing-epoch debits.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "01 Introduction", label = "post:introduction:irrevocability", environment = "postulate", statement = "Irrevocability is an oracle premise about external record history; closure operates on the fixed supplied data.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "01 Introduction", label = "post:introduction:authoritative-act-order", environment = "postulate", statement = "The supplied finite total act order and remaining epoch inputs determine the calculation; public parents and supplied dependencies have their placement rules, while logical time is an optional reading.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "01 Introduction", label = "post:introduction:epoch-edge-set", environment = "postulate", statement = "Each boundary supplies a finite monotone causally closed edge set.", kind = "invariant check", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "01 Introduction", label = "rem:introduction:mechanism-agnostic", environment = "remark", statement = "Interpretation or optional practice, not a closure admission condition: Any provider mechanism must establish agreement on the ordered acts as well as the edge set.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:comparator-previewed", environment = "subsection", statement = "Derive residual balances and counts from supplied entries and accepted acts, then solve conserved transport under its stated hypotheses; individual frame-response and partition claims retain their own assumptions.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "ins:introduction:comparator-made-human", environment = "ins", statement = "Interpretation or optional practice, not a closure admission condition: Feed and reward are terminal readings of the same standing field; neither may own its frame or redirect another actor source through passive structure. Preserve public, actor-authored relational inputs and reproducibility.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:verification-model", environment = "subsection", statement = "Interpretation or optional practice, not a closure admission condition: Audit and gated phases share public formulas; verify complete ledger and acts, folds, allocation, emission and each attempted rung, then certify residuals. Within-epoch convergence establishes neither inter-epoch tracking nor consent.", kind = "policy", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "01 Introduction", label = "subsec:introduction:reading-guide", environment = "subsection", statement = "Track reading guide as a separately addressable subsection.", kind = "policy", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "sec:comparator", environment = "section", statement = "Track comparator as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "subsec:comparator:the-axis", environment = "subsection", statement = "Track the axis as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "ax:comparator:inter-cluster", environment = "axiom", statement = "A meaningful comparison requires exogenous source rather than topology alone.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:topology-is-gauge", environment = "remark", statement = "Graph geometry alone cannot certify costly source.", kind = "none", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:actor-field-cluster-comparison", environment = "remark", statement = "Publish actor standing without prescribing social cluster partitions or aggregation.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "subsec:comparator:burn-primitive", environment = "subsection", statement = "Source oracle condition, not a closure operand or proof of source truth: Track burn primitive as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:comparator:burn-primitive", environment = "definition", statement = "Source oracle condition, not a closure operand or proof of source truth: The imported primitive must record costly irreversible publicly verifiable destruction.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:comparator:frame-inputs", environment = "definition", statement = "Closure consumes the supplied Actor-entry set, accepted acts, carried state and named free constants; no independent address, capacity, price, source history or source warrantor is an additional calculation operand.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "post:comparator:burn-primitive", environment = "postulate", statement = "State the source oracle’s conditions, including finalization, backing, cost and absence of privileged accrual; they warrant a supplied input and are not additional closure calculations or an operator-bound publication duty.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-exogenous-origin", environment = "condition", statement = "Source oracle condition, not a closure operand or proof of source truth: Import the supplied frame gross amount from outside the graph; no graph-derived rule or network operation may compute or write it.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-neutrality", environment = "condition", statement = "Source oracle condition, not a closure operand or proof of source truth: Treat the primitive as a uniform measurement of destroyed magnitude, not a priced asset, redemption right, entitlement or selection of a winner.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-non-transferability", environment = "condition", statement = "Source oracle condition, not a closure operand or proof of source truth: Keep each recorded destruction amount at its original address, with recoverable attribution and no duplicate contribution; this does not prohibit standing relocation, pooling or concentration through alternative funded histories. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-boundary-amount", environment = "condition", statement = "An identified boundary supplies the frame gross amounts used by that calculation. ``cond:comparator:finalized-burn-amount``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-boundary-fixity", environment = "condition", statement = "The identified completed boundary supplies one fixed frame gross amount to that calculation. ``cond:comparator:burn-finalization-pin``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-pinned-monotonicity", environment = "condition", statement = "Source oracle condition: gross amounts pinned to an associated identity do not decrease along connected histories, because the record is append-only and its contributions are nonnegative.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-conservative-publication", environment = "condition", statement = "Between source finalizations, publish no amount greater than the amount pinned by the next finalization; this is a source-oracle premise.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-revision-floor", environment = "condition", statement = "A source projection can revise an unfinalized amount down to its last finalized pin; the premise concerns source history, not a rewrite of a completed calculation.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-finalization-depth", environment = "condition", statement = "The source realization publishes a finalization depth and the finality assumptions under which a history containing a finalization boundary is not replaced; samples at or below it equal the pinned amount.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-bindability", environment = "condition", statement = "Source oracle condition: associate each attributed frame amount with the opaque Actor identity it denotes. The association asserts neither personhood nor signing-key authority and creates no separate address object in the calculation.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-non-negativity", environment = "condition", statement = "Source oracle condition, not a closure operand or proof of source truth: Require every address’s supplied frame gross amount to lie on the same nonnegative real line.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-provenance-auditability", environment = "condition", statement = "Source oracle condition, not a closure operand or proof of source truth: Anchor each unit of the frame gross amount to genuine irrecoverable destruction and cap each recording event by its backing destruction; an unbacked record contributes zero.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-costly-append-only-record", environment = "condition", statement = "Source oracle condition, not a closure operand or proof of source truth: Price destruction at its occurrence, preserve its record and provide no reverse map to the destroyed resource.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:comparator:bootstrap-capacity", environment = "definition", statement = "Pre-opening capacity describes attainable source amount where a pre-opening interval exists; no bound publication is required and an absent interval creates no capacity to bound. Closure consumes no source ceiling.", kind = "constant", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:burn-unit-cost-projection", environment = "condition", statement = "Project source amount into the declared external denomination at its stated terms; separate recording-event costs remain outside this proportional projection and neither is a closure operand.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:actor-entry-no-privileged-accrual", environment = "condition", statement = "The attributed frame gross amount does not accrue to an actor through a special operating-role privilege that defeats the assumed costliness of obtaining that amount. A source-realization claim relying on costliness includes this absence of privileged accrual as an assumption. ``cond:comparator:burn-no-privileged-accrual``.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "post:comparator:marker-bound-finalization", environment = "postulate", statement = "Recognize independent lineage and accepted claims and their common projection, while the marker binds the accepted epoch root and successor standard; closure evaluates supplied inputs separately.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-lineage-succession", environment = "condition", statement = "Identify the initial marker and its standard and a recognized predecessor-linked succession; source finalization assumptions protect the selected history without imposing whole-set acceptance containment.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-network-acceptance", environment = "condition", statement = "Recognize common claims through the prescribed correspondence and candidate static verdict, without requiring containment of entire accepted sets or predecessor selections.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-causal-dependence", environment = "condition", statement = "Bind the recognized predecessor, accepted epoch root, successor standard and lineage events in the marker’s dependency cone; do not infer accepted-claim containment from that dependence.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "cond:comparator:marker-single-count", environment = "condition", statement = "Count each source event once at its first common projection with matching amount and attribution; accepting an epoch root does not create another source contribution.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "def:comparator:marker-burn-snapshot", environment = "definition", statement = "Sum distinct destruction claims in the common lineage/acceptance projection through the recognized boundary; an older lineage claim can first become common later.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "eq:comparator:marker-burn-snapshot", environment = "equation", statement = "Sum the first common destruction claims by attributed Actor; repeated common claims count once.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "prop:comparator:marker-finalization-consistency", environment = "proposition", statement = "Under the recognition and common-projection premises, the source snapshot is consistent; no mandatory closure halt or accepted-set containment is inferred.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "subsec:comparator:imported-frame", environment = "subsection", statement = "Track imported frame as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "def:comparator:imported-frame", environment = "definition", statement = "Consume one amount family: the supplied nonnegative gross map on opaque Actor identities. Its common ordered codomain is the comparator frame and each Actor's amount is its fibre. Exogeneity, persistence, boundary stability and identity association are supplied frame premises, not an independent address operand.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "eq:comparator:seam", environment = "equation", statement = "Read an Actor’s supplied frame gross amount at that Actor’s identity.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:neutrality-from-silence", environment = "remark", statement = "A supplied Actor entry names an amount without assigning standing or a use. Closure supplies its computational role; external source pricing belongs to the oracle projection and the network computes relative standing.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "def:comparator:frame-binding", environment = "definition", statement = "Associate each supplied frame amount with one opaque Actor identity, without creating a closure address object or signing key. The source retains that attribution and cannot be pooled or reassigned to another Actor. Title follows its separate fold; standing is a computed pair comparison and can concentrate under an alternative funded partition.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:destination-funding-non-transferability", environment = "remark", statement = "Allow destination-funded new accrual without transferring recorded source or identifying its funder; this promises no standing invariance across alternative address portfolios. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:identity-is-layer-2", environment = "remark", statement = "Do not represent the person associated with an actor in Layer 1.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "lem:comparator:frame-stability", environment = "lemma", statement = "Fixed boundary entries, monotone gross history and nonnegative opaque-Actor attribution imply nondecreasing sampled frame gross amounts across connected consumed boundaries.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:auditability", environment = "remark", statement = "Summing recorded amounts does not establish genuine source backing; public provenance replay is a separate oracle over the applicable source history.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "subsec:comparator:the-source", environment = "subsection", statement = "Track the source as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "def:comparator:rate", environment = "definition", statement = "Divide residual balance by the greater of cumulative accepted-act count and one.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "eq:comparator:rate", environment = "equation", statement = "Compute the neutral source from residual balance and guarded count.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "def:comparator:residual-balance", environment = "definition", statement = "Subtract each accepted act's consummated writing-epoch debit from the Actor's imported frame gross amount. Historical debits retain their original prices; read the resulting balance at the current numeraire for solvency and the neutral source.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "eq:comparator:residual-balance", environment = "equation", statement = "Compute residual frame amount as supplied gross amount less all consummated action debits at their writing-epoch prices.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:vintage-trichotomy", environment = "remark", statement = "Preserve recorded parameters and debit vintages while reading carried balances under current constants.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:vintage-recorded-parameters", environment = "remark", statement = "Keep the parameters recorded by each accepted record unchanged.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:vintage-read-time-state", environment = "remark", statement = "Evaluate current carried frame-denominated state, including the frame balance, under the constants in force when it is read.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:vintage-consummated-debits", environment = "remark", statement = "Retain each consummated per-act debit at the price charged by its accepted epoch; never recalculate it.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:type-asymmetry", environment = "remark", statement = "Distinguish continuous frame gross amounts from discrete action counts. Their real-over-integer quotient requires numeraire reduction as the sole dimensional conversion; each write consumes its frame-denominated price.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "def:comparator:numeraire", environment = "definition", statement = "Use a positive frame-unit-per-action-credit numeraire as the sole conversion before a frame-denominated input meets a count. Each boundary consumes its structural value; a deterministic formula over consumed data is a closure calculation, while a fiat choice supplies a free input. Neither makes external price an operand.", kind = "constant", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "subsec:comparator:two-costs", environment = "subsection", statement = "Track two costs as a separately addressable subsection.", kind = "constant", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "ins:comparator:inherited-costliness", environment = "insight", statement = "Closure uses supplied frame amounts under costly-source assumptions, samples the frame and charges accepted acts at their recorded debit vintages. External supply capacity and price are oracle projections rather than calculation premises.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "def:comparator:source-faithful", environment = "definition", statement = "Source faithfulness preserves the attribution of supplied frame amount under the source assumptions and conserves intact pairs; it does not prove the source or standing invariance under Actor partition. An accepted act's title and recipient resolution likewise do not establish the truth of an external event it asserts.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:source-actor-mass", environment = "condition", statement = "The supplied Actor gross amount is nonnegative, costly-source-backed and persistent under the same opaque identity, subject to the Actor-entry assumptions. The calculation consumes that amount without establishing its source.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:source-edge-event", environment = "condition", statement = "Internal structurally completed branch events and positive folded coordinates can qualify allocation, but establish no external transaction truth or private purpose.", kind = "invariant check", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "post:comparator:accountability-cost", environment = "postulate", statement = "Interpretation or optional practice, not a closure admission condition: Keep attributed immutable claims and their endogenous accountability cost; internal corroboration cannot establish external truth or supply an authenticity test.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "02 Comparator", label = "tbl:comparator:two-costs", environment = "table", statement = "Distinguish exogenous source cost from endogenous accountability cost.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "subsec:comparator:faithfulness", environment = "subsection", statement = "Track faithfulness as a separately addressable subsection.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "post:comparator:faithfulness", environment = "postulate", statement = "Under supplied source assumptions, require the dimensional, immutable-ledger, pair-conservation, epoch-set, title, memoryless, universal-act, domain, tilt, cluster-mean and evaluated-state disciplines. Routes bypassing them are unfloored injections. Construction and certificates support the calculation clauses; complete-set admission's exclusive use of the completed post-debit result remains a boundary obligation. These properties imply neither partition invariance nor a universal standing-response sign.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-source", environment = "condition", statement = "Assume the supplied contribution has source backing, irrecoverability and its opaque identity association. These premises preserve provenance, not standing across alternative funded partitions; identical public records cannot distinguish legitimate separation from strategic concentration.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-numeraire", environment = "condition", statement = "Divide each frame-denominated input by the positive numeraire before combining it with a count.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-measurement", environment = "condition", statement = "Compute standing as a measurement of the record, not a possessed ledger asset; the ledger after measurement must equal the ledger before it.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-conservation", environment = "condition", statement = "Conserve full balance and count totals through row-stochastic allocation; this is rival allocation, not invariance of individual standings, participant maxima or unweighted sums. The receiving-family concentration of ``prop:epoch:split-concentration`` remains compatible with these scoped invariants.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-epoch-set", environment = "condition", statement = "Keep host-assigned order, relation frontiers and intra-epoch latest positions out of every standing quantity.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-title", environment = "condition", statement = "Resolve settlement counterparty allocation through structurally completed branch events, independently of terminal timeline selection.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-memorylessness", environment = "condition", statement = "Use no previous epoch’s standing as a semantic input.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-universal-act-weighing", environment = "condition", statement = "Weigh every accepted Actor-authored act exactly once, resolving to a person or self; consume matched hyper-acts atomically so unmatched legs and passive artifacts carry no standing. Admissible partitions can change author-indexed folds and normalized allocation, so invariance needs additional premises. The all-state hop-intertwining premises of ``thm:dynamics:split-hop-refinement`` are a sufficient invariance criterion, not a consequence of act partition alone.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-domain-weights", environment = "condition", statement = "Apply declared domain weights to complete folded acts; preserving aggregate ledger pairs does not by itself preserve the resulting author-indexed allocation. The all-state hop-intertwining premises of ``thm:dynamics:split-hop-refinement`` are a sufficient invariance criterion, not a consequence of act partition alone.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-responsive-tilt", environment = "condition", statement = "Use recipient standing only to modulate relative authored allocation, with hop fading at the greatest certified rung.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-cluster-rate", environment = "condition", statement = "Preserve the closed transported-count-weighted mean under internal pair allocation; neither an open fibre mean nor individual coordinates or maxima are thereby fixed. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cond:comparator:faithfulness-complete-set-admission", environment = "condition", statement = "Require complete-set admission to read only the completed post-debit standing result; this is a boundary-operator obligation, not a consequence of the standing construction. Identical public records cannot distinguish legitimate separation from strategic concentration under ``thm:epoch:split-observational-equivalence``; private purpose is not a record-derived input.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "ins:comparator:universal-amplifier", environment = "insight", statement = "Terminal value channels use dimensionless standing amplification without manufacturing source. Use published standing in terminal formulas only under their fixed-context premises; terminal scalar monotonicity does not imply monotonicity under a frame gross amount, act or funded partition. Partition readout bounds require the matched creators and fixed non-standing context of ``prop:transport:split-terminal-readout-bounds``.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:amplifier-rendering", environment = "remark", statement = "Terminal amplification must not silently become an admission-policy control. Zero standing retains unit amplification; an optional guild exponent is published with canonical default one. Terminal input monotonicity implies no monotone frame gross amount, act or partition response. Partition readout bounds require the matched creators and fixed non-standing context of ``prop:transport:split-terminal-readout-bounds``.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:conserved-allocation-scope", environment = "remark", statement = "Conservation excludes passive or unowned redirection and makes source allocation rival, including against self, but supplies no target veto. General funded-partition standing invariance is false even with proportional pairs and unchanged incoming acts. Pair totals, closed weighted means and equal-rate regimes survive; displacement bounds are not small strategic-gain guarantees. Concentration and invariant claims require ``prop:epoch:split-concentration`` and ``thm:dynamics:split-hop-refinement``; contraction bounds residual amplification, not residual size.", kind = "policy", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "cor:comparator:sybil-resistance-is-faithfulness", environment = "corollary", statement = "Sybil resistance means no standing without genuine contributing source and rival allocation of existing source; it promises no invariance when one participant funds several addresses. Under ``thm:epoch:split-observational-equivalence``, a record-based remedy imposes the same change on a legitimate completion with identical public fields, or the same distribution of changes if randomized.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "subsec:comparator:capacity-and-admission-benchmarks", environment = "subsection", statement = "Track capacity and admission benchmarks as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "eq:comparator:admission-benchmark-deposits", environment = "equation", statement = "Source oracle condition, not a closure operand or proof of source truth: Multiply unsupported-act burn benchmarks by the realization unit-cost projection.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "tbl:comparator:admission-benchmarks", environment = "table", statement = "Check debit-only, safety and door-neutral unsupported-act costs separately.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "subsec:comparator:the-surface", environment = "subsection", statement = "Track the surface as a separately addressable subsection.", kind = "constant", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:network-prices-the-frame", environment = "remark", statement = "Derive standing from imported source without importing a realization monetary mechanism.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:surface-readings", environment = "remark", statement = "External prices, denominations, event costs, capacity and operating arrangements are outside the calculation; closure consumes supplied Actor entries under its explicit hypotheses.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "oracle" },
  { chapter = "02 Comparator", label = "subsec:comparator:limitations", environment = "subsection", statement = "Track limitations as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:inherited-limitations", environment = "remark", statement = "Closure preserves supplied amount attribution but does not make funded Actor partition neutral for standing. Aggregate export is capacity-bounded while concentration can increase a member's standing. Additional Registration debit and aggregate frame increment are different quantities.", kind = "none", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "02 Comparator", label = "rem:comparator:structural-ceiling", environment = "remark", statement = "Internal act formation and title recognition are checkable, but consumed graph data cannot establish the truth of an asserted external event. Graph structure and externally supplied frame amount remain distinct.", kind = "none", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "sec:network", environment = "section", statement = "Track network as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "subsec:network:the-write", environment = "subsection", statement = "Track the write as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:write", environment = "definition", statement = "Write the accepted ordered whole acts only after evaluating their complete set against the declared inputs; dependent blocks are computed from those inputs.", kind = "function", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "rem:network:not-a-write", environment = "remark", statement = "Do not publish rejected candidates, solver iterates, derived edges or payload reductions as writes.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "subsec:network:admission-closure", environment = "subsection", statement = "Track admission closure as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:admission-closure", environment = "definition", statement = "Classify every value by whether its arithmetic or validity read-sites feed admission.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:network:admission-closure-binding", environment = "case", statement = "A binding quantity influences later admission and consumers must use its defined computed value; that semantic obligation does not require a separately published copy.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:network:admission-closure-free", environment = "case", statement = "Branch of ``def:network:admission-closure``: An object is free only when every read-site is terminal and never feeds forward epoch evolution; guild reimplementation is then permitted. Recomputability alone does not make a binding object free.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "case:network:admission-closure-title-feedback", environment = "case", statement = "Shared branch construction and settlement recipient resolution are binding inputs; a selected honored timeline is a terminal reading.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "rem:network:boundary-one-sentence", environment = "remark", statement = "Keep ledger, formation, branch-derived settlement standing and admission binding; terminal readings cannot replace those computations.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "subsec:network:object-taxonomy", environment = "subsection", statement = "Track object taxonomy as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:object-taxonomy", environment = "definition", statement = "Distinguish supplied inputs, binding computed values, verification support, optional copies and terminal readings by their actual consumers, not by whether a copy is published.", kind = "type", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:conserved-standing-package", environment = "definition", statement = "Provide the evaluated-state inputs, formulas, selected support and independent evidence needed to compute the conserved-standing package; deterministic cells, allocations and results need no duplicate publication.", kind = "type", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-evaluated-state", environment = "item", statement = "Supply the complete act set and cumulative entering frame and ledger state with in-force constants; derive computed balances and counts.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-folds", environment = "item", statement = "Compute fold cells, coefficients, recipient resolution and base allocation from supplied semantic state, acts and domain weights.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-activation", environment = "item", statement = "Supply activation formulas, controller constants and in-force settings; compute activation and the outgoing wall from the evaluated width and rung.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-tilt", environment = "item", statement = "Supply the tilt profile, backoff grid and ordered attempted-rung support; determine the accepted rung and attempt verdicts by checking that evidence.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-transport", environment = "item", statement = "Compute hop allocation and conserved transport from the supplied depth masses and current equilibrium inputs.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-emission", environment = "item", statement = "Compute source emission from the evaluated ledger and in-force inputs; the static set need not publish a second copy.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-certificate", environment = "item", statement = "Compute the standing and admission verdicts from the supplied sound certificate support and evaluated inputs; no redundant verdict or standing copy is required.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:conserved-standing-package-evidence", environment = "item", statement = "Supply irreducible soundness and instance-binding evidence; recover deterministic enclosures and residual values where the declared construction determines them.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "tbl:network:object-taxonomy", environment = "table", statement = "Apply the five permission classes to published values according to their read-sites.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "rem:network:taxonomy-subtleties", environment = "remark", statement = "Separate binding certificate verdicts from evidence and never let optional caches feed binding outputs.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "rem:network:within-epoch-solve-freeze", environment = "remark", statement = "Freeze the completed-set base matrix and ledger-derived emissions throughout a solve.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "subsec:network:host-contract", environment = "subsection", statement = "The host supplies the static calculation inputs and independent evidence; computed results and optional display assertions have separate roles.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "post:network:host-contract", environment = "postulate", statement = "Supply the complete static inputs, public interpretation and irreducible sound evidence for the accepted ordered acts; derive ledger, semantic, standing, title and controller results without mandatory duplicate copies.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:host-contract-accepted-records", environment = "item", statement = "Supply selected acts and order, cumulative structural state and boundary observations; compute edge set, partition and size. No asserted closure cause is supplied.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:host-contract-ledger-inputs", environment = "item", statement = "Supply frame gross amounts, entering ledger and cumulative counts, immutable earlier debit vintages and the present writing price; compute ending balances and counts.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:host-contract-semantic-projection", environment = "item", statement = "Supply complete authored semantic terms and sufficient cumulative graph state; derive cells, coefficients, recipients and base allocations.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:host-contract-transport", environment = "item", statement = "Supply tilt profile, trial policy, depth masses and independent support; compute emission and conserved transport at the selected equilibrium.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:host-contract-standing-support", environment = "item", statement = "Supply selected comparison points, ordered attempts and sound irreducible support; compute standing, action stamps, headroom and gate verdicts.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:host-contract-shared-policy", environment = "item", statement = "Read supplied in-force schedules, structural floor, boundary values and wall memory where not determined by public rules and remaining inputs; compute title and controller outputs and retain the specified receiving lead.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "itm:network:host-contract-evidence", environment = "item", statement = "Supply public formulas, versions and constants and the sound instance-bound support needed for every required attempted comparison; recover deterministic quantities when the inputs determine them.", kind = "type", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "def:network:door-headroom", environment = "definition", statement = "Sum stamp surplus once per accepted act as a non-actuating diagnostic.", kind = "function", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "rem:network:durations-no-glyph", environment = "remark", statement = "Minimum and maximum durations are wall-clock policy absent from formulas; the asserted timestamp remains recorded and verifies no elapsed time. Duration auditing requires external measurement.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "03 Network", label = "ins:network:back-pressure", environment = "insight", statement = "Separate epoch budget and timing selection from the greatest-certifiable-rung search.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "sec:graph", environment = "section", statement = "Track graph as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:edge-ontology", environment = "subsection", statement = "Track edge ontology as a separately addressable subsection.", kind = "none", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "ax:graph:authored-act-ontology", environment = "axiom", statement = "Accepted acts own all authoritative fields and project to edges; nodes and their properties are derived readings.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:act-ownership-invariant", environment = "remark", statement = "Every projection retains its parent act’s identity, approval, payload commitment and accounting; no projection independently creates another approved act.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "cor:graph:hyper-act-indivisibility", environment = "corollary", statement = "Both hyper-act projections share exactly one lifecycle and accounting unit.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:ontology-promotion", environment = "remark", statement = "Treat accepted acts as authored history and every edge as a derived projection.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:identifier-algebra", environment = "definition", statement = "Represent addresses, profiles, exact names and act-minted identifiers as disjoint constructors.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:authored-act", environment = "definition", statement = "Represent one atomic act with one binary or two matched hyper-edge projections.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:authored-act-binary", environment = "case", statement = "Branch of ``def:graph:authored-act``: A binary authored act projects to exactly one edge record and remains one atomic unit of formation, admission, ordering, counting and debit.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:authored-act-hyper", environment = "case", statement = "Branch of ``def:graph:authored-act``: A hyper-edge act projects to exactly two matched records, one A-leg and one T-leg; accept neither other cardinalities nor per-leg counting or debiting. It carries one dependency projection for the whole act.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-identifier", environment = "definition", statement = "The author chooses a nonce used once per author and family before submission and checks history and its batch; the nonce has no ordering meaning. The triple is semantic identity; foreign-party bytes remain outside the act.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "lem:graph:identifier-disjointness", environment = "lemma", statement = "Decide identifier class from its constructor without a lookup.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:anchoring", environment = "definition", statement = "Distinguish reference from class-specific anchoring and dangling state.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "lem:graph:dangling-neutral-fold", environment = "lemma", statement = "Return neutral folds for referenced identifiers lacking their required anchor.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:node-taxonomy", environment = "definition", statement = "Classify grounded Actor/Profile, named Type and six minted artifact kinds.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:name-equality", environment = "remark", statement = "Compare names by exact bytes without Unicode normalization or case folding.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:genesis-act-and-creator", environment = "definition", statement = "Detect self-minting genesis roles and derive creators by identifier class.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:genesis-act-and-creator-genesis-role", environment = "case", statement = "Branch of ``def:graph:genesis-act-and-creator``: An act of a genesis family has the genesis role exactly when its terminal target is mint of its own act identifier; decide this by syntactic equality of the act fields.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:genesis-act-and-creator-ordinary-role", environment = "case", statement = "Branch of ``def:graph:genesis-act-and-creator``: An act of a genesis family whose terminal target is not its own mint has ordinary role: it names an existing node and neither mints, fixes the creator, establishes genesis context nor roots title.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:genesis-act-and-creator-minted-creator", environment = "case", statement = "Branch of ``def:graph:genesis-act-and-creator``: For a minted node, resolve its creator to the author of its genesis act.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:genesis-act-and-creator-address-creator", environment = "case", statement = "Branch of ``def:graph:genesis-act-and-creator``: For an address node addr(a), resolve its creator to that address node itself.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:genesis-act-and-creator-profile-creator", environment = "case", statement = "Branch of ``def:graph:genesis-act-and-creator``: For a profile node prof(a), resolve its creator to addr(a).", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:genesis-act-and-creator-named-creator", environment = "case", statement = "Branch of ``def:graph:genesis-act-and-creator``: For a named node name(s), creator is absent; assign absent-creator standing zero and the neutral feed amplifier one. Named concepts have no owner.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:registration", environment = "definition", statement = "Anchor an existing grounded Actor/Profile pair through an ordinary priced act.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:derived-raw-edges", environment = "definition", statement = "Derive current raw Self readings from accepted standing without appending records.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:raw-traversal-snapshot", environment = "definition", statement = "Combine accepted edges with current derived Self readings for terminal traversal only.", kind = "type", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:derived-self-reading", environment = "definition", statement = "Derive both Self components from the same reduced standing and tenure maturity.", kind = "function", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:raw-snapshot-path", environment = "definition", statement = "Use bounded simple paths in the current raw snapshot without increasing-time constraints.", kind = "type", crate = "pn-readouts", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "thm:graph:raw-weight-ceiling", environment = "theorem", statement = "Raw canonical edge weights are nonnegative and strictly below one.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:raw-weight-ceiling-positive-walk", environment = "case", statement = "Branch of ``thm:graph:raw-weight-ceiling`` proof: Because every routing-live raw edge has weight below one, removing a repeated-node cycle from a positive-weight walk strictly improves its product and shortens it. This simplification is not valid for a fixed parity register.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:raw-weight-ceiling-zero-walk", environment = "case", statement = "Branch of ``thm:graph:raw-weight-ceiling`` proof: Removing a cycle from a zero-weight walk cannot decrease its product; repeated removal gives a simple path within the same upper depth bound when parity is unconstrained. Removing a negative-parity cycle changes the sign, so this argument supplies no fixed-parity simplification.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:canonical-folds", environment = "definition", statement = "Derive declared node properties from records; the shared branch certificate feeds binding settlement computation, while terminal timeline selections remain replaceable.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:stance-records-by-family", environment = "remark", statement = "Read incoming authored projections at their own passive-node targets; exclude control families and derived traversal edges from stance means. Registration and genesis Publish retain their authored stance coordinates, excluding structural fields. The standing A-leg restriction belongs to a different fold.", kind = "policy", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "lem:graph:act-edge-identifier-uniqueness", environment = "lemma", statement = "Public accepted-record uniqueness makes the author/act-nonce/family map injective; projection roles distinguish the act edges. Logical time is not an identity premise.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "ax:graph:parallel-authored-acts", environment = "axiom", statement = "Retain parallel acts individually without rejection, merging or implicit supersession.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:authored-act-bundle", environment = "definition", statement = "Group complete acts by author, incidence and family without reconstructing acts from unrelated legs.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-edge-projection", environment = "definition", statement = "Project one atomic act into its role-consistent binary or matched hyper-edge legs; role identity separates co-legs without a logical-time identity premise.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:act-edge-projection-binary-count", environment = "case", statement = "Branch of ``def:graph:act-edge-projection``: A binary act has exactly one edge projection, with identity derived from its parent act identifier and binary role.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:act-edge-projection-hyper-count", environment = "case", statement = "A hyper-act has exactly two matched A/T projections sharing its parent identity and authoritative key; an absent leg is malformed or incompletely retrieved, not a partially accepted act.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:authored-act-bundle-consumers", environment = "remark", statement = "Standing consumes its family netting cells and structural settlement completion; challenge and terminal readings do not delete records or change every-act accounting.", kind = "policy", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:terminal-folds-alter-nothing", environment = "remark", statement = "Terminal selection leaves all accepted records live for accounting and binding consumers.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "post:graph:title-act-bundle-reservation", environment = "postulate", statement = "Use settlement acts to construct the shared completed-branch and challenge record; neither sentiment nor a terminal choice replaces that structural fold.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:profile-update", environment = "remark", statement = "A parallel Registration updates payload history without changing the Actor's permanent frame binding.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:chain-ordered-revision-head", environment = "definition", statement = "Terminal revision selection follows the counted parent relation and retains the common incumbent across branches; asserted references alone do not establish counted ancestry.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:chain-ordered-revision-head-unique-maximal", environment = "case", statement = "Branch of ``def:graph:chain-ordered-revision-head``: Within the root-reachable revision acts, a unique causal-parent-maximal act is the revision head; with only the root, read its payload.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:chain-ordered-revision-head-incumbent", environment = "case", statement = "Branch of ``def:graph:chain-ordered-revision-head``: When root-reachable revision acts have several maximal elements, keep the deepest common causal ancestor as incumbent; do not break the branch tie by order. Acts without a root chain are fold-ignored but remain admitted and priced in other consumers.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:chain-ordered-revision-head-genesis-root", environment = "case", statement = "Branch of ``def:graph:chain-ordered-revision-head``: For Content, Comment and Message, root the chain-ordered revision fold at the genesis act.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:chain-ordered-revision-head-registration-root", environment = "case", statement = "Branch of ``def:graph:chain-ordered-revision-head``: For Profile, root the revision fold at its anchoring Registration, which is grounded and mints nothing.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:chain-ordered-revision-head-prior-head-root", environment = "case", statement = "Select Item description authors through a named timeline and epoch; causal revision ancestry orders that author’s own heads without making a terminal selection common title authority.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "prop:graph:revision-head-order-invariance", environment = "proposition", statement = "The canonical terminal revision head depends on asserted references and their counted relation under the accepted epoch partition, not a residual valid host linearization.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:chain-requirement-sited-in-fold", environment = "remark", statement = "Do not add revision-chain lookups to syntactic formation or turn declared parents into scoring incidence.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:canonical-erasure-default", environment = "definition", statement = "Within the optional courtesy standard: Select the structural revision head before rendering. An authenticated active forget request renders that head absent without falling back to a predecessor; only the same controller’s newer authenticated serve request supersedes it for that recipient. Without an active forget request, distinguish verified authored emptiness from unavailable opening evidence and report unknown request history as unknown.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:parallel-undefined", environment = "remark", statement = "Do not invent additional binding interpretations of parallel records.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:grounded-target-does-not-imply-allocation", environment = "remark", statement = "A grounded endpoint alone cannot confer standing authority.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:right-to-leave-completed", environment = "remark", statement = "Keep removable content separate from immutable relied-upon structure for every act kind.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:partition-and-passivity", environment = "subsection", statement = "Track partition and passivity as a separately addressable subsection.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:partition", environment = "definition", statement = "Derive active Actor and passive artifact partitions from projected records.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "ax:graph:passivity", environment = "axiom", statement = "Every accepted act has an Actor author and passive nodes cannot autonomously redirect edges.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:passivity-authorship", environment = "item", statement = "Require every recorded edge to have an active Actor author: an Actor-sourced edge is authored by its source, while a passive-sourced edge is a terminal hyper-edge leg authored by the act’s Actor. Reputation is derived, not an exception allowing passive-authored records.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:passivity-source-actor", environment = "case", statement = "Branch of ``ax:graph:passivity``: An edge whose source is an Actor is authored by that source Actor.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:passivity-passive-terminal-leg", environment = "case", statement = "Branch of ``ax:graph:passivity``: A record sourced from a passive node must be the T-leg of an Actor-authored hyper-edge; no third authorship case exists. Reputation is derived, not a record exception.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:passivity-non-autonomy", environment = "item", statement = "Permit no passive node to initiate, redirect or modify an edge; its outgoing recorded legs are fixed by the Actor at creation and remain immutable.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "prop:graph:author-source-identity", environment = "proposition", statement = "The recorded author, act-identifier author, supplied frame association and binary source or hyper-edge A-leg name the same Actor. Hyper-edge legs share the middle endpoint and retain that act author; their endpoints give the act's complete incidence. No leg has an independent author.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "lem:graph:passive-out-degree", environment = "lemma", statement = "Count passive outgoing projections as authored hyper-act terminal legs, plus the separate raw Profile Reputation component. Reference’s A-leg lands on the citing artifact, which sources its author-fixed T-leg; Reference terminal legs therefore count for every passive type.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:asymmetry", environment = "remark", statement = "An actor-directed act implies no reciprocal act or symmetric parameters.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:temporal-structure", environment = "subsection", statement = "Track temporal structure as a separately addressable subsection.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "ax:graph:act-causality", environment = "axiom", statement = "Each accepted whole act has public structural incidence and one authoritative key; compliant causal parents and declared dependencies precede it, without a logical-time premise.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-incidence-causality", environment = "definition", statement = "The optional Lamport fold reads complete public incidence and causal parents in accepted order, updates incident frontiers and carries reader-local accumulators; private dependencies and unchecked stamps are not recurrence inputs.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "case:graph:act-incidence-causality-incident-update", environment = "case", statement = "Branch of ``def:graph:act-incidence-causality``: After an act, advance every endpoint in its incidence set to that act frontier; both hyper-edge legs inherit the same event time.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "case:graph:act-incidence-causality-unchanged-endpoint", environment = "case", statement = "Branch of ``def:graph:act-incidence-causality``: For an endpoint outside an act incidence set, retain its preceding frontier unchanged.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:causal-frontier-not-ancestry", environment = "remark", statement = "A scalar public-history frontier is not an ancestry proof; incidence and public causal parents establish the optional recurrence while order and private dependency compliance have separate checks.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:edge-projection-maturity", environment = "definition", statement = "Compute each projection maturity from shared pre-act endpoint degree without sibling self-maturation.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:authoritative-act-order", environment = "definition", statement = "Use the supplied finite total act sequence and epoch-position coordinates for precedence; formation and placement checks use supplied cumulative state, while optional logical time follows the order.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:host-ordering-discretion", environment = "remark", statement = "Publish residual host ordering choices without promising incentive-neutral order.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "prop:graph:act-order-path-order", environment = "proposition", statement = "Authoritative act order grounds the required precedence relations; logical time is not an alternative ordering premise.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:act-time-not-wall-clock", environment = "remark", statement = "Compute logical timing and maturity without substituting wall-clock time.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:act-ordering-relations", environment = "remark", statement = "Public asserted parents feed counted ancestry; dependency evidence is separate; act nonces order neither intentions nor published acts.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:maturity-max-rationale", environment = "remark", statement = "The canonical maturity uses maximum endpoint degree to retain sparse-to-dense context.", kind = "none", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "prop:graph:maturity-bounds", environment = "proposition", statement = "Finite-degree maturity remains in the half-open unit interval and grows with degree.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:temporal-entropy", environment = "definition", statement = "Evaluate binary entropy of maturity with the zero endpoint totalized.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:separable-commitment", environment = "subsection", statement = "Track separable commitment as a separately addressable subsection.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-payload-projection", environment = "definition", statement = "Bind one opaque payload projection per act. The aggregate carriage bound applies to a supplied content pair; committed empty content is distinct from an unavailable opening.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "post:graph:separable-act-projections", environment = "postulate", statement = "Verify the structural part independently of holdings of either optional opening. Binding and concealment rest on the declared cryptographic premise; empty content uses the same formation and unavailable openings do not alter the commitments.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-payload-state", environment = "definition", statement = "Within the optional courtesy standard: Payload state is a holder’s observation: full-empty has verified empty bytes and the author’s content blinding value, full has other verified bytes and that value, and reduced has neither while the structural commitment remains. Holdings can change through an independently retained opening or local removal; only destruction of information no holder retains is irreversible. Absence at the host establishes neither authored emptiness nor reduction elsewhere; requested intent governs the addressed party’s response, not the act’s state.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "prop:graph:removable-projection-invariance", environment = "proposition", statement = "Opening availability changes no accepted act, structural quantity or completed result.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-payload-controller", environment = "definition", statement = "Within the optional courtesy standard, payload custody/removal authority stays with the authored record’s controller and is not reassigned by a later Item timeline transfer.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:payload-size-not-act-cost", environment = "remark", statement = "Within the optional courtesy standard: Charge one act regardless of its bounded payload size.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:act-payload-removal-neutrality", environment = "remark", statement = "Availability or absence of an opening does not change scoring; the invariant does not depend on a particular deletion act.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:act-payload-custody-phases", environment = "remark", statement = "Within the optional courtesy standard: append custody and content carriage are independent. Centralized carriage retains and atomically removes the optional payload and author-content-blinding-value pair and its opening material; decentralized carriage retains only the Layer 1 witness. All four combinations preserve the same structural record and witness. Payload authorship is outside what the record establishes about its recorded author.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:erasure-floor", environment = "remark", statement = "An unavailable opening leaves binding, concealing commitment residue under the declared cryptographic premise. A deployment requiring zero residue must leave the content wholly outside the commitment or use a vacuous projection.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:sentiment-slice", environment = "subsection", statement = "Track sentiment slice as a separately addressable subsection.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:sentiment-slice", environment = "definition", statement = "Construct the masked three-by-three slice with always-active marginals and baseline.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "eq:graph:sentiment-slice", environment = "equation", statement = "Construct the masked three-by-three slice with always-active marginals and baseline.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:marginal-archetypes", environment = "remark", statement = "Check that strong marginal direction survives weak bilinear intensity.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:rank-two-structure", environment = "subsection", statement = "Track rank two structure as a separately addressable subsection.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "prop:graph:rank-two-constraint", environment = "proposition", statement = "Check mask-dependent singular-value bounds rather than assuming exact rank two after clamping.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:rank-two-constraint-unmasked-rank", environment = "item", statement = "Check that the unclamped, unmasked sentiment slice is exactly rank one, as the outer product of its intensity and domain vectors with their absolute values and unit entries.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:rank-two-constraint-masked-bound", environment = "item", statement = "After clamping and masking, check the smallest-to-largest singular-value ratio against the effective-mask bounds: full mask below 0.05, Identity at most 0.14, Epistemic and Economic at most 0.10, Minimal at most 0.22. The full-mask evidence is a 21-by-21 numerical grid; Identity and Minimal attain their bounds at the extremal corner, while Epistemic and Economic maxima are interior and their corner ratio is zero.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "prop:graph:rank-two-constraint:energy-share", environment = "proposition clause", statement = "Check the claimed two-singular-value energy shares by mask.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:rank-two-constraint-full-mask", environment = "case", statement = "Branch of ``prop:graph:rank-two-constraint`` proof: For the full stored mask, clamping breaks exact rank-one proportionality. The reference singular values and the 21 by 21 grid numerically support the third-to-first ratio bound at sampled points; neither the interpolation gap nor a closed-form bound is certified by that grid.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:rank-two-constraint-restricted-mask", environment = "case", statement = "Branch of ``prop:graph:rank-two-constraint`` proof: Restricted masks inject genuine rank-three content. Identity and Minimal attain their bounds at the extremal corner; Epistemic and Economic have zero third singular value there and interior maxima confirmed on the sampled grid.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "ins:graph:rank-two-structural-consequence", environment = "insight", statement = "Compose the two-by-two path view and retain the full Frobenius attribution view.", kind = "policy", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:three-interfaces", environment = "subsection", statement = "Track three interfaces as a separately addressable subsection.", kind = "policy", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:dual-view-architecture", environment = "definition", statement = "Expose scalar, path-view and attribution-view extractions separately.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "tbl:graph:computational-interfaces", environment = "table", statement = "Keep raw geometry consumers separate from complete-act standing compilation.", kind = "policy", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:path-view-and-signed-svd", environment = "subsection", statement = "Track path view and signed svd as a separately addressable subsection.", kind = "type", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:path-view-extraction", environment = "definition", statement = "Extract the softened bilinear block with Full, Half and Marginal routing floors.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "eq:graph:path-view-extraction", environment = "equation", statement = "Extract the softened bilinear block with Full, Half and Marginal routing floors.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:path-view-extraction-full-or-minimal", environment = "case", statement = "Branch of ``def:graph:path-view-extraction``: For full or marginal tiers, soften each binary mask entry a to a+(1-a) times the bleed parameter when extracting the path view.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:path-view-extraction-half-corner", environment = "case", statement = "Branch of ``def:graph:path-view-extraction``: For the half tier, keep the path-view polarization corner (1,1) at coefficient one.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:path-view-extraction-half-off-corner", environment = "case", statement = "Branch of ``def:graph:path-view-extraction``: For the half tier, set the three off-corner path-view coefficients to the half floor; keep the full stored slice, attribution Frobenius norm and CAN base values unchanged.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:signed-svd", environment = "definition", statement = "Decompose nonsingular two-by-two matrices into proper rotations, singular magnitudes and orientation.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "eq:graph:signed-svd", environment = "equation", statement = "Decompose nonsingular two-by-two matrices into proper rotations, singular magnitudes and orientation.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "lem:graph:signed-svd-uniqueness", environment = "lemma", statement = "Distinct singular values determine the dominant axis up to simultaneous rotation sign.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:signed-svd-uniqueness-distinct-singular-values", environment = "case", statement = "Branch of ``lem:graph:signed-svd-uniqueness`` proof: For distinct singular values in the signed SO(2) decomposition, the only residual ambiguity is simultaneous negation of both rotations; the dominant axis line is invariant.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:signed-svd-uniqueness-isotropic", environment = "case", statement = "Branch of ``lem:graph:signed-svd-uniqueness`` proof: For equal singular values, the residual expands to a continuous family; the dominant axis is undefined and its angle is not assigned.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:coherence-ratio", environment = "definition", statement = "Return the singular-value ratio and handle the isotropic endpoint explicitly.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:dominant-mode-angle", environment = "definition", statement = "Compute the acute dominant-axis angle only when that axis is defined.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "eq:graph:dominant-mode-angle", environment = "equation", statement = "Compute the acute dominant-axis angle only when that axis is defined.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:signed-svd-geometric-mean", environment = "remark", statement = "At half diversity use the determinant magnitude while signed consumers retain parity.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:score-exponent-uniqueness", environment = "remark", statement = "Keep the stated determinant square-root exponent distinct from freely tunable terminal rendering.", kind = "policy", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:trace-determinant-recovery", environment = "remark", statement = "Recover determinant from signed singular values and trace only with the relative rotation.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "eq:graph:trace-recovery", environment = "align", statement = "Recover determinant from signed singular values and trace only with the relative rotation.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "eq:graph:det-recovery", environment = "align", statement = "Recover determinant from signed singular values and trace only with the relative rotation.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:determinant-sign-and-tiers", environment = "subsection", statement = "Track determinant sign and tiers as a separately addressable subsection.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:determinant-sign", environment = "definition", statement = "Extract orientation only for nonzero determinant.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "eq:graph:determinant-sign", environment = "equation", statement = "Extract orientation only for nonzero determinant.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:one-bit-extraction-cost", environment = "remark", statement = "Parity extraction reuses the determinant already computed for raw magnitude.", kind = "none", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "prop:graph:pipeline-anisotropy", environment = "proposition", statement = "Canonical nonzero-parameter path views have distinct singular values.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
