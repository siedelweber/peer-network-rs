  { chapter = "01 Introduction", label = "ins:introduction:equal-among-peers", environment = "insight", statement = "Standing pools transported balances and action counts rather than averaging actor rates.", kind = "invariant check", crate = "pn-epoch", citable = false, added_at = "network-v0.26.3", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:no-escape-velocity", environment = "insight", statement = "Certified fixed-rung relational support cannot be replaced by artifact routing.", kind = "invariant check", crate = "pn-epoch", citable = false, added_at = "network-v0.26.3", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:peer-claim-scope", environment = "insight", statement = "Incoming action mass controls peer convergence and an isolated actor retains its own source rate.", kind = "invariant check", crate = "pn-epoch", citable = false, added_at = "network-v0.26.3", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:only-faithful-coordinate", environment = "insight", statement = "The distributional comparison uses costly commitment per action rather than aggregate reserves.", kind = "invariant check", crate = "pn-epoch", citable = false, added_at = "network-v0.26.3", label_source = "explicit" },
  { chapter = "01 Introduction", label = "ins:introduction:the-floor-we-name", environment = "insight", statement = "Public accountability does not prove the truth of every graph claim.", kind = "none", crate = "pn-host", citable = false, added_at = "network-v0.26.3", label_source = "explicit" },
