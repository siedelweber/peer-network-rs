  { chapter = "F Verification", label = "ver:registration:w1-benchmark", environment = "labelled fixture table", statement = "Check the one-act solvency threshold.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:registration:safety-benchmark", environment = "labelled fixture table", statement = "Check that the unsupported one-act safety benchmark requires pre-act frame gross amount equal to twice the action price.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:registration:door-benchmark", environment = "labelled fixture table", statement = "Check that the unsupported one-act door benchmark is the action debit plus numeraire times the participation floor in pre-act frame gross amount.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
