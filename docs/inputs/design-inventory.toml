  { chapter = "05 Nodes and edges", label = "case:nodes:participant-found-successor", environment = "case", statement = "Branch of ``edge:nodes:participant``: A Participant founding a successor names the old Chat as A-leg origin and its own minted Chat as T-leg destination.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "case:nodes:participant-move", environment = "case", statement = "Branch of ``edge:nodes:participant``: A moving Participant names the origin Chat on the A-leg and destination Chat on the T-leg. Formation does not check prior membership in the origin; without it the act is a decorated join, and the fold reads leg roles rather than trusting the origin claim.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
