  { chapter = "Appendix I — Deployment", label = "prop:deployment:allocation-input-completeness", environment = "proposition", statement = "Ensure the standing compiler is deterministic over the disclosed accepted-act and ledger inputs.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "Appendix I — Deployment", label = "rem:deployment:completeness-safety-orthogonal", environment = "remark", statement = "Check compiler completeness separately from numerical safety certification.", kind = "invariant check", crate = "pn-replay", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
