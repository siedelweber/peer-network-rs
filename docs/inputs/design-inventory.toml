  { chapter = "B Compositional attribution", label = "case:can:compositional-depth-internal", environment = "case", statement = "Track compositional depth internal as a separately addressable case.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "eq:can:compositional-depth", environment = "equation", statement = "Inventory maximum-child-depth plus one with zero-depth leaves.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "def:can:dependency-induction", environment = "definition", statement = "Inventory raw contribution leaves, hyperedge compositions and control/Reputation exclusions.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "itm:can:dependency-induction-actor-edges", environment = "item", statement = "For the canonical CAN mapping, make each non-control Actor-sourced contribution record a leaf valued by its raw slice Frobenius norm. Source class, not authorship, controls this rule: a referenced derived Declaration may be a leaf, subject to CAN insulation, without exposing standing hop matrices or emission fractions.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "itm:can:dependency-induction-hyper-legs", environment = "item", statement = "Map each contributing hyper-edge to a depth-one CAN composition of its two leg leaves with redundancy one, irrespective of leg source class. A coincident Participant terminal self-loop remains a guild leaf although raw traversal prunes it; this two-leaf reading does not replace complete-act standing.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "itm:can:dependency-induction-passive-exclusion", environment = "item", statement = "Exclude standalone passive-sourced edges that are not designated hyper-edge legs from CAN, including Reputation; check source class and the composition-graph designation.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "itm:can:dependency-induction-control-exclusion", environment = "item", statement = "Exclude Withdraw, Rescind, Leave and De-invite control edges from CAN regardless of source class or hyper-edge membership; this exclusion overrides the leg-composition rule. Do not assign contribution value to cancellation or expulsion.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "subsec:can:base-values-and-transmission", environment = "subsection", statement = "Track base values and transmission as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "B Compositional attribution", label = "def:can:base-value", environment = "definition", statement = "Inventory the terminal default Frobenius leaf value without time or entropy.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
