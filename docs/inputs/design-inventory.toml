  { chapter = "F Verification", label = "ver:standing:conserved-equilibrium-enclosure", environment = "verification", statement = "Certify the exact reference conserved equilibrium by global residual enclosure and an independent local Krawczyk inclusion, with complete-set gate intervals.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:interval-certificate", environment = "labelled fixture table", statement = "Enclose the evaluated width-fence product; the retired staged verifier supplies no conserved equilibrium or rung evidence.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
