  { chapter = "F Verification", label = "rem:verification:numerical-rounding", environment = "remark", statement = "Use formulas and verified enclosures as the oracle and round display only after the claim is stable.", kind = "policy", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
