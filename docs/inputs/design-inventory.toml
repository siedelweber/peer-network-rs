  { chapter = "F Verification", label = "ver:standing:prior-screen", environment = "labelled fixture paragraph", statement = "Check the chartered cumulative profile against the sufficient cap.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:near-wall-clique", environment = "labelled fixture paragraph", statement = "Check equal evaluated certificates at equal width, wall, profile and rung; generated diagnostics separately check row conservation.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-conservation", environment = "labelled fixture paragraph", statement = "Check row conservation of emitted transport on the declared generated fixtures.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-zero-anchor", environment = "labelled fixture paragraph", statement = "Check zero-balance identity rows while retaining emission outside the hop mixture.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-relay", environment = "labelled fixture paragraph", statement = "At a fixed state, changing a relay emission does not attenuate another solvent source row; changing the relay ledger need not preserve the coupled equilibrium.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-wall-symmetry", environment = "labelled fixture paragraph", statement = "Check emission linearity below the own-source wall and saturation at one; the inherited width fence remains valid.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-certificate-transfer", environment = "labelled fixture paragraph", statement = "Check validity of the inherited fence with fixed emission, without equating it to the true derivative norm.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-no-tilt", environment = "labelled fixture paragraph", statement = "Check state independence and the zero fence at the exact zero-tilt anchor.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-export-bound", environment = "labelled fixture paragraph", statement = "Check each declared source exported balance/count pair against the chartered count ceiling, including depleted-source cases.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-rate-preservation", environment = "labelled fixture paragraph", statement = "Check the exported pair including its retained diagonal factor; when exported count is positive its rate equals the source rate.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-self-inertia", environment = "labelled fixture paragraph", statement = "Report the declared depleted-source equilibrium comparison with and without emission; the full-pair diagnostic deliberately does not satisfy the emission export ceiling.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:emission-split", environment = "labelled fixture paragraph", statement = "Check each declared source’s export ceiling in the finite split diagnostic and report aggregate export and standing movement with its unsplit comparison. This normalized-row diagnostic is not complete-act invariance; complete-act partitions can change standing and export. Guarantees retain the premises of ``prop:epoch:split-pair-displacement`` and ``prop:transport:split-terminal-readout-bounds``; legitimate and strategic completions of one record share observable consequences under ``thm:epoch:split-observational-equivalence``.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:actor-splitting", environment = "labelled fixture paragraph", statement = "Report the declared split comparisons alongside the certified partition counterexamples and exact surviving invariants. General standing invariance is false; guarantees retain the premises of ``prop:epoch:split-pair-displacement`` and ``prop:transport:split-terminal-readout-bounds``. Legitimate and strategic completions of one record share their observable consequences under ``thm:epoch:split-observational-equivalence``.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:split-admissibility", environment = "verification", statement = "Check complete registered acts, solvency, individual safety, policy, capacity, hulls and all higher-rung refusals for each comparison. This certifies both histories, not private purpose under ``thm:epoch:split-observational-equivalence``.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:split-fold-export", environment = "verification", statement = "Reproduce proportional complete-act partition with clipped Opinions, both signs of target movement, increased actual export and unchanged capacity; report both cost denominators. Do not extend the attained self-path bound to global optimality beyond the family of ``prop:epoch:split-self-path-export``.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:split-distinct-targets", environment = "verification", statement = "Distinct target Opinions reproduce reduced export and higher target standing without clipping collisions: positive per-Actor base and row normalization suffice. The two-rate mixture saturates the displacement bound, so eliminating fold collisions alone does not establish partition invariance.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:split-positive-rung", environment = "verification", statement = "Reproduce strictly separated export and target-standing enclosures at a greatest passing positive rung, not merely anchor diagnostics. Its displacement guarantee retains the measured-residual scope of ``prop:dynamics:split-projected-residual``.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:split-receiving", environment = "verification", statement = "Keep the donor pair and incoming acts unchanged while partitioning the recipient; check increased maximum with a smaller retained denominator. The identical partitioned record has the two possible purpose completions of ``ex:epoch:split-small``.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:split-concentration", environment = "verification", statement = "Reproduce the certified near-hull maximum gain with one added address, fixed incoming acts, rates and aggregate frame gross amount; stronger small-gain claims need premises excluding this fixture. The same record also has the legitimate-role reading of ``ex:epoch:split-showcase``; concentration alone identifies no purpose.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:split-isolated", environment = "verification", statement = "Check proportional isolated members preserve individual rates but not the unweighted sum; nonproportional members may raise the maximum while preserving the weighted mean. Distinguish conserved weighted means from the coordinate criterion of ``prop:epoch:split-centered-invariance``.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:split-readout-conditional", environment = "verification", statement = "Reproduce the conditional terminal calculation with fixed creators and factors, without claiming unchanged paths or an end-to-end reward or admission advantage. Admission clearance and terminal bounds require the separate hypotheses of ``prop:epoch:split-admission-clearance`` and ``prop:transport:split-terminal-readout-bounds``.", kind = "fixture", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:terminal-regression", environment = "labelled fixture paragraph", statement = "Regress terminal consumers through the public inputs their formulas read; an edition change can change their outputs and does not make insulated CAN standing-dependent.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:canonical-encoding", environment = "labelled fixture paragraph", statement = "Check the supplied binding representation and exact calculation inputs; independently computed standing needs no separately standardized encoded copy.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "subsec:verification:epoch-write-gates", environment = "subsection", statement = "Check the complete candidate act set against formation, solvency, safety and aggregate policy under the supplied epoch inputs.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:epoch:computed-standing-stamps", environment = "labelled fixture table", statement = "Enclose all five computed equilibrium coordinates.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
