  { chapter = "04 Graph", label = "def:graph:hyper-edge-scalar-interface", environment = "definition", statement = "Use the product of matched raw-leg norms as a raw consistency identity, never a standing coefficient.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "thm:graph:hyper-edge-reduction", environment = "theorem", statement = "Keep raw scalar, path-view, attribution and complete-act standing reductions distinct.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:hyper-edge-reduction-raw-scalar", environment = "item", statement = "For a complete hyper-edge act, compute its raw scalar norm as the product of its two leg norms.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:hyper-edge-reduction-raw-path", environment = "item", statement = "For a complete hyper-edge, multiply the two raw path-view matrices in leg order; its determinant and parity are the products of the leg determinants and parities.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:hyper-edge-reduction-attribution", environment = "item", statement = "For attribution, take each hyper-edge leg as an independent CAN base value and compose them at depth one with redundancy one.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:hyper-edge-reduction-standing", environment = "item", statement = "Consume a hyper-edge once in standing exactly when its family is in the closed person-vouch census and the act is complete. Neither leg is an independent standing edge; forbid unmatched terminal-leg entry or substitution of an unrelated incoming leg, and omit the passive middle artifact from the projected standing path.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "cor:graph:standing-act-atomicity", environment = "corollary", statement = "Accept a designated complete hyper-act for standing or contribute no outward standing through it.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:interaction-domains", environment = "subsection", statement = "Track interaction domains as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "tbl:graph:interaction-domains", environment = "table", statement = "Represent domain masks and distinguish defaults from the normative per-family census.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:mask-promotion-criterion", environment = "definition", statement = "Promote signed target-stance masks according to the census rather than self-report semantics.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:proposal-half-tier", environment = "definition", statement = "Apply Half routing floors to settlement and conversational proposal families while preserving stored slices.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:settlement-lifecycle", environment = "subsection", statement = "Track settlement lifecycle as a separately addressable subsection.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:item-genesis-act", environment = "definition", statement = "Root Item title in its self-minting Owner act; structural identity survives payload removal but does not establish real-world referent identity.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:item-identity-limit", environment = "remark", statement = "Treat title as ownership of a registered claim, not proof of a real-world referent; an edge's recorded author is recoverable from its parent act, not proof of payload authorship.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:settlement-act-reference", environment = "definition", statement = "Accept and Ratify name the Bid act, and Ratify also names the exact Accept.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-causal-parents", environment = "definition", statement = "Public asserted-parent references belong to the non-removable reference projection. They supply assertions, not the counted relation itself; def:graph:counted-parent-relation excludes placement-fault edges even though the accepted act remains charged. Honest batch formation checks history and causal layers.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:dependent-act-set", environment = "definition", statement = "Close candidate acts under the counted-parent relation, retaining whole hyper-act projections; do not turn invalid asserted references or cancellation matching into counted ancestry.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "cor:graph:act-projection-atomicity", environment = "corollary", statement = "Admit both hyper-act projections together without introducing a causal cycle.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:dependency-closure-excludes-conflicts", environment = "remark", statement = "Count explicit causal parents, not concurrent conflicting handshakes or cancellations merely because they concern the same Item.", kind = "policy", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:public-protocol-reference", environment = "definition", statement = "Public protocol references remain available independently of optional content-opening holdings; an unavailable opening does not remove the structural reference.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-removable-projections", environment = "definition", statement = "Model content and dependency commitments and their separately available openings without changing the immutable act.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-dependency-projection", environment = "definition", statement = "Bind one canonical, bounded, duplicate-free dependency set with no self-reference. Its act identifiers require lower keys of record, not a right to inclusion; a committed empty set is distinct from a missing opening.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "case:graph:act-dependency-projection-full-empty", environment = "case", statement = "Within the optional courtesy standard: The holder has the verified canonical empty dependency list and its opening. This observation of holdings is distinct from a missing or tombstoned opening and is never a graph state.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "case:graph:act-dependency-projection-full", environment = "case", statement = "Within the optional courtesy standard: A holder has the canonical dependency list and its opening, bound to the act. This describes that holder’s holdings, never a graph state; independently supplied authenticated opening material remains checkable after another holder removes its copy.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "case:graph:act-dependency-projection-tombstoned", environment = "case", statement = "Within the optional courtesy standard: The dependency list, the author’s dependency blinding value and other opening material are removed from this holder while the binding commitment remains. This is a holder’s observation, never a graph state or a bar to checking an independently supplied authenticated opening.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "def:graph:act-dependency-tombstone", environment = "definition", statement = "Within the optional courtesy standard: A holder removes the dependency list, the author’s dependency blinding value and other opening material, ending its storage or carriage undertaking without changing the accepted act or structural history. Independently supplied authenticated opening material remains checkable against the unchanged commitment.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:authentication-realization-out-of-scope", environment = "remark", statement = "Epoch acceptance belongs to oracle agreement; the epoch has no signature or seal, while act approvals authorize their own exact bytes and confer no epoch acceptance.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:author-commitment-preparation", environment = "definition", statement = "The author prepares the complete tuple before approval; structural body contains edge shape, incidence and semantic coordinates, while public references are a separate projection. No host entropy, seal, residue or ordering field enters it.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:verified-act", environment = "definition", statement = "A verified act is the complete structurally well-formed tuple with author-formed commitments and a valid approval of their exact association; no bare signing subject alone supplies the witness.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:approval-witness", environment = "definition", statement = "One author signature covers identifier, author, family, structural body, references and both commitments in exact association; key validity is not Actor authority.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:ordering-fraud-proof", environment = "definition", statement = "An authenticated complete dependency opening, approved act and declared order can establish absent or nonpreceding dependencies without rewriting the completed calculation.", kind = "certificate", crate = "pn-records", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "post:graph:ordering-accountability", environment = "postulate", statement = "Ordering and authenticated dependency evidence can show a placement violation without rewriting completed records or consequences; optional stamp accountability is a separate courtesy.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "post:graph:act-authentication-requirements", environment = "postulate", statement = "Check recorded complete-act approval, approved-byte integrity, transparency, hyper-act unity, retained binding and opening-qualified ordering accountability; key authority is a separate oracle assessment.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-signature-verification", environment = "item", statement = "Verify the recorded complete-act approval under the key mapped to its exact signed bytes, without inferring that key’s authority for the Actor.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-approved-act-integrity", environment = "item", statement = "Detect substitution of any act projection after approval; no opaque annex is introduced and the approval binds the other projections in their exact association.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-transparency", environment = "item", statement = "Place the complete act, including both commitments, within its recorded approval; no host contribution is required.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-approval", environment = "item", statement = "Only a completion-ready act covered by a well-formed recorded approval is eligible for the authoritative sequence.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-unity", environment = "item", statement = "Require both hyper-edge projections to resolve to the same approved parent act.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-projection-binding", environment = "item", statement = "Retain opening-independent binding of the approved act.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-ordering", environment = "item", statement = "Where dependency compliance is claimed, retain public evidence that can establish a violation without changing completed history.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:act-completion-epoch", environment = "definition", statement = "Identify the first accepted epoch of an act and compare title events at that granularity.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:title-order-irrelevance", environment = "remark", statement = "Settlement references and cited-state eligibility use counted ancestry and same-epoch causal layers. Residual order does not choose a branch or delete a completed child.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "post:graph:boundary-accountability", environment = "postulate", statement = "Expose the complete written-set partition and resolve the asserted timestamp; auditing duration bounds requires external measurement and selected records establish no treatment of unwritten submissions.", kind = "certificate", crate = "pn-host", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:settlement-clause-structure", environment = "remark", statement = "Separate membership and binding, cited-state party authorization, buyer/seller challenge evidence and causal well-formedness; challenge evidence does not veto structural completion.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "def:graph:title-certificate", environment = "definition", statement = "Compute the shared branch graph, terminal Actors and pending/attached epoch-stamped challenges from sufficient supplied state and acts; a named path and epoch select a reading, and an optional displayed copy remains optional.", kind = "certificate", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:cancellation-best-effort", environment = "remark", statement = "Written cancellation attaches challenge evidence whenever accepted, including after completion; submission promises no inclusion and does not bypass ordinary write gates.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "thm:graph:settlement-order-freeness", environment = "theorem", statement = "Permitted processing order leaves the same completed branches and challenge unions keyed by Accept and cancellation identities; dates are attached replay evidence.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "thm:graph:no-death-by-inaction", environment = "theorem", statement = "No per-object timeout creates a terminal Dead state; completed branches persist and written cancellation can continue.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:causal-locality-principle", environment = "remark", statement = "Permit global progress gates but no settlement state change triggered by its own inactivity.", kind = "policy", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "rem:graph:settlement-reputation", environment = "remark", statement = "A terminal policy may interpret the signed settlement stances; it does not change title or standing and cannot establish an external commercial event. The deterministic conjunction is rem:graph:settlement-coordinate-conjunction.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "courtesy" },
  { chapter = "04 Graph", label = "rem:graph:reviews-commentary", environment = "remark", statement = "Reviews do not change title and resolve their standing allocation home.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "subsec:graph:consumer-map", environment = "subsection", statement = "Track consumer map as a separately addressable subsection.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "04 Graph", label = "tbl:graph:consumer-map", environment = "table", statement = "Route each geometry output only to its named consumer and keep raw legs out of standing compilation.", kind = "policy", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "sec:nodes", environment = "section", statement = "Track nodes as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:universal-principles", environment = "subsection", statement = "Keep opaque Actor identity, incidence roles, complete-act unity and accounting consistent; optional logical time is not an independent closure member.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "post:nodes:canonical-tensor-pipeline", environment = "postulate", statement = "Assign parameter roles, form the masked slice, soften the path view and extract temporal and attribution interfaces.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-role-assignment", environment = "step", statement = "For every binary edge or hyper-edge leg, assign the domain parameters to directional and intensity roles; for a single-parameter edge set the missing role to one.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-extended-slice", environment = "step", statement = "Compute each extended tensor slice with the master sentiment-slice formula and its domain bilinear mask.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-path-view", environment = "step", statement = "Extract the path view from each extended slice using the declared bleed softening.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-temporal-augmentation", environment = "step", statement = "Augment the extended slice by its outer product with the temporal vector (1, tau).", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-interface-extraction", environment = "step", statement = "Expose the scalar interface as the extended slice Frobenius norm times sqrt(1+tau squared), the path interface as the extracted path view, and the attribution interface as the unaugmented Frobenius norm.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:row-collapse", environment = "remark", statement = "Type-fixed missing parameters equal one and cannot be user-selected to exploit row duplication.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:standing-recipient-resolution", environment = "subsection", statement = "Weigh all accepted acts once and route non-person activity into self-retention.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:coherence-does-not-allocate", environment = "remark", statement = "Positive raw parity never substitutes for complete eligible positive-coordinate acts.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
