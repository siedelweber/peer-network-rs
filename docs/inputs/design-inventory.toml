  { chapter = "F Verification", label = "ver:standing:hop-order-convention", environment = "labelled fixture paragraph", statement = "Check source-adjacent hop ordering; source-rate hulls bound completed states but do not prove resistance to every own-row strategy.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:self-retention-manipulation", environment = "labelled fixture paragraph", statement = "Using the declared reference pairs and one vouch, append one coefficient-one self-resolved act with no new actor entry; check the debit/count decrease in own ledger rate and report equilibrium movement within the two completed hulls. This diagnostic proves no universal retention-strategy resistance or act-response direction.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:no-tilt-anchor", environment = "labelled fixture paragraph", statement = "Check state independence and zero derivative and fence; bitwise equality requires the declared exact input and encoding profile.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
