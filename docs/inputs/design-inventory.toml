  { chapter = "F Verification", label = "ver:pathology:symmetric-apportionment", environment = "labelled fixture paragraph", statement = "Check exact symmetry of equal routes in the declared allocation fixture; general input relabeling has its own transport diagnostic.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:transport-equivariance", environment = "verification", statement = "Relabel the complete declared graph, ledger and parameters and check transport and equilibrium permutation defects within the certified comparison allowance; no Actor-splitting conclusion follows.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "subsec:verification:frame-gross-response", environment = "subsection", statement = "Group exact ledger and directed enclosure frame-response comparisons under the specified constants, policy and certificate; an unresolved response sign fails the stated verification claim, not a new admission rule.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:frame-gross-fixed-rung", environment = "labelled fixture paragraph", statement = "Check certified own, reached-sibling and unreached-sibling reversals in separate saturated fixed-positive-rung fixtures; strict signs do not imply prevalence.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:frame-gross-depleted-anchor", environment = "labelled fixture paragraph", statement = "Check the exact negative reached-recipient derivative and finite change with a depleted source at the accepted anchor; the effect is signed direct emission forcing.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:frame-gross-rung-switch", environment = "labelled fixture paragraph", statement = "Check one fixed refinement procedure across rational ledgers bracketing a rung threshold; positive frame gross increments shrink while a finite loss persists, without claiming termination at exact equality.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:act-response", environment = "verification", statement = "Check both signs in separate complete accepted-act comparisons and the isolated loss formula; without a finite source ceiling the absolute loss can be unbounded even at zero widths.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:standing:frame-gross-response-sharpness", environment = "labelled fixture paragraph", statement = "Compare certified local and finite responses with scalar, matrix and signed-series bounds using positive bound denominators; relative harm uses direct own forcing, not net own response.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:pathology:equal-rate-field", environment = "labelled fixture paragraph", statement = "Check equal-rate fixed points and zero Jacobian.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "ver:pathology:depleted-source-ballast", environment = "labelled fixture paragraph", statement = "Recompute the declared two-actor giant fixture under the current emitted operator.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "F Verification", label = "subsec:verification:shared-fixture", environment = "subsection", statement = "The independent reference point agrees within the certified conserved-equilibrium enclosures and declared allowance on the exact shared inputs; depth and relabeling diagnostics are separate results.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
