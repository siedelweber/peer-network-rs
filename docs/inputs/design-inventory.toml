  { chapter = "04 Graph", label = "itm:graph:hyper-edge-reduction-attribution", environment = "item", statement = "For attribution, take each hyper-edge leg as an independent CAN base value and compose them at depth one with redundancy one.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:hyper-edge-reduction-standing", environment = "item", statement = "Consume a hyper-edge once in standing exactly when its family is in the closed person-vouch census and the act is complete. Neither leg is an independent standing edge; forbid unmatched terminal-leg entry or substitution of an unrelated incoming leg, and omit the passive middle artifact from the projected standing path.", kind = "invariant check", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "cor:graph:standing-act-atomicity", environment = "corollary", statement = "Accept a designated complete hyper-act for standing or contribute no outward standing through it.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "subsec:graph:interaction-domains", environment = "subsection", statement = "Track interaction domains as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "tbl:graph:interaction-domains", environment = "table", statement = "Represent domain masks and distinguish defaults from the normative per-family census.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:mask-promotion-criterion", environment = "definition", statement = "Promote signed target-stance masks according to the census rather than self-report semantics.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:proposal-half-tier", environment = "definition", statement = "Apply Half routing floors to settlement and conversational proposal families while preserving stored slices.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "subsec:graph:settlement-lifecycle", environment = "subsection", statement = "Track settlement lifecycle as a separately addressable subsection.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:item-genesis-act", environment = "definition", statement = "Root Item title in its self-minting Owner act; structural identity survives payload removal but does not establish real-world referent identity.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:item-identity-limit", environment = "remark", statement = "Treat title as ownership of a registered claim, not proof of a real-world referent.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:settlement-act-reference", environment = "definition", statement = "Accept and Ratify name the Bid act, and Ratify also names the exact Accept.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:act-causal-parents", environment = "definition", statement = "Retain backward public causal references as immutable metadata without graph incidence.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:dependent-act-set", environment = "definition", statement = "Close candidate acts under causal ancestors and retain whole hyper-act projections.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "cor:graph:act-projection-atomicity", environment = "corollary", statement = "Admit both hyper-act projections together without introducing a causal cycle.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:dependency-closure-excludes-conflicts", environment = "remark", statement = "Do not expand causal dependency closure to concurrent cancellation conflicts.", kind = "policy", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:public-protocol-reference", environment = "definition", statement = "Keep formation and settlement references available after every removable projection is tombstoned.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:act-removable-projections", environment = "definition", statement = "Model content and dependency openings separately over immutable commitment residues.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:act-dependency-projection", environment = "definition", statement = "Encode a bounded versioned sorted unique act-identifier set with explicit empty and tombstoned states.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "case:graph:act-dependency-projection-full-empty", environment = "case", statement = "Track act dependency projection full empty as a separately addressable case.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "case:graph:act-dependency-projection-full", environment = "case", statement = "Track act dependency projection full as a separately addressable case.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "case:graph:act-dependency-projection-tombstoned", environment = "case", statement = "Track act dependency projection tombstoned as a separately addressable case.", kind = "serialization", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:act-dependency-tombstone", environment = "definition", statement = "Remove dependency carriage without deleting or recomputing finalized structural history.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:authentication-realization-out-of-scope", environment = "remark", statement = "Leave cryptographic algorithms, key management and wire realization to explicit deployment decisions.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:proposal-pre-commitment", environment = "definition", statement = "Bind the actor proposal and requested projection states before host salts or ordering.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:verified-act", environment = "definition", statement = "Represent the validated host-sealed header with separate commitment editions and no order fields.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:approval-witness", environment = "definition", statement = "Only the exact actor-approved verified act is eligible for candidate ordering.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:ordering-fraud-proof", environment = "definition", statement = "An ordinary full dependency opening can demonstrate a finalized ordering violation.", kind = "certificate", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "post:graph:ordering-accountability", environment = "postulate", statement = "A successful ordering fraud proof attributes fault without rewriting final history.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "post:graph:act-authentication-requirements", environment = "postulate", statement = "Require authorship, integrity, visible host additions, exact approval, hyper-act unity and retained binding.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-authorship", environment = "item", statement = "Before authoritative-sequence eligibility, require publicly checkable evidence that the named Actor authorized the proposal.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-proposal-integrity", environment = "item", statement = "Make host substitution of the proposal’s structural body, removable payload projection, dependency projection or requested publication state detectable before authoritative-sequence eligibility.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-transparency", environment = "item", statement = "Show the Actor every host-added field of the finalizable act before final approval.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-approval", environment = "item", statement = "Admit to the authoritative sequence only the exact finalizable act the Actor approved.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-unity", environment = "item", statement = "Require both hyper-edge projections to resolve to the same approved parent act.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-projection-binding", environment = "item", statement = "Removing a projection opening must not allow the immutable act to be rebound to a different payload or dependency value.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:act-authentication-requirements-ordering", environment = "item", statement = "Where dependency compliance is claimed, retain public evidence that can establish a violation without changing finalized history.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:act-finalization-epoch", environment = "definition", statement = "Identify the first accepted epoch of an act and compare title events at that granularity.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:act-envelope", environment = "definition", statement = "Publish the accepted act identifier, author, family, body, protocol references, causal parents, commitments, handshake, approval witness, finalization epoch and act time as an abstract envelope, with payload bytes, salts and dependency opening beside it and serialization left to deployment.", kind = "type", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:settlement-recognition", environment = "definition", statement = "Check the six recognition clauses including prior ownership and co-epoch cancellation precedence.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:settlement-recognition-completeness", environment = "item", statement = "Recognize a settlement candidate only if its Bid, Accept and Ratify acts are present with their edge projections in the final epoch edge set.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:settlement-recognition-reference-binding", environment = "item", statement = "Require both Accept and Ratify settlement references to resolve to the identifier of the Bid act that opened the Offer.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:settlement-recognition-authorization", environment = "item", statement = "Require the Accept author to be the certified owner at the boundary immediately before the Ratify’s finalization epoch, using the genesis owner for a fresh thread.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:settlement-recognition-buyer-consent", environment = "item", statement = "Refuse settlement recognition if a buyer Withdraw on the Offer finalizes no later than the Ratify’s epoch; a same-epoch cancellation defeats consent.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:settlement-recognition-seller-consent", environment = "item", statement = "Refuse settlement recognition if a seller Rescind on the Offer finalizes no later than the Ratify’s epoch; a same-epoch cancellation defeats consent.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "itm:graph:settlement-recognition-well-formedness", environment = "item", statement = "Check the observed handshake order Bid before Accept before Ratify as well-formedness only; it provides no tie breaker.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:title-order-irrelevance", environment = "remark", statement = "Title uses epoch membership and reference-forced handshake order rather than host tie-breaking.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "post:graph:boundary-accountability", environment = "postulate", statement = "Publish partition, constraints, closure cause and timestamp while granting no inclusion rights.", kind = "certificate", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:settlement-clause-structure", environment = "remark", statement = "Recognition reads membership, pointers, prior title and epoch indices without audit positions.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:ownership-thread", environment = "definition", statement = "Follow boundary transfers from genesis and distinguish failed claims from ordinary description updates.", kind = "type", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:settlement-consumption", environment = "definition", statement = "Consume every recognized unchallenged co-epoch candidate permanently even when conflicts prevent transfer.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "def:graph:title-certificate", environment = "definition", statement = "Map each Item to its thread terminal owner or void.", kind = "certificate", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "thm:graph:epoch-title-fold", environment = "theorem", statement = "Transfer on one candidate, retain incumbent on zero or multiple candidates, and consume conflicts.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:regret-window", environment = "remark", statement = "Treat the boundary certificate as finality and keep cancellation subject to inclusion.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:cancellation-best-effort", environment = "remark", statement = "Cancellation wins an admitted co-epoch tie but has no guaranteed delivery.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "thm:graph:settlement-order-freeness", environment = "theorem", statement = "Preserve title under residual sub-epoch permutations of a fixed epoch partition.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "thm:graph:no-death-by-inaction", environment = "theorem", statement = "Require authored settlement transitions rather than per-object expiry.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:causal-locality-principle", environment = "remark", statement = "Permit global progress gates but no settlement state change triggered by its own inactivity.", kind = "policy", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:settlement-reputation", environment = "remark", statement = "Standing reads complete folded acts. Accept and Ratify allocate outward only with positive mandatory folded coordinates and recognized, unchallenged, title-transferring candidates; otherwise they resolve to self while remaining weighed, priced and counted. Raw parity remains recognition-blind and proves no external assertion.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:reviews-commentary", environment = "remark", statement = "Reviews do not change title and resolve their standing allocation home.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "rem:graph:settlement-cross-layer", environment = "remark", statement = "Publish a deterministic title commit anchor without promising custody or payment atomicity.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "alg:graph:title-certificate-computation", environment = "algorithm", statement = "Replay epoch partitions to compute title with single-candidate transfer and conflict consumption.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "subsec:graph:consumer-map", environment = "subsection", statement = "Track consumer map as a separately addressable subsection.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "04 Graph", label = "tbl:graph:consumer-map", environment = "table", statement = "Route each geometry output only to its named consumer and keep raw legs out of standing compilation.", kind = "policy", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "sec:nodes", environment = "section", statement = "Track nodes as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:universal-principles", environment = "subsection", statement = "Enforce act authorship, shared time, tensor roles, complete hyper-acts, opaque payloads and census-only allocation.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "post:nodes:canonical-tensor-pipeline", environment = "postulate", statement = "Assign parameter roles, form the masked slice, soften the path view and extract temporal and attribution interfaces.", kind = "function", crate = "pn-graph", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-role-assignment", environment = "step", statement = "Track canonical tensor pipeline role assignment as a separately addressable step.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-extended-slice", environment = "step", statement = "Track canonical tensor pipeline extended slice as a separately addressable step.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-path-view", environment = "step", statement = "Track canonical tensor pipeline path view as a separately addressable step.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-temporal-augmentation", environment = "step", statement = "Track canonical tensor pipeline temporal augmentation as a separately addressable step.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "step:nodes:canonical-tensor-pipeline-interface-extraction", environment = "step", statement = "Track canonical tensor pipeline interface extraction as a separately addressable step.", kind = "function", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:row-collapse", environment = "remark", statement = "Type-fixed missing parameters equal one and cannot be user-selected to exploit row duplication.", kind = "invariant check", crate = "pn-graph", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:standing-recipient-resolution", environment = "subsection", statement = "Weigh all accepted acts once and route non-person activity into self-retention.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:coherence-does-not-allocate", environment = "remark", statement = "Positive raw parity never substitutes for complete eligible positive-coordinate acts.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:affordance-traits", environment = "subsection", statement = "Enforce class-syntactic target typing, allow ordinary updates and require Bid to mint a fresh Offer.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "tbl:nodes:affordance-traits", environment = "table", statement = "Assign Taggable, Reviewable, Ownable and Conversational capabilities to the declared passive types.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:active-node", environment = "subsection", statement = "Track active node as a separately addressable subsection.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "node:nodes:actor", environment = "node specification", statement = "Actor is the sole active author type with a grounded burn address.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "05 Nodes and edges", label = "eq:nodes:connectivity:actor", environment = "equation", statement = "Enforce the declared incoming and outgoing projection families for actor identifiers.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "rem:nodes:anchoring-and-relational-support", environment = "remark", statement = "Assign standing only to anchored actors and never manufacture source with the activation clamp.", kind = "invariant check", crate = "pn-epoch", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "subsec:nodes:leaf-passive-nodes", environment = "subsection", statement = "Track leaf passive nodes as a separately addressable subsection.", kind = "invariant check", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "node:nodes:profile", environment = "node specification", statement = "Profile is the unique passive grounded partner of an Actor and identifies a person-directed target.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "05 Nodes and edges", label = "eq:nodes:connectivity:profile", environment = "equation", statement = "Enforce the declared incoming and outgoing projection families for profile identifiers.", kind = "invariant check", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "05 Nodes and edges", label = "node:nodes:content", environment = "node specification", statement = "Content is a minted Taggable and Reviewable artifact with Publish genesis.", kind = "type", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
