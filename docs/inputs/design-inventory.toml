  { chapter = "F Verification", label = "ver:handshake:salting", environment = "labelled fixture paragraph", statement = "Check distinct per-act salts and reject modified returned commitments.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "F Verification", label = "ver:handshake:approval", environment = "labelled fixture paragraph", statement = "Reject missing, altered or transplanted actor approvals.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "F Verification", label = "ver:handshake:atomicity", environment = "labelled fixture paragraph", statement = "Reject missing or inconsistent hyperedge projections and leg-addressed dependencies.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "F Verification", label = "ver:handshake:ordering", environment = "labelled fixture paragraph", statement = "Check prior and same-epoch dependency order, cycles and unconstrained permutations.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "F Verification", label = "ver:handshake:tombstoning", environment = "labelled fixture paragraph", statement = "Retain commitments and binding results while refusing carriage restoration.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "F Verification", label = "ver:handshake:fraud", environment = "labelled fixture paragraph", statement = "Verify dependency openings and ordering fault without reversing finalized state.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "F Verification", label = "ver:handshake:title", environment = "labelled fixture paragraph", statement = "Check exact settlement references, same-epoch cancel precedence and conflict consumption.", kind = "fixture", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "G Frontiers", label = "app:frontiers", environment = "appendix", statement = "Inventory open questions affecting comparator claims and specified architectural extensions, each with scope, requirements and stake. One Layer-1 open problem concerns sharp funded-partition guarantees; six entries are architectural extensions, and neither universal splitting invariance nor universal burn monotonicity remains an open assertion.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "G Frontiers", label = "def:frontiers:open-problem", environment = "definition", statement = "An open problem must be capable of changing a needed admission, faithfulness or convergence claim or requirement; an already proved bound or a deployment choice with fixed validation is not one merely because it could be sharpened. One Layer-1 open problem concerns sharp funded-partition guarantees, beside six architectural extensions.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "G Frontiers", label = "rem:frontiers:priority", environment = "remark", statement = "Prioritize sharp funded-partition guarantees for faithfulness, exact conserved evaluation and the boundary mechanism for implementation, with declared work envelopes and certificate/emission monitoring. A tighter certificate requires a specified stronger charter; proved counterexamples and invariants delimit the remaining questions.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "G Frontiers", label = "subsec:frontiers:core", environment = "subsection", statement = "Distinguish the remaining funded-partition questions from their evidence and stake in comparator claims. Neither the open status nor its evidence licenses a new rule without stated hypotheses and consequences.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "G Frontiers", label = "frontier:allocation-split-invariance", environment = "frontier (core)", statement = "General funded-partition invariance is false. Keep sharp advantage bounds, structural invariant partitions and controlled admission/reward comparisons open; pair totals, closed weighted means and equal-rate invariants survive, and concentration can approach a whole hull width.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "G Frontiers", label = "subsec:frontiers:architectural", environment = "subsection", statement = "Distinguish implementation and phase-dependent mechanism tasks from conditional richer tensors, sign transport and replacement certificates; no extension silently changes the operative charter.", kind = "policy", crate = "pn-replay", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "G Frontiers", label = "frontier:boundary-mechanism", environment = "frontier (arch)", statement = "Expose accepted-set agreement and duration accountability without inventing decentralized consensus.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "G Frontiers", label = "frontier:high-dimensional-sentiment", environment = "frontier (arch)", statement = "Changing the operative tensor or temperature requires charter adoption with rank, determinant, composition, replay and multivariate-maturity evidence; extra coordinates alone establish none of these.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "G Frontiers", label = "frontier:typed-sign-transport", environment = "frontier (arch)", statement = "Keep composing path coherence distinct from locally gated stance. A richer order-sensitive sign or rotation path extension is terminal/guild-owned unless ordered-replay determinism is re-proved; it is outside the Layer-1 core.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "G Frontiers", label = "frontier:exact-conserved-evaluation", environment = "frontier (arch)", statement = "Benchmark whether the proved sparse per-pass bound fits the deployed boundary duration with real layout, hop blocking and memory locality. Publish the first capacity bottleneck; dropping small base relations is forbidden.", kind = "policy", crate = "pn-epoch", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "G Frontiers", label = "frontier:incremental-equilibrium-solver", environment = "frontier (arch)", statement = "Reuse exact projections, component invalidation, trial deltas and candidate warm starts without semantic dependence on prior standing; prove deterministic equality with from-scratch evaluation before benchmarking savings.", kind = "fixture", crate = "pn-verification", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "G Frontiers", label = "frontier:certificate-enclosure", environment = "frontier (arch)", statement = "Only a specified stronger charter can propose a global replacement certificate: state the required rung and graph class the width fence cannot certify, prove soundness including wall kinks, and report cost, interval overestimation or equality. The operative fence remains authoritative; no implementation chooses whichever gate passes.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "environment" },
  { chapter = "H Necessity", label = "app:necessity", environment = "appendix", statement = "Track necessity as a separately addressable appendix.", kind = "none", crate = "pn-verification", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "H Necessity", label = "subsec:necessity:directed-edges", environment = "subsection", statement = "Preserve directed incidence while flagging the claim that every projection source is active.", kind = "invariant check", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
