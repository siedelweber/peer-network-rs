  { chapter = "7 Sorting", label = "subsec:sorting:score-monotonicity", environment = "subsection", statement = "Track score monotonicity as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "thm:sorting:score-monotonicity", environment = "theorem", statement = "Inventory the stated terminal score monotonicity conditions.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-standing", environment = "item", statement = "With every other feed factor fixed, score is nondecreasing in published creator standing. That scalar-input derivative supplies no universal burn or act response, partition invariance or ranking guarantee.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-quality", environment = "item", statement = "With other score inputs fixed, require feed score to be nondecreasing in the content tensor’s Frobenius norm.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-coherence", environment = "item", statement = "With other score inputs fixed, require feed score to be nondecreasing in the absolute path-view determinant of any path edge.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-maturity", environment = "item", statement = "Treat feed maturity response as non-monotone, with the stated minimum near one half and net amplification only beyond the maturity crossing.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-entropy", environment = "item", statement = "With other score inputs fixed, require feed score to be nonincreasing in tensor entropy.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-diversity", environment = "item", statement = "For positive diversity preference and fixed other score inputs, require feed score to be nondecreasing in the second singular value.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-focus", environment = "item", statement = "For positive diversity preference, require the score’s condition-number derivative to be nonpositive when the first singular value exceeds the second; the isotropic case is excluded from that premise.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "7 Sorting", label = "itm:sorting:score-monotonicity-profile-bridge", environment = "item", statement = "On a fixed raw profile-bridged feed path, score is nondecreasing in the creator’s published standing through both the raw bridge factor and terminal amplifier. This is not a standing-transport property; burn or act changes require a separate completed-field comparison.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "sec:transport", environment = "section", statement = "Track transport as a separately addressable section.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "subsec:transport:commitment-via-burn", environment = "subsection", statement = "Track commitment via burn as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "def:transport:commitment-via-burn", environment = "definition", statement = "Read nonnegative cumulative burn amounts and inherited settlement properties through the burn interface.", kind = "function", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "rem:transport:burn-granularity", environment = "remark", statement = "Represent reduced source rates to at least eight significant figures without treating rounded gates as valid.", kind = "policy", crate = "pn-records", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "subsec:transport:guild-model", environment = "subsection", statement = "Track guild model as a separately addressable subsection.", kind = "policy", crate = "pn-records", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "post:transport:guild-grant", environment = "postulate", statement = "Permit terminal guild reinterpretations within the declared grant constraints, without changing binding standing or inferring that funding increases standing or preserves terminal context.", kind = "policy", crate = "pn-host", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "rem:transport:guild-grant-preconditions", environment = "remark", statement = "Guilds may reinterpret terminal commercial assertions but cannot replace the title fold or standing recipient rule; unrecognized, challenged or non-transferring settlements resolve to self, without a promised terminal remedy.", kind = "policy", crate = "pn-host", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "rem:transport:guild-grant-cases", environment = "remark", statement = "Guild choices are terminal reimplementations with public rules and canonical defaults; every CAN replacement retains depth decay, transmission below one and context independence without changing binding values or closure.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "case:transport:membership-policy", environment = "case", statement = "Choose a published terminal membership and sorting policy; the canonical fold admits participation and departure with advisory De-invites, without conditioning admission, departure or De-invite authoring.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "case:transport:deep-composition", environment = "case", statement = "Choose composition depth and scalar or matrix representation; the default scalar CAN follows the dependency DAG, and every choice preserves depth decay, transmission below one and context independence.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "case:transport:svd-corrected-transmission", environment = "case", statement = "Optionally replace saturated mean edge norms by the saturated top singular value of the mean matrix; the full recursion must retain the CAN invariants.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "case:transport:can-aggregation-function", environment = "case", statement = "Choose the aggregation function; arithmetic mean is canonical, while alternatives must preserve depth decay, strict transmission and context independence.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "case:transport:bridge-multi-bridge", environment = "case", statement = "Choose public bridge composition and attribution; the canonical single-bridge rule takes the outer maximum per recipient, and replacements must re-establish any claimed canonical guarantees.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "case:transport:bridge-eligibility-cliff", environment = "case", statement = "A guild chooses smoothing, with the unsmoothed single-bridge maximum as canonical default; a replacement accounts for redundancy amplification and inherits or re-derives each canonical guarantee it claims. Separately, the centralized-phase operator publishes an argmax-flip-rate threshold and a share-volatility companion, the ℓ1 distance between consecutive normalized share vectors, both computable from epoch-certificate data. Exceeding the threshold obliges the operator to publish a reference top-k ensemble composition rule; its use remains terminal and optional under the guild grant. This publication is a required policy; the implementation home is held in (`open:inventory:bridge-reaction-placement`).", kind = "policy", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "case:transport:bridge-delivery-semantics", environment = "case", statement = "Use the canonical campaign scalar as circuit quality; privately observed traversal supplies no self-sufficient record, and adding a navigation edge type lies outside the terminal grant.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "case:transport:notoriety-field", environment = "case", statement = "Optionally declare a terminal negative aggregation; the canonical choice has no separate field, retains public negative records outside standing endorsement and gives them no feedback into admission or standing.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "rem:transport:guild-economic-autonomy", environment = "remark", statement = "Leave payout units, margins and pool funding to published guild policy.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "subsec:transport:advertiser-objective", environment = "subsection", statement = "Track advertiser objective as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "eq:transport:campaign-scalar", environment = "equation", statement = "Inventory the terminal weighted best-circuit campaign score.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "rem:transport:actor-targets", environment = "remark", statement = "Restrict the canonical advertiser target population to actors.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "subsec:transport:reward-formula", environment = "subsection", statement = "Track reward formula as a separately addressable subsection.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "eq:transport:reward-formula", environment = "equation", statement = "Inventory the normalized terminal reward formula and its positive-improvement gate. With fixed creators, positive normalization and fixed non-standing factors, conditional input bounds apply; they establish no general burn or funded-partition reward effect.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "tbl:transport:layer-origins", environment = "table", statement = "Expose records, scalar standing and geometry as inputs without implementing rewards.", kind = "fixture", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "eq:transport:epoch-entropy", environment = "equation", statement = "Average creator edge entropy for the terminal reward factor.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "rem:transport:cross-channel-commitment-amplification", environment = "remark", statement = "Expose certified standing as a fixed scalar rather than a replaceable raw-graph recomputation. Feed attention and pool funds reuse that scalar as distinct resources, not a double count; fixed-context sensitivity implies no monotone burn or act response.", kind = "policy", crate = "pn-readouts", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "subsec:transport:properties", environment = "subsection", statement = "Track properties as a separately addressable subsection.", kind = "policy", crate = "pn-readouts", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "pty:transport:final-standing-input-monotonicity", environment = "property", statement = "With other creator-varying factors fixed, canonical reward share is nondecreasing in the published reduced-standing input through one plus that input. Burn, act and funded-partition effects require separate field and fixed-context comparisons.", kind = "none", crate = "none", citable = false, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "prop:transport:standing-readout-bounds", environment = "proposition", statement = "Bound feed and normalized reward sensitivity only with the specified creators, factors, pool and gate fixed and positive normalization; this is not an end-to-end burn, partition or ranking guarantee.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "cor:transport:zero-reward", environment = "corollary", statement = "Assign zero canonical reward when campaign improvement is nonpositive.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "thm:transport:epoch-entropy-damping", environment = "theorem", statement = "For a positive gate and pool with other factors and competing entropies fixed and a positive denominator, increasing own entropy never increases reward. Decrease is strict only with positive own and competing contributions; zero and sole contributions give equality, and an all-zero denominator gives no allocation claim.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "thm:transport:reward-proportionality", environment = "theorem", statement = "Inventory proportional terminal allocation among contributing creators. Use composite utility under the open improvement gate and positive normalization; a partition comparison must hold its terminal context fixed and supplies no end-to-end reward guarantee.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
  { chapter = "8 Transport", label = "prop:transport:split-terminal-readout-bounds", environment = "proposition", statement = "Translate partition standing bounds into terminal bounds only with creators and all non-standing factors matched; changed authorship, paths, attribution and guild factors need separate hypotheses.", kind = "none", crate = "none", citable = true, current_at = "network-v0.29.1", label_source = "explicit" },
