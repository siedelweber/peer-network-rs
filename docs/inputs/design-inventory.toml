  { chapter = "B Compositional attribution", label = "case:can:intrinsic-value-leaf-value", environment = "case", statement = "Branch of ``def:can:intrinsic-value``: At CAN depth zero, intrinsic value is the base value, the raw extended slice Frobenius norm.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
  { chapter = "B Compositional attribution", label = "case:can:intrinsic-value-recursive-value", environment = "case", statement = "Branch of ``def:can:intrinsic-value``: At positive CAN depth, intrinsic value is transmission times redundancy times the sum of dependency-weighted child intrinsic values.", kind = "none", crate = "none", citable = true, current_at = "network-v0.37.4", label_source = "explicit", material_class = "closure" },
