namespace = "org.peer-network.host.profile"
version = [1, 0, 0]

[[rows]]
name = "deployment"
category = "allocation"
namespace = "org.peer-network.test.publication"
major = 1
minor = 0
allocator = "repository maintainers for the centralized test deployment"
theory = "publication"
status = "reserved; complete theory and independent vectors pending"
owner = "lane/design"

[[rows]]
name = "act"
category = "allocation"
namespace = "org.peer-network.test.act"
major = 1
minor = 0
allocator = "repository maintainers for the centralized test deployment"
theory = "act-envelope"
status = "reserved; complete theory and independent vectors pending"
owner = "lane/design"

[[rows]]
name = "accepted-set"
category = "choice"
value = "complete-list"
reason = "A finite complete list exposes every member and both acceptance bounds directly, without an additional opening-availability dependency."
owner = "lane/design and lane/graph"

[[rows]]
name = "finality-response"
category = "choice"
value = "freeze-and-reanchor"
reason = "Loss of a final marker freezes the last closed state and publishes the fault; resumption requires an explicit reviewed re-anchor and a new published policy edition, preserving the old history."
owner = "lane/design"

[[rows]]
name = "accepted-records"
category = "section"
key = 2
fields = ["epoch and predecessor boundary", "authoritative ordered act identifiers and complete accepted envelopes", "final edge union with parent-act and leg references", "complete finalized prior-history references", "disjoint dependent blocks and authoritative positions", "realized size, closure cause, clock, opening and determination times, attested boundary timestamp and earliest-determination evidence"]

[[rows]]
name = "final-ledger"
category = "section"
key = 3
fields = ["shared recognized marker and policy reference", "gross settled burn snapshot, destruction identities, address attribution and first-acceptance increments", "final residual balance and final action count per Actor", "accepted-act increments per Actor", "immutable debit vintages: charged amount, numeraire, policy, effective boundary and predecessor ledger", "units and exact admitted rational charged values"]

[[rows]]
name = "semantic-projection"
category = "section"
key = 4
fields = ["every accepted Actor-authored act and complete structural projections", "fold-cell membership and coefficient with exact defining object", "recipient resolution including neutral and unresolved outcomes", "normalized family domain profiles and separate domain weights", "Actor and support ordering, self-retention and sparse base allocation"]

[[rows]]
name = "allocation-transport"
category = "section"
key = 5
fields = ["tilt shape and finite backoff grid", "accepted rung and each attempted higher rung with PASS, FAIL or INDECISIVE", "depth masses and deepest supported depth", "source emission fractions", "hop allocation factors and full support sufficient to reconstruct the conserved emitted transport"]

[[rows]]
name = "standing-admission"
category = "section"
key = 6
fields = ["rate hull and contributing width", "certificate scalar, clearance and verdict", "fixed-point enclosure and final standing", "final action and epoch stamps", "door headroom", "own-balance solvency, individual safety and final epoch admission verdicts with comparison evidence"]

[[rows]]
name = "closure-policy"
category = "section"
key = 7
fields = ["title certificate and settlement recognition with resolved parties and act references", "target size and minimum and maximum durations", "fixed structural declaration, numeraire and exact floor defining object", "wall and rational price in force, policy-floor and threshold schedules and margin", "controller edition, initialization, reduced constants and complete retained policy history", "completed width and rung, proposal, delivered led wall and burn image", "publication marker, pair, numeraire, policy and proposal; sequence declaration carried once"]

[[rows]]
name = "reproduction"
category = "section"
key = 8
fields = ["formula editions, exact constants and activation definitions", "immutable marker policy identity, edition, placement, cadence, initial marker and settlement/finality assumptions", "recognized marker, predecessors, fixed interpretation data and settled lineage evidence", "complete accepted sets and destruction/member evidence, including uniquely verifiable openings for commitment conformance", "numerical procedure edition, precision, refinement, equality, stopping and resource settings", "defining ridge, rational charge, complete floor comparison and charge replay attachments", "public interval boxes, residual bounds, certificate and rounding disclosures", "public previous-wall state and all input references required for independent reconstruction", "capacity bounds and provenance, dimensioned unit destruction cost, separate event costs and operator bound/proof or declared absence"]

[[rows]]
name = "act-identity"
category = "act-fields"
fields = ["act identifier I, author and family", "structural body B: identifier, author, family, binary/hyper shape, incidence, authored semantic coordinates, protocol references and requested payload/dependency publication states; both hyper-edge projections"]

[[rows]]
name = "act-causality"
category = "act-fields"
fields = ["public protocol references", "causal parents and authenticated placement evidence"]

[[rows]]
name = "act-commitments"
category = "act-fields"
fields = ["payload and dependency commitments with their distinct recipe identifiers", "proposal precommitment P, Actor proposal signature, content and dependency edition tags, verified header V and host verification seal"]

[[rows]]
name = "act-approval"
category = "act-fields"
fields = ["exact verified header V and host seal bound by the Actor approval witness; no epoch, position, logical time, membership, standing or title signed by that witness", "authentication edition and public verification material"]

[[rows]]
name = "act-finalization"
category = "act-fields"
fields = ["finalization epoch and act time", "parent-act links shared by both projections"]

[[rows]]
name = "openings"
category = "sidecars"
fields = ["payload bytes and payload salt", "dependency opening and dependency salt", "availability/removal state and authenticated retained anchors; private proposal nonce remains off-record submission state, never a publication field"]
reason = "Removable openings travel beside the immutable act envelope; removal never permits rebinding."

