[[rows]]
name = "equality"
category = "procedure"
value = "exact equality or certified comparison; a straddling enclosure refines or refuses, never rounds to a verdict"
owner = "lane/graph"

[[rows]]
name = "floor-routes"
category = "procedure"
value = "admitted rational charged values with both rational-floor and defining-ridge verification routes; replay restored charge evidence under the admitted verifier at consumption"
owner = "lane/graph"

[[rows]]
name = "fallback"
category = "procedure"
value = "retain the previous closed state when no candidate certifies within the declared budget; no write on indecision and no fabricated empty epoch"
owner = "lane/graph and lane/design"

[[rows]]
name = "monitoring"
category = "procedure"
value = "publish certificate/backoff, title comparison, emission, controller response, standing work and cadence observations; crossings trigger recorded review, never a new binding input"
owner = "lane/design"

[[rows]]
name = "structural-body"
category = "nested-fields"
fields = ["tagged act identifier: author, sequence and family", "layout discriminant; each leg identity, role, source, target and removal state", "settlement references; license attribution/provenance rational qualifiers", "asserted parents; named quantities with exact value, unit and vintage", "payload and dependency publication-state discriminants; protocol references"]

[[rows]]
name = "procedure"
category = "nested-fields"
fields = ["declaration namespace/name/edition and effective boundary", "procedure name, backend, allowed primitives, precision and equality policies", "backoff grid, margin, endpoint grid and optional enclosure/fence profiles", "production, solve and replay Work ceilings and iteration limit"]

[[rows]]
name = "solve-evidence"
category = "nested-fields"
fields = ["per-Actor lower/upper rate hull", "ordered attempts: rung, margined fence interval, Work, completion, stop cause and primitive references", "residual candidate map, residual upper bound, contraction upper bound and radius", "complete primitive records, with exact arguments, domains, results and validation evidence"]

[[rows]]
name = "ridge-evidence"
category = "nested-fields"
fields = ["definition schema, inverse temperature, bleed squared and core power", "input bracket, depth ceiling and production/replay Work ceilings", "ordered primitive queries, subdivision cells, optional image and consumed Work", "floor comparison wall and floor variants, queries, verdict and Work", "charge analytic premises, procedure, input and complete ridge record"]
