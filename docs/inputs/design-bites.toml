namespace = "org.peer-network.design.bites"
version = [1, 0, 0]

rows = [
  { ordinal = 1, slice = "pn-records: identities and accepted act/edge envelopes", records = "Study judgment: immutable act identity, author/source linkage, edge projection and explicit dependency data; label-to-field decision record and a complete-act counting fixture (def:graph:act-identifier) (def:graph:act-edge-projection) (ver:standing:hyper-act-single-accounting).", dependency = "Study judgment: no computational dependency; establishes the smallest public input surface. Resolve the identity/projection question before locking its encoding.", labels = ["def:graph:act-identifier", "def:graph:act-edge-projection", "ver:standing:hyper-act-single-accounting"] },
  { ordinal = 2, slice = "pn-records: burn data, numeric representation and constants edition", records = "Study judgment: sampled four-object burn record, exact declared inputs and typed constant definitions; dependency review, constant correspondence and override records (def:comparator:burn-interface) (subsec:deployment:transparency-of-protocol-formulas).", dependency = "Study judgment: follows the basic record types; may instead precede the act slice; blocked numeric-library and real-debit decisions must be settled before accepted ledger values are encoded.", labels = ["def:comparator:burn-interface", "subsec:deployment:transparency-of-protocol-formulas"] },
  { ordinal = 3, slice = "pn-graph: geometry and formation", records = "Study judgment: census, local formation checks, slices/tensors, determinant and parity; reference-geometry fixture record (post:nodes:canonical-tensor-pipeline) (tbl:verification:reference-edges) (ver:tensors:opinion).", dependency = "Study judgment: consumes bite 1 records and bite 2 numeric/constant declarations. Pure fixture geometry can precede the ledger and solver.", labels = ["post:nodes:canonical-tensor-pipeline", "tbl:verification:reference-edges", "ver:tensors:opinion"] },
  { ordinal = 4, slice = "pn-graph: complete-act structural folds and title", records = "Study judgment: verified complete acts, settlement recognition and title outputs; formation and title fixture record (def:graph:verified-act) (post:epoch:settlement-standing-title-coupling) (ver:standing:title-coupling).", dependency = "Study judgment: requires records/census; produces the title inputs consumed by epoch recipient resolution. No terminal membership or revision-policy engine.", labels = ["def:graph:verified-act", "post:epoch:settlement-standing-title-coupling", "ver:standing:title-coupling"] },
  { ordinal = 5, slice = "pn-epoch: final ledger and standing compiler", records = "Study judgment: final balances/counts/vintages, recipient resolutions, fold cells, coefficients, base allocation and emission; ledger, conservation and order-invariance fixture records (eq:epoch:final-residual-balance) (def:epoch:standing-recipient-resolution) (ver:standing:epoch-permutation-invariance).", dependency = "Study judgment: requires bites 2–4; unresolved Invitation/domain/fold semantics hold the affected compiler case.", labels = ["eq:epoch:final-residual-balance", "def:epoch:standing-recipient-resolution", "ver:standing:epoch-permutation-invariance"] },
  { ordinal = 6, slice = "pn-epoch: certified numerical kernel and conserved solve", records = "Study judgment: hull, activation enclosures, attempted-rung fence values, accepted rung, residual bounds and standing enclosure; numerical dependency and certificate fixture records (def:dynamics:conserved-standing-certificate) (lem:dynamics:fixed-point-residual-enclosure) (ver:standing:conservation).", dependency = "Study judgment: requires the frozen compiler and ledger from bite 5; resolve certificate/indecision/current-fixture questions before treating a fixture as proof.", labels = ["def:dynamics:conserved-standing-certificate", "lem:dynamics:fixed-point-residual-enclosure", "ver:standing:conservation"] },
  { ordinal = 7, slice = "pn-epoch: final admission and schedules", records = "Study judgment: action/epoch stamps, W1/W2, door headroom and declared next-boundary schedules; gate and boundary-policy fixture records (post:epoch:final-act-sequence-write-rule) (def:network:door-headroom) (def:epoch:safety-threshold) (ver:epoch:final-stamps).", dependency = "Study judgment: requires certified standing from bite 6 and a specified threshold-calibration rule; do not invent final-set search or consensus.", labels = ["post:epoch:final-act-sequence-write-rule", "def:network:door-headroom", "def:epoch:safety-threshold", "ver:epoch:final-stamps"] },
  { ordinal = 8, slice = "pn-host: canonical seven-part package", records = "Study judgment: versioned serialized package, declared formulas/constants, attempted-rung evidence and complete public inputs; canonical-format and round-trip fixture records (post:network:host-contract) (post:deployment:canonical-standing-publication).", dependency = "Study judgment: requires all binding outputs from bites 1–7 and a maintainer/deployment decision on canonical encoding.", labels = ["post:network:host-contract", "post:deployment:canonical-standing-publication"] },
  { ordinal = 9, slice = "pn-replay", records = "Study judgment: independent reconstruction and section-by-section comparison results citing the owning paper claims; package reproduction and mutation-rejection fixture records (subsec:deployment:conserved-standing-reproducibility) (post:deployment:public-object-replay).", dependency = "Study judgment: requires the package schema and computational public surfaces; no reverse dependency from pn-host.", labels = ["subsec:deployment:conserved-standing-reproducibility", "post:deployment:public-object-replay"] },
  { ordinal = 10, slice = "pn-readouts: optional raw publication service", records = "Study judgment: derived raw Self snapshot, edge scalars and exact bounded traversal outputs; small-graph exhaustive path and terminal-input separation fixture records (def:graph:raw-traversal-snapshot) (alg:epoch:exact-signed-raw-traversal) (rem:network:taxonomy-subtleties).", dependency = "Study judgment: requires published final standing and graph geometry; may move after bite 6 for a diagnostic prototype, but cannot feed standing. Resolve simple-path/walk semantics before asserting exact traversal.", labels = ["def:graph:raw-traversal-snapshot", "alg:epoch:exact-signed-raw-traversal", "rem:network:taxonomy-subtleties"] },
  { ordinal = 11, slice = "pn-verification: complete public-surface corpus", records = "Study judgment: Appendix F claim/input/expected-enclosure records, held-claim register and end-to-end replay results; no invented passing outcomes (rem:verification:numerical-rounding) (rem:verification:certificate-reproducibility).", dependency = "Study judgment: grows alongside each earlier bite as a leaf consumer; final corpus closure waits for every implemented public surface and all affected fixture questions.", labels = ["rem:verification:numerical-rounding", "rem:verification:certificate-reproducibility"] },
]
