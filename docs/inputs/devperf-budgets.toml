namespace = "org.peer-network.devperf.budgets"
version = [1, 0, 0]

[[rows]]
name = "unit"
category = "case"
budget_ms = 100
scope = "one unit test"
reason = "Local invariants need no service wait; small inputs keep the feedback loop immediate."

[[rows]]
name = "crate"
category = "case"
budget_ms = 500
scope = "one public-surface test"
reason = "Allow public encoding and validation while exposing accidental broad fixtures."

[[rows]]
name = "integration"
category = "case"
budget_ms = 2000
scope = "one pure or mock integration test"
reason = "Allow composition and fault histories without a real-service wait."

[[rows]]
name = "conformance"
category = "case"
budget_ms = 2000
scope = "one pure or mock shared-contract case"
reason = "The same predicate needs a small bounded history on every implementation."

[[rows]]
name = "property"
category = "case"
budget_ms = 1000
scope = "one generated property case"
reason = "Bound construction and evaluation by declared sizes; shrinking is included in the campaign below."

[[rows]]
name = "real-case"
category = "case"
budget_ms = 10000
scope = "one real-service case"
reason = "Allow actual transactions, RPC and controlled settlement while exposing unnecessary sleeps."

[[rows]]
name = "pure-suite"
category = "suite"
budget_ms = 5000
scope = "one named pure suite or level group"
reason = "A bounded selection of cases should stay interactive; this also covers bounded property generation and shrinking."

[[rows]]
name = "mock-suite"
category = "suite"
budget_ms = 10000
scope = "one named mock-backed suite"
reason = "Permit model histories and controlled fault schedules without paying service startup cost."

[[rows]]
name = "postgresql-suite"
category = "suite"
budget_ms = 30000
scope = "one real PostgreSQL suite"
reason = "Reserve time for isolated history, concurrency and restart cases on a provisioned instance."

[[rows]]
name = "elements-suite"
category = "suite"
budget_ms = 60000
scope = "one real Elements suite"
reason = "Allow signed blocks, depth, forks and recovery; measure controllable settlement rather than arbitrary sleep."

[[rows]]
name = "combined-suite"
category = "suite"
budget_ms = 90000
scope = "one PostgreSQL and Elements end-to-end suite"
reason = "Allow the combined durable and chain recovery path without hiding the cost in fast tests."

[[rows]]
name = "test-command"
category = "aggregate"
budget_ms = 10000
scope = "the per-change pure and mock test command"
reason = "The measured quiet test step is about nine seconds; keep a small margin and investigate growth."

[[rows]]
name = "ordinary-check"
category = "aggregate"
budget_ms = 5000
scope = "one ordinary non-test gate check"
reason = "Make repeated repository checks interactive; retained full-corpus work needs explicit registry review."

[[rows]]
name = "benchmark"
category = "suite"
budget_ms = 30000
scope = "one bounded benchmark workload campaign"
reason = "Allow warmup and multiple samples with deterministic work counts; larger campaigns need registry admission."

[[rows]]
name = "clean-build"
category = "build"
budget_ms = 120000
scope = "clean workspace dev or test build"
reason = "A two-minute initial allowance permits dependency compilation; it is a target awaiting a controlled cold measurement, not an observed result."

[[rows]]
name = "incremental-build"
category = "build"
budget_ms = 5000
scope = "one-file incremental rebuild"
reason = "An ordinary implementation-file edit should preserve a short feedback loop; profile and dependency fan-out are diagnosed separately."

[[rows]]
name = "gate"
category = "aggregate"
budget_ms = 120000
scope = "per-change gate on the imported tree in a fresh checkout, with its own retained node target"
reason = "Pinned-node gates of record took 81.2 s and 85.5 s; the latter used about 233 own CPU seconds at about two percent shared CPU pressure. A 120 s warning allowance gives about forty percent margin above the larger observed wall for post-import build work. Warm lane repeats are diagnostics, not the calibration workload."

[[rows]]
name = "service-gate"
category = "aggregate"
budget_ms = 180000
scope = "full required provisioned-service matrix"
reason = "Allow the warm gate and combined real-service cases; the service matrix is separate from the fast local path."

[[rows]]
name = "reference-map-case"
category = "case"
budget_ms = 15000
scope = "one published-fixture map or corpus case"
reason = "The exact reference declaration retains all Actors, edges, depths and published comparisons; the measured map and corpus cases need a bounded certificate tier."

[[rows]]
name = "reference-local-case"
category = "case"
budget_ms = 60000
scope = "one published-fixture local inclusion case"
reason = "Interval Jacobians, preconditioning, replay and mutation controls retain the full reference declaration; the local certificate is the longest measured reference case."

[[rows]]
name = "reference-wall-case"
category = "case"
budget_ms = 25000
scope = "one enclosed-reference-wall solve case"
reason = "The end-to-end wall consumer retains both enclosed and rational solve routes and their replay and adjacent Work controls."

[[rows]]
name = "reference-certificate-suite"
category = "suite"
budget_ms = 90000
scope = "one required reference-certificate group"
reason = "Allow the exact reference cases and their refusal controls as a separately measured group while preserving the unchanged fast and gate budgets."

[[rows]]
name = "reference-receiving-case"
category = "case"
budget_ms = 15000
scope = "one full-size published receiving showcase comparison"
reason = "The complete published Registration and donor multiplicities, both public histories and both annotation readings must survive compilation, solve and replay. The focused measurement is recorded in the receiving reference-tier amendment; the declared allowance also accounts for gate contention without changing any other case budget."

[[rows]]
name = "own-burn-case"
category = "case"
budget_ms = 15000
scope = "one complete-history own-loss mechanism"
reason = "The lowest sign-certifying precision retains compilation, both solves and replayed forcing; the smaller histories tested change the response sign. This mechanism has its own allowance rather than borrowing the published-reference tier."

[[rows]]
name = "own-burn-suite"
category = "suite"
budget_ms = 20000
scope = "the required own-loss mechanism group"
reason = "Allow the mechanism case and harness overhead while retaining its separate case warning and the per-commit gate budget."

[[rows]]
name = "reference-gate"
category = "aggregate"
budget_ms = 90000
scope = "required reference-certificate invocation"
reason = "The longest exact local certificate needs about fifty seconds; allow the unchanged certificate cases and runner overhead in a required invocation alongside the per-commit path."

[[rows]]
name = "calibrated-marker-recognition-case"
category = "case"
budget_ms = 1000
scope = "one pn-records::properties::marker_recognition case"
reason = "The recorded property draw count and generated lineage/burn-recognition predicates remain unchanged; reducing draws would remove declared evidence."

[[rows]]
name = "calibrated-typed-corruptions-case"
category = "case"
budget_ms = 1000
scope = "one pn-records::properties::typed_corruptions case"
reason = "The recorded property draw count and typed corruption families remain unchanged; reducing draws would remove declared evidence."

[[rows]]
name = "calibrated-act-directions-case"
category = "case"
budget_ms = 2500
scope = "one pn-epoch::solve::act_directions case"
reason = "Opposite signed complete-act comparisons retain both independently replayed solves and the finite forcing bounds at the declared precision."

[[rows]]
name = "calibrated-act-emission-case"
category = "case"
budget_ms = 1500
scope = "one pn-epoch::solve::act_emission case"
reason = "The complete accepted-act pair changes emission and retains independently replayed solves and the full finite-response transport."

[[rows]]
name = "calibrated-burn-depleted-case"
category = "case"
budget_ms = 1000
scope = "one pn-epoch::solve::burn_depleted case"
reason = "The depleted-source pair retains failed full-rung attempts, passing anchor solves, independent replay and the changed-emission finite shock."

[[rows]]
name = "calibrated-burn-monotone-case"
category = "case"
budget_ms = 1500
scope = "one pn-epoch::solve::burn_monotone case"
reason = "The sole-contributor pair retains both complete solves, independent replay and the whole-path regime premises."

[[rows]]
name = "calibrated-burn-sibling-case"
category = "case"
budget_ms = 10500
scope = "one pn-epoch::solve::burn_sibling case"
reason = "The saturated sibling pair retains the declared precision, independent solve replay, finite box shock and largest-direct-forcing feedback majorant."

[[rows]]
name = "calibrated-burn-switch-case"
category = "case"
budget_ms = 5500
scope = "one pn-epoch::solve::burn_switch case"
reason = "The burn pair retains both rung searches, the changed accepted rung, independent solve replay and the full finite-response transport."

[[rows]]
name = "calibrated-certified-splits-case"
category = "case"
budget_ms = 1000
scope = "one pn-epoch::solve::certified_splits case"
reason = "Matched and unmatched complete histories retain their certified solves, projected residuals, hop-premise checks and counterexample bounds."

[[rows]]
name = "calibrated-conserved-projection-case"
category = "case"
budget_ms = 1500
scope = "one pn-epoch::solve::conserved_projection case"
reason = "Supported and chartered depth projections retain the nonzero-depth cells, exact cell and Work pins, and refusal controls."

[[rows]]
name = "calibrated-conserved-residual-case"
category = "case"
budget_ms = 12000
scope = "one pn-epoch::solve::conserved_residual case"
reason = "The frozen fixture retains proposal-grid and iteration-cap comparisons, independent residual replay, exact Work boundaries and mutated-record refusals."

[[rows]]
name = "calibrated-fence-shapes-case"
category = "case"
budget_ms = 1000
scope = "one pn-epoch::solve::fence_shapes case"
reason = "Frozen-support shapes retain descending evaluated rung searches, independent primitive replay and width, tilt, wall and attachment refusal controls."

[[rows]]
name = "calibrated-compiled-conservation-case"
category = "case"
budget_ms = 2000
scope = "one pn-epoch::solve::partitions::compiled_conservation case"
reason = "The named transport mechanisms retain derived ledger export ceilings, declared conservation-width tolerance, passing and failing precision controls and replayed nonlinear transport."

[[rows]]
name = "calibrated-nonconstant-matched-split-case"
category = "case"
budget_ms = 4000
scope = "one pn-epoch::solve::partitions::nonconstant_matched_split case"
reason = "Real nonconstant matched transport retains its calibrated disjoint-image precision, compiled hop identities, common positive rung, solves and independent replay."

[[rows]]
name = "calibrated-positive-rung-split-case"
category = "case"
budget_ms = 6000
scope = "one pn-epoch::solve::partitions::positive_rung_split case"
reason = "The positive-rung displacement fixture retains the calibrated sign precision, its failing lower control, finite box comparisons and independent solve replay."

[[rows]]
name = "calibrated-published-isolated-acts-case"
category = "case"
budget_ms = 2500
scope = "one pn-epoch::solve::partitions::published_isolated_acts case"
reason = "The unsorted exact-rate sample family retains every complete before/after history, final-gate checks, independent solve replay and exact loss identity."

[[rows]]
name = "calibrated-published-retained-act-case"
category = "case"
budget_ms = 4500
scope = "one pn-epoch::solve::partitions::published_retained_act case"
reason = "The tagged retained-source fixture retains complete before/after solves, independent replay, the calibrated strict sign and its failing lower-precision control."

[[rows]]
name = "calibrated-receiving-small-case"
category = "case"
budget_ms = 1000
scope = "one pn-epoch::solve::partitions::receiving_small case"
reason = "The published small receiving history retains pooled and partitioned records, complete public-input annotation equivalence and cross-replayed certificates."

[[rows]]
name = "calibrated-sibling-outside-paths-case"
category = "case"
budget_ms = 7000
scope = "one pn-epoch::solve::partitions::sibling_outside_paths case"
reason = "The coupled negative response retains its calibrated precision and endpoint grid, the failing lower control, independent replay and the separate structural control."

[[rows]]
name = "calibrated-two-map-box-case"
category = "case"
budget_ms = 5500
scope = "one pn-epoch::solve::two_map_box case"
reason = "The frozen four-Actor fixture retains its declared box-map precision, both certified maps, independent replay and adjacent Work-limit controls."

[[rows]]
name = "calibrated-activation-costs-case"
category = "case"
budget_ms = 3000
scope = "one pn-graph::numeric::activation_costs case"
reason = "Cold composed requests retain independent Work, output-byte and arithmetic-step success/refusal boundaries; reusing a warm result would change the charged request."

[[rows]]
name = "calibrated-activation-endpoints-case"
category = "case"
budget_ms = 2000
scope = "one pn-graph::numeric::activation_endpoints case"
reason = "Wall placements and activation quantities retain direct and monotone evaluations, independent endpoint brackets, generalized joins and powered-source premises."

[[rows]]
name = "calibrated-activation-oracles-case"
category = "case"
budget_ms = 1000
scope = "one pn-graph::numeric::activation_oracles case"
reason = "Unsorted scalar compositions retain independent value and derivative oracle brackets and cold certified evaluation at the declared policy."

[[rows]]
name = "calibrated-activation-walls-case"
category = "case"
budget_ms = 1500
scope = "one pn-graph::numeric::activation_walls case"
reason = "The wall placements retain activation, gain and generalized-kink controls under the complete declared policy."

[[rows]]
name = "calibrated-enclosed-wall-clamp-case"
category = "case"
budget_ms = 1000
scope = "one pn-graph::numeric::enclosed_wall_clamp case"
reason = "The wall-coordinate interval retains independently sampled rational clamps, crossing generalized slopes and changed-enclosure replay refusal."

[[rows]]
name = "calibrated-evaluation-costs-case"
category = "case"
budget_ms = 3000
scope = "one pn-graph::numeric::evaluation_costs case"
reason = "Reduction, root/log-exp endpoint and sharing-prefix cases retain every cold Work success/refusal boundary and distinguish preparation from memo hits."

[[rows]]
name = "calibrated-reference-wall-branches-case"
category = "case"
budget_ms = 2000
scope = "one pn-graph::numeric::reference_wall_branches case"
reason = "Certified inverse-wall branches retain the floor, door, policy and deadband comparisons and their independently replayed queries."

[[rows]]
name = "calibrated-reference-wall-controls-case"
category = "case"
budget_ms = 2000
scope = "one pn-graph::numeric::reference_wall_controls case"
reason = "The inverse-wall controls retain both wrong-sign bracket refusals, indecisive stopping and changed query or attachment replay refusals."

[[rows]]
name = "calibrated-reference-wall-oracle-case"
category = "case"
budget_ms = 3000
scope = "one pn-graph::numeric::reference_wall_oracle case"
reason = "The tagged gain fixture retains certified bisection, independent endpoint signs and replay at the declared stopping width and precision."

[[rows]]
name = "calibrated-reference-wall-work-case"
category = "case"
