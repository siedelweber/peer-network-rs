numeric_display = { budget_ms = { display = "exact", exact_digits = 32 }, record_first_wall_seconds = { display = "exact", exact_digits = 32 }, record_second_wall_seconds = { display = "exact", exact_digits = 32 }, record_second_cpu_seconds = { display = "exact", exact_digits = 32 }, record_pressure_percent = { display = "exact", exact_digits = 32 } }
