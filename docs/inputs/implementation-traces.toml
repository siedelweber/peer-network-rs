rows = [
  { name = "public-inputs", decision = "dec:design:public-inputs", requirements = ["public-inputs"], labels = ["post:network:host-contract", "prop:deployment:allocation-input-completeness"], fixture = "complete-cause-package", cases = "Remove a disclosed act, declaration or boundary sample in turn; reconstruction must identify the missing cause before solving.", property = "Reordering unordered input collections preserves the compiled object; removing a cause cannot preserve a complete verdict.", oracle = "A separately written inventory walk over the full accepted-act sequence and references, without compiler summaries.", hold = "No executable completeness corpus exists until the records and replay bites.", status = "planned; execution evidence pending" },
  { name = "burn-boundary", decision = "dec:design:burn-boundary", requirements = ["burn-boundary"], labels = ["rem:comparator:burn-realization-audit-evidence", "def:comparator:frame-inputs", "subsec:deployment:realization-observations", "post:comparator:marker-bound-finalization", "cond:comparator:marker-lineage-succession", "cond:comparator:marker-network-acceptance", "cond:comparator:marker-causal-dependence", "cond:comparator:marker-single-count", "def:comparator:marker-burn-snapshot", "eq:comparator:marker-burn-snapshot", "prop:comparator:marker-finalization-consistency", "cond:comparator:burn-unit-cost-projection", "cond:comparator:burn-non-transferability", "cond:comparator:actor-entry-boundary-amount", "cond:comparator:burn-revision-floor", "def:comparator:bootstrap-capacity", "cond:comparator:actor-entry-no-privileged-accrual"], fixture = "burn-disclosures", cases = "Exercise missing samples, history finality under the published settlement depth and assumptions, equality to pinned amounts at or below that depth, provenance, denomination and terms, separate event costs, applicable operator proof or explained absence, and empty pre-opening capacity. Accept positive unit costs below one. Challenge nonempty genesis acceptance and opening credit from lineage alone, skipped or duplicate successors, changed policy, copied markers without lineage, unavailable openings, invalid or out-of-lineage acceptance, dropped predecessors, duplicate destruction aliases and changed addresses; include delayed acceptance and an empty accepted increment. Distinguish market repricing from unit recoinage and reject unit-cost multiplication of action-denominated quantities while accepting numeraire-converted burn quantities. The lineage concept (`spec:lineage:concept`) decides the designed and unbuilt successor recognition and authority cases; these planned cases retain their admitted scope and no historical fixture evidences the successor, whose control admission remains owed by the records, host and publication owners under (`gate:design:bite-11`).", property = "A recognized marker and fixed policy determine one gross snapshot and increment, counting each accepted destruction once; no later observation changes it. Gross monotonicity holds only along the same history, not for debited residual balances. Recognition supplies no liveness guarantee or fifth monetary input. The historical four-object burn carrier and retained audit disclosures remain this repository’s local interface; the paper’s calculation instead consumes supplied Actor entries and named calculation inputs under ``def:comparator:frame-inputs``, and no audit standard is adopted under ``rem:comparator:burn-realization-audit-evidence``.", oracle = "Independent finite-history enumeration of lineage, policy-defined accepted sets and distinct destruction identities, plus a dimensioned cost and disclosure checklist.", hold = "External destruction and settlement assurance remain deployment obligations.", status = "planned; execution evidence pending", conformance = ["realizes{``subsec:deployment:realization-observations``; The finite-history oracle compares supplied disclosures and recognition; external destruction and settlement remain an explicit hold.}"] },
  { name = "complete-acts", decision = "dec:design:complete-acts", requirements = ["complete-acts"], labels = ["def:graph:act-identifier", "def:graph:act-edge-projection", "post:epoch:universal-act-weighing"], fixture = "whole-act-counting", cases = "Use a hyper-act, repeated netting acts, a zero fold and a control act; retain all identities and charge each once.", property = "Cell partition covers accepted authored acts exactly once while counts follow members, not cells or legs.", oracle = "Direct enumeration of authored identities and rational debit sums, independent of the cell builder.", hold = "Exact fixtures must be transcribed and reviewed before the compiler is claimed complete.", status = "planned; execution evidence pending" },
  { name = "formation-title", decision = "dec:design:formation-title", requirements = ["formation-title"], labels = ["def:graph:identifier-algebra", "def:network:admission-closure", "def:graph:act-edge-projection", "thm:graph:epoch-branch-fold", "post:epoch:settlement-standing-title-coupling", "def:graph:settlement-structure"], fixture = "formation-title-cases", cases = "Sibling completions, reused interior states, wrong or forward anchors, first correct Ratify, pending and late buyer/seller cancellations, descendant challenge propagation and unavailable public support.", property = "All completed children remain in the shared graph; neither later challenge nor terminal selection removes them or redirects persistent settlement events.", oracle = "Independent full-run branch enumeration compared with repeated undated transitions and semantic seams under verif:actepoch:title-transition.", hold = "Successor representation, operations, independent controls and all dependent callers remain open:actepoch:title-admission; replacement is one coordinated cut under preview:actepoch:title-cuts.", status = "designed and unbuilt; existing single-owner controls retain only their actual assertions under amend:design:bite-four-close" },
  { name = "ledger-vintages", decision = "dec:design:ledger-vintages", requirements = ["ledger-vintages"], labels = ["post:epoch:act-debit", "def:epoch:safety-threshold"], fixture = "charged-vintage-cases", cases = "Charge two successive declared prices, then change the current price; prior debits must remain unchanged. Accept an older lineage burn at a later marker, including an epoch with no authored acts; deduplicate aliases and preserve the writing-epoch debit.", property = "Debit totals, emission and capacity read the same charged value and epoch; full/reduced unit conversion commutes.", oracle = "Independent exact rational ledger for representable profiles, plus reviewed expression witnesses for any added profile.", hold = "Non-rational charged-value support is held until its equality and certification contract is reviewed.", status = "planned; execution evidence pending" },
  { name = "final-state", decision = "dec:design:final-state", requirements = ["final-state"], labels = ["post:epoch:standing-epoch-set-determinism", "post:epoch:standing-memorylessness", "prop:deployment:allocation-input-completeness", "def:epoch:standing-domain-profile", "def:epoch:evaluated-epoch-state"], fixture = "compiler-cases", cases = "Retain independent ledger, netting and numerical cases. The successor adds all structurally completed handshake events, sibling events and cancellations before and after completion, preserving outward allocations subject to positivity and registration; incomplete handshakes remain at self.", property = "Dependency-compliant permutations preserve the compiled base, emission and hull when all stated inputs are fixed.", oracle = "Small direct cell and recipient tables written independently of production aggregation.", hold = "Deployment authentication and settled-lineage realization remain the public verifier contract; canonical publication, persistent admitted results, nonlinear evidence and unrestricted corpus retain their owning holds. Branch recipients, both compilers and publication/rebuild/fixture consumers remain unbuilt under preview:actepoch:title-cuts.", status = "existing compiler evidence retains its implemented scope; branching-title recipient integration is designed and unbuilt" },
  { name = "conservation", decision = "dec:design:conservation", requirements = ["conservation"], labels = ["def:epoch:conserved-standing-equilibrium", "post:epoch:standing-pair-mass-conservation", "rem:epoch:transport-is-not-ledger-transfer", "rem:gates:standing-safety-scope", "cor:comparator:sybil-resistance-is-faithfulness", "cond:comparator:burn-non-transferability", "thm:epoch:frame-gross-response", "thm:epoch:split-observational-equivalence"], fixture = "transport-cases", cases = "A depleted relay, zero-emission source, closed cluster and retained diagonal with nonzero incoming mass; matched funded partitions, identical-public-record purpose completions and burn-response counterexamples under (`verif:design:core-standing-properties`).", property = "Row sums and transported balance/count totals are conserved; exported count obeys the emission bound. These identities imply neither funded-address invariance nor universal burn monotonicity; recorded-amount non-transferability is not standing immobility. Identical public inputs cannot distinguish private purpose, and a record-based remedy imposes the same change on the legitimate and strategic completions.", oracle = "Dense rational matrix products at zero tilt, independently compared with sparse factor application.", hold = "Transcendental cases require the reviewed numerical backend and certified oracle.", status = "planned; execution evidence pending" },
  { name = "certificate", decision = "dec:design:certificate", requirements = ["certificate"], labels = ["def:dynamics:conserved-standing-certificate", "thm:dynamics:certified-conserved-standing-uniqueness", "lem:dynamics:fixed-point-residual-enclosure", "ver:standing:conserved-equilibrium-enclosure"], fixture = "fence-residual-cases", cases = "Equal-width graphs of different shape, a zero-width case and fences below, at and above the margin boundary. Transcribe the exact released reference Actor, vouch and standing_profile inputs and the independent conserved-equilibrium certificate.", property = "Equal width at fixed wall/profile/rung yields equal fence; residual enclosure contains the independently certified equilibrium.", oracle = "Independent high-precision directed evaluation plus exact zero-tilt and rational analytic cases; shared kernel output alone is insufficient. Check the released global residual and local Krawczyk evidence independently, preserving their distinct centres and radii.", hold = "The admitted backend fragment, finite boundary witnesses and reference corpus are supported by amend:design:backend-soundness-dossier and amend:design:bite-six-close. Additional platforms, binding ridge/controller admission and unrestricted families retain their named owners.", status = "scoped numerical execution supported under amend:design:bite-six-close" },
  { name = "rung-verdicts", decision = "dec:design:rung-verdicts", requirements = ["rung-verdicts"], labels = ["def:epoch:tilt-backoff-grid", "rem:epoch:certificate-failure-versus-indecisive-enclosure"], fixture = "rung-policy-cases", cases = "An indecisive high rung, a proved failed rung and a lower pass under one published finite refinement policy.", property = "Replay selects the greatest procedure-proved pass and preserves each higher attempted verdict and budget.", oracle = "A linear reference scan evaluating each rung independently from disclosed factors.", hold = "Canonical rung agreement waits for the deployment procedure and its execution vectors.", status = "planned; execution evidence pending" },
  { name = "final-membership", decision = "dec:design:final-membership", requirements = ["final-membership"], labels = ["def:network:write", "post:epoch:act-sequence-evaluation", "post:network:host-contract", "post:epoch:computed-edge-set"], fixture = "closure-partition-cases", cases = "Overlapping principal closures sharing a parent, interleaved blocks, missing parent, target/minimum and maximum-duration closures. Require the common recognized final marker independently of dependent-act closure; act order alone cannot supply the burn snapshot.", property = "Component partition is disjoint, covers the union and is invariant to processing order; authoritative positions remain checked.", oracle = "Exhaustive closure-set intersection and component enumeration on small proposed histories.", hold = "Earliest host determination remains an asserted local boundary observation; the successor static input and separate history-seam interfaces are unbuilt, and neither infers unwritten demand.", status = "planned; execution evidence pending" },
  { name = "admission", decision = "dec:design:admission", requirements = ["admission"], labels = ["post:epoch:act-sequence-write-rule", "post:network:host-contract", "def:epoch:computed-standing-stamps", "cond:epoch:write-own-balance-solvency", "cond:epoch:write-individual-safety", "cond:epoch:write-epoch-admission"], fixture = "gate-unit-cases", cases = "Individual failure hidden by a positive average, exact equality, threshold straddling, empty epoch and target overflow. Check the reference certificate final-set intervals and charge the revising act before forming its revised rate.", property = "Only a fully certified final state can accept; no member of a rejected or indecisive proposed set takes effect.", oracle = "Hand-derived rational ``cond:epoch:write-own-balance-solvency``, ``cond:epoch:write-individual-safety`` and ``cond:epoch:write-epoch-admission`` cases with explicit numeraire, counts, prices and reduced stamps.", hold = "The supported profile and certified solve exist. Final admission, stamps, candidate/common-marker closure and effective schedules remain the epoch-owned checklist in rec:design:bite-seven-checklist; missing evidence never counts as passing.", status = "planned; execution evidence pending" },
  { name = "policy-schedules", decision = "dec:design:policy-schedules", requirements = ["policy-schedules"], labels = ["def:epoch:safety-threshold", "def:epoch:policy-floor", "subsec:deployment:transparency-of-protocol-formulas", "def:epoch:safety-wall-floor", "def:epoch:wall-controller", "def:epoch:canonical-interim-wall-controller", "cond:epoch:safety-derivability", "cond:epoch:safety-in-epoch-certification", "cond:epoch:safety-wall-step-bound", "cond:epoch:safety-wall-hysteresis", "cond:epoch:safety-publication-lead", "cond:epoch:safety-controller-publication", "cond:epoch:safety-numeraire-covariance", "cond:epoch:safety-declared-floor", "cond:epoch:safety-input-quarantine"], fixture = "wall-controller-cases", cases = "Both chartered floors, exact ridge comparison, zero width, empty live domain, deadband equality, capped upward/downward steps, recoinage, fixed-ledger numeraire change and a next epoch wider than its predecessor.", property = "The actual wall and charge satisfy the labelled floor, controller and lead conditions; each epoch certifies its own width and never reads demand or an escalation window.", oracle = "Independent exact boundary-sequence model with separately certified gain inversion and ridge bounds; compare the floor, proposal, deadband branch, cap and delivered wall separately.", hold = "Deployment declarations and verified marker evidence remain required; economics and controller performance remain open, while the marker-bound settlement postulate establishes accepted-snapshot consistency for readers of the same recognized marker, without compulsory or timed acceptance.", status = "planned; execution evidence pending", conformance = ["realizes{``subsec:deployment:transparency-of-protocol-formulas``; The exact boundary-sequence model checks published schedules and controller arithmetic, not plant performance.}"] },
  { name = "publication", decision = "dec:design:publication", requirements = ["publication"], labels = ["post:network:host-contract", "post:deployment:canonical-standing-publication", "post:epoch:computed-edge-set"], fixture = "canonical-package-cases", cases = "Preserve historical complete-package roundtrips and refusals, including their local marker, declaration and authority members. For the unbuilt successor, round-trip each admitted static input payload and reject noncanonical bytes or missing required operands; the root contains no marker, predecessor or redundant computed-output copy. Test marker-root and successor-standard correspondence separately on the oracle route. Optional displays and semantic epoch coordinates remain with the adapted document concept’s owners.", property = "Equivalent normalized structures encode identically; optional query data cannot supply required facts or change certificate verification under (`inv:design:optional-query-separation`).", oracle = "Independently authored byte vectors and the complete semantic field inventory, independent of delivery partition.", hold = "Each owned static payload, closed theory, binding admission and independent vectors is owed; existing local authority duties remain outside closure. The adapted document concept is not yet admitted.", status = "planned; execution evidence pending", conformance = ["realizes{``post:deployment:canonical-standing-publication``; This statement uses the exact public-record and endpoint-verdict scope; enclosure soundness remains conditional on the reader’s own sound evaluation, and no execution evidence follows.}"] },
  { name = "replay", decision = "dec:design:replay", requirements = ["replay"], labels = ["post:deployment:public-object-replay", "subsec:deployment:conserved-standing-reproducibility", "rem:deployment:completeness-safety-orthogonal", "post:network:host-contract", "rem:graph:authentication-realization-out-of-scope", "prop:comparator:marker-finalization-consistency"], fixture = "reconstruction-mutations", cases = "Preserve historical package mutations and local authority/marker refusals. For the unbuilt successor static check, mutate required own-set inputs and support, omit an act and alter a charged vintage or selected operand. Separately test declared-history seams between already validated epochs and computed states. Oracle recognition selects accepted roots and checks their successor standards outside closure. No historical private-input time or mixed-package control evidences these new interfaces.", property = "Every mismatch is attributed to its fact and claim; accepted payload syntax cannot stand for mathematical verification or complete collected evidence.", oracle = "A public-input verifier and independently implemented small-case mathematics, not a host-cache comparison.", hold = "Static and history interfaces, sufficient cumulative state, sound support and separately bound oracle correspondence await their owning admissions; cross-implementation evidence remains owed.", status = "planned; execution evidence pending", conformance = ["realizes{``post:deployment:public-object-replay``; This statement uses exact public objects and endpoint verdicts only; enclosure soundness remains conditional on independent evaluation, and no execution evidence follows.}"] },
  { name = "constants", decision = "dec:design:constants", requirements = ["constants"], labels = ["subsec:deployment:transparency-of-protocol-formulas", "rem:verification:numerical-rounding"], fixture = "effective-edition-cases", cases = "Locked override, late announcement, exact literal mismatch and computed constant with an uncertified decimal.", property = "Effective-boundary lookup preserves historical values; locked constants cannot change through generic override carriers.", oracle = "Read-only correspondence against defining declarations and independently enclosed computed values.", hold = "Dependency versions and numerical constant witnesses require review before use.", status = "planned; execution evidence pending", conformance = ["realizes{``subsec:deployment:transparency-of-protocol-formulas``; Effective edition lookup and locked overrides are determined by the supplied history.}", "realizes{``case:deployment:transparency-of-protocol-formulas-silent-tuning``; The finite public-input check detects this missing or changed disclosure, without asserting external acquisition truth.}"] },
  { name = "terminal-separation", decision = "dec:design:terminal-separation", requirements = ["terminal-separation"], labels = ["def:network:object-taxonomy", "rem:network:taxonomy-subtleties", "post:transport:guild-grant"], fixture = "read-site-cases", cases = "Change raw caches, terminal preferences and optional diagnostics while fixing the binding inputs.", property = "Binding fields and admission remain unchanged; required evidence stays mandatory even when no formula reads it.", oracle = "Dependency/read-site audit and differential package runs with all optional data varied.", hold = "Terminal engines, operational availability and external assurances remain outside the implemented surface.", status = "planned; execution evidence pending" },
  { name = "raw-readings", decision = "dec:design:raw-readings", requirements = ["raw-readings"], labels = ["def:graph:raw-traversal-snapshot", "alg:epoch:exact-signed-raw-traversal"], fixture = "simple-path-cases", cases = "A negative cycle, parallel projections, tied products, zero determinant and a route revisiting the source.", property = "All and only bounded simple paths contribute to parity maxima; raw Self is derived, never appended as an act.", oracle = "Exhaustive independent simple-path enumeration on tiny graphs with exact products and separate parity calculation.", hold = "Unresolved scalar comparisons return INDECISIVE; resource exhaustion never returns an exact-service result.", status = "planned; execution evidence pending" },
]
