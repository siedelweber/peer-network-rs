  { bite = 5, work = "Pinned burn samples, immutable ledger vintages and storage evidence" },
  { bite = 8, work = "Host publication; pn-interchange transport mode; pn node/API and local control; pn-wallet spending/recovery; pn-client and both pn-command surfaces; faucet" },
  { bite = 9, work = "Independent package replay and client replay-input fetching without a live chain" },
