measurement = "Warm compiled-target runs with fresh four-package artifact directories at [[calibration_inline_levels]] inline levels: [[calibration_wall_seconds]] seconds; [[calibration_cpu_seconds]] own CPU seconds; shared CPU pressure [[calibration_pressure_percent]] percent. The third sample retained a metric-contention comparison failure; all stream records were delivered. This timing is not a passing verdict. Post-change atomic-counter and policy-binding campaign, warm compiled gate target and fresh four-package artifact directories, five predeclared runs: [[post_change_wall_seconds]] seconds; [[post_change_cpu_seconds]] own CPU seconds; [[post_change_shared_cores]] shared node cores and [[post_change_pressure_percent]] percent CPU pressure. All five functional results passed; the [[post_change_maximum]]-second sample retained its suite budget finding and is not excluded from the median. Post-change median [[post_change_median_ms]] milliseconds. This descriptive campaign does not silently replace the original calibration or establish a paired speedup across the changed workload."
reason = "The [[budget_ms]] ms warning threshold is [[median_margin:relation]] percent above the original [[median_ms]] ms calibration median; comparisons against either recorded median are inconclusive until [[comparison_samples]] scheduled quiet samples exist at identical workload and configuration with a declared cache state. The observation implementer owns the campaign, with admission by the repository reviewer; its trigger is the first proposed runtime regression or threshold revision requiring a comparison, after a quiet node window is allocated. Neither recorded campaign is replaced or discarded. [[warning_margin_percent]] percent above the original calibration maximum of [[calibration_maximum]] seconds, rounded up to a whole second; the later [[post_change_maximum]]-second excess does not enlarge the allowance. The former [[former_warning_seconds]]-second allowance was never a measured baseline for this traced workload; the general pure-suite allowance remains unchanged."
placement = "required fast-tier observation runtime workload; suite and enclosing gate step report independently, without adding their overlapping durations"
owner = "observation implementer and repository reviewer"
settlement = "Residual cost accepted by the implementer and independent reviewer, with post-change attribution now attached. Re-measure on workload or representation changes; timing excess never changes verdicts, retries, skips or termination. Retain metric-contention comparison failures independently."

attribution = "External cProfile of the Python runtime driver, with no production-source instrumentation: [[profile_wall_seconds]] seconds wall, [[profile_cpu_seconds]] seconds own CPU, [[profile_shared_cores]] shared node cores and [[profile_pressure_percent]] percent CPU pressure. Nonoverlapping runner attribution: [[profile_command_seconds]] seconds in command execution, capture and witness handling; [[profile_reconstruction_seconds]] seconds in artifact reconstruction and verification; [[profile_other_seconds]] seconds in remaining interpreter, registry and harness work. Child and reader-thread work is included in command waits, not separately attributed to native serialization, compaction or I/O. The four-mode case takes [[profile_four_mode_seconds]] seconds of the [[profile_suite_seconds]]-second test suite; the enclosing driver also loads and joins the registry and emits findings. This instrumented profile is separate from the unprofiled median."
