[[rows]]
name = "observation-runtime"
label_name = "observation-runtime-step"
label = "expt:devperf:observation-runtime-step"
operation = "observation runtime gate step"
measured_ms = 8512
median_ms = 8274
post_change_median_ms = 7745.445
budget_ms = 11000
ordinary_budget = "pure-suite"
status = "admitted"
measurement = "Warm compiled-target runs with fresh four-package artifact directories at 96 inline levels: 8.274, 7.748 and 8.511 seconds; 11.920, 10.576 and 12.259 own CPU seconds; shared CPU pressure 0.514, 0.930 and 0.262 percent. The third sample retained a metric-contention comparison failure; all stream records were delivered. This timing is not a passing verdict. Post-change atomic-counter and policy-binding campaign, warm compiled gate target and fresh four-package artifact directories, five predeclared runs: 7.745, 8.016, 15.406, 6.688, 7.368 seconds; 10.620, 10.983, 10.340, 8.620, 10.192 own CPU seconds; 18.43, 30.88, 28.98, 7.17, 5.39 shared node cores and 2.567, 1.228, 4.863, 0.081, 0.166 percent CPU pressure. All five functional results passed; the 15.406-second sample retained its suite budget finding and is not excluded from the median. Post-change median 7745.445 milliseconds. This descriptive campaign does not silently replace the original calibration or establish a paired speedup across the changed workload."
reason = "The 11000 ms warning threshold is 32.95 percent above the original 8274 ms calibration median; smaller increases must be compared explicitly under the comparison rule. Twenty-five percent above the original calibration maximum of 8.511 seconds, rounded up to a whole second; the later 15.406-second excess does not enlarge the allowance. The former five-second allowance was never a measured baseline for this traced workload; the general pure-suite allowance remains unchanged."
placement = "required fast-tier observation runtime workload; suite and enclosing gate step report independently, without adding their overlapping durations"
owner = "observation implementer and repository reviewer"
settlement = "Residual cost accepted by the implementer and independent reviewer, with post-change attribution now attached. Re-measure on workload or representation changes; timing excess never changes verdicts, retries, skips or termination. Retain metric-contention comparison failures independently."

attribution = "External cProfile of the Python runtime driver, with no production-source instrumentation: 7.498 seconds wall, 9.443 seconds own CPU, 16.23 shared node cores and 0.435 percent CPU pressure. Nonoverlapping runner attribution: 5.345 seconds in command execution, capture and witness handling; 0.081 seconds in artifact reconstruction and verification; 2.072 seconds in remaining interpreter, registry and harness work. Child and reader-thread work is included in command waits, not separately attributed to native serialization, compaction or I/O. The four-mode case takes 4.906 seconds of the 5.582-second test suite; the enclosing driver also loads and joins the registry and emits findings. This instrumented profile is separate from the unprofiled median."
