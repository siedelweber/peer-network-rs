status = "withdrawn"
measurement = "Five paired runs on the same full corpus on the compute node measured 26.123, 25.903, 28.599, 25.870 and 26.643 seconds before, and 0.249, 0.245, 0.257, 0.250 and 0.282 seconds after; the rounded up maximum after is 283 milliseconds. Exact commands, source identity and pressure indicators remain in the untracked measurement artifacts."
reason = "Profiling attributed 32.550 of 32.973 instrumented seconds to 71175 regular-expression searches, including repeated compilation. One compiled union now searches every tracked first-party document and template with the same literal labels and backtick boundaries. The source projections, inventories and graph checks remain intact; an exhaustive controlled predicate comparison and the existing refusal tests retain the evidence. Every paired optimized sample fits the ordinary budget."
placement = "required per-change gate under the ordinary-check budget"
owner = "foundation implementer and repository reviewer"
settlement = "Withdrawn because indexing removed the expensive repeated scan without weakening its predicate. This entry records the withdrawal and preserves the historical citation target; it grants no exception."

