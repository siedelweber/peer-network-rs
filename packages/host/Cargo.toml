[package]
autotests = false
name = "pn-host"
description = "Secret-terminating host-intranet PostgreSQL transport; persistence disabled"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[dependencies]
cli-common.workspace = true
tracing.workspace = true
secrecy.workspace = true
tokio-postgres = { version = "=0.7.18", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "io-util", "sync", "time"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
sha2.workspace = true
getrandom = { version = "=0.4.3", default-features = false }
base64 = { version = "=0.23.1", default-features = false }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "public"
path = "tests/public.rs"
