[package]
autotests = false
name = "pn-host"
description = "Secret-terminating host-intranet PostgreSQL transport; persistence disabled"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[features]
default = []
development-network = ["dep:pn-wallet"]

[dependencies]
pn-wallet = { path = "../wallet", optional = true }
cli-common.workspace = true
tracing.workspace = true
metrics.workspace = true
pn-records = { path = "../records" }
pn-interchange = { path = "../interchange" }
secrecy.workspace = true
tokio-postgres = { version = "=0.7.18", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "io-util", "sync", "time"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
sha2.workspace = true
getrandom = { version = "=0.4.3", default-features = false }
base64 = { version = "=0.23.1", default-features = false }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread"] }
serde_json.workspace = true
pn-records = { path = "../records", features = ["test-support"] }

[lints]
workspace = true

[[test]]
name = "public"
path = "tests/public.rs"
