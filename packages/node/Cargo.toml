[package]
name = "pn"
description = "Unserved node schema and register admission"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
debug-observation = ["cli-common/debug-observation"]

[dependencies]
async-graphql = { version = "=7.2.1", default-features = false }
async-graphql-parser = { version = "=7.2.1", default-features = false }
async-graphql-value = { version = "=7.2.1", default-features = false }
async-graphql-derive = { version = "=7.2.1", default-features = false }
clap.workspace = true
cli-common.workspace = true
pn-interchange = { path = "../interchange" }
secrecy.workspace = true
signal-hook = { version = "=0.4.6", default-features = false }
serde_json.workspace = true
toml.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "signal", "time"] }
tracing.workspace = true

[[bin]]
name = "pn"
path = "src/main.rs"

[lints]
workspace = true
