[package]
name = "pn-wallet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
arbitrary = { version = "=1.5.0", default-features = false }
pn-wallet = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "decode_layout"
path = "fuzz_targets/decode_layout.rs"
test = false
doc = false
bench = false
