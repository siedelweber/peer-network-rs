[package]
name = "pn-wallet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
arbitrary = { version = "=1.5.0", default-features = false }
pn-wallet = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "decode_layout"
path = "fuzz_targets/decode_layout.rs"
test = false
doc = false
bench = false

[patch.crates-io]
bitcoin = { path = "../../../vendor/bitcoin" }
elements = { path = "../../../vendor/elements" }
secp256k1 = { path = "../../../vendor/secp256k1" }
secp256k1-zkp = { path = "../../../vendor/secp256k1-zkp" }
secp256k1-sys = { path = "../../../vendor/secp256k1-sys" }
secp256k1-zkp-sys = { path = "../../../vendor/secp256k1-zkp-sys" }
