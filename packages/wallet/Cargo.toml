[package]
name = "pn-wallet"
description = "Bounded public Elements layouts and secret-owning read-only RPC; spending disabled"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[features]
default = []
fuzzing = []

[dependencies]
elements = { version = "=0.27.0", default-features = false }
tracing.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
tower = { workspace = true, features = ["limit", "timeout"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time"] }

[dev-dependencies]
dhat = "=0.3.3"
cli-common.workspace = true
pn-testkit.workspace = true

[lints]
workspace = true
