# Explicit repository policy; the gate selects this file and the default profile.
nextest-version = "0.9.149"
[store]
dir = ".lane/nextest"
[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s" }
failure-output = "final"
success-output = "never"

# The real-service and impostor fixtures share the lane's reserved ports.
[test-groups.host-service]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(pn-host)'
test-group = 'host-service'
