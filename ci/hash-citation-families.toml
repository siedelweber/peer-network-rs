[[rows]]
family = "policy-recipe-vectors"
group = "first-party identities"
measures = "SHA-256 of the permanent marker-policy/v1 framed fixtures"
producer = "ci/policy_vectors.py"
establishment = "recomputable"
reader = "policy-vectors"
source = "packages/records/tests/public/policy-digest-v1.json"
definition = "The tracked independent reader frames seven UTF-8 strings with unsigned big-endian 64-bit byte lengths, three unsigned big-endian 64-bit values, the placement byte and both discriminants after the permanent domain separator; all six rows must match."
paths = ["packages/records/tests/public/policy-digest-v1.json"]

[[rows]]
family = "artifact-address-vector"
group = "first-party observation"
measures = "SHA-256 of the fixed UTF-8 JSON string payload"
producer = "cli-common artifact publication on the prior implementing line"
establishment = "recomputable"
reader = "artifact-vector"
source = "packages/cli-common/src/observation/artifact-digest-v1.json"
definition = "Repeat the declared public string, encode it as a compact UTF-8 JSON string including quotation marks, and compute SHA-256. The Rust witness compares the stored literal with both the artifact digest field and its objects/sha256 filename. This preserves the existing content-address recipe."
paths = ["packages/cli-common/src/observation/artifact-digest-v1.json"]

[[rows]]
family = "observation-source-literals"
group = "Checked Rust syntax mirrored in operation admission"
measures = "Numeric literals and code-unit witnesses, not source identities"
producer = "The syntax census and its body/type-bound review register"
establishment = "defined"
reader = "interchange-literal"
definition = "The operation registry mirrors visible Rust bodies and type documentation. Its explicit numeric literals retain their source meaning; the observation gate checks the complete mirrored syntax against source, and this family excludes bare identity-shaped values."
paths = ["ci/observation-registry.json"]

# Boundary: explicit hexadecimal integers (including Rust suffixes), byte and
# Unicode escapes and ABNF hexadecimal ranges always participate. Bare runs have
# at least six characters. Short mixed letter/digit runs participate; letter-only
# short runs require a whole-word commit, digest, checksum, SHA, hash, rev,
# revision, tree or object context on their physical line, or a parenthesized
# dated tool-version tuple. Full 40/64-character runs participate without
# context, as do longer letter-bearing runs. Decimal-only
# short quantities require identity context or the existing parenthesized version
# form. Recognition does not establish a value: the same families below must do
# that. Every tracked byte and pathname is read, including tests and vendor code.

[[rows]]
family = "crate-archives"
group = "external packages"
measures = "SHA-256 of a registry crate archive"
producer = "cargo generate-lockfile"
establishment = "resolvable"
reader = "cargo-archive"
source = "Cargo.lock"
definition = "The package name and version locate https://static.crates.io/crates/{name}/{name}-{version}.crate; the registry checksum measures those archive bytes."
paths = ["Cargo.lock"]

[[rows]]
family = "correspondence-pins"
group = "first-party"
measures = "Normalized accepted decomposition and release-derived dataset projections"
producer = "ci/design.py:digest"
establishment = "recomputable"
reader = "projection-pin"
source = "ci/design.py"
function = "digest"
algorithm = "SHA-256 over the digest function's canonical JSON rows"
definition = "Run ci/design.py: questions excludes status, section and ambiguity; crates and bites use their full rows. The release_projection function selects all edition-marked inventory and constants rows, and question id/status/section/ambiguity fields, preserving absence of status. Every pin refuses an empty selection. The gate owns recomputation, while this audit verifies the named producer and subjects."
paths = ["ci/design.py"]
subjects = { CURRENT_INVENTORY_PIN = "docs/datasets/org.peer-network.design.inventory.json", REFRESHED_CONSTANTS_PIN = "docs/datasets/org.peer-network.design.constants.json", RELEASE_QUESTIONS_PIN = "docs/datasets/org.peer-network.design.questions.json", CRATES_PIN = "docs/datasets/org.peer-network.design.crates.json", BITES_PIN = "docs/datasets/org.peer-network.design.bites.json", QUESTIONS_PIN = "docs/datasets/org.peer-network.design.questions.json" }

