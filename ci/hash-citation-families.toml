reader = "assertion-reviews"
source = "ci/claim_review.json"
definition = "Only digest and public_commit fields in validated review bindings qualify. A closure must recompute from the carrying tree or its named public ancestor. Current equality supports the reviewed route; historical equality only accounts for a stale review. Unknown recipes, fields, paths and unrecomputable identities refuse."
paths = ["ci/claim_review.json"]

[[rows]]
