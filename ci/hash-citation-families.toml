[[rows]]
family = "regexml-provenance"
group = "vendored engine"
measures = "Public Git commit containing the anchored matcher and operation budget"
producer = "Git"
establishment = "resolvable"
reader = "public-git"
locator = "https://github.com/helping-kaiser/regexml/commit/feddb83dfdacceff2e81e86e7618ca31acccf910"
commit = "feddb83dfdacceff2e81e86e7618ca31acccf910"
definition = "The public fork commit is reachable on anchored-plus-budget; compare the vendored subtree with its regexml directory and the four root licence and credit files, allowing the documented scalar aliases and XSD repetition correction in src/re_compiler.rs, src/op_sequence.rs, src/op_repeat.rs and tests/test_regexml.rs. The correction adds one test function in src/op_repeat.rs and updates an existing budget test. It preserves counts and expands each position/count state once in every XSD repetition, with unbounded counts capped at subject length plus one and nullable minima padded by empty iterations. Distinct endpoints are yielded in descending position order; reported matches may differ from upstream greedy-first selection, and captured spans may come from an explored path rather than the reported derivation. Repository consumers do not read captures. XPath retains known wrong answers for these shapes. Retirement requires the anchored matcher, operation budget and count-preserving endpoint search."
paths = ["README.md", "docs/templates/README.md.j2", "ci/hash-citation-families.toml"]

