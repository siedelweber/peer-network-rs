definition = "Explicit integer literals denote the public byte patterns placed in test staging or the test-only mapped view. Their numeric values distinguish nonzero contents from erased zero bytes and distinct contents from constant diagnostics; they assert no digest or secret identity. Bare identity-shaped values remain excluded."
